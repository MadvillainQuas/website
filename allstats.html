            // =======================================================================
            // AUTO-TUNE LAMBDA: Finds lambda that best reproduces team ORtg/DRtg
            // Uses golden-section search on ORtg-only RAPM, minimizing RMSE vs actual team ratings
            // =======================================================================
            autoTuneLambdaAsync: async function(matchupData, teamRatings, onProgress, playerMinsData) {
                // teamRatings: { teamName: { ortg, drtg, poss } }
                // playerMinsData: { playerName: { mins, team } } from onOffData
                const self = this;
                onProgress = onProgress || function() {};
                const yieldToUI = () => new Promise(r => setTimeout(r, 0));

                try {
                    onProgress(0, 'Parsing stints for auto-tune...');
                    await yieldToUI();
                    const stints = self.buildStintsFromMatchupData(matchupData);
                    if (stints.length === 0) return { error: 'No stints' };
                            const playerIndex = self.buildPlayerIndex(stints);

                            // Build player→team map directly from CSV rows (fast)
                            const playerTeamPoss = {};
                            matchupData.forEach(m => {
                                const hName = m.Home_Team || m.home_team || '';
                                const aName = m.Away_Team || m.away_team || '';
                                const poss = parseFloat(m.Possessions || m.possessions || m.POSS) || 0;
                                if (!hName || !aName || poss < 1) return;
                                (m.Home_Lineup || m.home_lineup || '').split(',').forEach(p => {
                                    const pn = p.trim().toLowerCase();
                                    if (!pn) return;
                                    if (!playerTeamPoss[pn]) playerTeamPoss[pn] = {};
                                    playerTeamPoss[pn][hName] = (playerTeamPoss[pn][hName] || 0) + poss;
                                });
                                (m.Away_Lineup || m.away_lineup || '').split(',').forEach(p => {
                                    const pn = p.trim().toLowerCase();
                                    if (!pn) return;
                                    if (!playerTeamPoss[pn]) playerTeamPoss[pn] = {};
                                    playerTeamPoss[pn][aName] = (playerTeamPoss[pn][aName] || 0) + poss;
                                });
                            });
                            const playerTeam = {};
                            Object.entries(playerTeamPoss).forEach(([p, teams]) => {
                                const best = Object.entries(teams).sort((a, b) => b[1] - a[1])[0];
                                if (best) playerTeam[p] = best[0];
                            });

                            // Build matrices once (reused for all lambda trials)
                            const matrices = self.buildRAPMMatricesForStat(stints, playerIndex, 'ORtg');
                            if (!matrices) return { error: 'No valid ORtg data' };

                            // Use player minutes from onOffData (passed as playerMinsData)
                            // playerMinsData: { playerNameLower: { mins, team } }
                            const playerMins = {};
                            const teamGameMins = {};
                            if (playerMinsData) {
                                Object.entries(playerMinsData).forEach(([p, d]) => {
                                    playerMins[p] = d.mins;
                                    if (d.team) {
                                        if (!teamGameMins[d.team]) teamGameMins[d.team] = 0;
                                        teamGameMins[d.team] += d.mins;
                                    }
                                });
                                // teamGameMins is sum of all player mins per team; divide by 5 to get team game mins
                                Object.keys(teamGameMins).forEach(t => { teamGameMins[t] /= 5; });
                            }

                            // ============================================================
                            // V3.3: K-FOLD CROSS-VALIDATION objective (professional standard,
                            // cf. Sill 2010 "Improved NBA Adjusted +/-"). The previous objective
                            // (in-sample minutes-weighted team-fit RMSE) monotonically rewards
                            // weaker regularization — λ drifts to the search floor and overfits.
                            // λ is now chosen by OUT-OF-SAMPLE stint-level weighted RMSE with
                            // contiguous (≈game-blocked, chronological) folds. Team-fit RMSE is
                            // still computed at the chosen λ as a diagnostic.
                            // ============================================================
                            const K = 5;
                            const p = matrices.numFeatures;
                            const hcaCol = matrices.hcaCol;
                            const numObs = matrices.numObs;

                            // GAME-BLOCKED folds: all observations of a game share a fold.
                            // Contiguous stint-blocked folds split games across the
                            // train/test boundary; lineups repeat heavily within a game,
                            // so held-out stints had near-identical training rows —
                            // leakage that biased lambda low (overfit). Falls back to
                            // stint-pair blocking if the CSV predates game ids.
                            const foldOfObs = new Int8Array(numObs);
                            const obsGame = matrices.obsGame || [];
                            const hasGameIds = obsGame.length === numObs && obsGame.some(g => g);
                            if (hasGameIds) {
                                const gameFold = new Map();
                                obsGame.forEach(g => { if (!gameFold.has(g)) gameFold.set(g, 0); });
                                const gamesList = Array.from(gameFold.keys());
                                gamesList.forEach((g, gi) => gameFold.set(g, Math.min(K - 1, Math.floor(gi * K / gamesList.length))));
                                for (let i = 0; i < numObs; i++) foldOfObs[i] = gameFold.get(obsGame[i]);
                            } else {
                                const numStintPairs = Math.ceil(numObs / 2);
                                for (let i = 0; i < numObs; i++) {
                                    const stintIdx = Math.floor(i / 2);
                                    foldOfObs[i] = Math.min(K - 1, Math.floor(stintIdx * K / numStintPairs));
                                }
                            }

                            // Group X rows once
                            const rowData = new Map();
                            matrices.XData.forEach(en => {
                                if (!rowData.has(en.row)) rowData.set(en.row, []);
                                rowData.get(en.row).push(en);
                            });

                            // Precompute full + per-fold normal equations (train = full − fold)
                            const XtWXfull = new Float64Array(p * p);
                            const XtWyFull = new Float64Array(p);
                            const XtWXfold = [], XtWyFold = [];
                            for (let f = 0; f < K; f++) { XtWXfold.push(new Float64Array(p * p)); XtWyFold.push(new Float64Array(p)); }
                            for (let i = 0; i < numObs; i++) {
                                const w = matrices.weights[i];
                                const yi = matrices.y[i];
                                const entries = rowData.get(i) || [];
                                const f = foldOfObs[i];
                                for (let a2 = 0; a2 < entries.length; a2++) {
                                    const ea = entries[a2];
                                    const wvy = w * ea.val * yi;
                                    XtWyFull[ea.col] += wvy;
                                    XtWyFold[f][ea.col] += wvy;
                                    for (let b2 = 0; b2 < entries.length; b2++) {
                                        const eb = entries[b2];
                                        const v = w * ea.val * eb.val;
                                        XtWXfull[ea.col * p + eb.col] += v;
                                        XtWXfold[f][ea.col * p + eb.col] += v;
                                    }
                                }
                            }

                            const Abuf = new Float64Array(p * p);
                            const bBuf = new Float64Array(p);
                            const cvCache = new Map();

                            // K-fold CV: weighted out-of-sample RMSE at a given lambda
                            const evalLambdaCV = (lambda) => {
                                const cacheKey = Math.round(lambda);
                                if (cvCache.has(cacheKey)) return cvCache.get(cacheKey);
                                let sse = 0, wsum = 0;
                                for (let f = 0; f < K; f++) {
                                    const Xf = XtWXfold[f], yf = XtWyFold[f];
                                    for (let i = 0; i < p * p; i++) Abuf[i] = XtWXfull[i] - Xf[i];
                                    for (let d2 = 0; d2 < p; d2++) Abuf[d2 * p + d2] += (d2 === hcaCol ? lambda * 0.01 : lambda);
                                    let bnSq = 0;
                                    for (let i = 0; i < p; i++) { bBuf[i] = XtWyFull[i] - yf[i]; bnSq += bBuf[i] * bBuf[i]; }
                                    const beta = self.conjugateGradient(Abuf, bBuf, p, 1500, Math.max(1e-10, 1e-8 * Math.sqrt(bnSq)));
                                    // Predict held-out fold observations
                                    for (let i = 0; i < numObs; i++) {
                                        if (foldOfObs[i] !== f) continue;
                                        const entries = rowData.get(i) || [];
                                        let pred = 0;
                                        for (let a2 = 0; a2 < entries.length; a2++) pred += entries[a2].val * beta[entries[a2].col];
                                        const err = matrices.y[i] - pred;
                                        const w = matrices.weights[i];
                                        sse += w * err * err;
                                        wsum += w;
                                    }
                                }
                                const rmse = wsum > 0 ? Math.sqrt(sse / wsum) : 999;
                                cvCache.set(cacheKey, rmse);
                                return rmse;
                            };

                            // Team-fit RMSE — diagnostic only (no longer the selection objective)
                            const evalTeamRmse = (lambda) => {
                                const coefficients = self.solveWeightedRidge(matrices.XData, matrices.y, matrices.weights, matrices.numObs, matrices.numFeatures, lambda, hcaCol);
                                const { orapm, drapm } = self.centerRAPM(coefficients, playerIndex.playerCount, playerIndex);
                                const teamPred = {};
                                playerIndex.playerList.forEach(player => {
                                    const t = playerTeam[player];
                                    if (!t || !teamRatings[t]) return;
                                    const pm = playerMins[player] || 0;
                                    if (pm <= 0) return;
                                    const tgm = teamGameMins[t] || 1;
                                    const frac = pm / tgm;
                                    if (!teamPred[t]) teamPred[t] = { netSum: 0 };
                                    teamPred[t].netSum += frac * ((orapm[player] || 0) + (drapm[player] || 0));
                                });
                                let ssNet = 0, nTeams = 0;
                                Object.entries(teamPred).forEach(([t, pred]) => {
                                    if (!teamRatings[t]) return;
                                    const actualNet = teamRatings[t].ortg - teamRatings[t].drtg;
                                    ssNet += Math.pow(pred.netSum - actualNet, 2);
                                    nTeams++;
                                });
                                return nTeams > 0 ? Math.sqrt(ssNet / nTeams) : 999;
                            };

                    // Golden-section search over ln(λ) in [50, 8000] — CV error is ≈unimodal in log space
                    onProgress(10, 'Cross-validating lambda (5-fold)...');
                    const gr = (Math.sqrt(5) + 1) / 2;
                    let a = Math.log(50), b = Math.log(8000);
                    const tol = 0.04;
                    let steps = 0;
                    while (b - a > tol && steps < 25) {
                        const c = b - (b - a) / gr;
                        const d = a + (b - a) / gr;
                        const fc = evalLambdaCV(Math.exp(c));
                        await yieldToUI();
                        const fd = evalLambdaCV(Math.exp(d));
                        await yieldToUI();
                        if (fc < fd) b = d; else a = c;
                        steps++;
                        onProgress(10 + Math.round((steps / 25) * 80), 'Testing λ=' + Math.round(Math.exp((a + b) / 2)) + ' (CV RMSE=' + Math.min(fc, fd).toFixed(2) + ')');
                    }
                    const bestLambda = Math.round(Math.exp((a + b) / 2));
                    const bestRmse = evalLambdaCV(bestLambda);
                    const teamRmse = evalTeamRmse(bestLambda);

                    onProgress(100, 'Auto-tune complete! λ=' + bestLambda + ' (5-fold CV)');
                    console.log('[RAPM AutoTune] Best lambda=' + bestLambda + ' via 5-fold CV. CV RMSE=' + bestRmse.toFixed(3) + ', team-fit RMSE=' + teamRmse.toFixed(3));
                    return { bestLambda, bestRmse, teamRmse, steps, method: '5-fold-cv' };
                } catch (err) {
                    console.error('[RAPM AutoTune] Error:', err);
                    throw err;
                }
            },

            // =======================================================================
            // AUTO-TUNE APM LAMBDA: Same golden-section approach but for Bayesian Box APM
            // Searches baseLambda while keeping tau/xi fixed
            // =======================================================================
            autoTuneAPMLambdaAsync: async function(matchupData, seasonStatsMap, teamRatings, onProgress, fixedLambda, playerMinsData) {
                const self = this;
                onProgress = onProgress || function() {};
                const yieldToUI = () => new Promise(r => setTimeout(r, 0));

                try {
                    onProgress(0, 'Parsing stints for APM auto-tune...');
                    const stints = self.buildStintsFromMatchupData(matchupData);
                    if (stints.length === 0) return { error: 'No stints' };
                            const playerIndex = self.buildPlayerIndex(stints);

                            // Build player→team map
                            const playerTeamPoss = {};
                            matchupData.forEach(m => {
                                const hName = m.Home_Team || m.home_team || '';
                                const aName = m.Away_Team || m.away_team || '';
                                const poss = parseFloat(m.Possessions || m.possessions || m.POSS) || 0;
                                if (!hName || !aName || poss < 1) return;
                                (m.Home_Lineup || m.home_lineup || '').split(',').forEach(p => {
                                    const pn = p.trim().toLowerCase();
                                    if (!pn) return;
                                    if (!playerTeamPoss[pn]) playerTeamPoss[pn] = {};
                                    playerTeamPoss[pn][hName] = (playerTeamPoss[pn][hName] || 0) + poss;
                                });
                                (m.Away_Lineup || m.away_lineup || '').split(',').forEach(p => {
                                    const pn = p.trim().toLowerCase();
                                    if (!pn) return;
                                    if (!playerTeamPoss[pn]) playerTeamPoss[pn] = {};
                                    playerTeamPoss[pn][aName] = (playerTeamPoss[pn][aName] || 0) + poss;
                                });
                            });
                            const playerTeam = {};
                            Object.entries(playerTeamPoss).forEach(([p, teams]) => {
                                const best = Object.entries(teams).sort((a, b) => b[1] - a[1])[0];
                                if (best) playerTeam[p] = best[0];
                            });

                            // Build shared components (reused across lambda trials)
                            const matrices = self.buildRAPMMatricesForStat(stints, playerIndex, 'ORtg');
                            if (!matrices) return { error: 'No valid ORtg data' };
                            const boxResults = self.buildBoxScoreFeatures(playerIndex, seasonStatsMap);
                            const learnedCoefs = self.learnBoxScoreCoefficients(
                                matrices, playerIndex, boxResults,
                                self.bayesianBoxConfig.xi_off, self.bayesianBoxConfig.xi_def
                            );
                            const priors = self.computeBayesianBoxPriors(playerIndex, boxResults, learnedCoefs);

                            // Use fixed lambda from RAPM (don't search over lambda)
                            const useLambda = fixedLambda || 800;
                            onProgress(20, 'Box features and priors computed, tuning τ_off & τ_def independently at λ=' + useLambda + '...');

                            const leagueAvg = matrices.leagueAvg;

                            // Use player minutes from onOffData (passed as playerMinsData)
                            const playerMins = {};
                            const teamGameMins = {};
                            if (playerMinsData) {
                                Object.entries(playerMinsData).forEach(([p, d]) => {
                                    playerMins[p] = d.mins;
                                    if (d.team) {
                                        if (!teamGameMins[d.team]) teamGameMins[d.team] = 0;
                                        teamGameMins[d.team] += d.mins;
                                    }
                                });
                                Object.keys(teamGameMins).forEach(t => { teamGameMins[t] /= 5; });
                            }

                            // ============================================================
                            // V3.3: K-FOLD CROSS-VALIDATION objective for τ (out-of-sample
                            // stint-level weighted RMSE). The previous in-sample team-fit
                            // objective systematically rewards trusting raw plus-minus
                            // (high τ) regardless of generalization.
                            // ============================================================
                            const K = 3;
                            const numObs = matrices.numObs;
                            const numStintPairs = Math.ceil(numObs / 2);
                            const foldOfObs = new Int8Array(numObs);
                            for (let i = 0; i < numObs; i++) {
                                const stintIdx = Math.floor(i / 2);
                                foldOfObs[i] = Math.min(K - 1, Math.floor(stintIdx * K / numStintPairs));
                            }
                            // Per-fold training weights (held-out fold zeroed out)
                            const foldTrainWeights = [];
                            for (let f = 0; f < K; f++) {
                                const wArr = new Float64Array(numObs);
                                for (let i = 0; i < numObs; i++) wArr[i] = foldOfObs[i] === f ? 0 : matrices.weights[i];
                                foldTrainWeights.push(wArr);
                            }
                            const rowDataCV = new Map();
                            matrices.XData.forEach(en => {
                                if (!rowDataCV.has(en.row)) rowDataCV.set(en.row, []);
                                rowDataCV.get(en.row).push(en);
                            });

                            // Evaluate (tauOff, tauDef) by k-fold out-of-sample stint RMSE
                            const evalTau = (tOff, tDef) => {
                                let sse = 0, wsum = 0;
                                for (let f = 0; f < K; f++) {
                                    const apmFit = self.solveBayesianBoxRidge(
                                        matrices, playerIndex, priors, useLambda, tOff, tDef, foldTrainWeights[f]
                                    );
                                    const beta = apmFit.coefficients;
                                    for (let i = 0; i < numObs; i++) {
                                        if (foldOfObs[i] !== f) continue;
                                        const entries = rowDataCV.get(i) || [];
                                        let pred = 0;
                                        for (let a2 = 0; a2 < entries.length; a2++) pred += entries[a2].val * beta[entries[a2].col];
                                        const err = matrices.y[i] - pred;
                                        const w = matrices.weights[i];
                                        sse += w * err * err;
                                        wsum += w;
                                    }
                                }
                                return wsum > 0 ? Math.sqrt(sse / wsum) : 999;
                            };

                            // Team-fit RMSE diagnostic (full-data fit, NOT the selection objective)
                            const evalTeamRmse = (tOff, tDef) => {
                                const apmResults = self.solveBayesianBoxRidge(matrices, playerIndex, priors, useLambda, tOff, tDef);
                                const teamPred = {};
                                playerIndex.playerList.forEach(player => {
                                    const t = playerTeam[player];
                                    if (!t || !teamRatings[t]) return;
                                    const pm = playerMins[player] || 0;
                                    if (pm <= 0) return;
                                    const tgm = teamGameMins[t] || 1;
                                    const frac = pm / tgm;
                                    if (!teamPred[t]) teamPred[t] = { netSum: 0 };
                                    teamPred[t].netSum += frac * ((apmResults.orapm[player] || 0) + (apmResults.drapm[player] || 0));
                                });
                                let ssNet = 0, nTeams = 0;
                                Object.entries(teamPred).forEach(([t, pred]) => {
                                    if (!teamRatings[t]) return;
                                    const actualNet = teamRatings[t].ortg - teamRatings[t].drtg;
                                    ssNet += Math.pow(pred.netSum - actualNet, 2);
                                    nTeams++;
                                });
                                return nTeams > 0 ? Math.sqrt(ssNet / nTeams) : 999;
                            };

                    // 2D coarse grid: tau_off × tau_def independently (3-fold CV per cell)
                    const tauValues = [0.05, 0.1, 0.2, 0.4, 0.7, 1.2, 2.5, 5.0];
                    let bestTauOff = 0.5, bestTauDef = 0.7, bestRmse = 999;
                    let evalCount = 0;
                    const totalEvals = tauValues.length * tauValues.length;

                    for (let oi = 0; oi < tauValues.length; oi++) {
                        for (let di = 0; di < tauValues.length; di++) {
                            const tO = tauValues[oi];
                            const tD = tauValues[di];
                            const rmse = evalTau(tO, tD);
                            if (rmse < bestRmse) { bestRmse = rmse; bestTauOff = tO; bestTauDef = tD; }
                            evalCount++;
                        }
                        onProgress(20 + Math.round((evalCount / totalEvals) * 45), 'Coarse CV: τ_off=' + tauValues[oi].toFixed(2) + ' best so far CV RMSE=' + bestRmse.toFixed(2));
                        await yieldToUI();
                    }

                    // Fine 2D refinement around best (multiplicative neighborhood)
                    onProgress(70, 'Refining around τ_off=' + bestTauOff.toFixed(2) + ', τ_def=' + bestTauDef.toFixed(2) + '...');
                    const fineFactors = [0.6, 0.8, 1.0, 1.25, 1.6];
                    const fineOff = fineFactors.map(fac => Math.max(0.02, Math.round(bestTauOff * fac * 100) / 100));
                    const fineDef = fineFactors.map(fac => Math.max(0.02, Math.round(bestTauDef * fac * 100) / 100));
                    for (let oi = 0; oi < fineOff.length; oi++) {
                        for (let di = 0; di < fineDef.length; di++) {
                            if (fineFactors[oi] === 1.0 && fineFactors[di] === 1.0) continue; // already evaluated
                            const rmse = evalTau(fineOff[oi], fineDef[di]);
                            if (rmse < bestRmse) { bestRmse = rmse; bestTauOff = fineOff[oi]; bestTauDef = fineDef[di]; }
                        }
                        await yieldToUI();
                    }
                    const teamRmse = evalTeamRmse(bestTauOff, bestTauDef);
                    onProgress(92, 'Fine search done: τ_off=' + bestTauOff + ', τ_def=' + bestTauDef + ', CV RMSE=' + bestRmse.toFixed(2));

                    onProgress(100, 'APM τ auto-tune complete! τ_off=' + bestTauOff + ', τ_def=' + bestTauDef + ' (λ=' + useLambda + ', 3-fold CV)');
                    console.log('[APM AutoTune] Best: τ_off=' + bestTauOff + ', τ_def=' + bestTauDef + ', λ=' + useLambda + ' (fixed). CV RMSE=' + bestRmse.toFixed(3) + ', team-fit RMSE=' + teamRmse.toFixed(3));
                    return { bestLambda: useLambda, bestTauScale: 1.0, bestTauOff, bestTauDef, bestRmse, teamRmse, method: '3-fold-cv' };
                } catch (err) {
                    console.error('[APM AutoTune] Error:', err);
                    throw err;
                }
            },

            // =======================================================================
            // V6.0: BAYESIAN BOX APM - Intraocular.net Methodology
            // Based on: https://www.intraocular.net/posts/bayesian-box-plus-minus
            // 
            // Single unified model that learns box score coefficients (αⱼ) simultaneously
            // with player impacts (β). Uses per-possession box stats as features.
            //
            // Model:  Y ~ N(Xβ, σ)           # Lineup observations
            //         β ~ N(Σⱼ αⱼ · Zⱼ, τ)   # Box score prior for player coefficients
            //         αⱼ ~ N(0, ξ)           # Regularization on box score weights
            //
            // Two levels of regularization:
            //   τ (tau) - controls prior vs likelihood weight
            //   ξ (xi) - controls box score coefficient magnitudes
            // =======================================================================
            
            // Box score stat definitions for Bayesian Box APM
            boxScoreStatDefs: {
                offensive: [
                    { key: 'fgm2_poss', label: '2PM', csv: ['FGM', '3PM'], compute: (r) => ((r.FGM || 0) - (r['3PM'] || 0)) / Math.max(1, r.POSS) },
                    { key: 'fgmiss2_poss', label: '2PMiss', csv: ['FGA', 'FGM', '3PA', '3PM'], compute: (r) => (((r.FGA || 0) - (r.FGM || 0)) - ((r['3PA'] || 0) - (r['3PM'] || 0))) / Math.max(1, r.POSS) },
                    { key: 'fgm3_poss', label: '3PM', csv: ['3PM'], compute: (r) => (r['3PM'] || 0) / Math.max(1, r.POSS) },
                    { key: 'fgmiss3_poss', label: '3PMiss', csv: ['3PA', '3PM'], compute: (r) => ((r['3PA'] || 0) - (r['3PM'] || 0)) / Math.max(1, r.POSS) },
                    { key: 'ftm_poss', label: 'FTM', csv: ['FTM'], compute: (r) => (r.FTM || 0) / Math.max(1, r.POSS) },
                    { key: 'ftmiss_poss', label: 'FTMiss', csv: ['FTA', 'FTM'], compute: (r) => ((r.FTA || 0) - (r.FTM || 0)) / Math.max(1, r.POSS) },
                    { key: 'oreb_poss', label: 'OREB', csv: ['OREB'], compute: (r) => (r.OREB || 0) / Math.max(1, r.POSS) },
                    { key: 'ast_poss', label: 'AST', csv: ['AST'], compute: (r) => (r.AST || 0) / Math.max(1, r.POSS) },
                    { key: 'tov_poss', label: 'TOV', csv: ['TOV'], compute: (r) => (r.TOV || 0) / Math.max(1, r.POSS) }
                ],
                defensive: [
                    { key: 'dreb_poss', label: 'DRB', csv: ['DREB'], compute: (r) => (r.DREB || 0) / Math.max(1, r.POSS) },
                    { key: 'stl_poss', label: 'STL', csv: ['STL'], compute: (r) => (r.STL || 0) / Math.max(1, r.POSS) },
                    { key: 'blk_poss', label: 'BLK', csv: ['BLK'], compute: (r) => (r.BLK || 0) / Math.max(1, r.POSS) },
                    { key: 'pf_poss', label: 'PF', csv: ['PF'], compute: (r) => (r.PF || 0) / Math.max(1, r.POSS) }
                ]
            },
            
            // Bayesian Box APM hyperparameters (tuned per Intraocular research)
            bayesianBoxConfig: {
                tau_off: 0.5,      // Prior weight for offense (lower = more box score influence)
                tau_def: 0.7,      // Prior weight for defense (higher = more plus-minus influence)
                // V5.0: FIXED - Defensive box stats are noisier predictors, need MORE regularization
                // Research shows defensive box scores (STL, BLK, DRB) are less predictive of defensive impact
                xi_off: 0.5,       // Box coef regularization for offense (more reliable stats)
                xi_def: 0.3,       // Box coef regularization for defense (more regularization for noisier stats)
                baseLambda: 3000   // Base ridge regularization parameter
            },
            
            calculateAPMAsync: async function(matchupData, seasonStatsMap, baseLambda, onProgress) {

                    if (!stats) {
                        // Try original case
                        stats = seasonStatsMap[player];

                    if (!stats) {

                        for (const [key, val] of Object.entries(seasonStatsMap)) {

                                break;
                            }
                        }
                    }

                        offStats.forEach(stat => {
                            offFeatures[player][stat.key] = stat.compute(stats);

                // Standardize features (z-score) across all players
                const standardize = (features, statDefs) => {
                    statDefs.forEach(stat => {
                        const values = Object.values(features).map(f => f[stat.key]).filter(v => v !== 0);
                        if (values.length === 0) return;
                        
                        const mean = values.reduce((a, b) => a + b, 0) / values.length;
                        const variance = values.reduce((a, b) => a + (b - mean) ** 2, 0) / values.length;
                        const std = Math.sqrt(variance) || 1;
                        
                        Object.keys(features).forEach(player => {

                };
                
                standardize(offFeatures, offStats);
                standardize(defFeatures, defStats);
                
                return {
                    offensive: offFeatures,
                    defensive: defFeatures,
                    playersWithStats: playersWithStats,
                    offStatKeys: offStats.map(s => s.key),

            // V6.0: Learn box score coefficients (α) using regularized regression
            // Finds optimal weights for each box stat by regressing on plus-minus outcomes
            learnBoxScoreCoefficients: function(matrices, playerIndex, boxResults, xiOff, xiDef) {
                const self = this;
                
                // For computational efficiency, we use a simplified approach:
                // Learn α by finding coefficients that minimize: ||y - Z_expanded · α||² + ξ||α||²
                // where Z_expanded expands player box stats to possession level
                
                // Build aggregated plus-minus by player (weighted by possessions)
                const playerPM = {}; // player -> {totalPM, totalWeight}
                
                // Group XData by row for efficient computation
                const rowData = new Map();
                matrices.XData.forEach(entry => {
                    if (!rowData.has(entry.row)) rowData.set(entry.row, []);
                    rowData.get(entry.row).push({ col: entry.col, val: entry.val });
                });
                
                // Accumulate plus-minus for each player
                const hcaColIdx = matrices.hcaCol !== undefined ? matrices.hcaCol : -1;
                for (let i = 0; i < matrices.numObs; i++) {
                    const y = matrices.y[i];
                    const w = matrices.weights[i] || 1;
                    const rowEntries = rowData.get(i) || [];

                    rowEntries.forEach(entry => {
                        if (entry.col === hcaColIdx) return; // V3.3: skip HCA column (not a player)
                        const playerIdx = entry.col;
                        const isDefensive = playerIdx >= playerIndex.playerCount;
                        const actualIdx = isDefensive ? playerIdx - playerIndex.playerCount : playerIdx;
                        const player = playerIndex.playerList[actualIdx];
                        
                        if (!playerPM[player]) {
                            playerPM[player] = { offPM: 0, defPM: 0, offWeight: 0, defWeight: 0 };
                        }
                        
                        if (isDefensive) {
                            // Defensive: y contribution is negated (good defense = opponent scores less)
                            playerPM[player].defPM += -y * entry.val * w;
                            playerPM[player].defWeight += w;
                        } else {
                            playerPM[player].offPM += y * entry.val * w;
                            playerPM[player].offWeight += w;
                        }
                    });
                }
                
                // Compute average plus-minus per player
                Object.keys(playerPM).forEach(player => {
                    if (playerPM[player].offWeight > 0) {
                        playerPM[player].offPM /= playerPM[player].offWeight;
                    }
                    if (playerPM[player].defWeight > 0) {
                        playerPM[player].defPM /= playerPM[player].defWeight;
                    }
                });
                
                // Learn offensive coefficients via ridge regression: Z_off · α_off ≈ offPM
                const learnCoefs = (features, statKeys, pmKey, xi) => {
                    const n = Object.keys(features).length;
                    const k = statKeys.length;
                    if (n === 0 || k === 0) return {};
                    
                    // Build Z matrix (n x k) and y vector (n x 1)
                    const Z = [];
                    const y = [];
                    const players = Object.keys(features);
                    
                    players.forEach(player => {
                        if (!playerPM[player]) return;
                        const row = statKeys.map(key => features[player][key] || 0);
                        Z.push(row);
                        y.push(playerPM[player][pmKey] || 0);
                    });
                    
                    if (Z.length < 10) {
                        // Not enough data - use default coefficients
                        const coefs = {};
                        statKeys.forEach(key => coefs[key] = 0);
                        return coefs;
                    }
                    
                    // Solve ridge regression: (Z'Z + λI)α = Z'y
                    // Using simple closed-form solution
                    const lambda = xi * Z.length; // Scale regularization by sample size
                    
                    // Compute Z'Z (k x k)
                    const ZtZ = [];
                    for (let i = 0; i < k; i++) {
                        ZtZ[i] = [];
                        for (let j = 0; j < k; j++) {
                            let sum = 0;
                            for (let m = 0; m < Z.length; m++) {
                                sum += Z[m][i] * Z[m][j];
                            }
                            ZtZ[i][j] = sum + (i === j ? lambda : 0);
                        }
                    }
                    
                    // Compute Z'y (k x 1)
                    const Zty = [];
                    for (let i = 0; i < k; i++) {
                        let sum = 0;
                        for (let m = 0; m < Z.length; m++) {
                            sum += Z[m][i] * y[m];
                        }
                        Zty[i] = sum;
                    }
                    
                    // Solve (Z'Z + λI)α = Z'y using Cholesky or simple Gauss elimination
                    const alpha = self.solveLinearSystem(ZtZ, Zty);
                    
                    // Map back to named coefficients
                    const coefs = {};
                    statKeys.forEach((key, i) => {
                        coefs[key] = alpha[i] || 0;
                    });
                    
                    return coefs;
                };
                
                return {
                    offensive: learnCoefs(boxResults.offensive, boxResults.offStatKeys, 'offPM', xiOff),
                    defensive: learnCoefs(boxResults.defensive, boxResults.defStatKeys, 'defPM', xiDef)
                };
            },
            
            // V6.0: Simple linear system solver using Gaussian elimination with partial pivoting
            solveLinearSystem: function(A, b) {
                const n = A.length;
                if (n === 0) return [];
                
                // Create augmented matrix
                const M = A.map((row, i) => [...row, b[i]]);
                
                // Forward elimination with partial pivoting
                for (let col = 0; col < n; col++) {
                    // Find pivot
                    let maxRow = col;
                    let maxVal = Math.abs(M[col][col]);
                    for (let row = col + 1; row < n; row++) {
                        if (Math.abs(M[row][col]) > maxVal) {
                            maxVal = Math.abs(M[row][col]);
                            maxRow = row;
                        }
                    }
                    
                    // Swap rows
                    if (maxRow !== col) {
                        [M[col], M[maxRow]] = [M[maxRow], M[col]];
                    }
                    
                    // Check for singular matrix
                    if (Math.abs(M[col][col]) < 1e-10) continue;
                    
                    // Eliminate below
                    for (let row = col + 1; row < n; row++) {
                        const factor = M[row][col] / M[col][col];
                        for (let j = col; j <= n; j++) {
                            M[row][j] -= factor * M[col][j];
                        }
                    }
                }
                
                // Back substitution
                const x = new Array(n).fill(0);
                for (let i = n - 1; i >= 0; i--) {
                    if (Math.abs(M[i][i]) < 1e-10) continue;
                    x[i] = M[i][n];
                    for (let j = i + 1; j < n; j++) {
                        x[i] -= M[i][j] * x[j];
                    }
                    x[i] /= M[i][i];
                }
                
                return x;
            },
            
            // V6.0: Compute Bayesian Box Priors for each player using learned coefficients
            computeBayesianBoxPriors: function(playerIndex, boxResults, learnedCoefs) {
                const offPriors = {};
                const defPriors = {};
                
                playerIndex.playerList.forEach(player => {
                    // Offensive prior = Σⱼ αⱼ · Zⱼ (offensive)
                    let offPrior = 0;
                    const offFeats = boxResults.offensive[player] || {};
                    Object.entries(learnedCoefs.offensive).forEach(([key, coef]) => {
                        offPrior += coef * (offFeats[key] || 0);
                    });
                    offPriors[player] = offPrior;
                    
                    // Defensive prior = Σⱼ αⱼ · Zⱼ (defensive)
                    let defPrior = 0;
                    const defFeats = boxResults.defensive[player] || {};
                    Object.entries(learnedCoefs.defensive).forEach(([key, coef]) => {
                        defPrior += coef * (defFeats[key] || 0);
                    });
                    defPriors[player] = defPrior;
                });
                
                return {
                    offensive: offPriors,
                    defensive: defPriors
                };

            // V6.0: Solve Bayesian Box ridge regression with learned priors
            // Uses prior-subtraction method: y_adj = y - X·prior, β = prior + ridge(y_adj)
            solveBayesianBoxRidge: function(matrices, playerIndex, priors, baseLambda, tauOff, tauDef, weightOverride) {
                const self = this;
                const hcaColIdx = matrices.hcaCol !== undefined ? matrices.hcaCol : -1;

                // Build prior vectors (matching matrix column order)
                const offPriorVec = new Float64Array(playerIndex.playerCount);
                const defPriorVec = new Float64Array(playerIndex.playerCount);
                
                playerIndex.playerList.forEach((player, idx) => {
                    offPriorVec[idx] = priors.offensive[player] || 0;
                    // Defense: negate prior for RAPM convention (good defense = negative coefficient)
                    defPriorVec[idx] = -(priors.defensive[player] || 0);
                });
                
                // Adjust response: y_adjusted = y - X·prior
                const yAdjusted = new Float64Array(matrices.y.length);
                
                // Group XData by row
                const rowData = new Map();
                matrices.XData.forEach(entry => {
                    if (!rowData.has(entry.row)) rowData.set(entry.row, []);
                    rowData.get(entry.row).push({ col: entry.col, val: entry.val });
                });
                
                for (let i = 0; i < matrices.numObs; i++) {
                    let priorContribution = 0;
                    const rowEntries = rowData.get(i) || [];
                    
                    rowEntries.forEach(entry => {
                        if (entry.col === hcaColIdx) return; // V3.3: HCA column has no box prior
                        const playerIdx = entry.col;
                        const isDefensive = playerIdx >= playerIndex.playerCount;
                        const actualIdx = isDefensive ? playerIdx - playerIndex.playerCount : playerIdx;

                        if (isDefensive) {
                            priorContribution += entry.val * defPriorVec[actualIdx];
                        } else {
                            priorContribution += entry.val * offPriorVec[actualIdx];
                        }
                    });
                    
                    yAdjusted[i] = matrices.y[i] - priorContribution;

                // Higher tau = more weight on plus-minus (lower regularization toward prior)
                // Lower tau = more weight on box prior (higher regularization)
                const offLambda = baseLambda / Math.max(0.1, tauOff);
                const defLambda = baseLambda / Math.max(0.1, tauDef);

                // V3.3: weightOverride allows training on a subset of observations (k-fold CV)
                const residualCoefficients = self.solveWeightedRidgeDifferential(

                    yAdjusted,
                    weightOverride || matrices.weights,
                    matrices.numObs,
                    matrices.numFeatures,

                    defLambda,
                    playerIndex.playerCount
                );

                if (hcaColIdx >= 0) finalCoefficients[hcaColIdx] = residualCoefficients[hcaColIdx];

                const centered = self.centerRAPM(finalCoefficients, playerIndex.playerCount, playerIndex);

            // V6.0: Weighted ridge with different lambdas for offensive vs defensive coefficients
            // Uses conjugate gradient (sparse, no dense matrix allocation) to avoid memory crashes
            solveWeightedRidgeDifferential: function(XData, y, weights, numObs, numFeatures, lambdaOff, lambdaDef, playerCount) {
                const self = this;
                // V3.3: detect trailing HCA column (numFeatures = 2*playerCount + 1) — light penalty
                const hcaColIdx = numFeatures === playerCount * 2 + 1 ? numFeatures - 1 : -1;
                const hcaLambda = 0.01 * Math.min(lambdaOff, lambdaDef);

                // Group by row for sparse matrix-vector products
                const rowData = new Map();
                XData.forEach(entry => {
                    if (!rowData.has(entry.row)) rowData.set(entry.row, []);
                    rowData.get(entry.row).push({ col: entry.col, val: entry.val });
                });
                // Group by col for transpose operations
                const colData = new Map();
                XData.forEach(entry => {
                    if (!colData.has(entry.col)) colData.set(entry.col, []);
                    colData.get(entry.col).push({ row: entry.row, val: entry.val });
                });

                // Compute X'Wy (right-hand side)
                const XtWy = new Float64Array(numFeatures);
                for (let col = 0; col < numFeatures; col++) {
                    const entries = colData.get(col) || [];
                    let sum = 0;
                    entries.forEach(e => { sum += e.val * (weights[e.row] || 1) * y[e.row]; });
                    XtWy[col] = sum;
                }

                // CG solver: solves (X'WX + λI)x = X'Wy without forming X'WX
                // Matrix-vector product: Av = X'W(Xv) + λv
                const matvec = (v) => {
                    // Step 1: Xv (sparse)
                    const Xv = new Float64Array(numObs);
                    for (let row = 0; row < numObs; row++) {
                        const entries = rowData.get(row) || [];
                        let sum = 0;
                        entries.forEach(e => { sum += e.val * v[e.col]; });
                        Xv[row] = sum;
                    }
                    // Step 2: X'W(Xv) + λv
                    const result = new Float64Array(numFeatures);
                    for (let col = 0; col < numFeatures; col++) {
                        const entries = colData.get(col) || [];
                        let sum = 0;
                        entries.forEach(e => { sum += e.val * (weights[e.row] || 1) * Xv[e.row]; });
                        // Differential lambda (HCA fixed effect gets only a light penalty)
                        const colLambda = col === hcaColIdx ? hcaLambda : (col < playerCount ? lambdaOff : lambdaDef);
                        result[col] = sum + colLambda * v[col];
                    }
                    return result;
                };

                // Conjugate Gradient
                const x = new Float64Array(numFeatures);
                let r = new Float64Array(numFeatures);
                for (let i = 0; i < numFeatures; i++) r[i] = XtWy[i]; // r = b - Ax, x=0 so r=b
                let p = new Float64Array(r);
                let rsOld = 0;
                for (let i = 0; i < numFeatures; i++) rsOld += r[i] * r[i];

                const maxIter = Math.min(2000, numFeatures * 2);
                for (let iter = 0; iter < maxIter; iter++) {
                    const Ap = matvec(p);
                    let pAp = 0;
                    for (let i = 0; i < numFeatures; i++) pAp += p[i] * Ap[i];
                    if (pAp < 1e-20) break;
                    const alpha = rsOld / pAp;
                    for (let i = 0; i < numFeatures; i++) { x[i] += alpha * p[i]; r[i] -= alpha * Ap[i]; }
                    let rsNew = 0;
                    for (let i = 0; i < numFeatures; i++) rsNew += r[i] * r[i];
                    if (Math.sqrt(rsNew) < 1e-10) break;
                    const beta = rsNew / rsOld;
                    for (let i = 0; i < numFeatures; i++) p[i] = r[i] + beta * p[i];
                    rsOld = rsNew;
                }
                return x;
            },
            
            // V6.0: Cholesky decomposition solver for symmetric positive definite matrices
            choleskySolve: function(A, b) {
                const n = A.length;
                const L = [];
                for (let i = 0; i < n; i++) {
                    L[i] = new Float64Array(n);
                }
                
                // Cholesky decomposition: A = LL'
                for (let i = 0; i < n; i++) {
                    for (let j = 0; j <= i; j++) {
                        let sum = 0;
                        for (let k = 0; k < j; k++) {
                            sum += L[i][k] * L[j][k];
                        }
                        if (i === j) {
                            const val = A[i][i] - sum;
                            L[i][j] = val > 0 ? Math.sqrt(val) : 1e-10;
                        } else {
                            L[i][j] = (A[i][j] - sum) / (L[j][j] || 1e-10);
                        }
                    }
                }
                
                // Forward substitution: Ly = b
                const y = new Float64Array(n);
                for (let i = 0; i < n; i++) {
                    let sum = 0;
                    for (let j = 0; j < i; j++) {
                        sum += L[i][j] * y[j];
                    }
                    y[i] = (b[i] - sum) / (L[i][i] || 1e-10);
                }
                
                // Backward substitution: L'x = y
                const x = new Float64Array(n);
                for (let i = n - 1; i >= 0; i--) {
                    let sum = 0;
                    for (let j = i + 1; j < n; j++) {
                        sum += L[j][i] * x[j];
                    }
                    x[i] = (y[i] - sum) / (L[i][i] || 1e-10);
                }
                
                return x;
            },

                const offRows = teamRows.filter(r => !r._players.has(norm));
                const on = derived(aggLineups(onRows));
                const offAgg = offRows.length ? derived(aggLineups(offRows)) : null;
                const ta = teamAgg.get(d.Team);
                row.onNet = on.net; row.onOff = on.off; row.onDef = on.def;
                row.onPoss = on.poss + on.possV;
                row._diffs = {};
                for (const mode of ['onOff', 'vsTeam']) {
                    const cmp = mode === 'onOff' ? (offAgg || ta) : ta;
                    const dd = {};
                    DIFF_KEYS_RAW.forEach(k => dd[k] = on[k] - cmp[k]);
                    DIFF_KEYS_FLIP.forEach(k => dd[k] = cmp[k] - on[k]);
                    dd.net = dd.off + dd.def; // both components already positive-is-good
                    row._diffs[mode] = dd;
                }
            }
        }
        // clutch net (ON clutch lineups)
        const cRows = (clutchByTeam.get(d.Team) || []).filter(r => r._players.has(norm));
        if (cRows.length) {
            const tot = cRows.reduce((a, r) => ({
                poss: a.poss + f(r.POSS),
                defPoss: a.defPoss + (f(r.DEF_POSS) || f(r.POSS)),
                pts: a.pts + f(r.PTS), ptsA: a.ptsA + f(r.PTS_ALLOWED)
            }), { poss: 0, defPoss: 0, pts: 0, ptsA: 0 });
            if (tot.poss >= 5) {
                row.clutchNet = (tot.poss > 0 ? tot.pts / tot.poss * 100 : 0) -
                                (tot.defPoss > 0 ? tot.ptsA / tot.defPoss * 100 : 0);
                row.clutchPoss = tot.poss;
            }
        }
        L.teams.add(d.Team);
        L.players.push(row);
    });
    return L;
}

/* ------------------------------------------------------------------ state */
const S = {
    leagues: new Map(),          // code -> league object (players etc.)
    picked: new Map(),           // code -> {folder, dir, games}
    activeLeagues: new Set(),
    groupsOn: new Set(GROUPS.filter(g => g.def).map(g => g.id)),
    mode: 'pg',                  // pg | tot | p100
    diffMode: 'onOff',           // onOff | vsTeam
    search: '', minMpg: 0, minGp: 0,
    sortKey: 'pts', sortDir: 'desc',
    showAll: false,
    lambda: 800,
    stintsCache: new Map(),      // code -> parsed stint rows
    running: false
};

/* ----------------------------------------------------------------- status */
function makeStatus() {
    const box = $('#statusLog');
    return {
        log(msg, warn) {
            const line = el('div', { class: warn ? 'warn' : '' , text: msg });
            box.append(line); box.scrollTop = box.scrollHeight;
        }
    };
}

/* --------------------------------------------------------------- boot */
async function boot() {
    const status = makeStatus();
    $('#loadState').textContent = 'discovering folders…';
    const folders = await discoverFolders(status);
    const byCode = new Map();
    folders.forEach(fo => {
        if (!byCode.has(fo.code)) byCode.set(fo.code, []);
        byCode.get(fo.code).push(fo);
    });
    status.log(`found ${folders.length} folder(s), ${byCode.size} league code(s)`);

    const codes = [...byCode.keys()].sort();
    let done = 0;
    for (const code of codes) {
        $('#loadState').textContent = `checking ${code} (${++done}/${codes.length})…`;
        const pick = await pickLeagueFolder(code, byCode.get(code), status);
        if (!pick) { status.log(`${code}: NO usable folder — league excluded`, true); continue; }
        S.picked.set(code, pick);
    }

    // load picked leagues (player/lineup/clutch CSVs)
    for (const [code, pick] of S.picked) {
        $('#loadState').textContent = `loading ${code}…`;
        try {
            const [ps, lu, cl] = await Promise.all([
                fetchText(pick.dir + 'player_stats_enhanced.csv'),
                fetchText(pick.dir + 'lineup_stats_enhanced.csv'),
                fetchText(pick.dir + 'clutch_lineup_stats.csv').catch(() => null)
            ]);
            const L = computeLeague(code, { player_stats: ps, lineups: lu, clutch: cl }, pick.games);
            L.folder = pick.folder.name; L.ts = pick.folder.ts; L.dir = pick.dir;
            S.leagues.set(code, L);
            S.activeLeagues.add(code);
            status.log(`${code}: loaded ${L.players.length} players / ${L.teams.size} teams / ${pick.games} games (${pick.folder.ts})`);
        } catch (e) {
            status.log(`${code}: load failed — ${e.message}`, true);
        }
    }
    $('#loadState').textContent = `${S.leagues.size} league(s) loaded`;
    buildControls();
    render();
}

/* ------------------------------------------------------- RAPM / APM run */
async function ensureStints(code) {
    if (S.stintsCache.has(code)) return S.stintsCache.get(code);
    const L = S.leagues.get(code);
    const rows = parseCSV(await fetchText(L.dir + 'stints.csv'));
    // hard sanity (post-download): catches anything the size heuristic missed
    const gameIds = new Set(rows.map(r => r.game_id));
    const totalPts = rows.reduce((a, r) => a + f(r.home_points) + f(r.away_points), 0);
    if (rows.length / Math.max(gameIds.size, 1) < MIN_STINTS_PER_GAME || totalPts === 0) {
        throw new Error(`stints.csv failed sanity (${rows.length} stints / ${gameIds.size} games, ${totalPts} pts) — bugged output`);
    }
    S.stintsCache.set(code, rows);
    return rows;
}

function mergeRapm(code, result) {
    const L = S.leagues.get(code);
    L.rapm = result;
    L.players.forEach(p => {
        const off = PlayerRAPMEngine.getPlayerRapmValue(result, p.player, 'off');
        const def = PlayerRAPMEngine.getPlayerRapmValue(result, p.player, 'def');
        const net = PlayerRAPMEngine.getPlayerRapmValue(result, p.player, 'net');
        p.oRapm = off && off.rapm !== undefined ? off.rapm : null;
        // 'def' returns flipSign(-dRAPM); display convention (index_9): positive = good defense
        p.dRapm = def && def.rapm !== undefined ? -def.rapm : null;
        p.rapm = net && net.rapm !== undefined ? net.rapm : null;
    });
}
function mergeApm(code, result) {
    const L = S.leagues.get(code);
    L.apm = result;
    L.players.forEach(p => {
        const a = PlayerRAPMEngine.getPlayerApmValue(result, p.player);
        p.apm = a ? (a.apm ?? null) : null;
        p.oApm = a ? (a.oapm ?? null) : null;
        p.dApm = a ? (a.dapm ?? null) : null;
    });
}

async function runEngines(kind, codesArg) {
    if (S.running) return;
    S.running = true;
    const codes = codesArg || [...S.activeLeagues];
    const bar = $('#calcBar'), msg = $('#calcMsg');
    $('#calcPanel').style.display = 'block';
    try {
        for (const code of codes) {
            const L = S.leagues.get(code);
            if (!L) continue;
            msg.textContent = `${code}: loading stints…`;
            let rows;
            try { rows = await ensureStints(code); }
            catch (e) { msg.textContent = `${code}: ${e.message}`; continue; }
            const onProg = (p, m) => { bar.style.width = (p || 0) + '%'; msg.textContent = `${code} ${kind}: ${m || ''}`; };
            if (kind === 'RAPM' || kind === 'BOTH') {
                const res = await PlayerRAPMEngine.calculateAsync(rows, S.lambda, onProg);
                if (!res.error) mergeRapm(code, res);
                else msg.textContent = `${code}: RAPM error — ${res.error}`;
            }
            if (kind === 'APM' || kind === 'BOTH') {
                // exact same statsObject construction as index_9's triggerAPMCalculation
                const statsObject = {};
                L.players.forEach(p => {
                    if (p.poss > 0) statsObject[p.playerNorm] = {
                        FGM: p.fgm, FGA: p.fga, '3PM': p.tpm, '3PA': p.tpa, FTM: p.ftm, FTA: p.fta,
                        OREB: p.oreb, DREB: p.dreb, AST: p.ast, STL: p.stl, BLK: p.blk,
                        TOV: p.tov, PF: p.pf, POSS: p.poss
                    };
                });
                const res = await PlayerRAPMEngine.calculateAPMAsync(rows, statsObject, S.lambda, onProg);
                if (!res.error) mergeApm(code, res);
                else msg.textContent = `${code}: APM error — ${res.error}`;
            }
            render();
        }
        msg.textContent = 'done';
    } finally {
        S.running = false;
        setTimeout(() => { $('#calcPanel').style.display = 'none'; }, 2500);
    }
}

/* ----------------------------------------------------------------- table */
function cellValue(row, col) {
    if (col.k === 'leagueLabel') return leagueName(row.league);
    if (col.diff) {
        const d = row._diffs && row._diffs[S.diffMode];
        return d ? d[col.diff] : null;
    }
    let v = row[col.k];
    if (v == null) return null;
    if (col.counting) {
        if (S.mode === 'pg') return row.gp > 0 ? v / row.gp : 0;
        if (S.mode === 'p100') return row.poss > 0 ? v / row.poss * 100 : 0;
        return v;
    }
    if (col.k === 'mpg' && S.mode === 'tot') return row.min;
    return v;
}

function visibleCols() {
    return COLS.filter(c => c.group === 'fixed' || S.groupsOn.has(c.group));
}

function filteredRows() {
    const q = S.search.toLowerCase();
    const rows = [];
    for (const code of S.activeLeagues) {
        const L = S.leagues.get(code);
        if (!L) continue;
        for (const p of L.players) {
            if (p.mpg < S.minMpg || p.gp < S.minGp) continue;
            if (q && !(p.player.toLowerCase().includes(q) || p.team.toLowerCase().includes(q))) continue;
            rows.push(p);
        }
    }
    const col = COLS.find(c => c.k === S.sortKey) || COLS[3];
    rows.sort((a, b) => {
        if (col.str) {
            const av = String(cellValue(a, col) || ''), bv = String(cellValue(b, col) || '');
            return S.sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
        }
        const av = cellValue(a, col), bv = cellValue(b, col);
        const an = av == null ? -Infinity : av, bn = bv == null ? -Infinity : bv;
        return S.sortDir === 'asc' ? an - bn : bn - an;
    });
    return rows;
}

function render() {
    const cols = visibleCols();
    const rows = filteredRows();
    const thead = el('tr', null, ...cols.map((c, i) =>
        el('th', {
            class: (c.str ? 'sticky-col c' + i : '') + (S.sortKey === c.k ? ' sorted' : ''),
            onclick: () => {
                if (S.sortKey === c.k) S.sortDir = S.sortDir === 'asc' ? 'desc' : 'asc';
                else { S.sortKey = c.k; S.sortDir = c.str ? 'asc' : 'desc'; }
                render();
            }
        }, c.label + (S.sortKey === c.k ? (S.sortDir === 'asc' ? ' ▲' : ' ▼') : ''))
    ));
    const shown = S.showAll ? rows : rows.slice(0, 100);
    const frag = document.createDocumentFragment();
    shown.forEach((r, ri) => {
        const tr = document.createElement('tr');
        cols.forEach((c, i) => {
            const td = document.createElement('td');
            const v = cellValue(r, c);
            if (c.str) {
                td.textContent = v == null ? '' : v;
                td.className = 'sticky-col c' + i + (c.k === 'player' ? ' pname' : '');
            } else if (v == null) {
                td.textContent = '—'; td.className = 'muted';
            } else {
                td.textContent = c.diffColor && v > 0 ? '+' + v.toFixed(c.d) : v.toFixed(c.d);
                if (c.diffColor) {
                    const good = (c.hb === false) ? v < 0 : v > 0;
                    td.className = v === 0 ? '' : (good ? 'pos' : 'neg');
                }
            }
            tr.append(td);
        });
        frag.append(tr);
    });
    const table = $('#statTable');
    table.replaceChildren(el('thead', null, thead), el('tbody', null, frag));
    $('#rowCount').textContent = `${shown.length} of ${rows.length} players` + (S.showAll ? '' : ' (top 100 — use Show All)');
}

/* -------------------------------------------------------------- controls */
function buildControls() {
    // league chips
    const lc = $('#leagueChips');
    lc.replaceChildren();
    [...S.leagues.keys()].sort().forEach(code => {
        const L = S.leagues.get(code);
        const chip = el('button', {
            class: 'chip' + (S.activeLeagues.has(code) ? ' on' : ''),
            title: `${L.folder} — ${L.players.length} players, ${L.games} games`,
            onclick: () => {
                if (S.activeLeagues.has(code)) S.activeLeagues.delete(code);
                else S.activeLeagues.add(code);
                buildControls(); render();
            }
        }, `${leagueName(code)} (${L.games}g)`);
        lc.append(chip);
    });
    // group toggles
    const gt = $('#groupToggles');
    gt.replaceChildren();
    GROUPS.forEach(g => {
        gt.append(el('button', {
            class: 'chip small' + (S.groupsOn.has(g.id) ? ' on' : ''),
            onclick: () => {
                if (S.groupsOn.has(g.id)) S.groupsOn.delete(g.id);
                else S.groupsOn.add(g.id);
                buildControls(); render();
            }
        }, g.label));
    });
}

function wireStaticControls() {
    $('#searchBox').addEventListener('input', e => { S.search = e.target.value; render(); });
    $('#minMpg').addEventListener('change', e => { S.minMpg = f(e.target.value); render(); });
    $('#minGp').addEventListener('change', e => { S.minGp = f(e.target.value); render(); });
    $('#modeSel').addEventListener('change', e => { S.mode = e.target.value; render(); });
    $('#diffModeSel').addEventListener('change', e => { S.diffMode = e.target.value; render(); });
    $('#lambdaInput').addEventListener('change', e => { S.lambda = f(e.target.value) || 800; });
    $('#showAllBtn').addEventListener('click', () => { S.showAll = !S.showAll; $('#showAllBtn').textContent = S.showAll ? 'Top 100' : 'Show All'; render(); });
    $('#runRapmBtn').addEventListener('click', () => runEngines('RAPM'));
    $('#runApmBtn').addEventListener('click', () => runEngines('APM'));
    $('#runBothBtn').addEventListener('click', () => runEngines('BOTH'));
    $('#exportBtn').addEventListener('click', exportCsv);
    $('#statusToggle').addEventListener('click', () => {
        const p = $('#statusLog');
        p.style.display = p.style.display === 'none' ? 'block' : 'none';
    });
}

function exportCsv() {
    const cols = visibleCols();
    const rows = filteredRows();
    const esc = (s) => /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    const lines = [cols.map(c => esc(c.label)).join(',')];
    rows.forEach(r => {
        lines.push(cols.map(c => {
            const v = cellValue(r, c);
            if (v == null) return '';
            return c.str ? esc(String(v)) : v.toFixed(c.d);
        }).join(','));
    });
    const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
    const a = el('a', { href: URL.createObjectURL(blob), download: 'prophesy_allstats.csv' });
    document.body.append(a); a.click(); a.remove();
}

/* -------------------------------------------------------------------- go */
document.addEventListener('DOMContentLoaded', () => {
    wireStaticControls();
    boot().catch(e => {
        $('#loadState').textContent = 'FAILED: ' + e.message;
        console.error(e);
    });
});
})();
