<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROPHESY — All-League Stats</title>
    <script src="gate.js"></script>
    <script src="topnav.js" defer></script>
    <style>
        :root {
            --bg: #0f172a; --bg2: #1e293b; --bg3: #273449; --border: #334155;
            --text: #e2e8f0; --muted: #94a3b8; --accent: #a78bfa;
            --pos: #4ade80; --neg: #f87171;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text);
               font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; }
        .wrap { max-width: 1900px; margin: 0 auto; padding: 12px 16px 60px; }
        h1 { font-size: 20px; margin: 10px 0 2px; color: var(--accent); }
        .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
        .panel { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
                 padding: 10px 12px; margin-bottom: 10px; }
        .rowflex { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .chip { background: var(--bg3); color: var(--muted); border: 1px solid var(--border);
                border-radius: 14px; padding: 4px 12px; cursor: pointer; font-size: 12px; }
        .chip.on { background: #4c1d95; color: #ede9fe; border-color: var(--accent); }
        .chip.small { padding: 2px 9px; font-size: 11px; border-radius: 10px; }
        label { color: var(--muted); font-size: 12px; }
        input[type="text"], input[type="number"], select {
            background: var(--bg3); color: var(--text); border: 1px solid var(--border);
            border-radius: 6px; padding: 5px 8px; font-size: 12px; }
        input[type="text"] { width: 210px; }
        input[type="number"] { width: 70px; }
        button.btn { background: #4c1d95; color: #ede9fe; border: 1px solid var(--accent);
                     border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 12px; }
        button.btn.secondary { background: var(--bg3); color: var(--text); border-color: var(--border); }
        #loadState { color: var(--accent); font-size: 12px; }
        #statusLog { display: none; max-height: 180px; overflow-y: auto; background: #0b1120;
                     border: 1px solid var(--border); border-radius: 6px; padding: 8px;
                     font-family: Consolas, monospace; font-size: 11px; margin-top: 8px; }
        #statusLog .warn { color: #fbbf24; }
        #calcPanel { display: none; }
        #calcBarWrap { background: var(--bg3); border-radius: 4px; height: 8px; overflow: hidden; margin-top: 6px; }
        #calcBar { background: var(--accent); height: 100%; width: 0%; transition: width .2s; }
        #calcMsg { font-size: 11px; color: var(--muted); margin-top: 4px; }
        .tablewrap { overflow: auto; max-height: calc(100vh - 130px);
                     border: 1px solid var(--border); border-radius: 8px; }
        table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
        th, td { padding: 4px 8px; text-align: right; white-space: nowrap;
                 border-bottom: 1px solid #1e293b; }
        thead th { position: sticky; top: 0; background: var(--bg3); color: var(--muted);
                   cursor: pointer; z-index: 3; user-select: none; font-size: 11px;
                   border-bottom: 2px solid var(--border); }
        thead th.sorted { color: var(--accent); }
        tbody tr:hover td { background: #1c2a44; }
        td.sticky-col, th.sticky-col { position: sticky; background: var(--bg2); text-align: left; z-index: 2; }
        thead th.sticky-col { z-index: 4; background: var(--bg3); }
        .c0 { left: 0; min-width: 160px; } .c1 { left: 160px; min-width: 130px; } .c2 { left: 290px; min-width: 130px; }
        td.pname { color: #fff; font-weight: 600; }
        td.pos { color: var(--pos); } td.neg { color: var(--neg); } td.muted { color: #475569; }
        #rowCount { color: var(--muted); font-size: 11px; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>🌍 All-League Stats</h1>
    <div class="sub">Every league in one RealGM-style table — newest healthy data folder per league, duplicates deduped, bugged outputs skipped. RAPM &amp; APM use the exact engines from the Lineup Analyzer.</div>

    <div class="panel">
        <div class="rowflex">
            <span id="loadState">booting…</span>
            <button class="chip small" id="statusToggle" style="margin-left:auto">data-source log</button>
        </div>
        <div id="statusLog"></div>
    </div>

    <div class="panel">
        <div class="rowflex" id="leagueChips"></div>
    </div>

    <div class="panel">
        <div class="rowflex">
            <input type="text" id="searchBox" placeholder="Search player / team…">
            <label>Min MPG <input type="number" id="minMpg" value="0" min="0" step="1"></label>
            <label>Min GP <input type="number" id="minGp" value="0" min="0" step="1"></label>
            <label>Box mode
                <select id="modeSel">
                    <option value="pg">Per Game</option>
                    <option value="tot">Totals</option>
                    <option value="p100">Per 100 poss</option>
                </select>
            </label>
            <label>± baseline
                <select id="diffModeSel">
                    <option value="onOff">ON − OFF</option>
                    <option value="vsTeam">ON − Team Avg</option>
                </select>
            </label>
            <button class="btn secondary" id="showAllBtn">Show All</button>
            <button class="btn secondary" id="exportBtn">⬇ CSV</button>
            <span style="flex:1"></span>
            <label>λ <input type="number" id="lambdaInput" value="800" min="1"></label>
            <button class="btn" id="runRapmBtn">Calculate RAPM</button>
            <button class="btn" id="runApmBtn">Calculate APM</button>
            <button class="btn" id="runBothBtn">Both (all leagues)</button>
        </div>
        <div class="rowflex" id="groupToggles" style="margin-top:8px"></div>
        <div id="calcPanel">
            <div id="calcBarWrap"><div id="calcBar"></div></div>
            <div id="calcMsg"></div>
        </div>
    </div>

    <div class="rowflex" style="margin: 4px 2px;"><span id="rowCount"></span></div>
    <div class="tablewrap"><table id="statTable"></table></div>
</div>

<script>
/* ====================================================================
 * ENGINE — carried over VERBATIM from index_9.html (PlayerRAPMEngine +
 * parseCSV / name helpers). Do not edit here; fix in index_9 and re-sync.
 * ==================================================================== */
        function parseCSV(text) {
            const lines = text.trim().split('\n'), headers = [];
            let cur = '', inQ = false;
            for (let c of lines[0]) { if (c === '"') inQ = !inQ; else if (c === ',' && !inQ) { headers.push(cur.trim().replace(/\r/g, '')); cur = ''; } else cur += c; }
            headers.push(cur.trim().replace(/\r/g, ''));
            return lines.slice(1).map(line => {
                const vals = []; cur = ''; inQ = false;
                for (let c of line) { if (c === '"') inQ = !inQ; else if (c === ',' && !inQ) { vals.push(cur.trim().replace(/\r/g, '')); cur = ''; } else cur += c; }
                vals.push(cur.trim().replace(/\r/g, ''));
                const obj = {}; headers.forEach((h, i) => obj[h] = vals[i] || ''); return obj;
            });
        }

        let _globalPlayerMergeRules = [];

        function applyGlobalPlayerMerge(playerName) {
            if (!playerName || _globalPlayerMergeRules.length === 0) return playerName;
            let currentName = playerName.trim();
            let iterations = 0;
            const maxIterations = 10; // Prevent infinite loops from circular rules

            while (iterations < maxIterations) {
                let found = false;
                for (const rule of _globalPlayerMergeRules) {
                    // If current name matches an alias, resolve to primary
                    if (rule.aliases && rule.aliases.includes(currentName)) {
                        currentName = rule.primary;
                        found = true;
                        break;
                    }
                }
                if (!found) break; // No more transformations possible
                iterations++;
            }
            return currentName;
        }

        function setGlobalPlayerMergeRules(rules) {
            _globalPlayerMergeRules = rules || [];
        }

        function normalizePlayerName(name) {
            if (!name) return '';
            // Apply merge first
            const merged = applyGlobalPlayerMerge(name);
            return merged.toLowerCase()
                .replace(/[''`´'ʼˈ]/g, '')  // Remove all apostrophe variants
                .replace(/[^a-z0-9\s-]/g, '')  // Remove other special chars except hyphen
                .replace(/\s+/g, ' ')  // Normalize multiple spaces
                .trim();
        }

        function levenshteinDistance(a, b) {
            const la = a.length, lb = b.length;
            if (la === 0) return lb;
            if (lb === 0) return la;
            const dp = Array.from({ length: la + 1 }, () => Array(lb + 1).fill(0));
            for (let i = 0; i <= la; i++) dp[i][0] = i;
            for (let j = 0; j <= lb; j++) dp[0][j] = j;
            for (let i = 1; i <= la; i++) {
                for (let j = 1; j <= lb; j++) {
                    dp[i][j] = a[i-1] === b[j-1]
                        ? dp[i-1][j-1]
                        : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
                }
            }
            return dp[la][lb];
        }

        function fuzzyMatchPlayerName(name1, name2) {
            if (!name1 || !name2) return false;
            const n1 = normalizePlayerName(name1);
            const n2 = normalizePlayerName(name2);
            
            // Exact match after normalization
            if (n1 === n2) return true;
            
            // Split into parts
            const parts1 = n1.split(' ').filter(p => p.length > 0);
            const parts2 = n2.split(' ').filter(p => p.length > 0);
            
            if (parts1.length < 2 || parts2.length < 2) return false;
            
            // Check if last names match exactly
            const lastName1 = parts1[parts1.length - 1];
            const lastName2 = parts2[parts2.length - 1];
            if (lastName1 !== lastName2) return false;
            
            // Check if first name is abbreviated version or starts with same letters
            const firstName1 = parts1[0];
            const firstName2 = parts2[0];
            
            // One is prefix of the other (Aaryn vs Aaryndeep, Rian vs R'ian -> rian)
            if (firstName1.startsWith(firstName2) || firstName2.startsWith(firstName1)) return true;
            
            // First 3+ chars match (handles typos and abbreviations)
            if (firstName1.length >= 3 && firstName2.length >= 3) {
                if (firstName1.substring(0, 3) === firstName2.substring(0, 3)) return true;
            }
            
            // First 2 chars match (for shorter names like "Ri" in Rian)
            if (firstName1.length >= 2 && firstName2.length >= 2) {
                if (firstName1.substring(0, 2) === firstName2.substring(0, 2)) return true;
            }
            
            return false;
        }

        const PlayerRAPMEngine = {
            
            config: {
                // Default regularization (can be adjusted per stat)
                defaultLambda: 800,
                minStintPoss: 1,
                minPlayerPoss: 20,
                maxRating: 200.0,
                minRating: 0.0,
                // Stat-specific lambda scaling factors (lower = less regularization = more variance)
                // V3.2: Adjusted to more conservative values based on research benchmarks
                // Research: Sill (2010) recommends λ ≈ 2000 for per-100-possession data
                lambdaScales: {
                    'ORtg': 1.0,
                    'eFG': 0.4,       // eFG% - increased for stability
                    'TOV': 0.4,       // TOV% - increased for stability
                    'OREB': 0.5,      // OREB% - increased for stability
                    'FTR': 0.5,       // FT Rate - increased for stability
                    'AST': 0.4,
                    'STL': 0.5,
                    'BLK': 0.5,
                    // Shot location stats
                    'RimPct': 0.45,
                    'RimFreq': 0.5,
                    'MidPct': 0.5,
                    'MidFreq': 0.5,
                    'ThreePct': 0.45,
                    'ThreeFreq': 0.5,
                    // Transition & secondary stats
                    'FastBreak': 0.6,
                    'SecondChance': 0.6,
                    'PtsOffTov': 0.6
                }
            },
            
            // Stat configurations for multi-stat RAPM
            // Each config defines how to extract home/away values from a stint
            statConfigs: {
                'ORtg': {
                    name: 'Offensive Rating',
                    getHomeValue: (s) => { const p = s.homePossessions || s.possessions; return p > 0 ? (s.homePts / p) * 100 : null; },
                    getAwayValue: (s) => { const p = s.awayPossessions || s.possessions; return p > 0 ? (s.awayPts / p) * 100 : null; },
                    minVal: 0, maxVal: 200,
                    higherBetter: true,
                    unit: 'pts/100'
                },
                'eFG': {
                    name: 'Effective FG%',
                    getHomeValue: (s) => s.homeFga > 0 ? ((s.homeFgm + 0.5 * s.homeFg3m) / s.homeFga) * 100 : null,
                    getAwayValue: (s) => s.awayFga > 0 ? ((s.awayFgm + 0.5 * s.awayFg3m) / s.awayFga) * 100 : null,
                    minVal: 0, maxVal: 100,
                    higherBetter: true,
                    unit: '%'
                },
                'TOV': {
                    name: 'Turnover %',
                    getHomeValue: (s) => {
                        const denom = s.homeFga + 0.44 * s.homeFta + s.homeTov;
                        return denom > 0 ? (s.homeTov / denom) * 100 : null;
                    },
                    getAwayValue: (s) => {
                        const denom = s.awayFga + 0.44 * s.awayFta + s.awayTov;
                        return denom > 0 ? (s.awayTov / denom) * 100 : null;
                    },
                    minVal: 0, maxVal: 50,
                    higherBetter: false,
                    unit: '%'
                },
                'OREB': {
                    name: 'Offensive Rebound %',
                    getHomeValue: (s) => {
                        const total = s.homeOreb + s.awayDreb;
                        return total > 0 ? (s.homeOreb / total) * 100 : null;
                    },
                    getAwayValue: (s) => {
                        const total = s.awayOreb + s.homeDreb;
                        return total > 0 ? (s.awayOreb / total) * 100 : null;
                    },
                    minVal: 0, maxVal: 100,
                    higherBetter: true,
                    unit: '%'
                },
                'FTR': {
                    name: 'Free Throw Rate',
                    getHomeValue: (s) => s.homeFga > 0 ? (s.homeFta / s.homeFga) * 100 : null,
                    getAwayValue: (s) => s.awayFga > 0 ? (s.awayFta / s.awayFga) * 100 : null,
                    minVal: 0, maxVal: 100,
                    higherBetter: true,
                    unit: '%'
                },
                'AST': {
                    name: 'Assist %',
                    getHomeValue: (s) => s.homeFgm > 0 ? (s.homeAst / s.homeFgm) * 100 : null,
                    getAwayValue: (s) => s.awayFgm > 0 ? (s.awayAst / s.awayFgm) * 100 : null,
                    minVal: 0, maxVal: 100,
                    higherBetter: true,
                    unit: '%'
                },
                'STL': {
                    name: 'Steal %',
                    getHomeValue: (s) => { const p = s.awayPossessions || s.possessions; return p > 0 ? (s.homeStl / p) * 100 : null; },
                    getAwayValue: (s) => { const p = s.homePossessions || s.possessions; return p > 0 ? (s.awayStl / p) * 100 : null; },
                    minVal: 0, maxVal: 20,
                    higherBetter: true,
                    unit: '%'
                },
                'BLK': {
                    name: 'Block %',
                    getHomeValue: (s) => {
                        const opp2pa = s.awayFga - s.awayFg3a;
                        return opp2pa > 0 ? (s.homeBlk / opp2pa) * 100 : null;
                    },
                    getAwayValue: (s) => {
                        const opp2pa = s.homeFga - s.homeFg3a;
                        return opp2pa > 0 ? (s.awayBlk / opp2pa) * 100 : null;
                    },
                    minVal: 0, maxVal: 30,
                    higherBetter: true,
                    unit: '%'
                },
                // === SHOT LOCATION STATS ===
                'RimPct': {
                    name: 'Rim FG%',
                    getHomeValue: (s) => s.homeRimAtt > 0 ? (s.homeRimMade / s.homeRimAtt) * 100 : null,
                    getAwayValue: (s) => s.awayRimAtt > 0 ? (s.awayRimMade / s.awayRimAtt) * 100 : null,
                    minVal: 0, maxVal: 100,
                    higherBetter: true,
                    unit: '%'
                },
                'RimFreq': {
                    name: 'Rim Frequency',
                    getHomeValue: (s) => s.homeFga > 0 ? (s.homeRimAtt / s.homeFga) * 100 : null,
                    getAwayValue: (s) => s.awayFga > 0 ? (s.awayRimAtt / s.awayFga) * 100 : null,
                    minVal: 0, maxVal: 100,
                    higherBetter: true,
                    unit: '%'
                },
                'MidPct': {
                    name: 'Mid-Range FG%',
                    getHomeValue: (s) => s.homeMidAtt > 0 ? (s.homeMidMade / s.homeMidAtt) * 100 : null,
                    getAwayValue: (s) => s.awayMidAtt > 0 ? (s.awayMidMade / s.awayMidAtt) * 100 : null,
                    minVal: 0, maxVal: 100,
                    higherBetter: true,
                    unit: '%'
                },
                'MidFreq': {
                    name: 'Mid-Range Frequency',
                    getHomeValue: (s) => s.homeFga > 0 ? (s.homeMidAtt / s.homeFga) * 100 : null,
                    getAwayValue: (s) => s.awayFga > 0 ? (s.awayMidAtt / s.awayFga) * 100 : null,
                    minVal: 0, maxVal: 100,
                    higherBetter: false, // Generally less mid-range is better
                    unit: '%'
                },
                'ThreePct': {
                    name: '3PT FG%',
                    getHomeValue: (s) => s.homeFg3a > 0 ? (s.homeFg3m / s.homeFg3a) * 100 : null,
                    getAwayValue: (s) => s.awayFg3a > 0 ? (s.awayFg3m / s.awayFg3a) * 100 : null,
                    minVal: 0, maxVal: 100,
                    higherBetter: true,
                    unit: '%'
                },
                'ThreeFreq': {
                    name: '3PT Frequency',
                    getHomeValue: (s) => s.homeFga > 0 ? (s.homeFg3a / s.homeFga) * 100 : null,
                    getAwayValue: (s) => s.awayFga > 0 ? (s.awayFg3a / s.awayFga) * 100 : null,
                    minVal: 0, maxVal: 100,
                    higherBetter: true,
                    unit: '%'
                },
                // === TRANSITION & SECONDARY STATS ===
                'FastBreak': {
                    name: 'Fast Break Pts/100',
                    getHomeValue: (s) => { const p = s.homePossessions || s.possessions; return p > 0 ? (s.homeFastBreak / p) * 100 : null; },
                    getAwayValue: (s) => { const p = s.awayPossessions || s.possessions; return p > 0 ? (s.awayFastBreak / p) * 100 : null; },
                    minVal: 0, maxVal: 50,
                    higherBetter: true,
                    unit: 'pts/100'
                },
                'SecondChance': {
                    name: '2nd Chance Pts/100',
                    getHomeValue: (s) => { const p = s.homePossessions || s.possessions; return p > 0 ? (s.homeSecondChance / p) * 100 : null; },
                    getAwayValue: (s) => { const p = s.awayPossessions || s.possessions; return p > 0 ? (s.awaySecondChance / p) * 100 : null; },
                    minVal: 0, maxVal: 50,
                    higherBetter: true,
                    unit: 'pts/100'
                },
                'PtsOffTov': {
                    name: 'Pts Off TO/100',
                    getHomeValue: (s) => { const p = s.homePossessions || s.possessions; return p > 0 ? (s.homePtsOffTov / p) * 100 : null; },
                    getAwayValue: (s) => { const p = s.awayPossessions || s.possessions; return p > 0 ? (s.awayPtsOffTov / p) * 100 : null; },
                    minVal: 0, maxVal: 50,
                    higherBetter: true,
                    unit: 'pts/100'
                },
                'PTS100': {
                    name: 'Points per 100',
                    getHomeValue: (s) => { const p = s.homePossessions || s.possessions; return p > 0 ? (s.homePts / p) * 100 : null; },
                    getAwayValue: (s) => { const p = s.awayPossessions || s.possessions; return p > 0 ? (s.awayPts / p) * 100 : null; },
                    minVal: 0, maxVal: 200,
                    higherBetter: true,
                    unit: 'pts/100'
                }
            },
            
            // Build player index exactly like Python _build_player_list
            buildPlayerIndex: function(stints) {
                const playerSet = new Set();
                const playerPossessions = new Map();

                stints.forEach(stint => {
                    const homePoss = stint.homePossessions || stint.possessions;
                    const awayPoss = stint.awayPossessions || stint.possessions;
                    stint.homePlayers.forEach(p => {
                        playerSet.add(p);
                        playerPossessions.set(p, (playerPossessions.get(p) || 0) + homePoss);
                    });
                    stint.awayPlayers.forEach(p => {
                        playerSet.add(p);
                        playerPossessions.set(p, (playerPossessions.get(p) || 0) + awayPoss);
                    });
                });
                
                // Sort player list like Python
                const playerList = Array.from(playerSet).sort();
                const playerToIdx = new Map();
                playerList.forEach((player, idx) => playerToIdx.set(player, idx));
                
                return { 
                    playerList, 
                    playerToIdx, 
                    playerCount: playerList.length,
                    playerPossessions 
                };
            },
            
            // GENERALIZED: Build RAPM matrices for ANY stat
            // statKey: key from statConfigs (e.g., 'eFG', 'TOV', 'OREB', 'FTR', 'ORtg')
            // V3.2: Added response centering and stat-specific weighting
            buildRAPMMatricesForStat: function(stints, playerIndex, statKey) {
                const config = this.statConfigs[statKey];
                if (!config) {
                    console.error('[RAPM V3.2] Unknown stat:', statKey);
                    return null;
                }
                
                const numPlayers = playerIndex.playerCount;
                // V3.3: +1 column for home-court advantage (HCA). Home offense obs get +0.5,
                // away offense obs get -0.5, so the HCA coefficient = full home-minus-away gap
                // and venue bias no longer leaks into player coefficients.
                const numFeatures = numPlayers * 2 + 1; // First half: offensive, Second half: defensive, last: HCA
                const hcaCol = numPlayers * 2;
                const self = this;
                
                // Helper function: Get stat-specific weight for an observation
                // V3.2: Weights should reflect information content, not just possessions
                function getStatSpecificWeight(stint, statKey, isHome) {
                    const poss = isHome ? (stint.homePossessions || stint.possessions) : (stint.awayPossessions || stint.possessions);

                    switch(statKey) {
                        // Shooting percentages: weight by attempts (more shots = more info)
                        case 'eFG':
                        case 'MidPct':
                        case 'RimPct':
                        case 'FTR':  // FTRate = FTA/FGA, so FGA-based weighting
                            return isHome ? Math.max(stint.homeFga || 1, 1) : Math.max(stint.awayFga || 1, 1);
                        
                        case 'ThreePct':
                        case 'ThreeFreq':
                            return isHome ? Math.max(stint.homeFg3a || 1, 1) : Math.max(stint.awayFg3a || 1, 1);
                        
                        case 'MidFreq':
                            return isHome ? Math.max(stint.homeFga || 1, 1) : Math.max(stint.awayFga || 1, 1);
                        
                        case 'RimFreq':
                            return isHome ? Math.max(stint.homeFga || 1, 1) : Math.max(stint.awayFga || 1, 1);
                        
                        case 'BLK':
                            // Block % uses opponent 2PA as denominator
                            if (isHome) {
                                return Math.max((stint.awayFga - stint.awayFg3a) || 1, 1);
                            } else {
                                return Math.max((stint.homeFga - stint.homeFg3a) || 1, 1);
                            }
                        
                        case 'AST':
                            // AST% = AST/FGM, weight by FGM
                            return isHome ? Math.max(stint.homeFgm || 1, 1) : Math.max(stint.awayFgm || 1, 1);

                        case 'STL':
                            // STL% response = steals per OPPONENT possession (see statConfigs),
                            // so information content scales with opponent possessions —
                            // weighting by own possessions mismatched the response units.
                            return isHome ? (stint.awayPossessions || stint.possessions)
                                          : (stint.homePossessions || stint.possessions);

                        // Rate stats: possessions is appropriate
                        case 'ORtg':
                        case 'TOV':
                        case 'OREB':
                        case 'FastBreak':
                        case 'SecondChance':
                        case 'PtsOffTov':
                        case 'PTS100':
                        default:
                            return poss;
                    }
                }
                
                // ========== FIRST PASS: Compute weighted mean for response centering ==========
                // V3.2: Response centering ensures ridge penalty shrinks toward league average
                let sumY = 0;
                let totalWeight = 0;
                let validStintsCount = 0;
                let skippedNull = 0;
                
                stints.forEach(stint => {
                    const poss = stint.possessions;
                    if (poss < self.config.minStintPoss) return;
                    
                    const homeVal = config.getHomeValue(stint);
                    const awayVal = config.getAwayValue(stint);
                    
                    // Check home observation
                    if (homeVal !== null && homeVal !== undefined && isFinite(homeVal)) {
                        const clampedHome = Math.max(config.minVal, Math.min(config.maxVal, homeVal));
                        const homeWeight = getStatSpecificWeight(stint, statKey, true);
                        if (homeWeight > 0) {
                            sumY += homeWeight * clampedHome;
                            totalWeight += homeWeight;
                        }
                    }
                    
                    // Check away observation
                    if (awayVal !== null && awayVal !== undefined && isFinite(awayVal)) {
                        const clampedAway = Math.max(config.minVal, Math.min(config.maxVal, awayVal));
                        const awayWeight = getStatSpecificWeight(stint, statKey, false);
                        if (awayWeight > 0) {
                            sumY += awayWeight * clampedAway;
                            totalWeight += awayWeight;
                        }
                    }
                });
                
                const yMean = totalWeight > 0 ? sumY / totalWeight : 0;
                console.log('[RAPM V3.2] ' + statKey + ': response centering with yMean=' + yMean.toFixed(3));
                
                // ========== SECOND PASS: Build matrices with centered response ==========
                const XData = [];
                const yData = [];
                const weightsData = [];
                const obsGameData = [];  // game_id per observation (game-blocked CV)
                let obsIdx = 0;
                
                stints.forEach(stint => {
                    const poss = stint.possessions;
                    if (poss < self.config.minStintPoss) return;
                    
                    // Get home and away values for this stat
                    const homeVal = config.getHomeValue(stint);
                    const awayVal = config.getAwayValue(stint);
                    
                    // Skip if either value is null/undefined (insufficient data for this stat)
                    if (homeVal === null || homeVal === undefined || awayVal === null || awayVal === undefined) {
                        skippedNull++;
                        return;
                    }
                    
                    if (!isFinite(homeVal) || !isFinite(awayVal)) {
                        skippedNull++;
                        return;
                    }
                    
                    // Clamp values
                    const clampedHome = Math.max(config.minVal, Math.min(config.maxVal, homeVal));
                    const clampedAway = Math.max(config.minVal, Math.min(config.maxVal, awayVal));
                    
                    // V3.2: CENTER THE RESPONSE (subtract weighted mean)
                    const centeredHome = clampedHome - yMean;
                    const centeredAway = clampedAway - yMean;
                    
                    // Get stat-specific weights
                    const homeWeight = getStatSpecificWeight(stint, statKey, true);
                    const awayWeight = getStatSpecificWeight(stint, statKey, false);
                    
                    // Skip if weights are too small
                    if (homeWeight < 0.5 || awayWeight < 0.5) {
                        skippedNull++;
                        return;
                    }
                    
                    validStintsCount++;
                    
                    // === OBSERVATION 1: Home team's offensive value ===
                    // Home players get +1 in OFFENSIVE column (indices 0 to numPlayers-1)
                    stint.homePlayers.forEach(player => {
                        const idx = playerIndex.playerToIdx.get(player);
                        if (idx !== undefined) {
                            XData.push({ row: obsIdx, col: idx, val: 1.0 });
                        }
                    });
                    
                    // Away players get -1 in DEFENSIVE column (indices numPlayers to 2*numPlayers-1)
                    // They are defending against home team's offense
                    stint.awayPlayers.forEach(player => {
                        const idx = playerIndex.playerToIdx.get(player);
                        if (idx !== undefined) {
                            XData.push({ row: obsIdx, col: numPlayers + idx, val: -1.0 });
                        }
                    });
                    
                    // V3.3: Home-court advantage indicator (+0.5 for home offense)
                    XData.push({ row: obsIdx, col: hcaCol, val: 0.5 });

                    yData.push(centeredHome);  // V3.2: Now centered
                    weightsData.push(homeWeight);  // V3.2: Stat-specific weight
                    obsGameData.push(stint.gameId || '');  // for game-blocked CV folds
                    obsIdx++;
                    
                    // === OBSERVATION 2: Away team's offensive value ===
                    // Away players get +1 in OFFENSIVE column
                    stint.awayPlayers.forEach(player => {
                        const idx = playerIndex.playerToIdx.get(player);
                        if (idx !== undefined) {
                            XData.push({ row: obsIdx, col: idx, val: 1.0 });
                        }
                    });
                    
                    // Home players get -1 in DEFENSIVE column
                    // They are defending against away team's offense
                    stint.homePlayers.forEach(player => {
                        const idx = playerIndex.playerToIdx.get(player);
                        if (idx !== undefined) {
                            XData.push({ row: obsIdx, col: numPlayers + idx, val: -1.0 });
                        }
                    });
                    
                    // V3.3: Home-court advantage indicator (-0.5 for away offense)
                    XData.push({ row: obsIdx, col: hcaCol, val: -0.5 });

                    yData.push(centeredAway);  // V3.2: Now centered
                    weightsData.push(awayWeight);  // V3.2: Stat-specific weight
                    obsGameData.push(stint.gameId || '');  // for game-blocked CV folds
                    obsIdx++;
                });
                
                if (validStintsCount === 0) {
                    console.warn('[RAPM V3.2] No valid stints for stat:', statKey);
                    return null;
                }
                
                console.log('[RAPM V3.2] ' + statKey + ': ' + validStintsCount + ' valid stints, ' + skippedNull + ' skipped (null/invalid values)');
                
                return {

                    y: yData,
                    weights: weightsData,
                    obsGame: obsGameData,  // game_id per observation (game-blocked CV)
                    numObs: obsIdx,

            // Solve weighted ridge regression: (X'WX + λI)β = X'Wy
            // Using Conjugate Gradient method
            // V3.3: optional hcaCol gets a much lighter penalty (fixed effect, not shrunk like players)
            solveWeightedRidge: function(XData, y, weights, numObs, numFeatures, lambda, hcaCol) {
                console.log('[RAPM] Building normal equations...');
                
                // Build X'WX and X'Wy
                const XtWX = new Float64Array(numFeatures * numFeatures);
                const XtWy = new Float64Array(numFeatures);
                
                // Group XData by row for efficient processing
                const rowData = new Map();
                XData.forEach(entry => {
                    if (!rowData.has(entry.row)) rowData.set(entry.row, []);
                    rowData.get(entry.row).push({ col: entry.col, val: entry.val });
                });
                
                // Compute X'WX and X'Wy
                for (let i = 0; i < numObs; i++) {
                    const w = weights[i];
                    const yi = y[i];
                    const rowEntries = rowData.get(i) || [];
                    
                    // X'Wy contribution
                    rowEntries.forEach(entry => {
                        XtWy[entry.col] += w * entry.val * yi;
                    });
                    
                    // X'WX contribution
                    rowEntries.forEach(e1 => {
                        rowEntries.forEach(e2 => {
                            XtWX[e1.col * numFeatures + e2.col] += w * e1.val * e2.val;
                        });
                    });
                }
                
                // Add regularization: X'WX + λI
                // V3.3: HCA column is a fixed effect — penalize it only lightly (1% of λ)
                for (let i = 0; i < numFeatures; i++) {
                    XtWX[i * numFeatures + i] += (i === hcaCol ? lambda * 0.01 : lambda);
                }

                console.log('[RAPM] Solving with Conjugate Gradient...');

                // V3.3: scale-relative convergence tolerance (absolute tol is meaningless across stat scales)
                let bNormSq = 0;
                for (let i = 0; i < numFeatures; i++) bNormSq += XtWy[i] * XtWy[i];
                const cgTol = Math.max(1e-10, 1e-8 * Math.sqrt(bNormSq));

                // Solve using Conjugate Gradient
                const beta = this.conjugateGradient(XtWX, XtWy, numFeatures, 2000, cgTol);

                return beta;
            },
            
            // Conjugate Gradient solver for Ax = b
            conjugateGradient: function(A, b, n, maxIter, tol) {
                const x = new Float64Array(n);
                const r = new Float64Array(n);
                const p = new Float64Array(n);
                const Ap = new Float64Array(n);
                
                // r = b - Ax (initially x=0, so r=b)
                for (let i = 0; i < n; i++) r[i] = b[i];
                for (let i = 0; i < n; i++) p[i] = r[i];
                
                let rsold = 0;
                for (let i = 0; i < n; i++) rsold += r[i] * r[i];
                
                for (let iter = 0; iter < maxIter; iter++) {
                    // Ap = A * p
                    for (let i = 0; i < n; i++) {
                        Ap[i] = 0;
                        for (let j = 0; j < n; j++) {
                            Ap[i] += A[i * n + j] * p[j];
                        }
                    }
                    
                    // alpha = rsold / (p' * Ap)
                    let pAp = 0;
                    for (let i = 0; i < n; i++) pAp += p[i] * Ap[i];
                    if (Math.abs(pAp) < 1e-15) break;
                    
                    const alpha = rsold / pAp;
                    
                    // x = x + alpha * p
                    // r = r - alpha * Ap
                    for (let i = 0; i < n; i++) {
                        x[i] += alpha * p[i];
                        r[i] -= alpha * Ap[i];
                    }
                    
                    // Check convergence
                    let rsnew = 0;
                    for (let i = 0; i < n; i++) rsnew += r[i] * r[i];
                    
                    if (Math.sqrt(rsnew) < tol) {
                        console.log('[RAPM] CG converged at iteration ' + iter);
                        break;
                    }
                    
                    // p = r + (rsnew/rsold) * p
                    const beta = rsnew / rsold;
                    for (let i = 0; i < n; i++) {
                        p[i] = r[i] + beta * p[i];
                    }
                    
                    rsold = rsnew;
                }
                
                return x;
            },
            
            // Post-center coefficients exactly like Python _center_rapm
            centerRAPM: function(coefficients, numPlayers, playerIndex) {
                const orapm = {};
                const drapm = {};
                
                // Extract raw coefficients
                playerIndex.playerList.forEach((player, idx) => {
                    orapm[player] = coefficients[idx];
                    drapm[player] = coefficients[numPlayers + idx];
                });
                
                // Compute possession-weighted means
                let totalPoss = 0;
                let orapmSum = 0;
                let drapmSum = 0;
                
                playerIndex.playerList.forEach(player => {
                    const poss = playerIndex.playerPossessions.get(player) || 0;
                    totalPoss += poss;
                    orapmSum += orapm[player] * poss;
                    drapmSum += drapm[player] * poss;
                });
                
                const orapmMean = totalPoss > 0 ? orapmSum / totalPoss : 0;
                const drapmMean = totalPoss > 0 ? drapmSum / totalPoss : 0;
                
                console.log('[RAPM] Centering: ORAPM mean=' + orapmMean.toFixed(3) + ', DRAPM mean=' + drapmMean.toFixed(3));
                
                // Center the coefficients
                playerIndex.playerList.forEach(player => {
                    orapm[player] -= orapmMean;
                    drapm[player] -= drapmMean;
                });
                
                return { orapm, drapm };
            },

            // Build directional play type stints from play type events
            // Groups events by (offLineup, defLineup) and aggregates per play type + category
            buildPlayTypeStints: function(ptEvents, getCategoryTypes) {
                const groups = {};
                ptEvents.forEach(ev => {
                    if (!ev.offLineup || !ev.defLineup) return;
                    const offPlayers = ev.offLineup.split(',').map(n => applyGlobalPlayerMerge(n.trim()).toLowerCase()).filter(n => n);
                    const defPlayers = ev.defLineup.split(',').map(n => applyGlobalPlayerMerge(n.trim()).toLowerCase()).filter(n => n);
                    if (offPlayers.length !== 5 || defPlayers.length !== 5) return;
                    const offSorted = [...offPlayers].sort();
                    const defSorted = [...defPlayers].sort();
                    const key = offSorted.join(',') + '|' + defSorted.join(',');
                    if (!groups[key]) groups[key] = { offPlayers: offSorted, defPlayers: defSorted, events: [] };
                    groups[key].events.push(ev);
                });
                return Object.values(groups).map(g => {
                    const allPoss = g.events.filter(ev => ev.isPossession).length;
                    const ptAggs = {};
                    const catAggs = {};
                    g.events.forEach(ev => {
                        const pt = ev.shotType;
                        if (!pt) return;
                        if (!ptAggs[pt]) ptAggs[pt] = { poss: 0, pts: 0, fga: 0, fgm: 0, fg3m: 0, tov: 0, fta: 0 };
                        const a = ptAggs[pt];
                        if (ev.isPossession) a.poss++;
                        a.pts += ev.points || 0;
                        if (ev.isFG) a.fga++;
                        if (ev.isMake2 || ev.isMake3) a.fgm++;
                        if (ev.isMake3) a.fg3m++;
                        if (ev.isTurnover) a.tov++;
                        a.fta += ev.fta || 0;
                        // Category aggregates
                        if (getCategoryTypes) {
                            ['creation', 'spacing', 'finishing', 'transition'].forEach(cat => {
                                const types = getCategoryTypes(cat);
                                if (types && types.includes(pt)) {
                                    if (!catAggs[cat]) catAggs[cat] = { poss: 0, pts: 0, fga: 0, fgm: 0, fg3m: 0, tov: 0, fta: 0 };
                                    const c = catAggs[cat];
                                    if (ev.isPossession) c.poss++;
                                    c.pts += ev.points || 0;
                                    if (ev.isFG) c.fga++;
                                    if (ev.isMake2 || ev.isMake3) c.fgm++;
                                    if (ev.isMake3) c.fg3m++;
                                    if (ev.isTurnover) c.tov++;
                                    c.fta += ev.fta || 0;
                                }
                            });
                        }
                    });
                    return { offPlayers: g.offPlayers, defPlayers: g.defPlayers, totalPoss: allPoss, playTypes: ptAggs, categories: catAggs };
                });
            },

            // Build RAPM matrices for a specific play type stat from directional stints
            // Each stint is one observation (offense → defense direction)
            buildPlayTypeRAPMMatrices: function(ptStints, playerIndex, statType) {
                const numPlayers = playerIndex.playerCount;
                const numFeatures = numPlayers * 2;

                function getValue(s, statType) {
                    switch(statType) {
                        case 'PPP': return s.poss > 0 ? (s.pts / s.poss) * 100 : null;
                        case 'eFG': return s.fga > 0 ? ((s.fgm + 0.5 * s.fg3m) / s.fga) * 100 : null;
                        case 'TOV': return s.poss > 0 ? (s.tov / s.poss) * 100 : null;
                        case 'FTR': return s.fga > 0 ? (s.fta / s.fga) * 100 : null;
                        case 'Freq': return s.totalPoss > 0 ? (s.poss / s.totalPoss) * 100 : null;
                        default: return null;
                    }
                }
                function getWeight(s, statType) {
                    switch(statType) {
                        case 'eFG': case 'FTR': return Math.max(s.fga || 1, 1);
                        default: return Math.max(s.poss || 0, 0);
                    }
                }

                // First pass: compute weighted mean for centering
                let sumY = 0, totalWeight = 0;
                ptStints.forEach(s => {
                    const val = getValue(s, statType);
                    if (val == null || !isFinite(val)) return;
                    const w = getWeight(s, statType);
                    if (w < 0.5) return;
                    sumY += w * val;
                    totalWeight += w;
                });
                const yMean = totalWeight > 0 ? sumY / totalWeight : 0;

                // Second pass: build matrices
                const XData = [], yData = [], weightsData = [];
                let obsIdx = 0, validCount = 0;

                ptStints.forEach(s => {
                    const val = getValue(s, statType);
                    if (val == null || !isFinite(val)) return;
                    const w = getWeight(s, statType);
                    if (w < 0.5) return;
                    validCount++;

                    // Offensive players: +1 in offensive columns
                    s.offPlayers.forEach(p => {
                        const idx = playerIndex.playerToIdx.get(p);
                        if (idx !== undefined) XData.push({ row: obsIdx, col: idx, val: 1.0 });
                    });
                    // Defensive players: -1 in defensive columns
                    s.defPlayers.forEach(p => {
                        const idx = playerIndex.playerToIdx.get(p);
                        if (idx !== undefined) XData.push({ row: obsIdx, col: numPlayers + idx, val: -1.0 });
                    });

                    yData.push(val - yMean);
                    weightsData.push(w);
                    obsIdx++;
                });

                if (obsIdx === 0) return null;
                return { XData, y: yData, weights: weightsData, numObs: obsIdx, numFeatures, validStints: validCount, leagueAvg: yMean, yMean };
            },

            // Dynamic mapping for play type on-off column keys to RAPM stat names
            getDynamicMapping: function(leaderboardStat) {
                const patterns = [
                    { prefix: 'onoff_pt_', type: 'PT', isDef: false },
                    { prefix: 'donoff_pt_', type: 'PT', isDef: true },
                    { prefix: 'onoff_cat_', type: 'CAT', isDef: false },
                    { prefix: 'donoff_cat_', type: 'CAT', isDef: true }
                ];
                for (const p of patterns) {
                    if (!leaderboardStat.startsWith(p.prefix)) continue;
                    const rest = leaderboardStat.substring(p.prefix.length);
                    const lastIdx = rest.lastIndexOf('_');
                    if (lastIdx < 0) continue;
                    const name = rest.substring(0, lastIdx);
                    const stat = rest.substring(lastIdx + 1);
                    const statMap = { ppp: 'PPP', efg: 'eFG', tovPct: 'TOV', ftr: 'FTR', possPct: 'Freq' };
                    const rapmStat = statMap[stat];
                    if (!rapmStat) continue;
                    const rapmStatName = p.type + '_' + name + '_' + rapmStat;
                    // Sign conventions matching existing RAPM stat mapping:
                    // offTov: flipSign true (higher TOV = bad for offense)
                    // defTov: no flipSign (higher opponent TOV = good)
                    // def PPP/eFG/FTR: flipSign true (lower opponent = good)
                    let flipSign = false;
                    if (stat === 'tovPct') flipSign = !p.isDef;
                    else if (['ppp', 'efg', 'ftr'].includes(stat)) flipSign = p.isDef;
                    return { useRapm: true, rapmStatName, useDefCoef: p.isDef, flipSign, higherBetter: true };
                }
                return null;
            },

                            // Play Type RAPM: compute RAPM coefficients for each play type and category
