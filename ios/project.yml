# THE EPINOIA IPHONE APP'S PROJECT, AS TEXT. XcodeGen (https://github.com/yonaskolb/XcodeGen)
# turns this file into Epinoia.xcodeproj, on CI and on a Mac:
#     cd ios && xcodegen generate
# The .xcodeproj is never committed (ios/.gitignore): its project.pbxproj is thousands of lines of
# generated IDs that nobody can review in a pull request, and it cannot be written on the Windows PC
# this repo is edited on. Everything that matters about the build is here instead.
#
# Versions are defaults only. CI reads epinoia/ios/version.json and passes MARKETING_VERSION and
# CURRENT_PROJECT_VERSION to xcodebuild, and Info.plist takes both from those build settings.
name: Epinoia

options:
  bundleIdPrefix: uk.co.prophesyscouting
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true

targets:
  Epinoia:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    # Everything in Epinoia/ by file type: .swift compiled; Assets.xcassets and
    # PrivacyInfo.xcprivacy copied as resources; Info.plist and Epinoia.entitlements in no build
    # phase (they are read through the INFOPLIST_FILE and CODE_SIGN_ENTITLEMENTS settings). CI
    # checks the built app really contains PrivacyInfo.xcprivacy.
    sources:
      - path: Epinoia
    settings:
      base:
        PRODUCT_NAME: Epinoia
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.prophesyscouting.epinoia
        INFOPLIST_FILE: Epinoia/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Epinoia/Epinoia.entitlements
        # Automatic for a Mac with Xcode signed in; CI's release overrides it with Manual.
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only: the site is laid out for phones, and an iPad app would need iPad screenshots.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        # SWIFT 5 LANGUAGE MODE, MINIMAL CONCURRENCY CHECKING. Swift 6 mode turns UIKit, WebKit and
        # UserNotifications' incomplete concurrency annotations into hard errors and runtime
        # isolation traps. The UI types are still @MainActor in the code.
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          # DEBUG: Web Inspector on, and the bridge reports apnsEnv 'sandbox'.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

schemes:
  Epinoia:
    build:
      targets:
        Epinoia: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
