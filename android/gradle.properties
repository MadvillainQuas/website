# ANDROIDX ON. androidbrowserhelper and androidx.core are AndroidX libraries; nothing here
# uses the old support library, so Jetifier stays off.
android.useAndroidX=true

# EACH MODULE'S R CLASS HOLDS ONLY ITS OWN RESOURCES. The AGP 8 default, written down.
android.nonTransitiveRClass=true

# ENOUGH HEAP FOR D8 ON A CI RUNNER, and UTF-8 so the Λ in comments never trips the compiler.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
