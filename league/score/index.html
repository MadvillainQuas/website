/* ==================== gesture engine ==================== */
let SC = null; // adjust-button time-scrub gesture

function scrubRate(held){
  // gentle ramp: 1 s/s until 5s held, 2 s/s at 5s -> 5 s/s at 10s -> 10 s/s at 15s
  const s = held/1000;
  if(s<5) return 1;
  if(s<10) return 2 + (s-5)*(3/5);
  if(s<15) return 5 + (s-10)*(5/5);
  return 10;
}
function scrubStep(){
  if(!SC) return;
  const now = Date.now();
  const dt = now-(SC.lastStep||now); SC.lastStep = now;
  if(!SC.dir) return;
  const rate = scrubRate(now-SC.dirStart);
  S.clockMs = Math.max(0, Math.min(PLEN(S.period), S.clockMs + SC.dir*rate*dt));
  const el = $('#clkTxt'); if(el) el.textContent = fmtClock(S.clockMs);
  SC.btn.classList.add('scrubbing');
  SC.btn.innerHTML = '<span class="ic">'+(SC.dir>0?'◂◂':'▸▸')+'</span>'+rate.toFixed(1)+'×';
}
function endScrub(){
  if(!SC) return;
  clearInterval(SC.iv);
  const moved = SC.moved; SC = null;
  // plain tap: leave the DOM untouched so the button's click still lands and opens the modal
  if(moved){ window.__scrubbedAt = Date.now(); save(); renderAll(); }
}

function onCourtHas(t,pid){ return D && D.onCourt[t].includes(pid); }

function canHoldMake(team,pid){
  const p = ui.pending;
  if(p){
    if(p.ftArmed && team===p.team && pid) return true;
    if(p.shot==='ft' && p.team===team && p.pid===pid) return true;
    if(p.kind==='foul' && team!==p.team && pid) return true;
    return false;
  }
  return ['ft','p2','p3'].includes(ui.armed);
}

function gestureOptions(team,pid){
  const p = ui.pending, o = [];
  const inw = team===0?'right':'left', outw = team===0?'left':'right';
  if(p){
    if(p.kind==='miss'){
      o.push({dir:inw, label:'rebound', act:'reb'});
      if(team!==p.team && p.shot!=='ft') o.push({dir:outw, label:'block', act:'blk'});
    } else if(p.kind==='made'){
      if(team===p.team && pid!==p.pid && !p.assistDone) o.push({dir:inw, label:'assist', act:'ast'});
    } else if(p.kind==='to'){
      if(team!==p.team) o.push({dir:inw, label:'steal', act:'stl'});
    }
    return o;
  }
  if(!ui.armed){
    if(ui.subOut){
      if(ui.subOut.team===team && !onCourtHas(team,pid)) o.push({dir:'up', label:'sub in', act:'subin'});
    } else if(onCourtHas(team,pid)) o.push({dir:'down', label:'sub out', act:'subout'});
  }
  return o;
}

function startGesture(e,team,pid,row){
  if(!S || S.phase!=='game') return;
  if(G) return;
  G = {team, pid, row, x0:e.clientX, y0:e.clientY, dx:0, dy:0, t0:Date.now(), active:false, done:false,
       period0:S.period, clock0:S.clockMs, mouse:e.pointerType==='mouse'};
  G.holdT = setTimeout(()=>{
    if(!G || G.done) return;
    G.active = true; row.classList.add('lift'); showGuides(); vibrate(8);
  }, 280);
  if(canHoldMake(team,pid)){
    row.classList.add('charging');
    G.makeT = setTimeout(()=>{
      if(!G || G.done) return;
      if(Math.hypot(G.dx,G.dy)>14) return;
      G.done = true; row.classList.remove('charging');
      holdMade(team,pid); endGesture();
    }, 1500);
  }
}
function cancelGTimers(){ if(!G) return; clearTimeout(G.holdT); if(G.makeT) clearTimeout(G.makeT); }
function endGesture(){
  cancelGTimers();
  if(G && G.row){ G.row.classList.remove('lift','charging'); G.row.style.transform=''; }
  hideGuides();
}
function onGMove(e){
  if(SC){
    const dy = e.clientY-SC.y0;
    const nd = dy>14 ? 1 : (dy<-14 ? -1 : 0); // down = rewind, up = forward
    if(nd!==SC.dir){ SC.dir=nd; SC.dirStart=Date.now(); }
    if(nd) SC.moved = true;
    return;
  }
  if(!G || G.done) return;
  G.dx = e.clientX-G.x0; G.dy = e.clientY-G.y0;
  const dist = Math.hypot(G.dx,G.dy);
  if(!G.active){
    if(dist>12){
      // a mouse never scrolls the list, and a horizontal swipe can't either —
      // start the drag immediately; only early vertical touch-drags yield to scrolling
      const horizontal = Math.abs(G.dx) > Math.abs(G.dy)*1.4;
      if(G.mouse || horizontal){
        clearTimeout(G.holdT);
        if(G.makeT){ clearTimeout(G.makeT); G.makeT=null; }
        G.row.classList.remove('charging');
        G.active = true; G.row.classList.add('lift'); showGuides();
      } else { cancelGTimers(); G.row.classList.remove('charging'); G=null; return; }
    } else return;
  }
  if(dist>14 && G.makeT){ clearTimeout(G.makeT); G.makeT=null; G.row.classList.remove('charging'); }
  G.row.style.transform = 'translate('+(G.dx*.25)+'px,'+(G.dy*.2)+'px)';
  const opts = gestureOptions(G.team,G.pid);
  let fired = null;
  if(G.dx>70) fired = opts.find(o=>o.dir==='right');
  else if(G.dx<-70) fired = opts.find(o=>o.dir==='left');
  else if(G.dy>80) fired = opts.find(o=>o.dir==='down');
  else if(G.dy<-80) fired = opts.find(o=>o.dir==='up');
  if(fired){ G.done=true; endGesture(); fireOption(fired,G.team,G.pid); }
}
function onGUp(){
  if(SC){ endScrub(); return; }
  if(!G) return;
  if(G.done){ G=null; return; }
  const dist = Math.hypot(G.dx,G.dy);
  endGesture();
  const {team,pid} = G; G=null;
  if(dist<12) tap(team,pid);
}
function onGCancel(){ if(SC){ endScrub(); } if(!G) return; endGesture(); G=null; }

function showGuides(){
  if(!G) return;
  const opts = gestureOptions(G.team,G.pid);
  if(!opts.length){ hideGuides(); return; }
  const r = G.row.getBoundingClientRect();
  const g = $('#guide');
  g.classList.remove('hidden');
  g.style.top = (r.top + r.height/2)+'px';
  g.innerHTML = opts.map(o=>{
    if(o.dir==='left')  return '<span class="gchip gleft"><span class="ar">◀</span> '+o.label+'</span>';
    if(o.dir==='right') return '<span class="gchip gright">'+o.label+' <span class="ar">▶</span></span>';
    if(o.dir==='down')  return '<span class="gchip gdown"><span class="ar">▼</span> '+o.label+'</span>';
    return '<span class="gchip gup"><span class="ar">▲</span> '+o.label+'</span>';
  }).join('');
}
function hideGuides(){ const g=$('#guide'); g.classList.add('hidden'); g.innerHTML=''; }

function anchorAt(){
  // everything recorded inside a live window is stamped at the window's origin time,
  // however long the statistician takes
  const p = ui.pending; if(!p) return {};
  if(p.at) return p.at;
  const a = p.anchorIdx!=null ? evById(p.anchorIdx) : null; return a ? {period:a.period, clock:a.clock} : {};
}
function fireOption(o,team,pid){
  vibrate(12);
  const p = ui.pending;
  const at = anchorAt();
  switch(o.act){
    case 'reb': ui.pending=null; addEvent(Object.assign({t:'reb',team,pid,off:team===p.team},at));
      toast((team===p.team?'offensive':'defensive')+' rebound'); break;
    case 'blk': addEvent(Object.assign({t:'blk',team,pid},at)); resetPend(); toast('block'); break;
    case 'ast': p.assistDone=true; addEvent(Object.assign({t:'ast',team,pid},at)); resetPend(); toast('assist'); break;
    case 'stl': ui.pending=null; addEvent(Object.assign({t:'stl',team,pid},at)); toast('steal'); break;
    case 'subout': ui.subOut={team,pid,expires:Date.now()+WIN_MS};
      renderAll(); toast(S.running ? 'clock is running — fiba subs happen at dead balls · drag a bench player up' : 'drag a bench player up to sub in', 3200); break;
    case 'subin': { const out=ui.subOut.pid; ui.subOut=null;
      addEvent({t:'sub',team,out,in:pid}); toast('substitution'); break; }
  }
}

/* ==================== tap semantics ==================== */
function tap(team,pid){
  if(!S || S.phase!=='game') return;
  const p = ui.pending;
  if(p && p.pick){
    if(pickAllowed(p.pick,team,pid)){
      const act = p.pick; p.pick = null;
      fireOption({act},team,pid); return;
    }
    toast(p.pick==='ast' ? 'assist — tap a teammate' : (p.pick==='reb' ? 'tap a player' : 'tap an opponent'));
    return;
  }
  if(p){
    if(p.kind==='miss' || p.kind==='made'){
      if(team!==p.team && pid){
        // the fouler is locked behind ft — on a plain 2pt/3pt window, tap ft first
        if(!(p.shot==='ft' || p.ftArmed)) return;
        if(p.foulIdx==null){
          const kind = ui.foulType || 'shooting';
          S.running = false;
          p.foulIdx = addEvent(Object.assign({t:'foul',team,pid,kind,drawn:p.pid||null}, anchorAt()));
          p.shot = 'ft';
          resetPend(); vibrate(10);
          toast(FOULNAMES[kind]+' foul — '+pname(pid));
          foulAlert(pid);
        }
        return;
      }
      if(team===p.team && pid && (p.ftArmed || (pid===p.pid && p.shot==='ft'))){
        const i = addEvent(Object.assign({t:'ft_miss',team,pid}, anchorAt()));
        setPend('miss','ft',team,pid,i);
        renderAll(); ftProgress(); return;
      }
      return;
    }
    if(p.kind==='foul'){
      if(team!==p.team && pid){
        const i = addEvent(Object.assign({t:'ft_miss',team,pid}, anchorAt()));
        setPend('miss','ft',team,pid,i);
        renderAll(); ftProgress();
      }
      return;
    }
    return; // 'to' pending: only steal drag or X
  }
  if(!ui.armed) return;
  switch(ui.armed){
    case 'ft': { const i=addEvent({t:'ft_miss',team,pid}); setPend('miss','ft',team,pid,i); break; }
    case 'p2': { const i=addEvent({t:'p2_miss',team,pid}); setPend('miss','p2',team,pid,i); break; }
    case 'p3': { const i=addEvent({t:'p3_miss',team,pid}); setPend('miss','p3',team,pid,i); break; }
    case 'to': { const i=addEvent({t:'to',team,pid});
      ui.pending={kind:'to',team,pid,anchorIdx:i,expires:Date.now()+WIN_MS,at:originAt(i),steps:[i]}; break; }
    case 'pf': { S.running=false;
      const kind = ui.foulType||'personal';
      const i=addEvent({t:'foul',team,pid,kind});
      if(kind==='offensive'){
        // FIBA: an offensive foul is also a turnover, and never yields free throws
        const fe = evById(i);
        addEvent({t:'to',team,pid,period:fe.period,clock:fe.clock});
        ui.pending=null; ui.foulType=null;
        toast('offensive foul — turnover, '+pname(pid));
        foulAlert(pid); break;
      }
      ui.pending={kind:'foul',team,pid,anchorIdx:i,foulIdx:i,expires:Date.now()+WIN_MS,at:originAt(i),steps:[i],
        ftExp: kind==='tech'?1:(kind==='unsport'||kind==='disq'?2:(teamFoulsNow(D,team)>=4?2:0))};
      ui.foulType=null; foulAlert(pid); break; }
    case 'timeout': return;
  }
  ui.armed = null;
  renderAll();
}

function holdMade(team,pid){
  vibrate([14,40,14]);
  // stamp the make at the moment the hold began, not when it completed
  const at = (G && G.clock0!=null) ? {period:G.period0, clock:G.clock0} : {};
  const p = ui.pending;
  if(p){
    // inside a window: joined events share the window's origin time
    if(p.kind==='foul' && team!==p.team && pid){
      const i = addEvent(Object.assign({t:'ft_made',team,pid}, anchorAt()));
      setPend('made','ft',team,pid,i); renderAll(); ftProgress(); return;
    }
    if(p.team===team && pid && ((p.pid===pid && p.shot==='ft') || p.ftArmed)){
      const i = addEvent(Object.assign({t:'ft_made',team,pid}, anchorAt()));
      setPend('made','ft',team,pid,i); renderAll(); ftProgress(); return;
    }
    return;
  }
  switch(ui.armed){
    case 'ft': { const i=addEvent(Object.assign({t:'ft_made',team,pid}, at)); setPend('made','ft',team,pid,i); break; }
    case 'p2': { const i=addEvent(Object.assign({t:'p2_made',team,pid}, at)); setPend('made','p2',team,pid,i); break; }
    case 'p3': { const i=addEvent(Object.assign({t:'p3_made',team,pid}, at)); setPend('made','p3',team,pid,i); break; }
    default: return;
  }
  ui.armed = null;
  renderAll();
}

/* ==================== bulk substitution panel ==================== */
let SUBP = null;
function openSubPanel(t){
  SUBP = {team:t, outs:new Set(), ins:new Set()};
  renderSubPanel();
  $('#evModal').classList.remove('hidden');
}
function renderSubPanel(){
  const t = SUBP.team, onc = D.onCourt[t];
  const on = S.teams[t].players.filter(p=>onc.includes(p.id));
  const bench = S.teams[t].players.filter(p=>!onc.includes(p.id));
  const chip = (p,sel,cls) => '<span class="stchip'+(sel?' on':'')+' '+cls+'" data-pid="'+p.id+'">'+
    '<span style="font-family:var(--f-mono);opacity:.7;margin-right:5px">'+esc(p.num)+'</span>'+esc(p.name)+
    (D.stats[p.id].pf>=5||D.stats[p.id].dq?' <span style="color:var(--red)">·out</span>':'')+'</span>';
  const ok = SUBP.outs.size>0 && SUBP.outs.size===SUBP.ins.size;
  $('#evBody').innerHTML =
    '<div class="mtitle">substitutions — '+esc(tname(t))+(S.running?'<br><span style="color:var(--amber);font-size:10px">clock is running — subs happen at dead balls</span>':'')+'</div>'+
    '<div class="evsec">on court — tap to send out</div><div class="evchips">'+on.map(p=>chip(p,SUBP.outs.has(p.id),'so')).join('')+'</div>'+
    '<div class="evsec">bench — tap to bring in</div><div class="evchips">'+bench.map(p=>chip(p,SUBP.ins.has(p.id),'si')).join('')+'</div>'+
    '<div class="mbtns"><button data-k="cancel">cancel</button>'+
    '<button class="yes" data-k="go" style="'+(ok?'':'opacity:.4')+'">confirm '+SUBP.outs.size+' out · '+SUBP.ins.size+' in</button></div>';
  $('#evBody').onclick = e=>{
    const c = e.target.closest('.stchip[data-pid]');
    if(c){ const id=c.dataset.pid; const set = c.classList.contains('so')?SUBP.outs:SUBP.ins;
      set.has(id)?set.delete(id):set.add(id); renderSubPanel(); return; }
    const b = e.target.closest('[data-k]'); if(!b) return;
    if(b.dataset.k==='cancel'){ SUBP=null; $('#evModal').classList.add('hidden'); return; }
    if(b.dataset.k==='go'){
      if(!(SUBP.outs.size>0 && SUBP.outs.size===SUBP.ins.size)){ toast('match the outs and ins'); return; }
      const outs=[...SUBP.outs], ins=[...SUBP.ins], team=SUBP.team;
      SUBP=null; $('#evModal').classList.add('hidden');
      outs.forEach((o,i)=>addEvent({t:'sub',team,out:o,in:ins[i]}));
      toast(outs.length+' substitution'+(outs.length>1?'s':'')+' — '+tname(team));
    }
  };
}
function teamTap(t){
  if(!S || S.phase!=='game') return;
  if(!ui.armed && !ui.pending && !ui.subOut){ openSubPanel(t); return; }
  const p = ui.pending;
  if(p && p.kind==='miss'){
    const at = anchorAt();
    ui.pending = null;
    addEvent(Object.assign({t:'reb',team:t,pid:null,off:t===p.team},at));
    toast('team '+(t===p.team?'offensive':'defensive')+' rebound');
    return;
  }
  if(ui.armed==='timeout'){
    const left = timeoutsLeft(D,t);
    if(left<=0){ toast('no timeouts left — '+tname(t)); return; }
    S.running = false; ui.armed = null;
    addEvent({t:'timeout',team:t});
    toast('timeout '+tname(t)+' — '+(left-1)+' left');
    return;
  }
  if(ui.armed==='to'){
    ui.armed = null;
    const i = addEvent({t:'to',team:t,pid:null});
    ui.pending = {kind:'to',team:t,pid:null,anchorIdx:i,expires:Date.now()+WIN_MS,at:originAt(i),steps:[i]};
    renderAll(); return;
  }
  if(ui.armed==='pf'){
    S.running = false;
    const kind = ui.foulType || 'tech';
    ui.armed = null; ui.foulType = null;
    const i = addEvent({t:'foul',team:t,pid:null,kind});
    ui.pending = {kind:'foul',team:t,pid:null,anchorIdx:i,foulIdx:i,expires:Date.now()+WIN_MS,at:originAt(i),ftExp:1,steps:[i]};
    toast('bench '+FOULNAMES[kind]+' foul — '+tname(t));
    renderAll(); return;
  }
}

/* ==================== static wiring ==================== */
function wireGame(){
  $$('.plist').forEach(pl=>{
    pl.addEventListener('pointerdown', e=>{
      const row = e.target.closest('.prow');
      if(!row || !row.dataset.pid) return;
      startGesture(e, +pl.dataset.team, row.dataset.pid, row);
    });
  });
  document.addEventListener('pointermove', onGMove, {passive:true});
  document.addEventListener('pointerup', onGUp);
  document.addEventListener('pointercancel', onGCancel);
  document.addEventListener('touchmove', e=>{ if((G && G.active) || SC) e.preventDefault(); }, {passive:false});

  $('#subbar').addEventListener('pointerdown', e=>{
    const b = e.target.closest('.sub'); if(!b || b.disabled) return;
    const s = (window.__sbspec||[])[+b.dataset.i];
    if(!s || !s.scrub) return;
    SC = {y0:e.clientY, btn:b, dir:0, dirStart:0, moved:false, iv:setInterval(scrubStep,100)};
  });

  $$('#topbar .act').forEach(b=>b.addEventListener('click', ()=>{
    const a = b.dataset.act;
    const p = ui.pending;
    // ft inside a live shot window = and-one / shooting-foul free throws:
    // arm the window for ft, then tap (miss) or hold (made) the shooter as usual
    if(a==='ft' && p && (p.kind==='miss'||p.kind==='made')){
      p.ftArmed = !p.ftArmed;
      if(p.ftArmed){
        S.running = false;
        // livestats-style predictive count: and-one = 1, missed 2 = 2, missed 3 = 3
        if(p.ftExp==null) p.ftExp = p.kind==='made' ? 1 : (p.shot==='p3' ? 3 : 2);
        toast('free throws — expect '+p.ftExp+' · tap or hold the shooter');
      }
      resetPend(); renderAll();
      return;
    }
    ui.pending=null; ui.subOut=null; ui.foulType=null;
    ui.armed = ui.armed===a ? null : a;
    if(ui.armed==='ft') S.running = false; // a ft implies a foul — clock stops
    renderAll();
    if(ui.armed) openCmd(!IS_TOUCH); // popup opens on arming; keyboard focus only on non-touch
  }));
  $('#undoB').addEventListener('click', undo);
  $('#redoB').addEventListener('click', redo);

  $('#subbar').addEventListener('click', e=>{
    const b = e.target.closest('.sub'); if(!b || b.disabled) return;
    const spec = window.__sbspec || [];
    const s = spec[+b.dataset.i];
    if(s && s.fn) s.fn();
  });

  // score panel: the clock is the start/stop control (always reachable); the chevron collapses
  $$('.thead').forEach(th=>th.addEventListener('click', ()=>teamTap(+th.dataset.team)));

  $('#xCancel').addEventListener('click', cancelStep);
  $('#delayB').addEventListener('click', ()=>{
    if(ui.pending) ui.pending.expires += WIN_MS;
    if(ui.subOut) ui.subOut.expires += WIN_MS;
    updateXRing(); toast('+10 seconds');
  });
  $('#doneB').addEventListener('click', finishWindow);

  $('#sheetHandle').addEventListener('click', ()=>$('#sheet').classList.toggle('open'));
  $('#btnBox').addEventListener('click', ()=>{ $('#sheet').classList.remove('open'); openBox(); });
  $('#btnAdv').addEventListener('click', ()=>{ $('#sheet').classList.remove('open'); openAdv(); });
  $('#btnLog').addEventListener('click', ()=>{ $('#sheet').classList.remove('open'); openLog(); });
  $('#btnExp').addEventListener('click', ()=>{ $('#sheet').classList.remove('open'); downloadJSON(); });
  $('#btnSim').addEventListener('click', ()=>{ $('#sheet').classList.remove('open');
    askConfirm('simulate a full game? are you sure? this replaces the current game with test data', simulateGame); });
  $('#btnEnd').addEventListener('click', ()=>{
    $('#sheet').classList.remove('open');
    askConfirm('end the game?', endGame);
  });

  // desktop keyboard shortcuts
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape' && $('#pcModal') && !$('#pcModal').classList.contains('hidden')){ $('#pcModal').classList.add('hidden'); return; }
    if(!S || S.phase!=='game') return;
    if(e.target && e.target.matches && e.target.matches('input,textarea')) return;
    if(!$('#adjModal').classList.contains('hidden')){
      if(e.key==='Escape') $('#adjModal').classList.add('hidden');
      return;
    }
    if(!$('#evModal').classList.contains('hidden')){
      if(e.key==='Escape'){ EM=null; $('#evModal').classList.add('hidden'); }
      return;
    }
    if(!$('#confirmModal').classList.contains('hidden')) return;
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){
      e.preventDefault(); e.shiftKey ? redo() : undo(); return;
    }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    const overlayOpen = ['boxview','advview','logview'].some(id=>!document.getElementById(id).classList.contains('hidden'));
    if(e.key==='Escape'){
      if(overlayOpen) showScreen('game');
      else if(ui.armed||ui.pending||ui.subOut) cancelStep();
      return;
    }
    if(overlayOpen) return;
    const k = e.key===' ' ? 'space' : (e.key==='Enter' ? 'enter' : e.key.toLowerCase());
    // enter closes any live follow-up window, whatever the stat
    if(k==='enter'){ if(ui.pending||ui.subOut){ e.preventDefault(); finishWindow(); } return; }
    // sub-bar buttons declare their own keys (flow steps, chips, clock controls)
    const spec = window.__sbspec || [];
    const hit = spec.find(b=>b.key===k && !b.dis);
    if(hit){ e.preventDefault(); hit.fn(); return; }
    switch(k){
      case 'space': e.preventDefault(); S.running ? pauseClock() : resumeClock(); break;
      case 'f': $('.act[data-act="ft"]').click(); openCmd(true); break;
      case '2': $('.act[data-act="p2"]').click(); openCmd(true); break;
      case '3': $('.act[data-act="p3"]').click(); openCmd(true); break;
      case 't': $('.act[data-act="to"]').click(); openCmd(true); break;
      case 'p': $('.act[data-act="pf"]').click(); openCmd(true); break;
      case '/': e.preventDefault(); openCmd(true); break;
      case 'x': if(ui.armed||ui.pending||ui.subOut) cancelStep(); break;
      case 'd': if(!$('#delayB').classList.contains('hidden')) $('#delayB').click(); break;
      case 'j': jumpTap(); break;
      case 'b': openBox(); break;
      case 'l': openLog(); break;
    }
  });

  wireAdjust(); wireCmd();
}

/* ==================== typed command bar ==================== */
const IS_TOUCH = matchMedia('(hover:none) and (pointer:coarse)').matches;
const IS_MOBILE = IS_TOUCH && !matchMedia('(min-width:900px)').matches;   // phones/tablets: no typed command layer
function findByNum(t,num){ return S.teams[t].players.find(p=>String(p.num).trim()===String(num).trim()) || null; }
function cmdVisible(){ return !IS_MOBILE && !!(ui.armed || ui.pending); }
function renderCmd(){
  const bar = $('#cmdbar'); if(!bar) return;
  const vis = cmdVisible() && S.phase==='game';
  bar.classList.toggle('hidden', !vis);
  if(!vis){ $('#cmdIn').value=''; return; }
  const inp = $('#cmdIn');
  inp.placeholder = ui.pending ? '2;7b · 2;10r · 1;4a' : (ui.armed==='timeout' ? '1 or 2  →  team' : '1;10  →  team 1 · #10');
  previewCmd();
}
function openCmd(focus){
  renderCmd();
  if(focus && cmdVisible()){ const i=$('#cmdIn'); i.focus(); i.select(); }
}
/* grammar: tokens separated by commas, each token = team;number (semicolon or colon)
   1;10        → team 1 · #10  (armed stat; missed for shots)      1;10+ → made
   1;t         → team-only (turnover / bench foul)                1 → team (timeout)
   2;7b        → follow-up: block by team 2 · #7   (r rebound · b block · a assist · s steal)
   2;t r  = team rebound; team is required for rebounds, inferable for a/b/s if omitted */
const FOLLOW = {r:'reb', b:'blk', a:'ast', s:'stl'};
function splitTok(tok){ const m = tok.match(/^(?:([12])\s*[;:])?\s*(.+)$/); return m ? {team:m[1]?+m[1]-1:null, rest:m[2].trim()} : {team:null,rest:tok}; }
function parseFollow(tok, baseTeam){
  const {team:tIn, rest} = splitTok(tok);
  const m = rest.match(/^(\d{1,2}|t)\s*([rbas])$/i); if(!m) return {err:'follow-ups look like 2;7b · 2;10r · 1;4a · 2;3s'};
  const letter = m[2].toLowerCase(), act = FOLLOW[letter];
  if(m[1].toLowerCase()==='t'){ if(act!=='reb') return {err:'only rebounds can be team'}; if(tIn==null) return {err:'team rebound needs the team: 2;tr'}; return {act, team:tIn, pid:null}; }
  let team = tIn;
  if(team==null){
    if(act==='reb') return {err:'rebounds need the team: 2;10r'};
    team = act==='ast' ? baseTeam : 1-baseTeam;
  }
  const p = findByNum(team,m[1]); if(!p) return {err:'#'+m[1]+' not on '+tname(team)};
  if(act==='ast' && team!==baseTeam) return {err:'assist must be a teammate'};
  if((act==='blk'||act==='stl') && team===baseTeam) return {err:(act==='blk'?'block':'steal')+' must be an opponent'};
  return {act, team, pid:p.id, p};
}
function parseCmd(str){
  const toks = str.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
  const out = {main:null, follows:[], err:null};
  if(!toks.length) return out;
  let i = 0, baseTeam;
  if(!ui.pending){
    if(!ui.armed) return out;
    const {team:t, rest} = splitTok(toks[0]);
    if(ui.armed==='timeout'){
      const tt = t!=null ? t : (/^[12]$/.test(rest) ? +rest-1 : null);
      if(tt==null){ out.err='timeout: type the team, 1 or 2'; return out; }
      out.main={kind:'team', team:tt}; i=1; baseTeam=tt;
    } else {
      if(t==null){ if(/^[12]$/.test(rest)) { out.main={kind:'need'}; return out; } out.err='start with team;number — e.g. 1;10'; return out; }
      baseTeam = t; i = 1;
      const m = rest.match(/^(\d{1,2}|t)(\+|m)?$/); if(!m){ out.err='then the jersey number: 1;10  (1;10+ = made)'; return out; }
      if(m[1]==='t'){ if(!['to','pf'].includes(ui.armed)){ out.err='team-only works for to / pf'; return out; } out.main={kind:'team', team:baseTeam}; }
      else { const p = findByNum(baseTeam,m[1]); if(!p){ out.err='#'+m[1]+' not on '+tname(baseTeam); return out; }
        out.main={kind:'player', team:baseTeam, pid:p.id, p, made:!!m[2]}; }
    }
  } else baseTeam = ui.pending.team;
  for(; i<toks.length; i++){ const f = parseFollow(toks[i], baseTeam); if(f.err){ out.err=f.err; break; } out.follows.push(f); }
  return out;
}
function previewCmd(){
  const inp=$('#cmdIn'), hint=$('#cmdHint'); if(!inp||!hint) return;
  const r = parseCmd(inp.value);
  inp.classList.toggle('bad', !!r.err);
  if(r.err){ hint.innerHTML='<i>'+esc(r.err)+'</i>'; return; }
  const bits=[];
  if(r.main){ if(r.main.kind==='need') bits.push('<i>now the jersey number…</i>');
    else if(r.main.kind==='team') bits.push('<b>'+esc(tname(r.main.team))+'</b> · team');
    else bits.push('<b>#'+esc(r.main.p.num)+' '+esc(r.main.p.name)+'</b> · '+
      ({ft:'ft',p2:'2pt',p3:'3pt',to:'turnover',pf:'foul'}[ui.armed]||ui.armed)+(['ft','p2','p3'].includes(ui.armed)?(r.main.made?' made':' missed'):'')); }
  r.follows.forEach(f=>bits.push({reb:'rebound',blk:'block',ast:'assist',stl:'steal'}[f.act]+' → <b>'+(f.pid?'#'+esc(f.p.num)+' '+esc(f.p.name):'team '+esc(tname(f.team)))+'</b>'));
  hint.innerHTML = bits.length ? bits.join(' <i>·</i> ') : (ui.pending ? '<i>follow-ups: 2;7b block · 2;10r rebound · 1;4a assist · 2;3s steal · 2;tr team reb</i>' : '<i>team;number — 1;10+ for made — then ,2;7b / ,2;10r / ,1;4a</i>');
}
function applyCmd(){
  const inp=$('#cmdIn'); const r = parseCmd(inp.value);
  if(r.err){ toast(r.err); return; }
  if(!r.main && !r.follows.length) return;
  if(r.main && r.main.kind==='need'){ toast('add the jersey number'); return; }
  if(r.main){
    if(r.main.kind==='team') teamTap(r.main.team);
    else if(r.main.made) holdMade(r.main.team, r.main.pid);
    else tap(r.main.team, r.main.pid);
  }
  for(const f of r.follows){
    if(!ui.pending){ toast('window closed — '+({reb:'rebound',blk:'block',ast:'assist',stl:'steal'}[f.act])+' not applied'); break; }
    if(f.act==='reb' && ui.pending.kind!=='miss'){ toast('no rebound on a made shot'); continue; }
    if(f.act==='ast' && ui.pending.kind!=='made'){ toast('assist needs a made shot'); continue; }
    if(f.act==='stl' && ui.pending.kind!=='to'){ toast('steal needs a turnover'); continue; }
    if(f.act==='blk' && ui.pending.kind!=='miss'){ toast('block needs a missed shot'); continue; }
    if(f.act==='reb' && !f.pid){ const at=anchorAt(); const p=ui.pending; ui.pending=null;
      addEvent(Object.assign({t:'reb',team:f.team,pid:null,off:f.team===p.team},at)); toast('team rebound'); continue; }
    fireOption({act:f.act}, f.team, f.pid);
  }
  inp.value=''; renderCmd();
  if(cmdVisible()) inp.focus();
}
function wireCmd(){
  const inp=$('#cmdIn');
  inp.addEventListener('input', previewCmd);
  inp.addEventListener('keydown', e=>{
    e.stopPropagation();
    if(e.key==='Enter'){ e.preventDefault(); applyCmd(); }
    else if(e.key===' ' && !inp.value){ e.preventDefault(); S.running ? pauseClock() : resumeClock(); }   // clock always one key away
    else if(e.key==='Escape'){ e.preventDefault(); if(inp.value){ inp.value=''; previewCmd(); } else { inp.blur(); toast('keys back to the court · esc again cancels'); } }
  });
  $('#cmdGo').addEventListener('click', applyCmd);
}

/* ---- final: advanced stats (structure + formulas after GAMEVIS team box scores) ---- */
function teamTotals(d,t){
  const T = d.team[t];
  const P = S.teams[t].players.map(p=>d.stats[p.id]);
  const s = k => P.reduce((a,x)=>a+x[k],0);
  const o = {pts:T.pts, fgm:s('p2m')+s('p3m'), fga:s('p2a')+s('p3a'), fg3m:s('p3m'), fg3a:s('p3a'),
    fg2m:s('p2m'), fg2a:s('p2a'), ftm:s('ftm'), fta:s('fta'),
    oreb:s('or')+T.teamRebO, dreb:s('dr')+T.teamRebD, ast:s('ast'), stl:s('stl'), blk:s('blk'),
    tov:T.toTot, rimA:s('rimA'), rimM:s('rimM'), midA:s('midA'), midM:s('midM'), ptsAst:s('ptsAst'),
    minutes: cumEl(S.period,S.clockMs)/60000*5};
  o.possessions = 0.96*(o.fga + o.tov + 0.44*o.fta - o.oreb);
  o.tsa = o.fga + 0.44*o.fta;
  return o;
}
function teamAdv(d,t){
  const T = teamTotals(d,t), O = teamTotals(d,1-t);
  const dv = (a,b)=> b ? a/b : 0;
  return Object.assign(T, {
    ortg: dv(T.pts,T.possessions)*100, drtg: dv(O.pts,O.possessions)*100,
    ppp: dv(T.pts,T.possessions),
    efg: dv(T.fgm+0.5*T.fg3m,T.fga)*100, ts: dv(T.pts,2*T.tsa)*100,
    tovp: dv(T.tov,T.fga+0.44*T.fta+T.tov)*100,
    orebp: dv(T.oreb,T.oreb+O.dreb)*100, drebp: dv(T.dreb,T.dreb+O.oreb)*100,
    ftr: dv(T.fta,T.fga)*100, ftp: dv(T.ftm,T.fta)*100,
    astp: dv(T.ast,T.fgm)*100, astTo: T.tov?T.ast/T.tov:T.ast,
    stlp: dv(T.stl,O.possessions)*100, blkp: dv(T.blk,O.fga-O.fg3a)*100,
    rimp: dv(T.rimM,T.rimA)*100, rimr: dv(T.rimA,T.fga)*100,
    midp: dv(T.midM,T.midA)*100,
    p3p: dv(T.fg3m,T.fg3a)*100, p3r: dv(T.fg3a,T.fga)*100,
    astPtsP: dv(T.ptsAst, T.pts-T.ftm)*100,
    tsaPer100: dv(T.tsa,T.possessions)*100,
    pace: dv(T.possessions+O.possessions, 2) / Math.max(1,T.minutes/5) * 40
  });
}
function playerAdv(d,t,p,TT,OT,gameAvg){
  const s = d.stats[p.id], mins = s.min/60000;
  const dv = (a,b)=> b ? a/b : 0;
  const fga = s.p2a+s.p3a, fgm = s.p2m+s.p3m;
  const gameMinutes = Math.max(1, TT.minutes/5);
  const pPoss = fga + 0.44*s.fta + s.to;
  const teamPoss = TT.fga + 0.44*TT.fta + TT.tov;
  const usg = mins ? 100*(pPoss*gameMinutes)/(mins*teamPoss||1) : 0;
  const estTeamFgm = (mins/gameMinutes)*TT.fgm;
  const astPct = Math.max(0, estTeamFgm - fgm) > 0 ? 100*s.ast/(estTeamFgm - fgm) : 0;
  const oppPoss = OT.fga + 0.44*OT.fta - OT.oreb + OT.tov;
  const oc = s.oc;
  const ocPoss = 0.96*(oc.tFGA + oc.tTOV + 0.44*oc.tFTA - oc.tOR);
  const ocOppPoss = 0.96*(oc.oFGA + oc.oTOV + 0.44*oc.oFTA - oc.oOR);
  const r = {
    id:p.id, num:p.num, name:p.name, min:mins, minTxt:fmtMin(s.min),
    fgm, ast:s.ast, pts:s.pts, ptsAst:s.ptsAst, tpc:s.pts+s.ptsAst,
    ppp: dv(s.pts,pPoss), usg, astPct,
    rimA:s.rimA, rimP:dv(s.rimM,s.rimA)*100, midA:s.midA, midP:dv(s.midM,s.midA)*100,
    p3a:s.p3a, p3P:dv(s.p3m,s.p3a)*100,
    ocOrtg: dv(oc.tPTS,ocPoss)*100, ocEfg: dv(oc.tFGM+0.5*oc.t3M,oc.tFGA)*100,
    ocOreb: dv(oc.tOR,oc.tOR+oc.oDR)*100, ocTov: dv(oc.tTOV,oc.tFGA+0.44*oc.tFTA+oc.tTOV)*100,
    ocDrtg: dv(oc.oPTS,ocOppPoss)*100, ocOppEfg: dv(oc.oFGM+0.5*oc.o3M,oc.oFGA)*100,
    ocOppOreb: dv(oc.oOR,oc.oOR+oc.tDR)*100, ocTovF: dv(oc.oTOV,oc.oFGA+0.44*oc.oFTA+oc.oTOV)*100,
    ts: dv(s.pts,2*(fga+0.44*s.fta))*100,
    tovP: dv(s.to,fga+0.44*s.fta+s.to)*100,
    stlP: mins ? 100*(s.stl*gameMinutes)/(mins*oppPoss||1) : 0,
    blkP: mins ? 100*(s.blk*gameMinutes)/(mins*(OT.fga-OT.fg3a)||1) : 0,
    ftr: dv(s.fta,fga)*100,
    orebP: mins ? 100*(s.or*gameMinutes)/(mins*(TT.oreb+OT.dreb)||1) : 0,
    drebP: mins ? 100*(s.dr*gameMinutes)/(mins*(TT.dreb+OT.oreb)||1) : 0,
    pm:s.pm
  };
  r.au = r.usg ? r.astPct/r.usg : 0;
  r.net = r.ocOrtg - r.ocDrtg;
  return r;
}

function advTeamCalc(d,t){
  const T = d.team[t], o = 1-t;
  const P = S.teams[t].players.map(p=>d.stats[p.id]);
  const sum = k => P.reduce((a,s)=>a+s[k],0);
  const fga = sum('p2a')+sum('p3a'), fgm = sum('p2m')+sum('p3m'), p3m = sum('p3m');
  const fta = sum('fta'), ftm = sum('ftm');
  const oreb = sum('or')+T.teamRebO, dreb = sum('dr')+T.teamRebD;
  const Po = S.teams[o].players.map(p=>d.stats[p.id]);
  const osum = k => Po.reduce((a,s)=>a+s[k],0);
  const odreb = osum('dr')+d.team[o].teamRebD, ooreb = osum('or')+d.team[o].teamRebO;
  const tov = T.toTot;
  const poss = fga + 0.44*fta - oreb + tov;
  const minsPlayed = Math.max(1, cumEl(S.period, S.clockMs)/60000);
  return {
    pts:T.pts, poss, fga, fgm, fta, ftm, tov, ast:sum('ast'),
    efg: fga ? (fgm+0.5*p3m)/fga : 0,
    ts: (fga+0.44*fta) ? T.pts/(2*(fga+0.44*fta)) : 0,
    tovp: poss ? tov/poss : 0,
    orebp: (oreb+odreb) ? oreb/(oreb+odreb) : 0,
    drebp: (dreb+ooreb) ? dreb/(dreb+ooreb) : 0,
    ftr: fga ? fta/fga : 0,
    astp: fgm ? sum('ast')/fgm : 0,
    ortg: poss ? 100*T.pts/poss : 0,
    pace: 40*poss/minsPlayed,
    p3rate: fga ? sum('p3a')/fga : 0
  };
}

  root.querySelectorAll('.grpchips .stchip').forEach(c=>c.onclick=()=>{ advHidden.delete(c.dataset.show); renderFinal(); });
  root.querySelectorAll('table.adv th[data-k]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k; if(advSort.k===k) advSort.dir*=-1; else advSort={k,dir:k==='name'?1:-1}; renderFinal(); });
}
function advHTML_legacy(d){
  const A = [advTeamCalc(d,0), advTeamCalc(d,1)];
  const pct = v => (100*v).toFixed(1)+'%';
  const rows = [
    ['off rating', v=>v.ortg.toFixed(1)], ['pace (40)', v=>v.pace.toFixed(1)],
    ['efg%', v=>pct(v.efg)], ['ts%', v=>pct(v.ts)], ['tov%', v=>pct(v.tovp)],
    ['oreb%', v=>pct(v.orebp)], ['dreb%', v=>pct(v.drebp)], ['ft rate', v=>v.ftr.toFixed(2)],
    ['ast%', v=>pct(v.astp)], ['3pa rate', v=>pct(v.p3rate)], ['possessions', v=>v.poss.toFixed(1)]
  ];
  const c0 = S.teams[0].color||'#93f2bf', c1 = S.teams[1].color||'#8ff5ff';
  const teamTbl = '<div class="glass bxteam"><h3>team — four factors & ratings</h3><div class="tblwrap">'+
    '<table class="bx" style="min-width:0"><tr><th></th><th style="text-align:right;color:'+c0+'">'+esc(tname(0))+'</th>'+
    '<th style="text-align:right;color:'+c1+'">'+esc(tname(1))+'</th></tr>'+
    rows.map(r=>'<tr><td style="text-align:left;color:var(--dim);font-size:11px;letter-spacing:.14em">'+r[0]+'</td>'+
      '<td>'+r[1](A[0])+'</td><td>'+r[1](A[1])+'</td></tr>').join('')+'</table></div></div>';
  const plTbl = t => {
    const T = d.team[t]; const teamMin = Math.max(1, cumEl(S.period,S.clockMs)/60000);
    const teamFGA = A[t].fga, teamFTA = A[t].fta, teamTOV = A[t].tov;
    const rowsP = S.teams[t].players.filter(p=>d.stats[p.id].min>0).map(p=>{
      const s = d.stats[p.id]; const fga=s.p2a+s.p3a, fgm=s.p2m+s.p3m, mins=s.min/60000;
      const ts = (fga+0.44*s.fta) ? s.pts/(2*(fga+0.44*s.fta)) : 0;
      const efg = fga ? (fgm+0.5*s.p3m)/fga : 0;
      const usg = mins ? ((fga+0.44*s.fta+s.to)*(teamMin*5/5))/(mins*(teamFGA+0.44*teamFTA+teamTOV)||1)*100 : 0;
      const per40 = v => mins ? (v*40/mins).toFixed(1) : '0.0';
      return '<tr><td>'+esc(p.num)+'</td><td>'+esc(p.name)+'</td><td>'+fmtMin(s.min)+'</td>'+
        '<td>'+pct(ts)+'</td><td>'+pct(efg)+'</td><td>'+usg.toFixed(1)+'%</td>'+
        '<td>'+per40(s.pts)+'</td><td>'+per40(s.or+s.dr)+'</td><td>'+per40(s.ast)+'</td>'+
        '<td>'+(s.to?(s.ast/s.to).toFixed(1):(s.ast?'∞':'–'))+'</td><td>'+(s.pm>0?'+':'')+s.pm+'</td></tr>';
    }).join('');
    return '<div class="glass bxteam"><h3 style="color:'+(S.teams[t].color||'var(--lume)')+'">'+esc(tname(t))+'</h3><div class="tblwrap">'+
      '<table class="bx"><tr><th>#</th><th>player</th><th>min</th><th>ts%</th><th>efg%</th><th>usg%</th>'+
      '<th>pts/40</th><th>reb/40</th><th>ast/40</th><th>a/to</th><th>+/-</th></tr>'+rowsP+'</table></div></div>';
  };
  return teamTbl+plTbl(0)+plTbl(1);
}
function lineupAgg(d,t){
  const agg = {};
  d.lineups[t].forEach(l=>{
    const k=l.ids.join(','); const a=agg[k]=agg[k]||{ids:l.ids,dur:0,pf:0,pa:0,off:mkBox(),def:mkBox()};
    a.dur+=l.dur; a.pf+=l.pf; a.pa+=l.pa;
    for(const kk in l.off){ a.off[kk]+=l.off[kk]; a.def[kk]+=l.def[kk]; }
  });
  return Object.values(agg).sort((a,b)=>b.dur-a.dur).map(l=>{
    const o=l.off, D=l.def, dv=(a,b)=>b?a/b:0;
    const poss = 0.96*(o.fga+o.tov+0.44*o.fta-o.or), dposs = 0.96*(D.fga+D.tov+0.44*D.fta-D.or);
    l.poss = poss; l.dposs = dposs;
    l.ortg = dv(o.pts,poss)*100; l.efg = dv(o.fgm+0.5*o.f3m,o.fga)*100;
    l.tovp = dv(o.tov,o.fga+0.44*o.fta+o.tov)*100; l.orebp = dv(o.or,o.or+D.dr)*100;
    l.ftr = dv(o.fta,o.fga)*100;
    l.drtg = dv(D.pts,dposs)*100; l.oefg = dv(D.fgm+0.5*D.f3m,D.fga)*100;
    l.tovf = dv(D.tov,D.fga+0.44*D.fta+D.tov)*100; l.oreba = dv(D.or,D.or+o.dr)*100; l.oftr = dv(D.fta,D.fga)*100;
    l.net = l.ortg-l.drtg; l.pm = l.pf-l.pa;
    return l;
  });
}

}

        '<td class="'+gv(l.tovf,18,12)+'">'+l.tovf.toFixed(1)+'</td><td class="'+gv(l.oreba,20,30,true)+'">'+l.oreba.toFixed(1)+'</td>'+
        '<td class="'+gv(l.oftr,15,30,true)+'">'+l.oftr.toFixed(0)+'</td>'+

        '<td class="'+(l.pm>0?'pos':(l.pm<0?'neg':''))+'">'+(l.pm>0?'+':'')+l.pm+'</td></tr>';
    }).join('') || '<tr><td colspan="16" style="text-align:left;color:var(--faint)">no lineup data yet</td></tr>';
    return '<div class="glass bxteam advcard"><h3 style="color:'+(S.teams[t].color||'var(--lume)')+'">'+esc(tname(t))+'</h3><div class="tblwrap">'+

  return teamHTML(0)+teamHTML(1)+

/* ==================== game simulator (test data) ==================== */
function simulateGame(){
  if(!S || S.phase!=='game') return;
  let seed = (S.evSeq||1)*7919+13; const rand=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const pick = a => a[Math.floor(rand()*a.length)];
  // wipe the current game but keep teams / starters / colours
  S.events=[]; S.redo=[]; S.evSeq=0; S.running=false; S.period=1; S.clockMs=PLEN(1);
  ui.pending=null; ui.armed=null; ui.subOut=null; ui.foulType=null;
  addEvent({t:'period_start'});
  if(S.tipWinner==null){ S.tipWinner=Math.round(rand()); S.arrowInit=1-S.tipWinner; }
  const on = [S.starters[0].slice(), S.starters[1].slice()];
  const bench = [S.teams[0].players.map(p=>p.id).filter(id=>!on[0].includes(id)), S.teams[1].players.map(p=>p.id).filter(id=>!on[1].includes(id))];
  const skill = {}; [0,1].forEach(t=>S.teams[t].players.forEach(p=>skill[p.id]=0.7+rand()*0.6));
  const shooter = t => { const w = on[t].map(id=>skill[id]); const tot=w.reduce((a,b)=>a+b,0); let r=rand()*tot; for(let i=0;i<w.length;i++){ r-=w[i]; if(r<=0) return on[t][i]; } return on[t][0]; };
  const other = (t,not) => pick(on[t].filter(id=>id!==not));
  const rimLoc = ()=>({x:0.42+rand()*0.16, y:0.04+rand()*0.14});
  const midLoc = ()=>{ const side=rand(); return side<0.5 ? {x:0.15+rand()*0.2, y:0.15+rand()*0.2} : {x:0.65+rand()*0.2, y:0.15+rand()*0.2}; };
  const threeLoc = ()=>{ const r=rand(); return r<0.25?{x:0.05+rand()*0.06,y:0.04+rand()*0.08}:(r<0.5?{x:0.89+rand()*0.06,y:0.04+rand()*0.08}:{x:0.3+rand()*0.4,y:0.5+rand()*0.08}); };
  const doSub = t => { if(!bench[t].length) return; const out=pick(on[t]), inn=pick(bench[t]);
    addEvent({t:'sub',team:t,out,in:inn}); on[t]=on[t].map(x=>x===out?inn:x); bench[t]=bench[t].map(x=>x===inn?out:x); };
  const shot = (t, and1Ok) => {
    const sh = shooter(t), sk = skill[sh];
    const three = rand()<0.36, rim = !three && rand()<0.55;
    const made = rand() < (three?0.30*sk:(rim?0.58*sk:0.40*sk));
    const loc = three?threeLoc():(rim?rimLoc():midLoc());
    const stype = three ? 'jump shot' : (rim ? pick(['layup','layup','dunk','tip-in','floater']) : pick(['jump shot','fadeaway','floater','hook']));
    ui.armed = three?'p3':'p2'; renderAll();
    if(made){
      holdMade(t,sh); addEvent({t:'stype',ref:ui.pending.anchorIdx,v:stype}); recordLoc(loc.x,loc.y);
      if(rim && rand()<0.15) addEvent({t:'tag',ref:ui.pending.anchorIdx,tag:'transition'});
      if(rand()<0.58) fireOption({act:'ast'},t,other(t,sh));
      if(and1Ok && rand()<0.08){ // and-one
        document.querySelector('.act[data-act="ft"]').click();
        rand()<0.75 ? holdMade(t,sh) : tap(t,sh);
        tap(1-t, pick(on[1-t]));
        if(ui.pending && ui.pending.kind==='miss'){ fireOption({act:'reb'}, rand()<0.75?1-t:t, pick(on[rand()<0.75?1-t:t])); }
      }
      finishWindow(); return 'made';
    } else {
      tap(t,sh); addEvent({t:'stype',ref:ui.pending.anchorIdx,v:stype}); recordLoc(loc.x,loc.y);
      if(rand()<0.09) fireOption({act:'blk'},1-t,pick(on[1-t]));
      const oreb = rand()<0.27;
      if(rand()<0.11){ // shooting foul on the miss
        document.querySelector('.act[data-act="ft"]').click(); tap(1-t,pick(on[1-t]));
        const n = three?3:2; for(let i=0;i<n;i++){ rand()<0.74 ? holdMade(t,sh) : tap(t,sh); }
        if(ui.pending && ui.pending.kind==='miss') fireOption({act:'reb'}, rand()<0.75?1-t:t, pick(on[rand()<0.75?1-t:t]));
        finishWindow(); return 'ft';
      }
      if(rand()<0.06){ const at=anchorAt(); ui.pending=null; addEvent(Object.assign({t:'reb',team:oreb?t:1-t,pid:null,off:oreb},at)); }
      else fireOption({act:'reb'}, oreb?t:1-t, pick(on[oreb?t:1-t]));
      return oreb ? 'oreb' : 'miss';
    }
  };
  let poss = S.tipWinner!=null ? S.tipWinner : 0;
  const nP = 4 + (rand()<0.12?1:0);
  for(let q=1;q<=4;q++){
    if(q>1){ S.period=q; S.clockMs=PLEN(q); addEvent({t:'period_start'}); }
    let clock = PLEN(q); let possInQ = 0;
    while(clock > 4000){
      const dur = 6000 + rand()*18000; clock = Math.max(0, clock-dur); S.clockMs = clock; S.running = false;
      possInQ++;
      const t = poss;
      // rotation subs / timeouts at natural breaks
      if(possInQ===9 || possInQ===22){ doSub(0); doSub(1); if(rand()<0.5) doSub(rand()<0.5?0:1); }
      if(possInQ===15 && rand()<0.6){ ui.armed='timeout'; renderAll(); teamTap(rand()<0.5?0:1); }
      const r = rand();
      if(r<0.13){ // turnover
        const who = shooter(t); ui.armed='to'; renderAll(); tap(t,who);
        addEvent({t:'stype',ref:ui.pending.anchorIdx,v:pick(['bad pass','bad pass','travel','24s','out of bounds','double dribble'])});
        if(rand()<0.55) fireOption({act:'stl'},1-t,pick(on[1-t])); else finishWindow();
        poss = 1-t; continue;
      }
      if(r<0.24){ // non-shooting foul by defence
        ui.armed='pf'; renderAll(); const fouler=pick(on[1-t]); tap(1-t,fouler);
        if(ui.pending && ui.pending.ftExp>=2){ const sh=shooter(t); for(let i=0;i<2;i++){ rand()<0.74 ? holdMade(t,sh) : tap(t,sh); }
          if(ui.pending && ui.pending.kind==='miss') fireOption({act:'reb'}, rand()<0.75?1-t:t, pick(on[rand()<0.75?1-t:t]));
          finishWindow(); poss=1-t; continue; }
        finishWindow(); // ball stays with offence
      }
      if(r>=0.24 && r<0.26){ // offensive foul
        ui.armed='pf'; renderAll(); ui.foulType='offensive'; tap(t,shooter(t)); poss=1-t; continue;
      }
      let res = shot(t, true);
      let guard=0;
      while(res==='oreb' && guard++<3){ clock=Math.max(0,clock-4000); S.clockMs=clock; res = shot(t,true); }
      poss = 1-t;
    }
    S.clockMs = 0;
  }
  // overtime if tied
  let d = derive();
  let ot = 5;
  while(d.score[0]===d.score[1] && ot<=6){
    S.period=ot; S.clockMs=PLEN(ot); addEvent({t:'period_start'});
    let clock=PLEN(ot);
    while(clock>4000){ clock=Math.max(0,clock-(8000+rand()*14000)); S.clockMs=clock; shot(poss,true); poss=1-poss; }
    S.clockMs=0; d=derive(); ot++;
  }
  save();
  toast('simulated game — '+tname(0)+' '+d.score[0]+' · '+tname(1)+' '+d.score[1], 3500);
  endGame();
}

/* ==================== livestats-style export ==================== */
function buildExport(){
  const d = derive();
  const teamX = t => {
    const tm = S.teams[t], T = d.team[t], pl = {};
    tm.players.forEach((p,i)=>{
      const s = d.stats[p.id];
      pl[i+1] = {shirtNumber:String(p.num), name:p.name, sMinutes:fmtMin(s.min), sPoints:s.pts,
        sFieldGoalsMade:s.p2m+s.p3m, sFieldGoalsAttempted:s.p2a+s.p3a,
        sTwoPointersMade:s.p2m, sTwoPointersAttempted:s.p2a,
        sThreePointersMade:s.p3m, sThreePointersAttempted:s.p3a,
        sFreeThrowsMade:s.ftm, sFreeThrowsAttempted:s.fta,
        sReboundsOffensive:s.or, sReboundsDefensive:s.dr, sReboundsTotal:s.or+s.dr,
        sAssists:s.ast, sTurnovers:s.to, sSteals:s.stl, sBlocks:s.blk,
        sFoulsPersonal:s.pf, sFoulsOn:s.fd, sPlusMinusPoints:s.pm};
    });
    return {name:tm.name, score:d.score[t],
      tot:{sPoints:T.pts, sPointsInThePaint:T.paint, sPointsFastBreak:T.fast,
        sPointsSecondChance:T.sc, sPointsFromTurnovers:T.pot, sBenchPoints:T.bench,
        sBiggestLead:T.lead,
        sReboundsTeam:T.teamRebO+T.teamRebD, sTurnoversTeam:T.teamTo, sTurnovers:T.toTot,
        sFoulsTotal:T.foulTot, sTimeoutsFirstHalf:T.tos.h1, sTimeoutsSecondHalf:T.tos.h2}, pl};
  };
  const pidNo = pid => { const m=PMAP[pid]; return m ? S.teams[m.team].players.indexOf(m.p)+1 : null; };
  const PTS = {ft_made:1, p2_made:2, p3_made:3};
  const ACT = {ft_miss:['freethrow',null,0], ft_made:['freethrow',null,1],
    p2_miss:['2pt',null,0], p2_made:['2pt',null,1],
    p3_miss:['3pt',null,0], p3_made:['3pt',null,1],
    ast:['assist',null,1], stl:['steal',null,1], blk:['block',null,1],
    to:['turnover',null,1], timeout:['timeout','full',1], game_end:['game','end',1],
    jump:['jumpball','alternating',1]};
  const pbp = []; let n=1; const s=[0,0];
  S.events.forEach((ev,i)=>{
    if(ev.t==='tag'||ev.t==='stype'||ev.t==='loc') return;
    let a = ACT[ev.t];
    if(ev.t==='reb') a=['rebound', ev.off?'offensive':'defensive', 1];
    else if(ev.t==='foul') a=['foul', FOULNAMES[ev.kind]||'personal', 1];
    else if(ev.t==='sub') a=['substitution', null, 1];
    else if(ev.t==='period_start') a=['period','start',1];
    if(!a) return;
    if(PTS[ev.t]) s[ev.team]+=PTS[ev.t];
    let sub = a[1], sx = null, sy = null;
    if(ev.t==='to'){ let tt=null; S.events.forEach(x=>{ if(x.t==='stype'&&x.ref===ev.id) tt = tt===x.v?null:x.v; }); if(tt) sub=tt; }
    if(/^p[23]_/.test(ev.t)){
      const bits = [];
      S.events.forEach(x=>{ if(x.t==='stype'&&x.ref===ev.id) bits.unshift(x.v); });
      const tg = activeTags(ev.id); if(tg.size) bits.push(...tg);
      if(bits.length) sub = bits.join('+');
      S.events.forEach(x=>{ if(x.t==='loc'&&x.ref===ev.id){ sx=x.x; sy=x.y; } });
    }
    const row = {actionNumber:n++, period:ev.period, gt:fmtClock(ev.clock), x:sx, y:sy,
      tno:ev.team!=null?ev.team+1:null, pno:ev.pid?pidNo(ev.pid):null,
      player:ev.pid?pname(ev.pid):null,
      actionType:a[0], subType:sub, success:a[2], s1:s[0], s2:s[1]};
    if(ev.t==='sub'){ row.playerIn=pname(ev.in); row.playerOut=pname(ev.out); }
    pbp.push(row);
  });
  return {gameInfo:{source:'courtside', exported:new Date().toISOString(),
      periods:S.period, result:tname(0)+' '+d.score[0]+' — '+tname(1)+' '+d.score[1]},
    tm:{1:teamX(0), 2:teamX(1)}, pbp};
}
function downloadJSON(){
  const data = JSON.stringify(buildExport(), null, 1);
  const b = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = ('courtside_'+tname(0)+'_'+tname(1)).replace(/\s+/g,'-')+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  toast('exported');
}

/* ==================== setup screen ==================== */
function rosterRowEl(){
  const div = document.createElement('div');
  div.className = 'rrow';
  div.innerHTML = '<input class="rnum" type="text" inputmode="numeric" maxlength="2" placeholder="#">'+
    '<input class="rname" type="text" placeholder="player name" autocapitalize="none">'+
    '<button class="rdel">✕</button>';
  div.querySelector('.rdel').addEventListener('click', ()=>div.remove());
  return div;
}
const TEAMCOLORS = ['#93f2bf','#8ff5ff','#ffb3ef','#ffd166','#b7a8ff','#ff8f97',
  '#ffffff','#ff9f43','#c8ff5a','#5ab8ff','#ff5fb0','#d7c4a1'];
function initSetup(){
  $$('.team-card').forEach((card,t)=>{
    const sw = document.createElement('div');
    sw.className = 'swatches';
    sw.innerHTML = TEAMCOLORS.map(c=>
      '<span class="swatch" data-c="'+c+'" style="background:'+c+';color:'+c+'"></span>').join('');
    card.insertBefore(sw, card.querySelector('.roster'));
    const def = t===0 ? TEAMCOLORS[0] : TEAMCOLORS[1];
    card.dataset.color = def;
    sw.querySelector('[data-c="'+def+'"]').classList.add('on');
    sw.addEventListener('click', e=>{
      const s = e.target.closest('.swatch'); if(!s) return;
      sw.querySelectorAll('.swatch').forEach(x=>x.classList.remove('on'));
      s.classList.add('on');
      card.dataset.color = s.dataset.c;
    });
    const roster = card.querySelector('.roster');
    for(let i=0;i<5;i++) roster.appendChild(rosterRowEl());
    card.querySelector('.addP').addEventListener('click', ()=>roster.appendChild(rosterRowEl()));
    const file = card.querySelector('.scanFile');
    card.querySelector('.scanP').addEventListener('click', ()=>file.click());
    file.addEventListener('change', ()=>{ if(file.files[0]) handleScan(card, file.files[0]); file.value=''; });
  });
  $('#goGame').addEventListener('click', startGame);
  $('#trainB').addEventListener('click', startTraining);
}
function startTraining(){
  const roster1 = ['ada lovelace','grace hopper','katherine johnson','hedy lamarr','radia perlman',
    'annie easley','mary jackson','dorothy vaughan','margaret hamilton','joan clarke',
    'frances allen','barbara liskov'];
  const roster2 = ['miles davis','john coltrane','bill evans','paul chambers','jimmy cobb',
    'wynton kelly','cannonball adderley','lee morgan','art blakey','horace silver',
    'freddie hubbard','dexter gordon'];
  showStarterPick([
    {name:'neon city', color:TEAMCOLORS[0], players:roster1.map((n,i)=>({id:'p0_'+i, name:n, num:String(i+4)}))},
    {name:'soft club', color:TEAMCOLORS[1], players:roster2.map((n,i)=>({id:'p1_'+i, name:n, num:String(i+4)}))}
  ]);
}
function startGame(){
  const teams = [];
  $$('.team-card').forEach((card,t)=>{
    const name = (card.querySelector('.tname').value.trim() || 'team '+(t+1)).toLowerCase();
    const players = [];
    card.querySelectorAll('.rrow').forEach(r=>{
      const nm = r.querySelector('.rname').value.trim();
      if(!nm) return;
      players.push({id:'p'+t+'_'+players.length, name:nm.toLowerCase(),
        num:r.querySelector('.rnum').value.trim()});
    });
    teams.push({name, players, color:card.dataset.color||TEAMCOLORS[t]});
  });
  if(!teams[0].players.length || !teams[1].players.length){ toast('add players to both teams'); return; }
  const proceed = ()=>showStarterPick(teams);
  if(teams[0].players.length<5 || teams[1].players.length<5)
    askConfirm('fewer than five on a team — start anyway?', proceed);
  else proceed();
}

/* ==================== starting-five picker ==================== */
let SP = null;
function showStarterPick(teams){
  SP = {teams, sel:[new Set(teams[0].players.slice(0,5).map(p=>p.id)),
                    new Set(teams[1].players.slice(0,5).map(p=>p.id))]};
  renderStarterPick();
  showScreen('startersview');
}
function renderStarterPick(){
  const need = t => Math.min(5, SP.teams[t].players.length);
  const colHTML = t => {
    const rows = SP.teams[t].players.map(p=>{
      const on = SP.sel[t].has(p.id);
      return '<div class="prow'+(on?' startsel':' bench')+'" data-team="'+t+'" data-pid="'+p.id+'">'+
        '<span class="pname">'+esc(p.name)+'</span><span class="pnum">'+esc(p.num)+'</span></div>';
    }).join('');
    return '<div class="spcol"><div class="glass sphead"><div class="tn">'+esc(SP.teams[t].name)+'</div>'+
      '<div class="tsub">'+SP.sel[t].size+' / '+need(t)+' starters</div></div>'+
      '<div class="splist" data-team="'+t+'">'+rows+'</div></div>';
  };
  const ok = SP.sel[0].size===need(0) && SP.sel[1].size===need(1);
  $('#startersview').innerHTML =
    '<div class="ovhead"><button class="backbtn" id="spBack">← rosters</button>'+
    '<div class="ovtitle">pick the starting fives</div></div>'+
    '<div class="spgrid">'+colHTML(0)+colHTML(1)+'</div>'+
    '<button id="spGo" class="bigcta" style="margin:10px auto 14px;'+(ok?'':'opacity:.35;')+'">start game</button>';
  $('#spBack').onclick = ()=>{ SP=null; showScreen('setup'); };
  $$('#startersview .splist').forEach(el=>el.addEventListener('click', e=>{
    const r = e.target.closest('.prow'); if(!r) return;
    const t = +r.dataset.team, pid = r.dataset.pid, sel = SP.sel[t];
    if(sel.has(pid)) sel.delete(pid);
    else {
      if(sel.size>=need(t)){ toast('five already picked — deselect one first'); return; }
      sel.add(pid);
    }
    renderStarterPick();
  }));
  $('#spGo').onclick = ()=>{
    if(!(SP.sel[0].size===need(0) && SP.sel[1].size===need(1))){ toast('pick five per team'); return; }
    const teams = SP.teams;
    const starters = [teams[0].players.filter(p=>SP.sel[0].has(p.id)).map(p=>p.id),
                      teams[1].players.filter(p=>SP.sel[1].has(p.id)).map(p=>p.id)];
    SP = null;
    launchGame(teams, starters);
  };
}
function launchGame(teams, starters){
  S = newState();
  S.teams = teams; S.phase = 'game'; S.starters = starters;
  buildPmap();
  showScreen('game');
  addEvent({t:'period_start'});
  toast('tap the clock to start it · tap a team name for subs', 4200);
  jumpTap(); // opening tip -> possession + alternating arrow
}

/* ==================== roster scan (ocr) ==================== */
function loadTesseract(){
  return new Promise((res,rej)=>{
    if(window.Tesseract) return res();
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    sc.onload = res; sc.onerror = ()=>rej(new Error('offline'));
    document.head.appendChild(sc);
  });
}
function parseRoster(text){
  const players = []; let teamName = null;
  text.split('\n').map(l=>l.trim()).filter(Boolean).forEach(line=>{
    let m = line.match(/^[\s#*.•\-]*(\d{1,2})[\s.):\-]+([A-Za-zÀ-ÿ'`.\- ]{2,40})$/);
    if(m){ players.push({num:m[1], name:m[2].trim()}); return; }
    m = line.match(/^([A-Za-zÀ-ÿ'`.\- ]{2,40}?)[\s.]+#?(\d{1,2})$/);
    if(m){ players.push({num:m[2], name:m[1].trim()}); return; }
    if(!teamName && !/\d/.test(line) && line.length>=3 && line.length<=28 &&
       /^[A-Za-zÀ-ÿ'&.\- ]+$/.test(line)) teamName = line;
  });
  return {teamName, players};
}
async function handleScan(card, file){
  toast('reading roster… hold on', 20000);
  try{
    await loadTesseract();
    const res = await Tesseract.recognize(file, 'eng');
    const {teamName, players} = parseRoster(res.data.text || '');
    if(!players.length){ toast('couldn’t read any players — add manually', 3500); return; }
    const tn = card.querySelector('.tname');
    if(teamName && !tn.value.trim()) tn.value = teamName.toLowerCase();
    const roster = card.querySelector('.roster');
    players.forEach(p=>{
      let row = [...roster.querySelectorAll('.rrow')].find(r=>!r.querySelector('.rname').value.trim());
      if(!row){ row = rosterRowEl(); roster.appendChild(row); }
      row.querySelector('.rnum').value = p.num;
      row.querySelector('.rname').value = p.name.toLowerCase();
    });
    toast('scanned '+players.length+' players — check & edit', 3500);
  }catch(err){
    toast('scan needs internet — add players manually', 4000);
  }
}

/* ==================== boot ==================== */
wireGame(); wireConfirm(); initSetup();
S = newState();
function migrate(s){
  if(!s || !s.events) return s;
  if(!s.evSeq || s.events.some(e=>e.id==null)){
    let q = 0;
    s.events.forEach(e=>{ e.id = ++q; });
    s.events.forEach(e=>{
      if((e.t==='tag'||e.t==='stype'||e.t==='loc') && e.idx!=null){
        const t = s.events[e.idx]; e.ref = t ? t.id : null; delete e.idx;
      }
    });
    s.evSeq = q;
  }
  return s;
}
(function boot(){
  const saved = migrate(loadSaved());
  if(saved && saved.phase && saved.phase!=='setup' && saved.teams){
    showScreen('setup');
    askConfirm('resume the saved game?', ()=>{
      S = saved; S.running = false; buildPmap();
      if(S.phase==='final'){ renderFinal(); showScreen('finalview'); }
      else { showScreen('game'); renderAll(); }
    }, ()=>{
      localStorage.removeItem('courtside_v1');
      S = newState(); showScreen('setup');
    });
  } else showScreen('setup');
})();
