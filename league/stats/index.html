<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04100b">
<!-- PUBLIC. No gate.js, no topnav.js. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co">
<title>Season stats · Courtside</title>
<link rel="stylesheet" href="../kit/courtside-kit.css">
<link rel="stylesheet" href="../kit/table.css">
<link rel="stylesheet" href="../kit/nav.css">
<style>
  .empty{padding:calc(var(--u)*5) calc(var(--u)*3);text-align:center;color:var(--ink-3);font-family:var(--f-micro);font-size:11px}
  a.plain{color:inherit;text-decoration:none} a.plain:hover{color:var(--lume)}
  .ctl{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:calc(var(--u)*2) calc(var(--u)*3);
    border-bottom:1px solid var(--rule)}
  table.cs-tbl th{cursor:pointer;user-select:none}
  table.cs-tbl th.sorted{color:var(--lume)}
</style>
</head>
<body>
<div class="cs-frame">
  <div style="display:flex;align-items:center;gap:12px;padding:calc(var(--u)*2) calc(var(--u)*3);border-bottom:1px solid var(--rule)">
    <a href="../" class="plain"><span style="font-family:var(--f-score);font-size:19px;background:linear-gradient(100deg,var(--lume),var(--aqua));color:#04100b;padding:3px 11px 1px;text-transform:uppercase">Courtside</span></a>
    <span id="ctx" class="cs-micro"></span>
  </div>
  <div class="cs-hdr"><span class="idx">01</span><h2 id="title">Season statistics</h2></div>
  <!-- search, min-games, stat-group pills, column toggles and CSV all come
       from the shared table component, so they behave identically here and on
       the leaders board. -->
  <div id="tbl"></div>
  <footer style="padding:calc(var(--u)*3);font-family:var(--f-micro);font-size:9px;color:var(--ink-3)">Courtside Network</footer>
</div>
<script src="../config.js"></script>
<script src="../season.js"></script>
<script src="../data.js"></script>
<script src="../fulltable.js"></script>
<script src="stats.js"></script>
<script src="../nav.js"></script>
</body>
</html>
