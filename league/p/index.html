<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04100b">
<!-- PUBLIC. No gate.js, no topnav.js. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co">
<title>Player · Courtside</title>
<link rel="stylesheet" href="../kit/courtside-kit.css">
<style>
  .empty{padding:calc(var(--u)*5) calc(var(--u)*3);text-align:center;color:var(--ink-3);font-family:var(--f-micro);font-size:11px}
  a.plain{color:inherit;text-decoration:none} a.plain:hover{color:var(--lume)}
  .hero{display:flex;align-items:center;gap:16px;padding:calc(var(--u)*3);border-bottom:1px solid var(--rule)}
  .pnum{font-family:var(--f-score);font-size:64px;line-height:.8;color:var(--team-a);
    text-shadow:0 0 34px color-mix(in oklch,var(--team-a) 45%,transparent)}
  .pname{font-family:var(--f-ui);font-weight:800;font-size:23px;text-transform:uppercase;letter-spacing:.02em}
  .psub{font-family:var(--f-micro);font-size:10px;color:var(--ink-3);margin-top:6px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr))}
  .tile{padding:15px 10px;text-align:center;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .tile:last-child{border-right:none}
  .tile .v{font-family:var(--f-score);font-size:26px}
  .tile .l{font-family:var(--f-micro);font-size:9px;color:var(--ink-3);margin-top:6px}
</style>
</head>
<body>
<div class="cs-frame">
  <div style="display:flex;align-items:center;gap:12px;padding:calc(var(--u)*2) calc(var(--u)*3);border-bottom:1px solid var(--rule)">
    <a href="../" class="plain"><span style="font-family:var(--f-score);font-size:19px;background:linear-gradient(100deg,var(--lume),var(--aqua));color:#04100b;padding:3px 11px 1px;text-transform:uppercase">Courtside</span></a>
    <span id="ctx" class="cs-micro"></span>
  </div>
  <div class="hero"><div class="pnum" id="num">—</div>
    <div><div class="pname" id="name">—</div><div class="psub" id="sub"></div></div></div>
  <div class="tiles" id="tiles"></div>
  <div class="cs-hdr"><span class="idx">01</span><h2>Season</h2></div>
  <div class="cs-tw" id="seasons"></div>
  <div class="cs-hdr"><span class="idx">02</span><h2>Game log</h2></div>
  <div class="cs-tw" id="log"></div>
  <footer style="padding:calc(var(--u)*3);font-family:var(--f-micro);font-size:9px;color:var(--ink-3)">Courtside Network</footer>
</div>
<script src="../config.js"></script>
<script src="player.js"></script>
</body>
</html>
