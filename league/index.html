<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moved to /epinoia/</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="/epinoia/">
<!-- ==========================================================================
     THIS ADDRESS MOVED TO /epinoia/

     It is kept because it is not ours to break. The embeds are lines of markup
     sitting in other people's websites — a club pastes one in once and never
     touches it again — and links to fixtures and box scores have been shared
     into group chats and posted on club pages. Renaming the section was a
     decision made here; a dead fixture strip on somebody's homepage would be a
     consequence they never agreed to.

     THE QUERY STRING IS CARRIED ACROSS, which is the whole point: an embed's
     settings live in it, so ?l=slug&amp;n=24 has to arrive at the new address
     intact or the strip lands with no league and shows nothing.

     Both a script and a meta refresh, deliberately. The script is instant and
     uses replace() so Back does not bounce between the two addresses; the meta
     refresh is the fallback for anything that will not run it.
     ========================================================================== -->
<meta http-equiv="refresh" content="0; url=/epinoia/">
<script>
  (function () {
    location.replace('/epinoia/' + location.search + location.hash);
  }());
</script>
</head>
<body>
<p>This page has moved to <a href="/epinoia/">/epinoia/</a>.</p>
</body>
</html>
