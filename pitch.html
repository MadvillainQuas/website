<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Owning the Pipeline — Super League Basketball</title>
<meta name="description" content="A centralised youth development & player-rights framework for Super League Basketball. Strategic proposal & investor briefing.">

<!-- Open Graph / social preview -->
<meta property="og:title" content="Owning the Pipeline — Super League Basketball">
<meta property="og:description" content="A centralised youth development & player-rights framework. Retain British talent. Monetise the pipeline. Build the next generation of stars.">

<!-- NOTE: this page deliberately does NOT load gate.js — it is the one public,
     no-login page on the site. Everything else stays behind the invite gate. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Caladea ≈ Cambria (titles) · Carlito ≈ Calibri (body) — metric-compatible open clones -->
<link href="https://fonts.googleapis.com/css2?family=Caladea:ital,wght@0,400;0,700;1,400&family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0e1b36;            /* dark slide background          */
  --navy-panel:#16264a;      /* raised panel on dark slides    */
  --navy-panel-2:#1b2f57;
  --ink:#16243f;             /* navy text/titles on light      */
  --ink-soft:#42536e;        /* body text on light             */
  --muted:#7f8aa0;           /* secondary text                 */
  --orange:#e1701a;          /* accent                         */
  --orange-soft:#f29d4e;
  --circle:#1e3a63;          /* icon circle (navy)             */
  --light:#ffffff;           /* light slide background         */
  --card:#f3f6fb;            /* card surface on light          */
  --card-line:#e4e9f1;
  --serif:'Caladea','Cambria','Georgia',serif;
  --sans:'Carlito','Calibri','Segoe UI',system-ui,sans-serif;
  --stage-w:1280px;
  --stage-h:720px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#05080f;overflow:hidden;font-family:var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{display:flex;align-items:center;justify-content:center}

/* ---------- letterboxed, auto-scaling stage ---------- */
#viewport{position:fixed;inset:0;overflow:hidden;background:#05080f}
#stage{position:absolute;top:50%;left:50%;width:var(--stage-w);height:var(--stage-h);
  transform-origin:center center;will-change:transform}

/* ---------- slides ---------- */
.slide{position:absolute;inset:0;width:var(--stage-w);height:var(--stage-h);
  padding:64px 72px;display:flex;flex-direction:column;opacity:0;visibility:hidden;
  pointer-events:none;transition:opacity .01s;overflow:hidden}
.slide.light{background:var(--light);color:var(--ink)}
.slide.dark{background:var(--navy);color:#eaf0fb}
/* entrance / exit transforms driven by JS classes */
.slide.cur{opacity:1;visibility:visible;pointer-events:auto;z-index:2}
.slide.enter-next{animation:inNext .55s cubic-bezier(.22,.61,.36,1) both}
.slide.enter-prev{animation:inPrev .55s cubic-bezier(.22,.61,.36,1) both}
@keyframes inNext{from{opacity:0;transform:translateX(70px) scale(.985)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(-70px) scale(.985)}to{opacity:1;transform:none}}

/* staggered child reveal — applied when slide becomes current */
.slide.cur .reveal{animation:rise .55s cubic-bezier(.22,.61,.36,1) both}
.reveal{opacity:0}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* ---------- shared bits ---------- */
.eyebrow{font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:13px;
  color:var(--orange);margin-bottom:14px}
.slide.dark .eyebrow{color:var(--orange-soft)}
h1.title{font-family:var(--serif);font-weight:700;line-height:1.04;letter-spacing:-.01em}
.slide .title{font-size:46px;color:var(--ink);margin-bottom:8px}
.slide.dark .title{color:#fff}
.lead{font-size:19px;line-height:1.5;color:var(--ink-soft);max-width:1040px;margin-top:10px}
.slide.dark .lead{color:#b9c6df}
.lead em,.fn em{font-style:italic}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.fn{margin-top:auto;padding-top:18px;font-size:15px;line-height:1.45;color:var(--ink-soft);font-style:italic;max-width:1090px}
.slide.dark .fn{color:#9fb0cd}
.pagefoot{position:absolute;left:72px;right:72px;bottom:26px;display:flex;justify-content:space-between;
  font-size:12.5px;letter-spacing:.04em;color:#9aa7bd}
.slide.dark .pagefoot{color:#5e708f}

/* ---------- card grids ---------- */
.grid{display:grid;gap:18px}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c4{grid-template-columns:repeat(4,1fr)}
.grid.c5{grid-template-columns:repeat(5,1fr)}
.grid.c2x3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--card-line);border-radius:14px;padding:20px 20px 22px;
  display:flex;flex-direction:column;gap:11px;transition:transform .25s ease,box-shadow .25s ease,border-color .25s;cursor:default}
.slide.dark .card{background:var(--navy-panel);border-color:rgba(255,255,255,.06)}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 38px rgba(14,27,54,.16);border-color:rgba(225,112,26,.45)}
.slide.dark .card:hover{box-shadow:0 18px 40px rgba(0,0,0,.45)}
.card.accent{background:var(--orange);border-color:var(--orange)}
.card.accent .ch,.card.accent .cb{color:#fff}
.card.accent .icon{background:rgba(255,255,255,.18)}
.ch{font-size:18px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.slide.dark .ch{color:#fff}
.cb{font-size:14px;line-height:1.45;color:var(--ink-soft)}
.slide.dark .cb{color:#a9b8d4}
.icon{width:54px;height:54px;border-radius:50%;background:var(--circle);display:flex;align-items:center;
  justify-content:center;flex:0 0 auto;box-shadow:0 6px 16px rgba(14,27,54,.18)}
.icon.org{background:var(--orange)}
.icon svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon svg.fill{fill:#fff;stroke:none}
.compact .card{padding:16px 16px 17px;gap:8px}
.compact .ch{font-size:16px}.compact .cb{font-size:13px;line-height:1.4}
.compact .icon{width:46px;height:46px}.compact .icon svg{width:22px;height:22px}

/* ---------- big stat ---------- */
.statbig{font-family:var(--serif);font-weight:700;color:var(--orange);line-height:1}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:46px;align-items:center;flex:1;min-height:0}
.two-col .col-cards{display:flex;flex-direction:column;gap:14px}

/* ---------- title slide ---------- */
.titleslide .big{font-family:var(--serif);font-weight:700;font-size:104px;color:#fff;line-height:.98;letter-spacing:-.02em}
.titleslide .sub{font-size:24px;color:#b9c6df;max-width:760px;margin-top:22px;line-height:1.4}
.titleslide .tag{margin-top:46px;font-size:21px;font-weight:700;color:#fff}
.titleslide .tag .o{color:var(--orange-soft)}
.eyebrow-stack{font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.eyebrow-stack .l1{color:#dce6f6;font-size:17px}
.eyebrow-stack .l2{color:var(--orange-soft);font-size:14px;margin-top:6px;letter-spacing:.16em}

/* concentric basketball motif (title + closing) */
.rings{position:absolute;right:-90px;bottom:-90px;width:560px;height:560px;pointer-events:none}
.rings span{position:absolute;border-radius:50%;border:2px solid rgba(120,150,200,.32)}
.rings .r1{inset:0}.rings .r2{inset:90px}.rings .r3{inset:170px;border-color:var(--orange)}
.rings .ball{position:absolute;inset:235px;border-radius:50%;background:var(--orange);display:flex;
  align-items:center;justify-content:center}
.rings .ball svg{width:54px;height:54px;fill:#fff}

/* ---------- flow (slide 7) ---------- */
.flow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 18px}
.flow .node{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1}
.flow .node .icon{width:60px;height:60px}
.flow .node span{font-size:14px;font-weight:700;color:#dce6f6;text-align:center}
.flow .arrow{color:var(--orange);font-size:24px;flex:0 0 auto;opacity:.85}
.spotlight{background:linear-gradient(135deg,#16264a,#1b2f57);border:1px solid rgba(225,112,26,.4);
  border-radius:16px;padding:22px 26px;display:flex;gap:20px;align-items:flex-start}
.spotlight .sp-icon{width:58px;height:58px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.spotlight .sp-icon svg{width:28px;height:28px;fill:#fff}
.spotlight .sp-tag{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--orange-soft);text-transform:uppercase}
.spotlight .sp-h{font-family:var(--serif);font-size:24px;color:#fff;margin:4px 0 8px}
.spotlight .sp-b{font-size:14.5px;color:#b9c6df;line-height:1.45}

/* ---------- chart (slide 6) ---------- */
.chartcard{background:var(--navy-panel);border-radius:16px;padding:24px 26px}
.chartcard .ct{font-weight:700;color:#fff;font-size:16px}
.chartcard .cs{color:var(--orange-soft);font-size:12.5px;margin-top:3px;letter-spacing:.02em}
.bars{display:flex;align-items:flex-end;gap:26px;height:230px;margin:26px 8px 8px;border-bottom:2px solid rgba(255,255,255,.18);padding-bottom:0}
.bargroup{display:flex;align-items:flex-end;gap:8px;flex:1;height:100%}
.bar{flex:1;background:var(--circle);border-radius:5px 5px 0 0;height:0;transition:height 1s cubic-bezier(.22,.61,.36,1);position:relative;min-width:26px}
.bar.org{background:var(--orange)}
.bar b{position:absolute;top:-22px;left:0;right:0;text-align:center;color:#fff;font-size:14px;font-weight:700}
.legend{display:flex;gap:18px;margin-top:14px;font-size:13px;color:#b9c6df}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---------- rounds / waterfall stat rows ---------- */
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:24px;flex:1;align-content:center}
.bigcard{background:var(--card);border:1px solid var(--card-line);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.slide.dark .bigcard{background:var(--navy-panel);border-color:rgba(255,255,255,.07)}
.bigcard .num{width:40px;height:40px;border-radius:50%;background:var(--orange);color:#fff;font-weight:700;
  display:flex;align-items:center;justify-content:center;font-size:18px;font-family:var(--serif)}
.bigcard .bh{font-family:var(--serif);font-size:22px;color:var(--ink)}
.slide.dark .bigcard .bh{color:#fff}
.statrow{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-top:1px solid var(--card-line)}
.slide.dark .statrow{border-color:rgba(255,255,255,.08)}
.statrow .k{font-size:14px;color:var(--ink-soft)}
.slide.dark .statrow .k{color:#a9b8d4}
.statrow .v{font-weight:700;color:var(--orange);font-size:19px;font-family:var(--serif)}
.bigcard .note{font-size:13.5px;color:var(--ink-soft);font-style:italic;margin-top:4px}
.slide.dark .bigcard .note{color:#9fb0cd}

/* banner (slide 12) */
.banner{background:var(--navy);border-radius:14px;padding:20px 28px;display:flex;align-items:center;gap:28px;margin-top:16px}
.slide.dark .banner{background:var(--navy-panel)}
.banner .big{font-family:var(--serif);font-weight:700;font-size:48px;color:var(--orange);flex:0 0 auto;line-height:1}
.banner .big small{font-size:24px;color:#fff;font-weight:400}
.banner .bt{font-size:15px;color:#cdd8ec;line-height:1.45}

/* conferences (slide 17) */
.confs{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.conf{background:var(--navy-panel);border-radius:14px;padding:20px 24px}
.conf h3{font-family:var(--serif);color:#fff;font-size:20px;margin-bottom:12px}
.conf .teams{display:flex;flex-wrap:wrap;gap:8px}
.conf .teams span{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:20px;
  padding:6px 14px;font-size:13.5px;color:#dce6f6}
.conf .teams span.star{border-color:var(--orange);color:var(--orange-soft)}

/* ---------- chrome: progress, controls, counter, overview ---------- */
#progress{position:fixed;top:0;left:0;height:3px;background:var(--orange);width:0;z-index:50;transition:width .4s ease;box-shadow:0 0 10px rgba(225,112,26,.6)}
#counter{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:50;color:#9aa7bd;
  font-size:13px;letter-spacing:.05em;background:rgba(8,14,26,.55);padding:6px 14px;border-radius:20px;
  backdrop-filter:blur(8px);font-variant-numeric:tabular-nums;user-select:none}
#counter b{color:#fff}
.navbtn{position:fixed;top:50%;transform:translateY(-50%);z-index:50;width:46px;height:46px;border-radius:50%;
  border:1px solid rgba(255,255,255,.18);background:rgba(8,14,26,.5);color:#cdd8ec;cursor:pointer;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);transition:.2s;opacity:.5}
.navbtn:hover{opacity:1;background:var(--orange);border-color:var(--orange);color:#fff}
#prev{left:18px}#next{right:18px}
.navbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#tools{position:fixed;top:16px;right:16px;z-index:50;display:flex;gap:8px}
.tool{width:38px;height:38px;border-radius:9px;border:1px solid rgba(255,255,255,.16);background:rgba(8,14,26,.5);
  color:#cdd8ec;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);transition:.2s}
.tool:hover{background:var(--orange);border-color:var(--orange);color:#fff}
.tool svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* overview grid */
#overview{position:fixed;inset:0;z-index:60;background:rgba(5,8,15,.96);backdrop-filter:blur(6px);
  display:none;padding:54px 40px 40px;overflow-y:auto}
#overview.on{display:block}
#overview h2{color:#fff;font-family:var(--serif);font-size:24px;margin-bottom:22px;text-align:center}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;max-width:1200px;margin:0 auto}
.ovcell{aspect-ratio:16/9;border-radius:9px;overflow:hidden;cursor:pointer;border:2px solid transparent;
  position:relative;background:#0e1b36;transition:.2s}
.ovcell:hover{border-color:var(--orange);transform:scale(1.03)}
.ovcell .mini{position:absolute;inset:0;transform-origin:top left}
/* minis hold a full (non-current) .slide — force them visible & static */
.ovcell .mini .slide{opacity:1!important;visibility:visible!important;animation:none!important}
.ovcell .mini .reveal{opacity:1!important;animation:none!important}
.ovcell .lbl{position:absolute;left:0;bottom:0;background:rgba(8,14,26,.82);color:#cdd8ec;font-size:11px;
  padding:3px 8px;border-radius:0 8px 0 0;z-index:3}
.ovcell.cur{border-color:var(--orange)}

/* hint toast */
#hint{position:fixed;bottom:54px;left:50%;transform:translateX(-50%);z-index:55;color:#cdd8ec;font-size:13px;
  background:rgba(8,14,26,.7);padding:9px 18px;border-radius:22px;backdrop-filter:blur(8px);
  transition:opacity .5s;pointer-events:none}
#hint.gone{opacity:0}

@media (max-width:760px){
  #tools .tool.lbl-hide{display:none}
  #counter{bottom:12px}
}
</style>
</head>
<body>
<div id="progress"></div>
<div id="viewport"><div id="stage"></div></div>

<button class="navbtn" id="prev" aria-label="Previous slide"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
<button class="navbtn" id="next" aria-label="Next slide"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>

<div id="tools">
  <button class="tool" id="t-over" title="Overview (O)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
  <button class="tool" id="t-full" title="Fullscreen (F)"><svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
</div>

<div id="counter"><b id="c-cur">1</b> / <span id="c-tot">24</span></div>
<div id="hint">Use ← → or swipe · press <b>O</b> for overview · <b>F</b> for fullscreen</div>

<div id="overview"><h2>Owning the Pipeline — all slides</h2><div class="ovgrid" id="ovgrid"></div></div>

<script>

const ic = (name)=>`<span class="icon">${I[name]||''}</span>`;

const SLIDES = [
/* 1 — TITLE */
{theme:'dark',cls:'titleslide',html:`
  <div class="eyebrow-stack reveal"><div class="l1">Super League Basketball</div><div class="l2">Strategic Proposal · Investor Briefing</div></div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
    <div class="big reveal">Owning the<br>Pipeline</div>
    <div class="sub reveal">A centralised youth development &amp; player-rights framework for Super League Basketball.</div>
    <div class="tag reveal">Retain British talent.&nbsp;&nbsp;<span class="o">Monetise the pipeline.</span>&nbsp;&nbsp;Build the next generation of stars.</div>
  </div>
  <div class="rings reveal"><span class="r1"></span><span class="r2"></span><span class="r3"></span><span class="ball">${ballMark}</span></div>
  <div class="pagefoot"><span>Prepared for institutional review · June 2026</span><span></span></div>`},

/* 2 — THE PROBLEM */
{theme:'light',eyebrow:'The Problem',title:'We develop talent we don’t keep',
 body:`<div class="two-col">
   <div class="reveal">
     <p class="lead" style="margin:0 0 18px">British basketball produces talent more readily than it retains it. Players who develop strongly in the British system between 16 and 19 routinely leave for US prep schools and overseas programmes at pre-college and college age — and the value of that development accrues to others.</p>
     <p class="lead" style="font-style:italic;font-size:17px">Any future draft can only allocate the talent the system keeps. Early loss is therefore both a sporting and a commercial leak.</p>
   </div>
   <div class="col-cards">
     <div class="card reveal">${ic('plane')}<div class="ch">Talent leaves early</div><div class="cb">Promising players exit at 16–19 — other countries reap the benefit.</div></div>
     <div class="card reveal">${ic('chartDown')}<div class="ch">Development is sliding</div><div class="cb">A decline in GB U16–U20 results signals a system under-resourced versus its competitors.</div></div>
     <div class="card reveal">${ic('outward')}<div class="ch">Value flows outward</div><div class="cb">With no early rights, SLB cannot capture the upside of the players it helped create.</div></div>
   </div>
 </div>`,page:'02'},

/* 3 — WHY NOW */
{theme:'dark',eyebrow:'Why Now',title:'The market now pays for rights',
 body:`<div class="two-col">
   <div class="reveal">
     <div class="statbig" style="font-size:96px" data-count="500000" data-prefix="$">$500,000</div>
     <p class="lead" style="margin-top:14px">Gonzaga’s buy-out for Mario Saint-Supéry — now one of many, as paid players move freely into the NCAA, NBA Europe and EuroLeague.</p>
   </div>
   <div class="col-cards">
     <div class="card reveal">${ic('cap')}<div class="ch">Pay no longer blocks college</div><div class="cb">Paid players now keep NCAA eligibility — so a buy-out clause carries real, repeated commercial weight.</div></div>
     <div class="card reveal">${ic('money')}<div class="ch">Every player is a potential sale</div><div class="cb">Every developing player becomes a route to the NBA, NBA Europe and EuroLeague — and a potential rights sale.</div></div>
   </div>
 </div>`,
 fn:'Under today’s British structure, SLB is not positioned to capture any of this value.',page:'03'},

/* 4 — THE SOLUTION (timeline) */
{theme:'light',eyebrow:'The Solution',title:'Hold the rights early. Build a league around it.',
 lead:'SLB takes central control of player-rights from age 16, anchored by a marketed, broadcast-ready U22 Youth League and paid apprenticeship contracts — the academy model of professional football, built for basketball.',
 body:`<div class="grid c4 compact" style="margin-top:8px">
   <div class="card reveal"><div class="eyebrow" style="margin:0">Age 16</div>${ic('handshake')}<div class="ch">Pre-contract</div><div class="cb">Player commits to the SLB pathway over a US prep move — paid, and the college door stays open.</div></div>
   <div class="card reveal"><div class="eyebrow" style="margin:0">Age 17</div>${ic('signature')}<div class="ch">Academy deal</div><div class="cb">Paid apprenticeship contract and resourced development.</div></div>
   <div class="card reveal"><div class="eyebrow" style="margin:0">To 22</div>${ic('trophy')}<div class="ch">Youth League / SLB</div><div class="cb">Competes in the marketed, broadcast-ready U22 product, with SLB minutes and buy-out fees as a club incentive.</div></div>
   <div class="card accent reveal"><div class="eyebrow" style="margin:0;color:#fff">Draft</div>${ic('star')}<div class="ch">Monetise / retain</div><div class="cb">Rights realised via draft or buy-out — or retained via exemptions.</div></div>
 </div>`,
 fn:'All benefit: players get professional development and pay; the league secures the rights and the upside; the ecosystem shares the value.',page:'04'},

/* 5 — STRATEGIC RATIONALE (5 cards) */
{theme:'light',eyebrow:'Strategic Rationale',title:'Five ways the framework wins',
 body:`<div class="grid c5 compact">
   <div class="card reveal">${ic('anchor')}<div class="ch">Retain talent</div><div class="cb">Keep home-grown players connected to SLB through typical EABL years and beyond.</div></div>
   <div class="card reveal">${ic('money')}<div class="ch">Monetise the pipeline</div><div class="cb">Capture buy-out value when players move to college, the NBA or EuroLeague.</div></div>
   <div class="card reveal">${ic('whistle')}<div class="ch">Develop centrally</div><div class="cb">Direct camps, coaching and S&amp;C where they lift the standard most, with centralised talent.</div></div>
   <div class="card reveal">${ic('scissors')}<div class="ch">Cut import reliance</div><div class="cb">Raise the level from within instead of overspending on the import market.</div></div>
   <div class="card reveal">${ic('star')}<div class="ch">Build marketable stars</div><div class="cb">Tie the next Amari Williams or Tosan Evbuomwan to SLB from an early age.</div></div>
 </div>`,page:'05'},

/* 6 — COMMERCIAL ENGINE (chart) */
{theme:'dark',eyebrow:'The Commercial Engine',title:'Youth basketball is already the audience',
 lead:'On Hoopsfix, youth content out-engages senior SLB material — and across league finals, breakout creators and grassroots channels, the audience is already there, almost entirely unmarketed.',
 body:`<div class="two-col" style="gap:36px">
   <div class="chartcard reveal">
     <div class="ct">Youth-basketball creators &amp; grassroots (000s)</div>
     <div class="cs">YouTube subscribers vs Instagram followers · public channel data</div>
     <div class="bars" id="bars6">
       <div class="bargroup"><div class="bar" data-h="20"><b>20</b></div><div class="bar org" data-h="33"><b>33</b></div></div>
       <div class="bargroup"><div class="bar org" data-h="3"><b>3</b></div></div>
       <div class="bargroup"><div class="bar" data-h="2"><b>2</b></div></div>
     </div>
     <div class="legend"><span><i style="background:var(--circle)"></i>YouTube subs</span><span><i style="background:var(--orange)"></i>Instagram</span></div>
   </div>
   <div class="col-cards">
     <div class="card reveal">${ic('tv')}<div class="ch"><span class="statbig" style="font-size:40px" data-count="41000">41,000</span></div><div class="cb">combined YouTube views across the NBL youth final fours.</div></div>
     <div class="card reveal">${ic('globe')}<div class="ch"><span class="statbig" style="font-size:40px">No. 2</span></div><div class="cb">most-played team sport by 11–15s in England — diverse, urban, and diaspora-rich.</div></div>
   </div>
 </div>`,
 fn:'The demographic is there and unmarketed — low-cost streaming and diaspora channels turn it into reach.',page:'06'},

/* 7 — GROWTH PLAY (flow + spotlight) */
{theme:'dark',eyebrow:'The Growth Play',title:'The British-Filipino bridge',
 lead:'Britain has a large, under-served Filipino community and a passionate basketball culture. SLB can build a marketed bridge to it — starting with UK-resident British-Filipino talent and the diaspora audience that follows it.',
 body:`<div class="flow reveal">
     <div class="node">${ico('flag')}<span>Philippines</span></div><div class="arrow">→</div>
     <div class="node">${ico('player')}<span>British-Filipino</span></div><div class="arrow">→</div>
     <div class="node">${ico('trophy')}<span>KAMPI league</span></div><div class="arrow">→</div>
     <div class="node">${ico('globe')}<span>UK diaspora</span></div>
   </div>
   <div class="spotlight reveal">
     <div class="sp-icon">${I.star}</div>
     <div><div class="sp-tag">Spotlight</div><div class="sp-h">A KAMPI All-Star team in the Youth League</div>
     <div class="sp-b">Enter a KAMPI All-Star side — drawn from England Basketball’s UK-based Filipino league and backed by central SLB resources — into the new U22 competition, lifting home-grown British-Filipino players onto a marketed, broadcast-ready stage.</div></div>
   </div>
   <div class="grid c3 compact" style="margin-top:16px">
     <div class="card reveal">${ic('arrowUp')}<div class="ch">Higher level + exposure</div><div class="cb">KAMPI’s best step up a level and onto an aired, marketed league.</div></div>
     <div class="card reveal">${ic('globe')}<div class="ch">A Philippines bridge</div><div class="cb">A natural platform to cross-promote with one of the sport’s biggest markets.</div></div>
     <div class="card reveal">${ic('star')}<div class="ch">Marketable stars</div><div class="cb">Develops Filipino-British talent that resonates with Filipino audiences.</div></div>
   </div>`,
 fn:'The British-Filipino bridge multiplies the audience and content lines — an engagement play, with international recruitment a later, regulated option.',page:'07'},

/* 8 — THE MODEL (4 cards) */
{theme:'light',eyebrow:'The Model',title:'Four reinforcing revenue streams',
 body:`<div class="grid c4 compact">
   <div class="card reveal">${ic('money')}<div class="ch">Buy-outs &amp; sale-on fees</div><div class="cb">Frequent training-comp-scale fees as players move to college and Europe, plus occasional six-figure sales — shared with schools and federations.</div></div>
   <div class="card reveal">${ic('broadcast')}<div class="ch">Media &amp; sponsorship</div><div class="cb">A produced, broadcast-ready Youth League opens a new content and partnership base.</div></div>
   <div class="card reveal">${ic('sun')}<div class="ch">Summer programming</div><div class="cb">In-house Pro-Am, multi-day Combine and 1-on-1 events at league venues drive central revenue year-round.</div></div>
   <div class="card reveal">${ic('globe')}<div class="ch">International markets</div><div class="cb">New diaspora audiences, sponsorship and regulated media- and data-rights — content-led, reaching Filipino and wider Asian markets.</div></div>
 </div>`,
 fn:'A share of every rights sale trickles down to the originating school, grassroots club and national federation — keeping the whole ecosystem invested.',page:'08'},

/* 9 — STRUCTURE & GOVERNANCE (3 cards) */
{theme:'light',eyebrow:'Structure & Governance',title:'A closed, vetted system — built to broadcast',
 body:`<div class="grid c3">
   <div class="card reveal">${ic('arrowUp')}<div class="ch">Elevate, with the academies</div><div class="cb">An SLB-controlled tier above the EABL — SLB club teams (e.g. Gladiators Blue), delivered with DiSE colleges and Basketball England, Wales and beyond.</div></div>
   <div class="card reveal">${ic('badge')}<div class="ch">Earn your place</div><div class="cb">Entry against clear minimum standards — residency, court access, coaching, facilities — modelled on the Premier League’s Academy Category grading.</div></div>
   <div class="card reveal">${ic('broadcast')}<div class="ch">Broadcast by design</div><div class="cb">Teams rebranded into one Youth League identity, with minimum broadcasting standards built into the entry criteria.</div></div>
 </div>`,page:'09'},

/* 10 — DRAFT EVENT */
{theme:'dark',eyebrow:'A New Off-Season Event',title:'The SLB Draft — an event the league doesn’t have yet',
 lead:'SLB has no draft today. Creating one turns the quiet off-season into the league’s marquee commercial event — and a structured route from youth talent to senior contracts.',
 body:`<div class="grid c3 compact">
   <div class="card reveal">${ic('calendar')}<div class="ch">Off-season salience</div><div class="cb">Keeps the league in conversation when no games are being played.</div></div>
   <div class="card reveal">${ic('star')}<div class="ch">A marketable spectacle</div><div class="cb">An engaging, must-watch moment built for broadcast and sponsors.</div></div>
   <div class="card reveal">${ic('clipboard')}<div class="ch">Test before you sign</div><div class="cb">Clubs assess every prospect in one place before committing.</div></div>
 </div>
 <div class="spotlight reveal" style="margin-top:16px">
   <div class="sp-icon">${I.clipboard}</div>
   <div><div class="sp-tag">The Combine</div><div class="sp-h" style="font-size:21px">Pre-draft testing for U23s in one central venue</div>
   <div class="sp-b">Continuous media coverage and ticketed income. Storylines built in — who’s the most athletic Brit? Who dominates the scrimmages? Open NCAA &amp; pro-scout access fuels the buy-out pipeline. Open to every British U23 who declares their interest.</div></div>
 </div>`,page:'10'},

/* 11 — DRAFT STRUCTURE (two rounds) */
{theme:'light',eyebrow:'Draft Structure',title:'Two rounds, real commitments',
 lead:'Open to every British player U23 who declares. Each round guarantees senior terms, a team option and negotiated buy-out clauses — the clauses that feed the rights-sale engine.',
 body:`<div class="cols2">
   <div class="bigcard reveal"><div style="display:flex;align-items:center;gap:14px"><span class="num">1</span><span class="bh">First round (first 5 picks)</span></div>
     <div class="statrow"><span class="k">Guaranteed contract</span><span class="v">2 years</span></div>
     <div class="statrow"><span class="k">Team option</span><span class="v">+1 year</span></div>
     <div class="statrow"><span class="k">Buy-out clauses</span><span class="v">Negotiated</span></div>
     <div class="note">The marquee picks — top declared prospects, the headline of the night.</div>
   </div>
   <div class="bigcard reveal"><div style="display:flex;align-items:center;gap:14px"><span class="num">2</span><span class="bh">Second round</span></div>
     <div class="statrow"><span class="k">Guaranteed contract</span><span class="v">1 year</span></div>
     <div class="statrow"><span class="k">Team option</span><span class="v">+2 years</span></div>
     <div class="statrow"><span class="k">Buy-out clauses</span><span class="v">Negotiated</span></div>
     <div class="note">Depth and upside — longer club control in exchange for a lower guarantee.</div>
   </div>
 </div>`,
 fn:'Negotiated buy-out clauses on every contract turn developed talent into a recurring revenue stream.',page:'11'},

/* 12 — DRAFT INTEGRATION (3 cards + banner) */
{theme:'light',eyebrow:'Draft Integration',title:'Feeding the draft — without punishing developers',
 lead:'A meaningful share of non-SLB teams keeps the system fair, so clubs aren’t simply developing talent for rivals to profit from.',
 body:`<div class="grid c3 compact">
   <div class="card reveal">${ic('userCheck')}<div class="ch">Player exemptions</div><div class="cb">Clubs that develop a draft-eligible player for 2+ years can retain rights or take first option — modelled on the B.League.</div></div>
   <div class="card reveal">${ic('homeFlag')}<div class="ch">Home-country rules</div><div class="cb">Optional mechanisms keep Scottish, Welsh and Irish players with clubs from their own nation.</div></div>
   <div class="card reveal">${ic('list')}<div class="ch">Minimum roster rule</div><div class="cb">At least three draftees retained on the 12-man roster — the draft must create real senior minutes.</div></div>
 </div>
 <div class="banner reveal"><div class="big" data-count="2">2 <small>of 12</small></div><div class="bt">roster spots reserved for draftees — turning the draft into a guaranteed, visible pathway into the senior game.</div></div>`,page:'12'},

/* 13 — SENIOR GAME (3 cards, 1 accent) */
{theme:'light',eyebrow:'Developing in the Senior Game',title:'The SLB Trophy, reimagined for youth',
 lead:'Convert the existing SLB Trophy into a youth-focused group stage and knockout tournament — a competitive proving ground that forces senior minutes for the next generation, giving NCAA scouts good tape.',
 body:`<div class="grid c3">
   <div class="card reveal"><div class="eyebrow" style="margin:0">2 × U22</div>${ic('court')}<div class="ch">On the court</div><div class="cb">At least two U22 players on the floor at all times — real minutes, real stakes.</div></div>
   <div class="card reveal"><div class="eyebrow" style="margin:0">3 × U19</div>${ic('users')}<div class="ch">In the squad</div><div class="cb">At least three U19 players in every registered squad — a guaranteed seat at the table.</div></div>
   <div class="card accent reveal"><div class="eyebrow" style="margin:0;color:#fff">Minutes = £</div>${ic('money')}<div class="ch">Subsidised by play</div><div class="cb">A ProB France-style mechanism, backed by Basketball England, paying clubs by the youth minutes they play.</div></div>
 </div>`,
 fn:'A secondary competition becomes a development engine — and clubs are paid to feed it.',page:'13'},

/* 14 — ALIGNED INCENTIVES (6 cards) */
{theme:'light',eyebrow:'Aligned Incentives',title:'A system where everyone wins',
 body:`<div class="grid c2x3 compact" style="gap:14px">
   <div class="card reveal">${ic('shield')}<div class="ch">SLB</div><div class="cb">Talent control, buy-out revenue, a new media product and marketable stars.</div></div>
   <div class="card reveal">${ic('building')}<div class="ch">SLB clubs</div><div class="cb">A return on development via exemptions, retained rights and draft access.</div></div>

/* ============================================================
   RENDER
   ============================================================ */
const stage = document.getElementById('stage');
function buildSlide(s,i){
  const el=document.createElement('section');
  el.className='slide '+s.theme+(s.cls?(' '+s.cls):'');
  el.dataset.i=i;
  let inner='';
  if(s.html){ inner=s.html; }
  else{
    inner+=`<div class="reveal">`;
    if(s.eyebrow) inner+=`<div class="eyebrow">${s.eyebrow}</div>`;
    if(s.title)   inner+=`<h1 class="title">${s.title}</h1>`;
    if(s.lead)    inner+=`<p class="lead">${s.lead}</p>`;
    inner+=`</div>`;
    inner+=`<div class="body">${s.body||''}</div>`;
    if(s.fn) inner+=`<div class="fn reveal">${s.fn}</div>`;
    inner+=`<div class="pagefoot"><span>Owning the Pipeline</span><span>${s.page||''}</span></div>`;
  }
  el.innerHTML=inner;
  return el;
}
SLIDES.forEach((s,i)=>stage.appendChild(buildSlide(s,i)));
const slideEls=[...stage.querySelectorAll('.slide')];   /* main deck only — not overview minis */
document.getElementById('c-tot').textContent=SLIDES.length;

/* ============================================================
   SCALE TO FIT (letterbox)
   ============================================================ */
function fit(){
  const sc=Math.min(window.innerWidth/1280, window.innerHeight/720);
  stage.style.transform=`translate(-50%,-50%) scale(${sc})`;
}
window.addEventListener('resize',fit); fit();

/* ============================================================
   NAVIGATION
   ============================================================ */
let cur=-1, animating=false;
function stagger(el){
  [...el.querySelectorAll('.reveal')].forEach((r,k)=>{ r.style.animationDelay=(0.05+k*0.07)+'s'; });
}
function animateNums(el){
  el.querySelectorAll('[data-count]').forEach(n=>{
    const tgt=+n.dataset.count, pre=n.dataset.prefix||'', dur=900, t0=performance.now();
    const fmt=v=>{ if(tgt>=1000) return Math.round(v).toLocaleString('en-GB'); return Math.round(v); };
    const suffix = n.querySelector('small') ? n.querySelector('small').outerHTML : '';
    function step(t){ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
      n.firstChild && (n.childNodes[0].nodeType===3) ? n.childNodes[0].textContent=pre+fmt(tgt*e)+(suffix?' ':'') : n.textContent=pre+fmt(tgt*e);
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}
function animateBars(el){
  el.querySelectorAll('.bar[data-h]').forEach(b=>{
    const max=33; b.style.height=(b.dataset.h/max*100)+'%';
  });
}
function go(n,dir){
  n=Math.max(0,Math.min(SLIDES.length-1,n));
  if(n===cur) return;
  const el=slideEls[n];
  dir = dir!==undefined ? dir : (n>cur?1:-1);
  // Visibility is driven purely by the `cur` class (see CSS). No inline styles,
  // so a revisited slide always becomes visible again.
  slideEls.forEach(s=>s.classList.remove('cur','enter-next','enter-prev'));
  // reset reveals so the staggered entrance re-runs each visit
  el.querySelectorAll('.reveal').forEach(r=>{ r.style.animation='none'; void r.offsetWidth; r.style.animation=''; });
  el.classList.add('cur', dir>=0?'enter-next':'enter-prev');
  stagger(el);
  cur=n;
  document.getElementById('c-cur').textContent=n+1;
  document.getElementById('progress').style.width=((n+1)/SLIDES.length*100)+'%';
  if(location.hash!=='#'+(n+1)) history.replaceState(null,'','#'+(n+1));
  // kick off in-slide animations slightly after entrance
  setTimeout(()=>{ animateNums(el); animateBars(el); },380);
  updateOverview();
}
function next(){ go(cur+1,1); }
function prev(){ go(cur-1,-1); }

document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;

/* keyboard */
addEventListener('keydown',e=>{
  if(document.getElementById('overview').classList.contains('on')){
    if(e.key==='Escape'||e.key==='o'||e.key==='O'){toggleOverview();}
    return;
  }
  switch(e.key){
    case 'ArrowRight': case ' ': case 'PageDown': next(); e.preventDefault(); break;
    case 'ArrowLeft': case 'PageUp': prev(); e.preventDefault(); break;
    case 'Home': go(0); break;
    case 'End': go(SLIDES.length-1); break;
    case 'f': case 'F': toggleFull(); break;
    case 'o': case 'O': toggleOverview(); break;
  }
});

/* click zones (left third = prev, right = next) — ignore interactive cards */
document.getElementById('viewport').addEventListener('click',e=>{
  if(e.target.closest('.card,.navbtn,.tool,#overview,a,button')) return;
  if(e.clientX < window.innerWidth*0.32) prev(); else next();
});

/* swipe */
let tx=0,ty=0;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){ dx<0?next():prev(); }
},{passive:true});

/* fullscreen */
function toggleFull(){ if(!document.fullscreenElement){ document.documentElement.requestFullscreen?.(); } else { document.exitFullscreen?.(); } }
document.getElementById('t-full').onclick=toggleFull;

/* overview */
const ov=document.getElementById('overview'), ovgrid=document.getElementById('ovgrid');
SLIDES.forEach((s,i)=>{
  const cell=document.createElement('div'); cell.className='ovcell'; cell.dataset.i=i;
  const mini=document.createElement('div'); mini.className='mini';
  mini.innerHTML=buildSlide(s,i).outerHTML;
  cell.appendChild(mini);
  const lbl=document.createElement('div'); lbl.className='lbl'; lbl.textContent=(i+1)+'. '+(s.title? s.title.replace(/<[^>]+>/g,'').slice(0,34) : 'Title');
  cell.appendChild(lbl);
  cell.onclick=()=>{ go(i); toggleOverview(); };
  ovgrid.appendChild(cell);
});
function scaleMinis(){
  document.querySelectorAll('.ovcell').forEach(c=>{
    const w=c.clientWidth; const m=c.querySelector('.mini .slide')||c.querySelector('.mini > *');
    const mini=c.querySelector('.mini');
    mini.style.transform=`scale(${w/1280})`; mini.style.width='1280px'; mini.style.height='720px';
  });
}
function updateOverview(){ document.querySelectorAll('.ovcell').forEach(c=>c.classList.toggle('cur',+c.dataset.i===cur)); }
function toggleOverview(){ ov.classList.toggle('on'); if(ov.classList.contains('on')){ scaleMinis(); updateOverview(); } }
document.getElementById('t-over').onclick=toggleOverview;
addEventListener('resize',()=>{ if(ov.classList.contains('on')) scaleMinis(); });

/* hint auto-hide */
setTimeout(()=>document.getElementById('hint').classList.add('gone'),4600);

/* deep-link + start */
addEventListener('hashchange',()=>{ const n=parseInt(location.hash.slice(1))-1; if(!isNaN(n)) go(n); });
const start=parseInt(location.hash.slice(1))-1;
go(!isNaN(start)&&start>=0?start:0,1);
</script>
