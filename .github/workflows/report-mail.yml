name: Reports by email (game analyses, Sunday scouting reports)

# Every half hour (scripts/report_mailer.mjs, migration 0221): the game analysis of each subscribed club's games as soon as
# they are final, and on Sunday morning at each address's own time the week's opponents' reports (with the club's own every
# other Sunday), all in one email. The PDFs are drawn by the site itself, served from this checkout, in headless Chromium.
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY, RESEND_API_KEY, REPORTS_FROM ("Epinoia <reports@your-domain>").
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and print what would be sent, send nothing"
        type: boolean
        default: false
      only:
        description: "Only this address (optional)"
        required: false

permissions:
  contents: read

concurrency:
  group: report-mail
  cancel-in-progress: false

jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Chromium
        run: |
          npm i --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
      - name: Serve the site and send
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORTS_FROM: ${{ secrets.REPORTS_FROM }}
          DRY: ${{ github.event.inputs.dry_run }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
          node scripts/report_mailer.mjs
