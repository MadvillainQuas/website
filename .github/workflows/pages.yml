name: pages

# THE PUBLIC WEBSITE, FROM AN ALLOWLIST.
#
# Publishing the repository root served every file in the repository on the website:
# the database migrations, the Edge Functions, the ingest scripts and their
# configuration, the internal docs, the tools and the app sources. This publishes only
# what tools/build-site.py copies (the site's own folders and pages), and that script
# refuses to finish if anything from its never-publish list gets in.
#
# The Pages source is "GitHub Actions" (switched 2026-09-24, with HTTPS enforced), so every
# commit to main deploys, as the old branch publishing did.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # RUNS_ON: see ingest.yml
    runs-on: ${{ vars.RUNS_ON && fromJSON(vars.RUNS_ON) || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the public site (allowlist)
        run: python3 tools/build-site.py _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
