name: pages

# THE PUBLIC WEBSITE, FROM AN ALLOWLIST.
#
# Publishing the repository root served every file in the repository on the website:
# the database migrations, the Edge Functions, the ingest scripts and their
# configuration, the internal docs, the tools and the app sources. This publishes only
# what tools/build-site.py copies (the site's own folders and pages), and that script
# refuses to finish if anything from its never-publish list gets in.
#
# The Pages source is "GitHub Actions" (switched 2026-09-24, with HTTPS enforced), so every
# commit to main deploys, as the old branch publishing did.

on:
  workflow_dispatch:
  push:
    branches: [main]
  # Every night: the pages a search engine reads (a full page for every player, team and league,
  # written by tools/build-seo.py from the database) follow the data, not the commits.
  schedule:
    - cron: '35 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # RUNS_ON: see ingest.yml
    runs-on: ${{ vars.RUNS_ON && fromJSON(vars.RUNS_ON) || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the public site (allowlist)
        run: python3 tools/build-site.py _site

      # THE ADDRESSES A SEARCH ENGINE FINDS: p/<name>.html, t/<slug>.html and l/<slug>.html are the full
      # player, team and league pages with their own title, description, canonical and structured data,
      # and /epinoia/sitemap.xml lists them (tools/build-seo.py). They are made from the public database
      # on every deploy, and a deploy REPLACES the site - so a night the database cannot be read must not
      # publish a site with no player pages. The last good copy is kept in the Actions cache and used
      # instead; only when there is neither is the deploy stopped.
      - name: Restore the last good search pages
        uses: actions/cache/restore@v4
        with:
          path: _seo-cache
          key: seo-pages-restore
          restore-keys: seo-pages-

      - name: Search-engine pages (every player, team and league)
        run: |
          rm -rf _seo-new
          if python3 tools/build-seo.py _seo-new; then
            rm -rf _seo-cache && mkdir -p _seo-cache && cp -r _seo-new/epinoia _seo-cache/
            cp -r _seo-new/epinoia/. _site/epinoia/
            echo "SEO_FRESH=1" >> "$GITHUB_ENV"
          elif [ -d _seo-cache/epinoia ]; then
            echo "::warning::the search pages could not be built from the database; deploying the last good copy"
            cp -r _seo-cache/epinoia/. _site/epinoia/
          else
            echo "::error::the search pages could not be built and there is no earlier copy to fall back on"
            exit 1
          fi

      # kept only from a night's own run, so a day of pushes does not fill the cache with copies
      - name: Keep these search pages as the last good copy
        if: env.SEO_FRESH == '1' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v4
        with:
          path: _seo-cache
          key: seo-pages-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
