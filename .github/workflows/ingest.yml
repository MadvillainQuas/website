name: League ingest (schedule → feed → Supabase)

# Polls every configured schedule source (config/ingest-sources.json, or
# public.schedule_sources when Supabase keys are set), fetches new / live
# games, and publishes them three ways: the repo feed under data/feed/
# (committed here — index_9's offline source), Supabase external_games +
# storage (index_9's primary source, realtime-capable), and — for sources
# that name a platform league — games + game_advanced for the Epinoia site.
# Nightly it also regenerates the 13-CSV dataset from the archived feed.
# Same politeness rules as the GameVis pre-scrape: 300 ms request gap, one
# host at a time.
on:
  schedule:
    # DISCOVERY TWICE A WEEK, AND ONLY A PEEK. The leagues are connected and their fixture lists are
    # published weeks ahead; what changes between two looks is the odd tip-off moved or venue named.
    # This ran every 30 min from 12:00 to 23:30 UTC and re-read (and rewrote) ~2,000 fixtures each
    # time - the load that had the database refusing requests from ~23:40 UTC on 24 and 25 Sep 2026.
    # A pass now writes only what differs from what is stored (run_ingest: fixture_changed), and
    # never touches a finished game. 05:40 UTC Monday and Thursday: nothing anywhere is live.
    # Everything that used to ride on the half-hourly pass has its own trigger now: fixture
    # reminders are pg_cron's minute tick (notify_tick, from the stored fixtures); a game played while
    # no lane was watching is caught up by the hourly floor below; a broadcast is looked for by the
    # live lane when the game comes due.
    - cron: "40 5 * * 1,4"          # Mon + Thu 05:40 UTC: discovery (schedule changes only)
    # THE LIVE LANE RUNS AROUND THE CLOCK. A fixture list is known days ahead, so discovery can
    # run twice a week -- but a game is only live while it is being played, and
    # B.LEAGUE tips at 06:00 and 07:50 UTC. The old window covered France at 18:30 and never Japan
    # at all, so a B.LEAGUE game read 0-0 from tip to final however well the lane worked.
    - cron: "5-55/10 * * * *"       # every 10 min, all day: live games only
    # AND AN HOURLY ONE AS THE FLOOR. GitHub's cron is best-effort and drops high-frequency
    # schedules first: 7 h passed between live runs on 19-20 Sep 2026 inside a window that asked
    # for one every 10 minutes. Hourly schedules are delivered far more reliably. The chain at the
    # foot of this file is what actually holds a game live; this is the cold start for when the
    # chain is not running and every 10-minute slot has been dropped.
    - cron: "2 * * * *"
    - cron: "15 3 * * *"            # nightly dataset rebuild (only - it no longer runs discovery)
  workflow_dispatch:
    inputs:
      source:
        description: "Only this source label/code (optional)"
        required: false
      dry_run:
        description: "Discover + fetch, write nothing"
        type: boolean
        default: false
      rebuild_dataset:
        description: "Also regenerate the 13-CSV dataset from the archive"
        type: boolean
        default: false
      refresh:
        description: "Re-process every game (backfill stints / re-translate)"
        type: boolean
        default: false
      ids:
        description: "Only these game ids, comma-separated (tests)"
        required: false
      live:
        description: "Run the live lane now (polls live/due games every 10 s, waits for tip-offs, chains itself)"
        type: boolean
        default: false
      reset_league:
        description: "START A LEAGUE AGAIN: its slug (e.g. cibacopa). Deletes its games and players, keeps clubs, crests, venues; then re-reads it"
        required: false
      reset_confirm:
        description: "Type the same slug again to confirm the reset"
        required: false

# The live lane is a long-lived pass (up to ~5.5 h: polls in-progress games every 30 s, naps until
# the next tip-off, and re-dispatches itself while games are live or due - GitHub's cron is
# best-effort and cannot be relied on for liveness). It must not queue behind, or block, the
# discovery run, so the two lanes have their own concurrency groups; at most one live
# pass runs and one waits, and GitHub cancels any further pending ones -- which is what keeps four
# cron entries and the chain from piling up.
#
# WHICH LANE IS THIS? Asked as "scheduled, but neither discovery nor the nightly rebuild", NOT by
# naming the live cron. Naming it meant every live schedule added above had to be spelled out in
# four places, and a mismatch would silently run the live cron AS DISCOVERY -- a 60-minute timeout
# committing the feed. Asked this way an unrecognised schedule falls to the live lane, which is the
# safe side: short, Supabase-only, commits nothing. Testing an adapter by its literal name has now
# cost this pipeline data three times; this is the same mistake in YAML.
#
# THIS TEST APPEARS FOUR TIMES: here, timeout-minutes, the run step, and the commit step.
# Change one, change all four.
concurrency:
  group: league-ingest-${{ ((github.event.schedule != '' && github.event.schedule != '40 5 * * 1,4' && github.event.schedule != '15 3 * * *') || github.event.inputs.live == 'true') && 'live' || 'main' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write        # a pass may dispatch the next live-lane pass

jobs:
  ingest:
    # The repository variable RUNS_ON moves the job to the self-hosted runners, e.g.
    # ["self-hosted","linux","epinoia"] (tools/runner/README.md); unset, GitHub's own runners.
    runs-on: ${{ vars.RUNS_ON && fromJSON(vars.RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: ${{ ((github.event.schedule != '' && github.event.schedule != '40 5 * * 1,4' && github.event.schedule != '15 3 * * *') || github.event.inputs.live == 'true') && 350 || 60 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }   # the scraper pipeline is written against 3.12
      - uses: browser-actions/setup-chrome@v1      # headless Chrome for SPA schedule pages
      # cairosvg (team_colours.py via sync_logos, reading an SVG crest) needs the system libcairo
      # -- pip alone gets the Python wrapper but not the native library it calls into.
      # (already installed on the self-hosted runners, which have no sudo)
      - run: dpkg -s libcairo2 > /dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2)
      - run: pip install -r scripts/requirements.txt
      # The scraper pipeline (stints, lineups, the 13-CSV dataset). Private repo → deploy key.
      - name: Checkout scraper pipeline
        if: ${{ vars.SCRAPER_REPO != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SCRAPER_REPO }}
          ssh-key: ${{ secrets.SCRAPER_DEPLOY_KEY }}
          path: scraper
      - name: Install scraper requirements
        if: ${{ vars.SCRAPER_REPO != '' }}
        run: |
          # Windows-only helpers (toasts) are skipped; everything the parsers need installs.
          # RUNNER_TEMP, not /tmp: two runner instances on one machine would share /tmp.
          grep -viE "win10toast|pywin32" scraper/requirements.txt > "$RUNNER_TEMP/req.txt" || true
          pip install -r "$RUNNER_TEMP/req.txt" || pip install selenium beautifulsoup4 requests pandas numpy scikit-learn tqdm
      # A GAME PLAYED WHILE NO LANE WAS WATCHING (the PC off, the chain broken, a cron slot dropped)
      # used to be picked up by the next half-hourly discovery pass. Discovery is twice a week now,
      # so the catch-up asks the one question itself: anything that tipped off 4 h - 7 days ago
      # and is still not final? One or two reads when the answer is no, which is nearly always.
      #
      # EVERY LIVE-LANE PASS ASKS IT, NOT ONLY THE HOURLY SLOT. The hourly cron is in the live lane's
      # concurrency group, so while the chain holds the lane (a pass lasts up to 5.5 h and dispatches the
      # next) the hourly run waits, and the next cron slot's run replaces it: of 40 scheduled runs from
      # 26 to 30 Sep 2026, 14 were cancelled that way. The chain itself always runs, so the question
      # goes at the head of each of its passes.
      - name: Catch up games played while no lane was watching
        if: ${{ (github.event.schedule != '' && github.event.schedule != '40 5 * * 1,4' && github.event.schedule != '15 3 * * *') || github.event.inputs.live == 'true' }}
        # bounded: the live loop after it is 330 of the job's 350 minutes, and a pass cut off by the job
        # timeout never dispatches the next one
        timeout-minutes: 12
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SCRAPER_DIR: ${{ github.workspace }}/scraper
          PYTHONPATH: ${{ github.workspace }}/scraper
        run: python scripts/ingest/run_ingest.py --config --catch-up --feed-out "" || echo "catch-up failed - the live lane still runs"
      # NOTHING SITS LIVE FOR DAYS. Every live-lane pass (so the hourly floor too) reads again, and finalises through the
      # normal path, any game still live or finalising more than 4 h after its tip-off - of ANY age, in any league; the
      # catch-up above only looks at games under a week old whose feed row is not final, which is how Oaklands Wolves
      # v Cardiff Met (tip-off Oct 2025, the feed final, finalise-game refusing it) and three more sat on the front page
      # from 26 to 30 Sep 2026. One still open 6 h after tip-off is closed on its last state (final if the fourth
      # period or later was over or decided, else void): scripts/ingest/stuck.py, and supabase/migrations/0203 for the
      # same rule run by pg_cron. Idempotent, and nearly always one read that finds nothing. Repair by hand, with a
      # table and a failing exit code: .github/workflows/repair-stalled.yml.
      - name: Repair games stuck live
        if: ${{ (github.event.schedule != '' && github.event.schedule != '40 5 * * 1,4' && github.event.schedule != '15 3 * * *') || github.event.inputs.live == 'true' }}
        timeout-minutes: 12
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SCRAPER_DIR: ${{ github.workspace }}/scraper
          PYTHONPATH: ${{ github.workspace }}/scraper
        run: python scripts/ingest/run_ingest.py --config --repair-stalled --feed-out "" || echo "repair failed - the live lane still runs"
      # scripts/ingest/reset_league.py: only when asked by name, twice. The backup of every deleted row is kept as a
      # run artifact (not committed: it holds player records), for 30 days.
      - name: Reset a league (on request)
        id: reset
        if: ${{ github.event.inputs.reset_league != '' && github.event.inputs.reset_league == github.event.inputs.reset_confirm }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # the re-read covers this league's sources only (a --refresh of every league would be a day's work), and a
          # league with no source in the config is not reset at all: nothing could read it back
          codes=$(python -c "import json,sys;print(','.join(sorted({s['code'] for s in json.load(open('config/ingest-sources.json'))['sources'] if s.get('league_slug')==sys.argv[1]})))" "${{ github.event.inputs.reset_league }}")
          if [ -z "$codes" ]; then echo "no source in config/ingest-sources.json has league_slug ${{ github.event.inputs.reset_league }} - not reset"; exit 1; fi
          python scripts/ingest/reset_league.py --league "${{ github.event.inputs.reset_league }}" --apply
          echo "codes=$codes" >> "$GITHUB_OUTPUT"
      - name: Keep the reset's backup
        if: ${{ github.event.inputs.reset_league != '' && github.event.inputs.reset_league == github.event.inputs.reset_confirm }}
        uses: actions/upload-artifact@v4
        with:
          name: reset-${{ github.event.inputs.reset_league }}
          path: data/reset/
          retention-days: 30
      - name: Run ingest
        id: run
        # the nightly slot rebuilds the dataset and nothing else
        if: ${{ github.event.schedule != '15 3 * * *' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # optional: a free, read-only YouTube Data API key lets the worker find and line up
          # each fed game's broadcast by itself (scripts/ingest/auto_video.py)
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SCRAPER_DIR: ${{ github.workspace }}/scraper
          PYTHONPATH: ${{ github.workspace }}/scraper
          # docs/feed-timing.md: flipped from the repository's variables, no commit needed
          EPINOIA_OBSERVER: ${{ vars.EPINOIA_OBSERVER }}   # "0" = inline fetch (kill switch); unset = observer on
          EPINOIA_STAMPS: ${{ vars.EPINOIA_STAMPS }}       # step 3 memory stamps: "shadow" = print only, "off" = poll stamps; unset = on (needs the observer)
        run: |
          python scripts/ingest/run_ingest.py --config \
            ${{ (github.event.inputs.source || steps.reset.outputs.codes) && format('--source "{0}"', github.event.inputs.source || steps.reset.outputs.codes) || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}             ${{ (github.event.inputs.refresh == 'true' || (github.event.inputs.reset_league != '' && github.event.inputs.reset_league == github.event.inputs.reset_confirm)) && '--refresh' || '' }}             ${{ github.event.inputs.ids && format('--ids "{0}"', github.event.inputs.ids) || '' }}             ${{ ((github.event.schedule != '' && github.event.schedule != '40 5 * * 1,4' && github.event.schedule != '15 3 * * *') || github.event.inputs.live == 'true') && '--live-only --live-loop 19800 --live-every 10 --feed-out ""' || '' }}
      # The worker says chain=true when a game is live or a tip-off is near: the live lane starts
      # (or continues) its next pass straight away instead of waiting for a cron slot.
      - name: Start the next live-lane pass
        if: ${{ steps.run.outputs.chain == 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ingest.yml --ref "$GITHUB_REF_NAME" -f live=true || echo "dispatch failed (a pass is probably already queued)"
      - name: Shrink newly copied crests (nightly / on request)
        # snapshots copies each club's crest at the size its own site serves it (up to 3 MB); pages draw
        # them at 32-128 px and no longer use Storage's resizing (Pro includes 100 a month). This makes
        # each copy 256 px WebP, once - see scripts/ingest/shrink_crests.py.
        if: ${{ github.event.schedule == '15 3 * * *' || github.event.inputs.rebuild_dataset == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -m pip install --quiet pillow requests
          python scripts/ingest/shrink_crests.py || echo "crest shrink failed - it will try again tomorrow"
      - name: Commit feed + datasets
        if: ${{ github.event.inputs.dry_run != 'true' && !((github.event.schedule != '' && github.event.schedule != '40 5 * * 1,4' && github.event.schedule != '15 3 * * *') || github.event.inputs.live == 'true') }}
        run: |
          git config user.name "league-ingest[bot]"
          git config user.email "league-ingest@users.noreply.github.com"
          # the ingest's own state only. The older tools' datasets (data/data_*, data/latest.json) are no longer built
          # or committed: the repository is public, and a dataset in it is a dataset anybody can download.
          git add -A data/feed
          git diff --cached --quiet && echo "nothing new" || git commit -m "feed: ingest $(date -u +%Y-%m-%dT%H:%MZ)"
          # somebody may have pushed while we ran — replay our feed commit on top of theirs, on the branch
          # this run was dispatched on (main for every scheduled run; a feature branch for a one-off run of
          # its own new sources, which must never be rebased onto main here)
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push
