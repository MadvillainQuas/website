        run: node supabase/tests/api.test.mjs
        env:
          EPINOIA_API_KEY: ${{ secrets.EPINOIA_API_KEY }}

      - name: RLS policy tests
        # skips cleanly until the migration is applied; then it asserts the refusals
        run: node supabase/tests/rls.test.mjs

