name: guard

# The carve-out in /epinoia/ is defined by OMISSION — no gate.js, no topnav.js.
# Omissions are exactly what gets undone by accident, so they are enforced here:
# a paste of the standard <head> block becomes a failed build, not a silent outage.

on:
  push:
    paths: ['epinoia/**', 'share/**', 'sw.js', 'supabase/**', '.github/workflows/guard.yml',
            '.well-known/**', 'android/**', '.github/workflows/android.yml', 'tools/ios-team.mjs',
            # What wins: the builder, the backfill and their workflows (the run-ww tests read them)
            'tools/build-analytics.mjs', 'tools/build-odds.mjs', 'scripts/backfill_features.mjs', 'scripts/backfill_situations.mjs',
            '.github/workflows/analytics.yml', '.github/workflows/backfill-features.yml',
            # the records backfill's runner and workflow (records-backfill.test.mjs reads them)
            'scripts/records_backfill.mjs', '.github/workflows/records-backfill.yml']
  workflow_dispatch:

jobs:
  carve-out:
    # RUNS_ON: see ingest.yml
    runs-on: ${{ vars.RUNS_ON && fromJSON(vars.RUNS_ON) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      # Patterns match USAGE, not mentions — a comment warning against gate.js
      # must not fail the build, or the guard gets deleted out of annoyance.
      - name: The public section must never load the invite gate
        run: |
          if grep -rnE --exclude-dir=vendor '<script[^>]+src=["'"'"'][^"'"'"']*(gate|topnav)\.js|import[^;]+["'"'"'][^"'"'"']*(gate|topnav)\.js' epinoia/; then
            echo "::error::gate.js / topnav.js is LOADED under epinoia/ — the public section would be hidden from visitors."
            exit 1
          fi
          echo "ok — no gate references under epinoia/"

      # A share link is sent to a coach who has no invite code and never will.
      # The carve-out is the ABSENCE of gate.js — and an absence is exactly what
      # a well-meaning "make every page consistent" edit restores, turning every
      # link already sent into a locked door with nothing to announce it.
      - name: A share link must open for someone with no invite code
        run: |
          if grep -rnE --exclude-dir=vendor '<script[^>]+src=["'"'"'][^"'"'"']*(gate|topnav)\.js|import[^;]+["'"'"'][^"'"'"']*(gate|topnav)\.js' share/; then
            echo "::error::gate.js / topnav.js is LOADED under share/ — every share link would demand an invite code."
            exit 1
          fi
          # The other half of the same door: gamevis.html bounces visitors with
          # no prophesy_auth_v2 session back to index.html. Copied into the
          # share page it would lock out precisely the people shares exist for.
          if grep -rn 'prophesy_auth_v2' share/; then
            echo "::error::the sign-in redirect is present under share/ — recipients would be bounced to the login page."
            exit 1
          fi
          echo "ok — share pages carry no gate and no auth redirect"

      - name: No service-role key may ship to a browser
        run: |
          # an actual assignment, or a raw JWT literal — not prose about them
          # sb_publishable_* is meant to be public. sb_secret_* and service_role are not.
          # A real key appears inside a string literal. Prose that merely NAMES these
          # (this README does) must not fail the build — third time that bit me.
          if grep -rnE --exclude-dir=vendor --include='*.js' --include='*.html' --include='*.ts'              '(service_role|SERVICE_ROLE[A-Z_]*)\s*[:=]|["'"'"'`]sb_secret_|["'"'"']eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.' epinoia/; then
            echo "::error::a service-role key or raw JWT appears under epinoia/. Only the anon key belongs in client code."
            exit 1
          fi
          echo "ok — no privileged credentials in client code"
          # Stripe keys and webhook signing secrets belong in Edge Function secrets
          # (npx supabase secrets set), never in a file: not in a page, not in the
          # billing function, not in a test. A secret key moves money and a signing
          # secret mints memberships. Same rule as above — a QUOTED literal with at
          # least one character after the prefix, so prose naming sk_live_ and a
          # startsWith('sk_test_') mode check do not fail the build. Tests that
          # need a secret assemble a fake one from pieces. Every file type, and no
          # -I: a source file git thinks is binary must not hide a key.
          if grep -rnE --exclude-dir=vendor --exclude-dir=node_modules '["'"'"'`](sk|rk)_(live|test)_[A-Za-z0-9]|["'"'"'`]whsec_[A-Za-z0-9]' epinoia/ supabase/; then
            echo "::error::a Stripe secret key, restricted key or webhook signing secret appears under epinoia/ or supabase/. It belongs in an Edge Function secret."
            exit 1
          fi
          echo "ok — no Stripe secrets committed"

      - name: User text must never be interpolated as HTML
        run: |
          # innerHTML fed directly from a player/team name is the XSS the plan calls out.
          if grep -rnE --exclude-dir=vendor 'innerHTML\s*=\s*[^;]*\b(p\.name|player\.name|team\.name|\.display_name)\b' epinoia/; then
            echo "::error::user-supplied text interpolated into innerHTML without escaping."
            exit 1
          fi
          echo "ok — no unescaped user text in innerHTML"

      - name: Assets must be version-stamped
        # a browser that has decided a file is fresh will not ask again, so the
        # only reliable cache-bust is a URL it has never seen
        run: python tools/stamp-assets.py --check

      - name: No personal address may be committed
        # the contact recipient lives in an Edge Function secret; a personal
        # address in a public repo is a spam list entry with extra steps
        run: |
          if grep -rniE --exclude-dir=vendor '[a-z0-9._%+-]+@(gmail|googlemail|outlook|hotmail|yahoo|icloud)\.[a-z.]+' epinoia/ supabase/; then
            echo "::error::a personal email address appears in the repository."
            exit 1
          fi
          echo "ok — no personal addresses committed"

      # THE SITE NEVER NAMES WHERE ITS CODE IS KEPT (2026-09-24): no link, API call, text or
      # comment in anything EPINOIA ships. Third-party files are exempt (the vendored SDK and
      # the fonts' licences name their own projects), and so is Markdown, which is never
      # published (tools/build-site.py).
      - name: The site never names the code host
        run: |
          if grep -rIil "github" epinoia/ share/ --exclude-dir=vendor --exclude='*.md' --exclude='OFL-*.txt'; then
            echo "::error::a shipped file under epinoia/ or share/ names GitHub (listed above)."
            exit 1
          fi
          echo "ok - nothing shipped names the code host"

      - name: The service worker must not cache the public section
        run: |
          if [ -f sw.js ] && ! grep -q "startsWith('/epinoia/')" sw.js; then
            echo "::error::sw.js is missing the /epinoia/ bypass — live pages would be served stale."
            exit 1
          fi
          echo "ok — service worker bypasses /epinoia/"

  engine-parity:
    # RUNS_ON: see ingest.yml
    runs-on: ${{ vars.RUNS_ON && fromJSON(vars.RUNS_ON) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # 24, not 20: report.test.mjs and awards.test.mjs import the Edge Functions' .ts
        # files, which Node strips types from natively only from 22.6 (default from 23.6).
        # On 20 the report suite died on ERR_UNKNOWN_FILE_EXTENSION, hidden until 5913f27
        # let the job reach it. 24 is also what every suite is run with locally.
        with: { node-version: '24' }

      - name: The Edge Function and the browser must run the same engine
        run: |
          # supabase/functions/_shared/engine.js is epinoia/engine.js plus an ESM tail.
          # If they drift, the server and the public page can disagree about a score.
          # Since 9ef8dbe the copy opens with a one-line GENERATED banner from extract-shared.mjs;
          # comparing byte-for-byte from byte 0 failed on that banner alone, on every commit, and
          # because this step comes first no suite after it ran. The banner is skipped, nothing else.
          sed '1{/GENERATED from epinoia\/engine\.js/d}' supabase/functions/_shared/engine.js | head -c $(wc -c < epinoia/engine.js) > "$RUNNER_TEMP/shared_head.js"
          if ! diff -q epinoia/engine.js "$RUNNER_TEMP/shared_head.js" > /dev/null; then
            echo "::error::supabase/functions/_shared/engine.js has drifted from epinoia/engine.js."
            echo "Re-sync with:  cp epinoia/engine.js supabase/functions/_shared/engine.js && (re-append the ESM tail)"
            exit 1
          fi
          echo "ok — engines identical"

      - name: Engine smoke test
        run: node supabase/tests/engine.smoke.mjs

      # DELIBERATELY EARLY IN THIS JOB. plpgsql only checks a RAISE's format
      # string when the function body is compiled, i.e. at CREATE time, so a
      # `raise exception '% ...'` with no argument is not a runtime surprise —
      # it stops `supabase db push` dead. And db push is not transactional, so
      # it stops it HALF WAY, leaving the earlier statements applied, the
      # migration unrecorded, and the database in a state no file describes.
      # That happened on 0140 (2026-09-19) and only good luck — every statement
      # in that file being idempotent — made re-running it safe. A migration is
      # pushed by hand from a laptop, so CI is the only chance to catch it
      # before the database is the thing finding out.
      #
      # It checks a second thing for the same reason: a mixed-case address in a
      # self-test is there to prove a function folds it, so the folded form has
      # to be what the assertion below reads back. A case-sensitive sed broke
      # that pair in 0140 and the self-test failed on the live database, 33
      # statements in, on the very next push after the RAISE.
      - name: No migration can stop a db push half way
        run: node supabase/tests/migration-lint.test.mjs

      # 0171 closed gaps a later migration can reopen by re-creating a function,
      # view or policy from an older copy: a withheld child's name in the season
      # view, an official's email, fake results, another club's player on your
      # roster. And players lost its table-wide SELECT (a guardian's name is not
      # public), so a column added later must be granted by name or every page
      # selecting it is refused.
      - name: The security sweep stays swept
        run: node supabase/tests/security-sweep.test.mjs

      # The uploader inserted `w` and `h` into a table whose columns are
      # `width` and `height`, so PostgREST refused every upload the platform
      # ever attempted and the media table stood at nought rows. The failure is
      # at the last step — the files reach storage fine — so nothing looked
      # broken until somebody read the error.
      - name: The uploader's columns must exist on public.media
        run: node supabase/tests/media-columns.test.mjs

      # Six files built /object/public/<path> with the bucket left out, so every
      # one of them asked for a URL that cannot exist and got NoSuchKey. It
      # survived because each call site falls back quietly to a monogram or a
      # drawing — nothing looked broken, there was simply never a photograph.
      - name: A public storage URL must name its bucket
        run: node supabase/tests/storage-urls.test.mjs

      # "Back to listing" reads the discarded-event count out of the refusal to
      # put it in the confirmation dialog. It was changed to read only the
      # exception's DETAIL field — correct, and it shipped before the migration
      # that populates DETAIL, which turned the button dead on the live site.
      # Both call sites must therefore also read the sentence, and must agree.
      - name: Both revert dialogs must read the event count the same way
        run: node supabase/tests/revert-count.test.mjs

      # The rail hides its role-gated rows with node.hidden = true, which the
      # browser honours through [hidden]{display:none} at specificity (0,1,0).
      # nav.css then styled the same rows at (0,2,1) with display:flex, so the
      # stylesheet outranked the attribute and every gated console — score a
      # game, club portal, league admin, admin controls, platform — was painted
      # for everybody, signed out included. Nothing was actionable through them
      # (RLS refuses every write behind them), but the rail was telling accounts
      # they held rights they did not hold.
      - name: A hidden nav row must actually be hidden
        run: node supabase/tests/nav-gating.test.mjs

      # Japanese and Spanish (docs/i18n.md): every rail page loads i18n.js early, both
      # dictionaries carry the same keys, and the words stay the ones the leagues print.
      - name: Languages
        run: |
          TZ=UTC node supabase/tests/i18n.test.mjs
          node supabase/tests/i18n-tool.test.mjs

      # A letter the pixel faces cannot draw (Ę in MĘŻCZYZN) is transliterated under those faces
      # only; the coverage table is generated from the fonts by tools/font-coverage.py
      - name: Display-face transliteration
        run: node supabase/tests/glyphs.test.mjs

      # A new league starts without its merchandise shelf (0148), a shouted club is written as a
      # name in the ingest and in the database (0149; two implementations, one rule), and the game
      # page's tab strip fits by measurement.
      - name: League defaults, club names and the tab strip
        run: node supabase/tests/league-defaults.test.mjs

      # The preview writes prose from season aggregates, so it can be
      # confidently wrong in a way a table cannot. edge() is signed so positive
      # always means the attacking side is ahead, whichever way the factor runs
      # — and the first draft read a negative edge as a defensive strength,
      # describing a defence that was generous on that factor as shutting the
      # matchup down. These hold the sign convention, the small-sample refusal
      # and the escaping of club names and venues.
      - name: The fixture preview must say true things
        run: node supabase/tests/preview.test.mjs

      # The match report is generated prose sitting directly above the box score
      # it describes, so a sentence disagreeing with the table under it is worse
      # than no sentence. Holds the claims — which side won what, whether a run
      # happened, whether a lineup swung it — plus the three faults found by
      # reading real output: lowercase names, per-100 rates quoted off
      # three-minute samples, and the same passage of play retold three times.
      - name: The match report must say true things
        run: node supabase/tests/report.test.mjs

      - name: Club and player reports over linked competitions (SLB + EuroCup)
        # the linked side's ids counted as the club's and the player's, summed before any rate; ranked against the
        # league's own field all the same, and the cover says so; the RAPM never reads the linked games
        run: node supabase/tests/report-scopes.test.mjs

      - name: A Synergy play-type file read right - drives left, right and straight, their shots, face-up and post-up defence
        # epinoia/synergy.js over a made-up player in the scraper's own columns (Side, Play Type, Sub 1..4, POSS, PTS, FG MADE ...):
        # an isolation's drives counted once (the Overall total, the split's shot types), a spot-up and a pick-and-pop's too;
        # TO BASKET the rim, the DRIBBLE JUMPER's twos mid-range and threes threes; attacked face-up = every isolation and every
        # drive outside one; post-D = the post-ups; the older "Sub Category" export; a name matched by surname and initial
        run: node supabase/tests/synergy.test.mjs

      - name: Synergy in the reports, AST% on the situation cards, the clean type, PRIME REPORT and RAPM kept (0228)
        # report.js: the DRIVES L/R category (pairs tinted against his drives in all directions, never this season's marks, the
        # better side green, the sample under each), face-up / post-D in every defence group, no category for a player with no
        # file; the left / right chart (PPP in its lean's colour, marks at all directions); a situation card's AST% by kind; the
        # pixel faces set to Archivo; PRIME REPORT; RAPM read from and kept in report_rapm; 0228 on PGlite (Synergy for platform
        # administrators only, RAPM read by anyone, the players' ZIP on for every address)
        run: node supabase/tests/report-synergy.test.mjs

      - name: The reports manager, and the players' reports in a reply (0228)
        # reports-manager.js: a Synergy file matched to the clubs the reports are on (each address's clubs and whom they play in
        # the next two weeks; never the whole site); the mailer: the ZIP read back whole, whose reports go in (10 minutes a game,
        # the released left out), the reply threaded under the Sunday email, every report primed with Synergy and RAPM kept
        run: node supabase/tests/reports-manager.test.mjs

      - name: One game's BPM, as Basketball-Reference adapts BPM 2.0 to a game
        # bpm.js game: the season's position and role, the team rating from the season BPMs of the players who played plus
        # half the margin and the lead correction (BBRef's worked example: +16.9 / +3.1), few minutes regressed at the
        # competition's level; the engine's average lead; the game page, modern box, game log and graphics all ask it
        run: node supabase/tests/game-bpm.test.mjs

      - name: A disabled account is out, and another email on its network does not get back in
        # 0230: the gate refuses a disabled account's signed-in requests and any account on a blocked network (never a
        # signed-out reader, the service key or a platform administrator; it fails open); account_status signs the page
        # out and says why; disabling ends the sessions; an account made after its network was blocked is disabled
        run: node supabase/tests/disabled-accounts.test.mjs

      - name: What a membership will open needs an account first
        # access.js signinFirst: signed out, every lockable feature asks for an account (never on a game page, never the box
        # score's tabs, never a members-only league's wall); the card, the placeholder and the box; every table's views past
        # MISC (players) and TOTALS (clubs) are part of the lock
        run: node supabase/tests/signin-gates.test.mjs

      - name: Previews for a signed-out reader, ten a week and one free report of each kind
        # 0231: counted against a salted one-way code of the network (never the address); the eleventh refused, the same
        # thing again free, the reports apart; a preview opens one feature on one page for thirty minutes; the game report
        # stays open to everyone for now
        run: node supabase/tests/previews.test.mjs

      - name: Highlights, the video feed and the live chat (0237)
        # every migration on PGlite: a channel's mode is its league's or the platform's; a league's Video tab, a game's
        # videos and HOME's video feed show only what may be seen; the chat's gate and store are the edge function's
        # alone, a shown message goes out on chat:<game> with no user id, three reports take one down
        run: |
          npm i --no-save @electric-sql/pglite
          node supabase/tests/video-chat.test.mjs

      - name: A channel's own names for clubs, for the video matcher (0240)
        # every migration on PGlite: the names are the channel's administrators' alone and never a reader's; a name for a
        # club or for none, the same name again replaces it; the console's read of the newest videos and what was found;
        # a change sends the unmatched videos back, rematch the matched too, never one linked by hand
        run: |
          npm i --no-save @electric-sql/pglite
          node supabase/tests/video-clubs.test.mjs

      - name: The live chat's moderator, and the league's Video and Live tabs (0237)
        # the moderator's policy, the message as data, the fail-closed verdict and the function's order (gate, model, store);
        # the tabs hidden until needed, one idle-time call, the player's state from YouTube's frame, cinema, the game's embed
        run: |
          node supabase/tests/chat-moderation.test.mjs
          node supabase/tests/league-media.test.mjs

      - name: Box score renders with nothing but S and derive()
        # catches a helper left behind by the extraction, which otherwise only
        # shows up as a blank public page
        run: node supabase/tests/boxscore.isolation.mjs

      - name: The live path publishes corrections, not just additions
        # undo, redo and a mid-log edit must reach the viewer AND the durable
        # log; a length-based high-water mark could see none of them
        run: node supabase/tests/live.test.mjs

      - name: The scoreboard clock is a time in the game that happened
        # a full clock at a break is the END of the period just played, never the start of it
        # ("Q1 · 10:00" through the first break), and a live box score never counts minutes
        # from a placeholder 0:00 (ten for every starter two minutes in)
        run: node supabase/tests/periodpill.test.mjs

      - name: Round-robin scheduling
        # a fixture list is the artefact everybody plans around: everybody
        # plays everybody once, nobody twice in a round, and the home/away
        # split is within one game for an even team count
        run: node supabase/tests/schedule.test.mjs

      - name: Box plus/minus
        # the port checks intermediate values, not just the final number — a
        # BPM that is right in aggregate but wrong per component cannot be
        # debugged later
        run: node supabase/tests/bpm.test.mjs

      - name: Shared modules match the browser copies
        # bpm.js and season.js run in BOTH the browser and the finalise Edge
        # Function, which is what stops the MVP award and the leaderboard from
        # naming different players. A drift here would let them.
        run: node supabase/tests/extract-shared.mjs --check

      - name: MVP by BPM
        # the appearance gate, the gate relaxing on a young season, and a
        # non-UUID player id being declined rather than failing a finalise
        run: node --experimental-strip-types supabase/tests/awards.test.mjs

      - name: A player who is not on the register does not break a page
        # CIBACOPA's feed files unmatched players as "0:12"; in an id=in.(...) list that is a 400 for
        # the whole read, which blanked Team Stats, the leaders and the global tables
        run: node supabase/tests/unregistered-players.test.mjs

      - name: The weekly fans' vote
        # the once-a-week rule and the podium's moves; the ballot being the Stars
        # podium's own week (the fanvote function runs stars.js, checked on the BCB
        # capture) and every club that won; fifteen players in 0150
        run: node --experimental-strip-types supabase/tests/fanvote.test.mjs

      - name: Who's your favourite? (HOME's prompt for a fan who follows no club)
        # home/favourites.js: who is asked and when it stays shut (once per account and browser, remind
        # me later, never), the country and club rows, the store, follow.js's set-rather-than-flip and
        # quiet options run in a VM, the anchor between the daily fixtures and MY FOLLOWED, the panel
        # black in the light theme and white in the dark, and 0161's set_fan_prefs being 0150's plus
        # one line; every string the panel writes has a Japanese and a Spanish entry
        run: node supabase/tests/favourites.test.mjs

      - name: Usernames (EPINOIA GO, migration 0163)
        # a table nobody writes directly, one verdict for every rule (format, reserved, blocklist with
        # disguises, taken whatever the case), 30 days between changes, a race lost to "taken"; the profile
        # page checking as it is typed and never translating a name
        run: node supabase/tests/usernames.test.mjs

      - name: The arena editor (EPINOIA GO, migration 0164)
        # a pin moved by pasting a Google Maps address (the place's own point, not the map's centre), the
        # place id a moved pin keeps, the states and their order; merge_venues for administrators only,
        # everything moved before the row goes, "checked by" always the person signed in; ja/es
        run: node supabase/tests/arena-editor.test.mjs

      - name: Stamps (EPINOIA GO, migration 0165)
        # a stamp keeps no location, only the fan reads theirs, nobody writes one but the check; the check's
        # window, trusted pins, the accuracy allowance, no faster than a plane, the rate limit, private games;
        # the games a fan can stamp, asked for with no location at all
        run: node supabase/tests/stamps.test.mjs

      - name: The EPINOIA GO page (epinoia/go/)
        # what a game is to a fan standing somewhere, the order games are listed in; every refusal the
        # check can give has words, in ja and es too; the location leaves the phone in the stamp call only
        run: node supabase/tests/go-page.test.mjs

      - name: EPINOIA GO's numbers, passport and leaderboards (migration 0166)
        # on a board only by choice, with a username and 18 or over confirmed; names and numbers, never an
        # id; a private league's board not a stranger's; the journey in the order made; the drawing's names
        # never overlapping or off the edge; ja/es
        run: node supabase/tests/go-boards.test.mjs

      - name: Predictions, where to watch, the leaderboards and their moderation (migration 0239)
        # a pick signed in and before tip-off; everyone's split, nobody's picks; a face only for a public page;
        # only a platform administrator rejects a picture and warns; the pill and the strip never open the card
        # they sit in; the watch data is the spreadsheet's
        run: TZ=UTC node supabase/tests/predictions.test.mjs

      - name: EPINOIA's model - the win probabilities, the run, and its picks (winodds.js, build-odds.mjs, migration 0253)
        # known answers on invented games (the better club, the home court, the schedule, form, positions, who is
        # playing, one tip-off, its own calibration, the packed state, the nine-number reads); the run against a
        # stand-in database (only what is new, the state gzipped, the pick's side never sent); and on a real Postgres
        # (PGlite) the table closed to readers, picks frozen at tip-off, game_forecast's gates and prediction_model
        run: |
          npm i --no-save @electric-sql/pglite
          node supabase/tests/winodds.test.mjs
          node supabase/tests/build-odds.test.mjs
          node supabase/tests/model-picks.test.mjs

      - name: EPINOIA GO's "Games been to", the fans' photographs (migration 0167)
        # private until a person approves; a fan writes only in their own folder; a public file named for
        # the photograph, never its fan; only stamped games, never a youth league's or one with an under-18
        # on a roster, only 18 or over; three reports take one down; every refusal in words; ja/es
        run: node supabase/tests/go-photos.test.mjs

      - name: EPINOIA GO's feed of stamps, and going public in one tap (migration 0177)
        # a fan's stamps are shown only by their own choice, never because they joined the leaderboards before;
        # one call turns on both, needing a username and 18 or over; the feed is the photographs, then the stamps
        # of the fans who chose, a stamp with a photograph shown once; no account id, note or location in a row;
        # the day and hour on the league's clock; the card's tap, its order of calls and its fall-back; ja/es
        run: node supabase/tests/go-public.test.mjs

      - name: Print files
        # these become physical objects. A sheet at the wrong DPI, a background
        # that prints as a white slab on a black shirt, or a design past the
        # trim line is a refund rather than a bug report.
        run: node supabase/tests/artwork.test.mjs

      - name: Print-on-demand requests
        # a wrong request creates a REAL product in a REAL shop, on sale. The
        # shapes are asserted rather than discovered: Printify's two-step
        # upload, pennies against pounds, and a 200 with no product id in it.
        run: node supabase/tests/merchstore.test.mjs

      - name: Partner feed payloads
