        run: node supabase/tests/shotclock.test.mjs

      - name: Every rotation bar is the box score's minutes
        # epinoia/rotation.js follows the engine's minutes to the millisecond on real games
        run: node supabase/tests/rotation.test.mjs

      - name: Rebounds off each zone's misses (events tab, club profile)
        # AHEAD OF events.test with the steps above: every miss is followed by the first rebound before
