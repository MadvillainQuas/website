        # tab's table on both views, a season of logs at both ends, and a real LiveStats game
        run: node supabase/tests/rebound-zones.test.mjs

      - name: A substitution is one change however its two halves were logged
        # translate/fiba_events.py paired an OUT and an IN only when they arrived back to back;
