name: guard

# The carve-out in /epinoia/ is defined by OMISSION — no gate.js, no topnav.js.
# Omissions are exactly what gets undone by accident, so they are enforced here:
# a paste of the standard <head> block becomes a failed build, not a silent outage.

on:
  push:
    paths: ['epinoia/**', 'share/**', 'sw.js', 'supabase/**', '.github/workflows/guard.yml',
            '.well-known/**', 'android/**', '.github/workflows/android.yml', 'tools/ios-team.mjs']
  pull_request:
  workflow_dispatch:

jobs:
  carve-out:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Patterns match USAGE, not mentions — a comment warning against gate.js
      # must not fail the build, or the guard gets deleted out of annoyance.
      - name: The public section must never load the invite gate
        run: |
          if grep -rnE --exclude-dir=vendor '<script[^>]+src=["'"'"'][^"'"'"']*(gate|topnav)\.js|import[^;]+["'"'"'][^"'"'"']*(gate|topnav)\.js' epinoia/; then
            echo "::error::gate.js / topnav.js is LOADED under epinoia/ — the public section would be hidden from visitors."
            exit 1
          fi
          echo "ok — no gate references under epinoia/"

      # A share link is sent to a coach who has no invite code and never will.
      # The carve-out is the ABSENCE of gate.js — and an absence is exactly what
      # a well-meaning "make every page consistent" edit restores, turning every
      # link already sent into a locked door with nothing to announce it.
      - name: A share link must open for someone with no invite code
        run: |
          if grep -rnE --exclude-dir=vendor '<script[^>]+src=["'"'"'][^"'"'"']*(gate|topnav)\.js|import[^;]+["'"'"'][^"'"'"']*(gate|topnav)\.js' share/; then
            echo "::error::gate.js / topnav.js is LOADED under share/ — every share link would demand an invite code."
            exit 1
          fi
          # The other half of the same door: gamevis.html bounces visitors with
          # no prophesy_auth_v2 session back to index.html. Copied into the
          # share page it would lock out precisely the people shares exist for.
          if grep -rn 'prophesy_auth_v2' share/; then
            echo "::error::the sign-in redirect is present under share/ — recipients would be bounced to the login page."
            exit 1
          fi
          echo "ok — share pages carry no gate and no auth redirect"

      - name: No service-role key may ship to a browser
        run: |
          # an actual assignment, or a raw JWT literal — not prose about them
          # sb_publishable_* is meant to be public. sb_secret_* and service_role are not.
          # A real key appears inside a string literal. Prose that merely NAMES these
          # (this README does) must not fail the build — third time that bit me.
          if grep -rnE --exclude-dir=vendor --include='*.js' --include='*.html' --include='*.ts'              '(service_role|SERVICE_ROLE[A-Z_]*)\s*[:=]|["'"'"'`]sb_secret_|["'"'"']eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.' epinoia/; then
            echo "::error::a service-role key or raw JWT appears under epinoia/. Only the anon key belongs in client code."
            exit 1
          fi
          echo "ok — no privileged credentials in client code"
          # Stripe keys and webhook signing secrets belong in Edge Function secrets
          # (npx supabase secrets set), never in a file: not in a page, not in the
          # billing function, not in a test. A secret key moves money and a signing
          # secret mints memberships. Same rule as above — a QUOTED literal with at
          # least one character after the prefix, so prose naming sk_live_ and a
          # startsWith('sk_test_') mode check do not fail the build. Tests that
          # need a secret assemble a fake one from pieces. Every file type, and no
          # -I: a source file git thinks is binary must not hide a key.
          if grep -rnE --exclude-dir=vendor --exclude-dir=node_modules '["'"'"'`](sk|rk)_(live|test)_[A-Za-z0-9]|["'"'"'`]whsec_[A-Za-z0-9]' epinoia/ supabase/; then
            echo "::error::a Stripe secret key, restricted key or webhook signing secret appears under epinoia/ or supabase/. It belongs in an Edge Function secret."
            exit 1
          fi
          echo "ok — no Stripe secrets committed"

      - name: User text must never be interpolated as HTML
        run: |
          # innerHTML fed directly from a player/team name is the XSS the plan calls out.
          if grep -rnE --exclude-dir=vendor 'innerHTML\s*=\s*[^;]*\b(p\.name|player\.name|team\.name|\.display_name)\b' epinoia/; then
            echo "::error::user-supplied text interpolated into innerHTML without escaping."
            exit 1
          fi
          echo "ok — no unescaped user text in innerHTML"

      - name: Assets must be version-stamped
        # a browser that has decided a file is fresh will not ask again, so the
        # only reliable cache-bust is a URL it has never seen
        run: python tools/stamp-assets.py --check

      - name: No personal address may be committed
        # the contact recipient lives in an Edge Function secret; a personal
        # address in a public repo is a spam list entry with extra steps
        run: |
          if grep -rniE --exclude-dir=vendor '[a-z0-9._%+-]+@(gmail|googlemail|outlook|hotmail|yahoo|icloud)\.[a-z.]+' epinoia/ supabase/; then
            echo "::error::a personal email address appears in the repository."
            exit 1
          fi
          echo "ok — no personal addresses committed"

      - name: The service worker must not cache the public section
        run: |
          if [ -f sw.js ] && ! grep -q "startsWith('/epinoia/')" sw.js; then
            echo "::error::sw.js is missing the /epinoia/ bypass — live pages would be served stale."
            exit 1
          fi
          echo "ok — service worker bypasses /epinoia/"

  engine-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # 24, not 20: report.test.mjs and awards.test.mjs import the Edge Functions' .ts
        # files, which Node strips types from natively only from 22.6 (default from 23.6).
        # On 20 the report suite died on ERR_UNKNOWN_FILE_EXTENSION, hidden until 5913f27
        # let the job reach it. 24 is also what every suite is run with locally.
        with: { node-version: '24' }

      - name: The Edge Function and the browser must run the same engine
        run: |
          # supabase/functions/_shared/engine.js is epinoia/engine.js plus an ESM tail.
          # If they drift, the server and the public page can disagree about a score.
          # Since 9ef8dbe the copy opens with a one-line GENERATED banner from extract-shared.mjs;
          # comparing byte-for-byte from byte 0 failed on that banner alone, on every commit, and
          # because this step comes first no suite after it ran. The banner is skipped, nothing else.
          sed '1{/GENERATED from epinoia\/engine\.js/d}' supabase/functions/_shared/engine.js | head -c $(wc -c < epinoia/engine.js) > /tmp/shared_head.js
          if ! diff -q epinoia/engine.js /tmp/shared_head.js > /dev/null; then
            echo "::error::supabase/functions/_shared/engine.js has drifted from epinoia/engine.js."
            echo "Re-sync with:  cp epinoia/engine.js supabase/functions/_shared/engine.js && (re-append the ESM tail)"
            exit 1
          fi
          echo "ok — engines identical"

      - name: Engine smoke test
        run: node supabase/tests/engine.smoke.mjs

      # The uploader inserted `w` and `h` into a table whose columns are
      # `width` and `height`, so PostgREST refused every upload the platform
      # ever attempted and the media table stood at nought rows. The failure is
      # at the last step — the files reach storage fine — so nothing looked
      # broken until somebody read the error.
      - name: The uploader's columns must exist on public.media
        run: node supabase/tests/media-columns.test.mjs

      # Six files built /object/public/<path> with the bucket left out, so every
      # one of them asked for a URL that cannot exist and got NoSuchKey. It
      # survived because each call site falls back quietly to a monogram or a
      # drawing — nothing looked broken, there was simply never a photograph.
      - name: A public storage URL must name its bucket
        run: node supabase/tests/storage-urls.test.mjs

      # "Back to listing" reads the discarded-event count out of the refusal to
      # put it in the confirmation dialog. It was changed to read only the
      # exception's DETAIL field — correct, and it shipped before the migration
      # that populates DETAIL, which turned the button dead on the live site.
      # Both call sites must therefore also read the sentence, and must agree.
      - name: Both revert dialogs must read the event count the same way
        run: node supabase/tests/revert-count.test.mjs

      # The rail hides its role-gated rows with node.hidden = true, which the
      # browser honours through [hidden]{display:none} at specificity (0,1,0).
      # nav.css then styled the same rows at (0,2,1) with display:flex, so the
      # stylesheet outranked the attribute and every gated console — score a
      # game, club portal, league admin, admin controls, platform — was painted
      # for everybody, signed out included. Nothing was actionable through them
      # (RLS refuses every write behind them), but the rail was telling accounts
      # they held rights they did not hold.
      - name: A hidden nav row must actually be hidden
        run: node supabase/tests/nav-gating.test.mjs

      # The preview writes prose from season aggregates, so it can be
      # confidently wrong in a way a table cannot. edge() is signed so positive
      # always means the attacking side is ahead, whichever way the factor runs
      # — and the first draft read a negative edge as a defensive strength,
      # describing a defence that was generous on that factor as shutting the
      # matchup down. These hold the sign convention, the small-sample refusal
      # and the escaping of club names and venues.
      - name: The fixture preview must say true things
        run: node supabase/tests/preview.test.mjs

      # The match report is generated prose sitting directly above the box score
      # it describes, so a sentence disagreeing with the table under it is worse
      # than no sentence. Holds the claims — which side won what, whether a run
      # happened, whether a lineup swung it — plus the three faults found by
      # reading real output: lowercase names, per-100 rates quoted off
      # three-minute samples, and the same passage of play retold three times.
      - name: The match report must say true things
        run: node supabase/tests/report.test.mjs

      - name: Box score renders with nothing but S and derive()
        # catches a helper left behind by the extraction, which otherwise only
        # shows up as a blank public page
        run: node supabase/tests/boxscore.isolation.mjs

      - name: The live path publishes corrections, not just additions
        # undo, redo and a mid-log edit must reach the viewer AND the durable
        # log; a length-based high-water mark could see none of them
        run: node supabase/tests/live.test.mjs

      - name: Round-robin scheduling
        # a fixture list is the artefact everybody plans around: everybody
        # plays everybody once, nobody twice in a round, and the home/away
        # split is within one game for an even team count
        run: node supabase/tests/schedule.test.mjs

      - name: Box plus/minus
        # the port checks intermediate values, not just the final number — a
        # BPM that is right in aggregate but wrong per component cannot be
        # debugged later
        run: node supabase/tests/bpm.test.mjs

      - name: Shared modules match the browser copies
        # bpm.js and season.js run in BOTH the browser and the finalise Edge
        # Function, which is what stops the MVP award and the leaderboard from
        # naming different players. A drift here would let them.
        run: node supabase/tests/extract-shared.mjs --check

      - name: MVP by BPM
        # the appearance gate, the gate relaxing on a young season, and a
        # non-UUID player id being declined rather than failing a finalise
        run: node --experimental-strip-types supabase/tests/awards.test.mjs

      - name: Print files
        # these become physical objects. A sheet at the wrong DPI, a background
        # that prints as a white slab on a black shirt, or a design past the
        # trim line is a refund rather than a bug report.
        run: node supabase/tests/artwork.test.mjs

      - name: Print-on-demand requests
        # a wrong request creates a REAL product in a REAL shop, on sale. The
        # shapes are asserted rather than discovered: Printify's two-step
        # upload, pennies against pounds, and a 200 with no product id in it.
        run: node supabase/tests/merchstore.test.mjs

      - name: Partner feed payloads
        # these are the bytes RealGM and Eurobasket republish as fact. The
        # thing worth guarding is not that it works but that it stays right
        # QUIETLY wrong: a minor slipping into a feed, team totals drifting
        # from the lines above them, or a field map that renames a key in the
        # JSON but not in the CSV header.
        run: node supabase/tests/feeds.test.mjs

      - name: Membership payments
        # the billing function's pure half: the Stripe-Signature check over the
        # raw body, the exact Checkout / Portal / Connect request shapes on the
        # pinned API version, what a re-fetched subscription writes, which
        # deliveries send the one-off emails, and whose account may grant what.
        # A mistake here takes money without granting access, or grants access
        # nobody paid for — and neither shows up as an error.
        run: node supabase/tests/billing.test.mjs

      - name: Memberships in the browser
        # analytics fail OPEN and a members-only league fails closed only on a
        # known answer; the premium catalogue matches the real column keys
        run: node supabase/tests/access.test.mjs

      - name: Push notifications on a lock screen
        # the 2-hour reminder replaces the 2-day one (same tag), a reminder is
        # never pushed after tip-off (TTL and expiry), and the Topic header a
        # push service would reject is caught here rather than on a phone
        run: node supabase/tests/pushpayload.test.mjs

      - name: Push notifications on the phone
        # the service worker turns a payload into a notification and a tap into the
        # right page; push.js decides whether to offer notifications (never on iOS
        # outside the Home Screen app, never after "not now", never when blocked)
        run: node supabase/tests/push.test.mjs

      - name: Fixtures in a calendar
        # the feed every calendar app reads the same way (RFC 5545 folding in octets, UTC
        # stamps, stable UIDs and a stable DTSTAMP so the ETag holds), and a panel that puts
        # the route that works on this device first — an Android phone is never sent down the
        # Google route, which Samsung Calendar can never see
        run: node supabase/tests/ics.test.mjs

      - name: Notifications to the iPhone app, through Apple
        # the provider token Apple accepts (ES256, r||s, refreshed on the half hour), a
        # lineups alert replacing the reminder (collapse id = the web's topic), a dead token
        # dropped like a dead browser (410), and notify sending an apns: row through APNs
        run: node supabase/tests/apns.test.mjs

      - name: The website's side of the iPhone app
        # an iPhone never offered the Android download (the Android page swapped for the
        # iPhone page before paint), the app recognised as the app, no Google button and no
        # checkout inside it, the universal-links file, and the privacy notice
        run: node supabase/tests/ios-web.test.mjs

      - name: Notification buttons on a league's own website
        # the button asks for permission inside the tap and never takes the site's own
        # service worker scope; the window reports "following" only to the site that
        # opened it, and the button believes only Epinoia; the imported worker leaves
        # the site's requests alone; every function called exists
        run: node supabase/tests/notify-embed.test.mjs

      - name: Every page about a league wears its colours
        # fixtures, statistics, WOWY, news, a game and joining are painted by nav.js;
        # club and player profiles keep their club's colours; a league's own accent
        # wins; a page that changes league takes the last one's colours off
        run: node supabase/tests/league-theme-pages.test.mjs

      - name: One shape for a player's name, whatever the feed calls them
        # names.py: "DONCIC, LUKA", "Hernangomez, Willy", kanji with a romaji field beside it,
        # Czech and Polish diacritics, Cyrillic, Mc/Mac/O'/hyphens/particles, and the full stops
        # that drop an action in the stint engine — all to "Luka Doncic", with every form the
        # normaliser folded away kept as an alias
        run: python scripts/ingest/names_test.py

      - name: A side not known yet is never a club
        # "To be determined", "TBC", "Winner of QF1": the ingest, the console and the
        # database (0126) share one rule, tested against the same names
        run: |
          python scripts/ingest/placeholders_test.py
          node supabase/tests/placeholders.test.mjs

      - name: The console's fixture list
        # overlapping loads draw once, an empty competition still gets its import and
        # generator panels, cup opponents are named, 200+ games fold away and open
        # thirty at a time
        run: node supabase/tests/admin-fixtures.test.mjs

      - name: Official-vote CSV parsing and name folding
        # the two places a pasted spreadsheet breaks a naive parser: a club
        # with a comma in its name, and a surname carrying accents in one
        # system and not in another
        run: node supabase/tests/csvvotes.test.mjs

      - name: Roster CSV parsing
        # the one path where a manager hands us a whole squad at once, so a
        # quiet misparse is twenty wrong rows rather than one
        run: node supabase/tests/csv.test.mjs

      - name: An embed wears the page it is on
        # embed.js reads a club site's light/dark, background and brand colour and keeps the embed
        # in step; Epinoia's pages send their league or club colours; embed/theme.js applies only
        # what its own parent sends, readable on either ground; the strip names its league
        run: node supabase/tests/embed-colourway.test.mjs

      - name: An approved image reaches the public bucket
        # every approval moves its file out of media-pending; storage refused every move until
        # 0123 ("new row violates row-level security policy"), so the consoles copy the bytes
        # when a move is refused, and 0123 adds the update policy the move needed
        run: node supabase/tests/media-publish.test.mjs

      - name: A league's logo and the colours it gives the league
        # 0122 makes a published logo the league's and keeps colours read from it honest (a new
        # logo resets them, a hand-picked choice is never overwritten); the league's pages and
        # the rail paint only vouched-for colours; the worker and the browser agree on a
        # second colour; and a database without 0122 still shows every league page
        run: node supabase/tests/league-colours.test.mjs

      - name: A fed league's season, clubs and players
        # which Genius phases are this season (SLB names them '26-27'), the whole season's fixtures
        # not the current round, club codes from the preview page, and clubs and players that share
        # a name or feed code across leagues (London Lions men and women) never merging
        run: node supabase/tests/clubs.test.mjs

      - name: LiveStats conversion
        # an imported game must be indistinguishable downstream from a scored
        # one, so this checks the ENGINE's box score, not just the event shapes
        run: node supabase/tests/livestats.test.mjs

      - name: The simulator cannot reach a real game
        # `simulate a full game` empties the log, which on a real fixture makes the
        # next publish retract every row already written — and the button sat two
        # along from `end game` behind one confirm.
        run: node supabase/tests/scorer-simulate.test.mjs

      - name: A fed game lands where it happened
        # the LiveStats chain has four links in three languages — the poll stamp,
        # the tip anchor, the position arithmetic and the clip window — and nothing
        # checked that they compose. Asserts the property the design rests on (the
        # tip cancels) and that a clip still contains the shot at either cadence.
        run: node supabase/tests/videosync.test.mjs

      - name: Two games that mapped to the wrong footage
        # held as fixtures because the ways they broke are not ways anybody would
        # think to invent: 106394dc read 6% of its broadcast and listed no first
        # half at all, and 52bfe03b put 256 plays at 6:03:11 of a video one hour
        # fifty-five long because 668 rows shared one insert instant. Runs the
        # real rows through video.js and the real gates through ai_worker.py.
        run: node supabase/tests/video-mapping.test.mjs

      - name: A live event survives the trip to the layer
        # broadcast.js re-applied its database-row flattener to events that had
        # already been flattened, so on air a substitution lost who went on and
        # off (six names on a five-man card) and every offensive rebound was
        # counted defensive. The scorebug was fine, which is why it was missed.
        run: node supabase/tests/broadcast-liveevents.test.mjs

      - name: Who is driving the clock
        # a keeper and a camera both publish continuously, and whichever frame
        # landed last used to win -- so the on-air clock alternated between them
        # several times a minute. Runs the real subscriber over the real local
        # transport, so it exercises adoptState rather than a copy of its rule.
        run: node supabase/tests/clockauthority.test.mjs

      - name: The scorer keeps itself on the phone
        # the push worker registers at scope /epinoia/, which covers the scorer,
        # and answers a failed request with "Nothing is stored on this phone" --
        # false, and shown to a statistician at the exact moment the hall's wifi
        # drops and they reload out of habit.
        run: node supabase/tests/durability.test.mjs

      - name: One hung request does not take the game with it
        # a hall's access point fails by accepting the connection and then going
        # silent, and nothing limited a fetch -- so the publisher's chain stopped
        # for the browser's own timeout, minutes, with the badge still saying
        # live. Runs the shipped wrapper against a server that never answers.
        run: node supabase/tests/fetch-deadline.test.mjs

      - name: A correction does not delete the game it was correcting
        # the durable write fired the upsert and the delete together and let the
        # server order them -- and the upsert ignores duplicates, so arriving
        # first made it a no-op for every row the delete then removed. Correcting
        # one action mid-game deleted every row after it and wrote none back.
        run: node supabase/tests/retraction-order.test.mjs

      - name: A correction belongs where it happened, not where it was typed
        # the log travels by sequence number, so a play added back into the first
        # quarter replayed after the final buzzer everywhere except the device it
        # was typed on -- clamping a stint to zero, zeroing the plus-minus of both
        # players in a missed substitution, and moving an opponent basket to five
        # who were not on the floor for it.
        run: node supabase/tests/engine-order.test.mjs

      - name: The exit that says "no free throws"
        # the foul window's legend named the delete as the way out of it, so the
        # commonest foul in a game was routinely erased by a scorer who meant
        # "no free throws". Nothing said so: the badge just dropped back, and by
        # the fourth a player with five fouls was still on the floor.
        run: node supabase/tests/scorer-foul.test.mjs

      - name: A second device takes over the game it is given
        # loadRecorded pulled the log but not the five that started, so a device
        # taking over replayed real substitutions against the five its own picker
        # had defaulted to -- and every plus-minus, stint and lineup row in the
        # game was then computed against a lineup that never took the floor.
        run: node supabase/tests/takeover.test.mjs

      - name: Clock cam decoder, on rendered scoreboards
        # renders seven-segment boards through what a sports hall does to a
        # picture -- dim, flickering, banded, blurred, angled, dot-matrix, and
        # the colon that blinks off -- and holds the decoder to a read rate and,
        # far more importantly, a ceiling on readings that are WRONG.
        run: node supabase/tests/clockcam.decode.test.mjs

      - name: Clock cam, what reaches the broadcast
        # a misread that drops the clock used to go straight to air. This runs a
        # quarter of deliberately bad frames through the physics and asserts that
        # nothing wrong is ever published, while real jumps -- a new period, the
        # table correcting itself -- still land.
        run: node supabase/tests/clockcam.clock.test.mjs

      - name: LiveStats round trip on real games
        # takes real scored games, re-expresses them in FIBA's vocabulary,
        # imports them back and compares every player's line.
        # Skips cleanly when the project is unreachable.
        run: node supabase/tests/livestats.roundtrip.mjs

      - name: A corrected feed does not empty the game, or un-time it
        # the rewrite was delete-everything-then-insert-everything with no
        # transaction: caught twice in five minutes on live fixtures reading ZERO
        # events mid-game while the score row still showed 2-16. And the stamp
        # carry keyed on pid, a platform id that moves as substitutes appear, so
        # three of four live games ended with their whole log un-timed.
        run: node supabase/tests/ingest-replace.test.mjs

      - name: A play is timed by the version of the feed it first appeared in
        # docs/feed-timing.md steps 1-4: the stamp is the CDN copy's Last-Modified rather than
        # our receive time (the copy we get is a median 13 s old), pulled back by the game clock
        # within its version, and its window reaches back to the upload that did not hold it,
        # with 10 s for the feed's own lag. Replays four live games out of the recorded probe,
        # so the numbers in the names are measurements, not hopes.
        run: node supabase/tests/feedstamp.test.mjs

      - name: JSON API
        # exercises the deployed function over HTTP with a real key.
        # Skips cleanly when EPINOIA_API_KEY is not set, so a fork without
        # one still gets a green build.
        run: node supabase/tests/api.test.mjs
        env:
          EPINOIA_API_KEY: ${{ secrets.EPINOIA_API_KEY }}

      - name: RLS policy tests
        # skips cleanly until the migration is applied; then it asserts the refusals
        run: node supabase/tests/rls.test.mjs

      - name: Privilege tests (signed in, no roles)
        # Covers the attacker anon cannot model: someone with an account.
        # Never signs up — a signup sends email from the same allowance the
        # magic-link logins use. Skips cleanly until the probe account exists.
        run: node supabase/tests/authed.test.mjs

      - name: Game flow and connections agree with the box score
        # GAMEVIS's two tabs replay the log themselves; on a real LiveStats game their
        # possessions, assists and points assisted must be the engine's to the unit
        run: node supabase/tests/gameflow.test.mjs

      - name: The events tab's situations are the box score's
        # second-chance, off-turnover and fast-break points by the engine's own windows,
        # on a hand-worked log and three real LiveStats games
        run: node supabase/tests/events.test.mjs

      - name: A game's numbers are shaded by their percentile against real games
        # epinoia/gamepct.js + the preset tools/build-gamepct.mjs built: every coloured stat
        # has a scale, the reading rules hold, and full stats and events shade on a real game
        run: node supabase/tests/gamepct.test.mjs

      - name: HOME, the app mode and the global fixtures, stars and leagues
        # appmode.js (the installed app never paints the water splash; links outside /epinoia/
        # leave the app), every wordmark and the sidebar lead to HOME, the global games merge
        # and daily pick, the stars refactor held identical to the league page's saved output,
        # country grouping, and the app shell's banner / app card / update notice decisions
        run: |
          node supabase/tests/appmode.test.mjs
          node supabase/tests/home-links.test.mjs
          node supabase/tests/globalgames.test.mjs
          node supabase/tests/stars.test.mjs
