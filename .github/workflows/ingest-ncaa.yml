name: NCAA live lane (sharded)

# NCAA DIVISION II AND III PUT SEVERAL HUNDRED GAMES ON THE FLOOR AT ONCE (docs/ncaa-readiness.md).
# The league ingest's live lane (ingest.yml) reads and writes one game at a time - at most ~56 versions a
# minute, measured on 30 Sep 2026 - so the NCAA sources ("live_lane": "ncaa" on their rows in
# config/ingest-sources.json) are polled here instead, split by game across SHARDS runners:
# run_ingest.py --live-only --lane ncaa --shard i/SHARDS. Each shard owns the games whose
# crc32(external id) % SHARDS is i-1, so no two runners ever write the same game. The default lane
# ignores every source that names a lane, so nothing is polled twice.
#
# ON FROM 14 OCT 2026 for NCAA Division II, men and women (NCAA_D2M / NCAA_D2W). The schedule only fires
# November to March, so the lane wakes for the season by itself. D2 is followed live ON DEMAND (0264): one
# scoreboard read per division and day covers every unwatched game, a game is read in full only while somebody
# watches it and at its final whistle - so one runner is enough (repository variable NCAA_SHARDS = 1). Raise it
# if a Saturday's finals queue up. Public repo: Actions minutes are free (docs/ncaa-readiness.md).
on:
  schedule:
    - cron: "*/10 15-23,0-5 * 11,12,1,2,3 *"   # US afternoons and evenings, Nov-Mar (UTC)
    - cron: "7 * * 11,12,1,2,3 *"              # the hourly floor, as ingest.yml has
    # DISCOVERY, DAILY, OCTOBER TO MARCH (13:20 UTC, before any US tip-off). ingest.yml discovers every league
    # twice a week, and GitHub drops scheduled runs: a season published on a Tuesday, or a Thursday run that
    # never fired, would leave the first games unlisted - and the live lane only follows games already listed.
    # This reads the two NCAA sources' scoreboards around today (3 days back, 14 ahead: ~36 requests), so the
    # season is listed the day ncaa.com publishes it, and a moved tip-off or an added game is caught within a day.
    # The first fixtures written create the leagues, their conferences and clubs. Division II has never opened
    # before 1 November (Fri 1 Nov 2024, Sat 1 Nov 2025; later in 2023) - adapters/ncaa.py SEASON_START - so
    # October's runs read nothing until 1 November is within the 14 days ahead (from the 18th).
    - cron: "20 13 * 10,11,12,1,2,3 *"
  workflow_dispatch:
    inputs:
      shards:
        description: "How many runners split the games (1-8)"
        required: false
        default: "1"
      dry_run:
        description: "Fetch, write nothing"
        type: boolean
        default: false
      discover:
        description: "Run the NCAA discovery pass (fixtures) instead of the live lane"
        type: boolean
        default: false

# discovery has a group of its own: in the live lane's, it would wait behind a pass of up to 5.5 h
concurrency:
  group: ${{ (github.event.schedule == '20 13 * 10,11,12,1,2,3 *' || github.event.inputs.discover == 'true') && 'ncaa-discovery' || 'ncaa-live-lane' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write        # a pass may dispatch the next one

jobs:
  discover:
    if: ${{ github.event.schedule == '20 13 * 10,11,12,1,2,3 *' || github.event.inputs.discover == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scripts/requirements.txt
      # the scoreboard query's hash is the scraper pipeline's (validation/ncaa/ncaa_adapter.py SHAS)
      - name: Checkout scraper pipeline
        if: ${{ vars.SCRAPER_REPO != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SCRAPER_REPO }}
          ssh-key: ${{ secrets.SCRAPER_DEPLOY_KEY }}
          path: scraper
      - name: Discover NCAA fixtures
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SCRAPER_DIR: ${{ github.workspace }}/scraper
          PYTHONPATH: ${{ github.workspace }}/scraper
        run: |
          codes=$(python3 -c "import json; d=json.load(open('config/ingest-sources.json')); rows=d if isinstance(d,list) else d.get('sources',[]); print(','.join(r['code'] for r in rows if r.get('adapter')=='ncaa' and r.get('enabled',True)))")
          echo "NCAA sources: $codes"
          python scripts/ingest/run_ingest.py --config --source "$codes" --feed-out "" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

  plan:
    if: ${{ github.event.schedule != '20 13 * 10,11,12,1,2,3 *' && github.event.inputs.discover != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      list: ${{ steps.p.outputs.list }}
    steps:
      - id: p
        run: |
          n="${{ github.event.inputs.shards || vars.NCAA_SHARDS || '1' }}"
          case "$n" in ''|*[!0-9]*) n=1;; esac
          [ "$n" -lt 1 ] && n=1; [ "$n" -gt 8 ] && n=8
          echo "shards=$n" >> "$GITHUB_OUTPUT"
          echo "list=$(python3 -c "import json,sys;print(json.dumps(list(range(1,int(sys.argv[1])+1))))" "$n")" >> "$GITHUB_OUTPUT"

  live:
    needs: plan
    runs-on: ${{ vars.RUNS_ON && fromJSON(vars.RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.list) }}
    outputs:
      chain: ${{ steps.run.outputs.chain }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scripts/requirements.txt
      # the NCAA parse is the scraper pipeline's (validation/ncaa/ncaa_adapter.py): private repo, deploy key
      - name: Checkout scraper pipeline
        if: ${{ vars.SCRAPER_REPO != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SCRAPER_REPO }}
          ssh-key: ${{ secrets.SCRAPER_DEPLOY_KEY }}
          path: scraper
      - name: Run the lane (shard ${{ matrix.shard }} of ${{ needs.plan.outputs.shards }})
        id: run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SCRAPER_DIR: ${{ github.workspace }}/scraper
          PYTHONPATH: ${{ github.workspace }}/scraper
        run: |
          python scripts/ingest/run_ingest.py --config --live-only --lane ncaa \
            --shard "${{ matrix.shard }}/${{ needs.plan.outputs.shards }}" \
            --live-loop 19800 --live-every 10 --feed-out "" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

  # The next pass, once: a matrix job's output is whichever shard finished last, which is enough - the
  # shards share one schedule, so any of them still holding a live or imminent game says chain=true.
  next:
    needs: [plan, live]
    if: ${{ always() && needs.live.outputs.chain == 'true' && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ingest-ncaa.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f shards="${{ needs.plan.outputs.shards }}" || echo "dispatch failed (a pass is probably already queued)"
