<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04100b">
<!-- PUBLIC. No gate.js, no topnav.js. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co">
<title>Season stats · Epinoia</title>
<link rel="icon" type="image/png" sizes="32x32" href="../brand/epinoia-mark-32.png">
<link rel="apple-touch-icon" href="../brand/epinoia-mark-180.png">
<link rel="stylesheet" href="../kit/epinoia-kit.css?v=151">
<link rel="stylesheet" href="../kit/table.css?v=151">
<link rel="stylesheet" href="../kit/nav.css?v=151">
<style>
  .empty{padding:calc(var(--u)*5) calc(var(--u)*3);text-align:center;color:var(--ink-3);font-family:var(--f-micro);font-size:11px}
  a.plain{color:inherit;text-decoration:none} a.plain:hover{color:var(--lume)}
  .ctl{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:calc(var(--u)*2) calc(var(--u)*3);
    border-bottom:1px solid var(--rule)}
  table.ep-tbl th{cursor:pointer;user-select:none}
  table.ep-tbl th.sorted{color:var(--lume)}
  .ep-hdr{display:flex;align-items:baseline;gap:12px}
  .subpage{margin-left:auto;padding-right:calc(var(--u)*3);font-family:var(--f-micro);
    font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--lume);
    text-decoration:none;white-space:nowrap}
  .subpage:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="ep-frame">
  <div style="display:flex;align-items:center;gap:12px;padding:calc(var(--u)*2) calc(var(--u)*3);border-bottom:1px solid var(--rule)">
    <a href="../" class="plain"><span style="font-family:var(--f-score);font-size:13px;background:linear-gradient(100deg,var(--lume),var(--aqua));color:#04100b;padding:3px 11px 1px;text-transform:uppercase" class="epinoia-mark" aria-label="Epinoia">EPINOIΛ</span></a>
    <span id="ctx" class="ep-micro"></span>
  </div>
  <div class="ep-hdr"><span class="idx">01</span><h2 id="title">Season statistics</h2>
    <a href="wowy/" class="subpage">WOWY &amp; lineups →</a></div>
  <!-- search, min-games, stat-group pills, column toggles and CSV all come
       from the shared table component, so they behave identically here and on
       the leaders board. -->
  <div id="tbl"></div>
  <footer style="padding:calc(var(--u)*3);font-family:var(--f-micro);font-size:9px;color:var(--ink-3)">Epinoia Network</footer>
</div>
<script src="../config.js?v=151" defer></script>
<script src="../bpm.js?v=151" defer></script>
<script src="../season.js?v=151" defer></script>
<script src="../data.js?v=151" defer></script>
<script src="../fulltable.js?v=151" defer></script>
<script src="stats.js?v=151" defer></script>
<script src="../nav.js?v=151" defer></script>
<script src="../xscroll.js?v=151" defer></script>
</body>
</html>
