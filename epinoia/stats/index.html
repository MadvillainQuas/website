<style>
  .empty{padding:calc(var(--u)*5) calc(var(--u)*3);text-align:center;color:var(--ink-3);font-family:var(--f-micro);font-size:11px}
  a.plain{color:inherit;text-decoration:none} a.plain:hover{color:var(--lume)}
  .ctl{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:calc(var(--u)*2) calc(var(--u)*3);
    border-bottom:1px solid var(--rule)}
  table.ep-tbl th{cursor:pointer;user-select:none}
  table.ep-tbl th.sorted{color:var(--lume)}
  .ep-hdr{display:flex;align-items:baseline;gap:12px}
  .subpage{margin-left:auto;padding-right:calc(var(--u)*3);font-family:var(--f-micro);
    font-size:9.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--lume);
    text-decoration:none;white-space:nowrap}
  .subpage:hover{text-decoration:underline}
  /* IN THE LEAGUE'S OWN COLOURS (nav.js paints body.league-themed on every page about one
     league): this page's heading takes the wash and the trim a league's other pages give theirs */
  body.league-themed .ep-frame > .ep-hdr{position:relative;padding-bottom:calc(var(--u)*1.5);
    background:linear-gradient(120deg, color-mix(in srgb,var(--league-a) 26%,var(--ground)) 0%,
                                       color-mix(in srgb,var(--league-a) 8%,var(--ground)) 55%, transparent 100%)}
  body.league-themed .ep-frame > .ep-hdr::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;pointer-events:none;
    background:linear-gradient(90deg,var(--league-a) 0 72%,var(--league-b) 72% 88%,var(--league-a) 88%)}
  body.league-themed #title{color:var(--league-a-ink)}
  /* the season chips are links, so a season can be copied or opened in a new tab;
     a chip does not want the underline a link carries by default */
  #seasonRow{gap:12px}
  #seasonPick{display:flex;gap:7px;flex-wrap:wrap}
  #seasonPick .ep-chip{text-decoration:none}
  /* WHAT THE TABLE COVERS (scopebar.js): the season's competitions, and a league's conferences,
     as buttons above the table; nothing at all when there is nothing to choose */
  #tbl > .scopehost{padding:calc(var(--u)*2) calc(var(--u)*3) 0;border-bottom:1px solid var(--rule)}
  #tbl > .scopehost:empty{display:none}
  #ctx{min-width:0}

  /* ON A PHONE (820px and below, where the tab bar is). THE HEADER WRAPS. Its two links
     never did: nowrap, pushed right by margin-left:auto, beside a 26px title, so on a
     360px phone "WOWY & lineups" ended at x=504 and laid the whole page out 504px wide,
     the tab bar's menu button with it, off the screen. The title takes the first row and
     the links share the next, each a 40px target. */
  @media (max-width:820px){
    .ep-frame > .ep-hdr{flex-wrap:wrap;row-gap:2px;align-items:center}
    .ep-frame > .ep-hdr h2{flex:1 1 calc(100% - 40px);min-width:0;font-size:22px;line-height:1.05;overflow-wrap:anywhere}
    .ep-frame > .ep-hdr .subpage{margin-left:0;padding:0 14px 0 0;min-height:40px;
      display:inline-flex;align-items:center;font-size:10px}
    /* the covering and conference buttons get the page's side gutter; they sat flush against the frame */
    #tbl > .scopehost{padding:10px 12px 0}
    #tbl > .scopehost .scopelab{font-size:10px;flex:none}
    /* A SAFETY NET, NOT THE FIX: whatever grows too wide later is clipped at the frame
       rather than widening the page. clip, not hidden -- it makes no scroll container,
       so the table's sticky header still sticks to the page. */
    .ep-frame{overflow-x:clip;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
    /* THE BELL MOVES ABOVE THE TAB BAR: top right it covered the league name and, once the
       page scrolls, the right end of the table's sticky header. Its panel opens upward. */
    body.has-nav .ep-bell{top:auto;bottom:calc(58px + env(safe-area-inset-bottom,0px) + 10px)}
    body.has-nav .ep-bell .panel{top:auto;bottom:48px;max-height:min(60vh,520px)}
  }
  /* INSTALLED, the status bar is drawn over the page (black-translucent), so the page starts below it */
  @media (display-mode:standalone){
    body{padding-top:env(safe-area-inset-top,0px)}
  }
</style>

<body>
<div class="ep-frame">
  <div style="display:flex;align-items:center;gap:12px;padding:calc(var(--u)*2) calc(var(--u)*3);border-bottom:1px solid var(--rule)">
    <a href="../home/" class="plain"><span class="wm epinoia-mark" aria-label="Epinoia">EPINOIΛ</span></a>
    <span id="ctx" class="ep-micro"></span>
  </div>
  <div class="ep-hdr"><span class="idx">01</span><h2 id="title">Season statistics</h2>
    <!-- team stats live on the league page's Team Stats tab; stats.js points this at the
         league being viewed once the context is known -->
    <a href="../l/#teams" class="subpage" id="teamsLink">Team stats →</a>
    <a href="wowy/" class="subpage">WOWY &amp; lineups →</a></div>
  <!-- WHICH SEASON (stats.js, drawn by seasonbar.js). Above the table's own
       "covering" filter because a season is which numbers these are, while a
       phase is which part of them. Hidden until the league has more than one
       season with games in it. -->
  <div class="ctl" id="seasonRow" style="display:none">
    <span class="scopelab">season</span><span id="seasonPick"></span>
  </div>
  <!-- THE SAME SEASON AS A TABLE OR AS CHARTS (stats.js): the chart lab (chartlab.js) draws scatter graphs of any two
       of the table's columns, players or teams, under the same season and "covering" choices. #charts in the address. -->
  <div class="ctl" id="viewRow">
    <span class="scopelab">view</span>
    <div class="ep-tabs" role="tablist" aria-label="Season statistics as a table or as charts">
      <button type="button" class="ep-tab on" data-v="table" role="tab" aria-selected="true">Table</button>
      <button type="button" class="ep-tab" data-v="charts" role="tab" aria-selected="false">Charts</button>
    </div>
  </div>
  <!-- search, min-games, stat-group pills, column toggles and CSV all come
       from the shared table component, so they behave identically here and on
       the leaders board. -->
  <div id="tbl"></div>
  <footer style="padding:calc(var(--u)*3);font-family:var(--f-micro);font-size:9px;color:var(--ink-3)">Epinoia Network</footer>
</div>
