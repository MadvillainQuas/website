<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04170f">
<!-- PUBLIC. No gate.js, no topnav.js. -->
<!-- THE VIDEO TAB EMBEDS A PLAYER, AND THAT COSTS FRAME-SRC ENTRIES.

     Named hosts only, and only the four platforms epinoia/video.js can
     actually parse a link for. A wildcard here would let anything the page
     ever rendered a URL into become an iframe, which is precisely the hole
     this header exists to close.

     'self' MUST STAY IN THE LIST. frame-src does not fall back to default-src
     once it is declared, so naming the platforms without it would silently
     forbid the page from framing anything of ours. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' data: https://*.supabase.co wss://*.supabase.co https://www.googleapis.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.twitch.tv https://player.vimeo.com https://www.facebook.com https://www.google.com">
<title>Box score · Epinoia</title>

<link rel="icon" type="image/png" sizes="32x32" href="../brand/epinoia-mark-32.png">
<link rel="apple-touch-icon" href="../brand/epinoia-mark-180.png">
<!-- The scorer's own stylesheet, generated from it. The renderers below emit
     the scorer's class names, so this is what makes the public box score look
     like the statistician's screen rather than merely contain the same numbers. -->
<link rel="stylesheet" href="../boxscore.css?v=242">
<link rel="stylesheet" href="report.css?v=239">
<link rel="stylesheet" href="preview.css?v=239">
<link rel="stylesheet" href="../video.css?v=243">
<link rel="stylesheet" href="../kit/nav.css?v=239">
<style>
  /* The way in for whoever is scoring tonight. Hidden by default and revealed
     only once the database has said this account may score THIS game, so a
     visitor is never shown a door that would be shut in their face. */
  .scorecta{font-family:var(--f-micro,inherit);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;text-decoration:none;padding:7px 13px;border-radius:999px;
    background:linear-gradient(100deg,var(--lume),var(--aqua));color:#04100b;
    font-weight:700;margin-left:auto;white-space:nowrap}
  .scorecta:hover{filter:brightness(1.08)}
  .scorecta.hide{display:none}
  /* THE SPLIT BUTTON. "Score this game" is what almost everybody wants and it
     stays one click away — the caret is for the person who is also running a
     stream, which is a minority of a minority and must not cost the majority a
     second decision. */
  .ctawrap{display:inline-flex;align-items:stretch;position:relative}
  .ctawrap.hide{display:none}
  .ctamore{font-family:var(--f-micro,inherit);font-size:11px;line-height:1;
    padding:0 9px;cursor:pointer;color:#04100b;
    background:var(--lume);border:0;border-left:1px solid rgba(0,0,0,.22)}
  .ctamore:hover{filter:brightness(1.08)}
  .ctamenu{position:absolute;top:calc(100% + 5px);right:0;z-index:40;min-width:250px;
    background:var(--panel,#0a1512);border:1px solid var(--rule-2,rgba(147,242,191,.44));
    box-shadow:0 10px 30px rgba(0,0,0,.5);padding:5px;display:flex;flex-direction:column}
  .ctamenu.hide{display:none}
  .ctamenu a{display:block;padding:9px 11px;text-decoration:none;color:var(--ink,#e6fff1);
    font-family:var(--f-micro,inherit);font-size:10px;letter-spacing:.06em;line-height:1.75}
  .ctamenu a:hover{background:rgba(147,242,191,.12)}
  .ctamenu a small{display:block;color:var(--ink-3,rgba(230,255,241,.5));font-size:9px;
    letter-spacing:.02em;margin-top:2px}
  /* Quieter than the scoring button beside it, and deliberately so: one of
     these is what somebody came here to do, and the other is the undo for a
     mistake. An outline rather than the gradient, and it only warms up on
     hover — a destructive action should not be the brightest thing on a page
     somebody is reading a live score on. */
  .revertcta{font-family:var(--f-micro,inherit);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;padding:6px 12px;border-radius:999px;cursor:pointer;
    background:transparent;color:var(--ink-3,#8aa);border:1px solid var(--rule-2,#345);
    white-space:nowrap;margin-left:8px}
  .revertcta:hover{color:var(--flare,#ff5f6b);border-color:var(--flare,#ff5f6b)}
  .revertcta:disabled{opacity:.5;cursor:default}
  .revertcta.hide{display:none}
  a.revertcta{text-decoration:none;display:inline-block;line-height:1.2}
  /* the scoring button claims the spare room; this one sits next to it */
  #scoreCta + .revertcta{margin-left:8px}
  /* The attach-video sheet. Deliberately plain: it is three fields used twice a
     season by one person, not a screen anybody lives in. */
  .vsheet{position:fixed;inset:0;z-index:1200;display:flex;align-items:center;
    justify-content:center;padding:24px;background:rgba(2,16,11,.94)}
  .vsheet .box{width:min(460px,100%);border:1px solid var(--rule,rgba(147,242,191,.2));
    border-radius:16px;background:var(--panel,#0a1a13);padding:20px;
    display:flex;flex-direction:column;gap:12px}
  .vsheet h3{margin:0;font-size:16px;font-weight:500}
  .vsheet p{margin:0;font-size:12.5px;line-height:1.8;color:var(--ink-3,rgba(230,255,241,.55))}
  .vsheet input{width:100%;padding:9px 11px;border-radius:9px;
    border:1px solid var(--rule,rgba(147,242,191,.2));background:rgba(0,0,0,.28);
    color:var(--ink,#e6fff1);font-size:13px}
  .vsheet .tip{display:flex;gap:8px;align-items:center}
  .vsheet .tip input{width:74px;text-align:center}
  .vsheet .row{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}
  .vsheet button{padding:9px 15px;border-radius:10px;font-size:13px;
    border:1px solid var(--rule,rgba(147,242,191,.2));background:transparent;
    color:var(--ink,#e6fff1);cursor:pointer}
  .vsheet button.go{background:var(--lume,#93f2bf);border-color:var(--lume,#93f2bf);color:#04100b}
  .vsheet .msg{font-size:12.5px;line-height:1.75;color:var(--amber,#ffd166);min-height:1px}
  /* the automatic anchors: three quiet rows under the typed number */
  .vsheet .vsauto{display:flex;flex-direction:column;gap:7px;padding:10px 0 2px;border-top:1px solid var(--rule,rgba(147,242,191,.14))}
  .vsheet .vsrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .vsheet .vsrow button{padding:6px 11px;font-size:12px}
  .vsheet .vsnote{font-size:11.5px;line-height:1.5;color:var(--ink-3,rgba(230,255,241,.55));flex:1;min-width:160px}
  .vsheet .vsfile{display:inline-flex;gap:8px;align-items:center;font-size:12px;cursor:pointer}
  .vsheet .vsfile input{width:auto;padding:0;font-size:11.5px}
  .vsheet .vsrow.hide{display:none}
  /* Page chrome only — nothing here restyles the box score itself. */
  body{margin:0;background:var(--bg-base,#060c09);color:var(--text-primary,#e6fff1)}
  .wrap{max-width:1150px;margin:0 auto;padding:0 12px 60px}
  .top{display:flex;align-items:center;gap:12px;padding:12px 2px;flex-wrap:wrap}
  .wm{font-family:var(--f-score);font-size:19px;background:linear-gradient(100deg,#93f2bf,#8ff5ff);
    color:#04100b;padding:3px 11px 1px;text-transform:uppercase;text-decoration:none}
  .ctx{font-family:var(--f-micro);font-size:9px;color:var(--text-muted);letter-spacing:.1em;
    text-transform:uppercase}
  .status{margin-left:auto;display:flex;align-items:center;gap:7px;font-family:var(--f-micro);
    font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-secondary)}
  .status i{width:7px;height:7px;border-radius:50%;background:#5d7f70;display:block}
  .status.live i{background:#ff5f6b;animation:pl 1.6s ease-in-out infinite}
  .status.delayed i{background:#ffd166}
  .status.final i{background:#93f2bf}
  .status.offline i{background:#5d7f70}
  @keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.status.live i{animation:none}}
  .msg{padding:40px 14px;text-align:center;font-family:var(--f-micro);font-size:11px;
    color:var(--text-muted);line-height:2}
  .foot{padding:24px 2px;font-family:var(--f-micro);font-size:9px;color:var(--text-muted);
    display:flex;gap:14px;flex-wrap:wrap}
  .foot a{color:var(--text-muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="../" class="wm epinoia-mark" aria-label="Epinoia">EPINOIΛ</a>
    <span class="ctx" id="ctx"></span>
    <span class="ctawrap hide" id="ctaWrap">
      <a class="scorecta" id="scoreCta" href="#">score this game →</a>
      <button class="ctamore" id="ctaMore" aria-haspopup="true" aria-expanded="false"
              title="more ways to open this fixture">▾</button>
      <span class="ctamenu hide" id="ctaMenu" role="menu"></span>
    </span>
    <button class="revertcta hide" id="revertCta" type="button">back to listing</button>
    <!-- The route to a recording for a game that is already over. The scorer
         will not open a finished fixture — correctly, its log is closed — so
         the only place left that knows which game you are looking at is this
         page. Shown only to somebody the database says may attach one. -->
    <button class="revertcta hide" id="vidCta" type="button">attach video</button>
    <!-- Where a fed game's numbers come from: the FIBA LiveStats page the ingest
         worker reads. Shown to the same people who may attach video (platform /
         league admins, the game's statistician), so a score that looks behind can
         be checked against the source in one click. -->
    <a class="revertcta hide" id="lsCta" href="#" target="_blank" rel="noopener">FIBA LiveStats ↗</a>
    <span class="status offline" id="status"><i></i><span id="statusText">connecting</span></span>
  </div>

  <div id="view"><div class="msg">Loading the game…</div></div>

  <div class="foot">
    <a href="../">← all games</a>
    <span id="foot"></span>
  </div>
</div>

<!-- the preview a SCHEDULED fixture shows instead of an empty box score.
     data.js/season.js are what the statistics pages aggregate with, so the
     preview cannot disagree with them about what a rebound is. -->
<script src="../season.js?v=239" defer></script>
<script src="../bpm.js?v=239" defer></script>
<script src="../data.js?v=239" defer></script>
<!-- the match report: facts, then prose, then the page. Split on purpose —
     story.js decides what is TRUE and is testable, report.js decides how it
     READS, and a language model would slot in at that seam. -->
<script src="story.js?v=239" defer></script>
<script src="report.js?v=239" defer></script>
<script src="reportview.js?v=239" defer></script>
<script src="gamefacts.js?v=239" defer></script>
<script src="preview.js?v=239" defer></script>
<script src="../video.js?v=239" defer></script>
<!-- finding the tip-off in the footage itself: stream start, file clock, or the
     scoreboard in the picture (OCR, vendored — the CSP allows no CDN script) -->
<script src="../videoanchor.js?v=243" defer></script>
<script src="video.js?v=243" defer></script>
<script src="game.js?v=245" defer></script>
<script src="../nav.js?v=239" defer></script>
<script src="../xscroll.js?v=239" defer></script>
</body>
</html>
