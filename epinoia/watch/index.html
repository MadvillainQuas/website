<!-- PUBLIC. No gate.js, no topnav.js.
     ONE GAME VIDEO, AS ITS OWN PAGE (2026-10-07). tools/build-seo.py writes a copy of this page for every video tied to a
     game (watch/<home>-v-<away>-<kind>-<youtube id>.html): its head (title, description, VideoObject structured data) and
     the part between the watch:body markers (the head, the video's cover, the result, the game's other videos), so a
     search engine reads the page without running it. Google shows a video result only for a page whose main content is
     the video; this page is that, with the box score under it. Built to the page standard (docs/page-standard.md).
     THIS BARE COPY (?g=<game>&v=<youtube id>, from a game page's video tab) is not for search: it goes to the video's own
     address when it has one (watch/paths.json), else draws the video from the game's list. The player is
     youtube-nocookie and is made only when pressed (media.js player). -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com">
