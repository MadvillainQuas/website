<style>
  /* THE SITE'S SCALE. mode.js marks any page opened without ?l= as the platform splash, and the kit turns the 150% zoom
     off for the splash (epinoia-kit.css 2b), which left the all-leagues news archive at 100% beside every other page.
     The archive is an ordinary page: the same two steps as the kit, one notch more specific than its opt-out. */
  @media (min-width:1000px){ html.m-splash body{zoom:1.25} }
  @media (min-width:1200px){ html.m-splash body{zoom:1.5} }
  a.plain{color:inherit;text-decoration:none}
  .topbar{display:flex;align-items:center;gap:12px;padding:calc(var(--u)*2) calc(var(--u)*3);
    border-bottom:1px solid var(--rule);flex-wrap:wrap}
  .wm{font-family:var(--f-score);font-size:13px;
    background:linear-gradient(100deg,var(--lume),var(--aqua));color:var(--on-accent);
    padding:3px 9px 1px;text-transform:uppercase}
  .hero{padding:calc(var(--u)*4) calc(var(--u)*3) calc(var(--u)*3);
    border-bottom:1px solid var(--rule)}
  .hero h1{font-family:var(--f-score);font-size:clamp(30px,7vw,58px);line-height:.88;margin:0;
    text-transform:uppercase;background:linear-gradient(100deg,var(--lume),var(--aqua));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .lg{font-family:var(--f-micro);font-size:9.5px;color:var(--ink-3);
    letter-spacing:0.08em;text-transform:uppercase;margin-top:calc(var(--u))}
  .wrap{padding:calc(var(--u)*3)}
  /* the archive/article switch — see mode.js */
  .m-list #one{display:none}
  .m-article #list{display:none}
  .empty{padding:calc(var(--u)*5) 0;text-align:center;color:var(--ink-3);
    font-family:var(--f-micro);font-size:11px}
  .pager{display:flex;gap:10px;align-items:center;justify-content:center;
    padding:calc(var(--u)*3);font-family:var(--f-micro);font-size:9px;color:var(--ink-3)}
  footer.foot{padding:calc(var(--u)*4) calc(var(--u)*3);font-family:var(--f-micro);
    font-size:9px;color:var(--ink-3);display:flex;gap:16px;flex-wrap:wrap}
  footer.foot a{color:var(--ink-3);text-decoration:none}
  /* the platform's news: the switches, the publishers, the cards (kit/newscard.css) */
  .nw-tabs{margin-bottom:calc(var(--u)*3)}
  .nw-pubs{margin-bottom:calc(var(--u)*4)}
  .nw-pubs:empty{display:none}
  .nw-h{font-family:var(--f-micro);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
    margin-bottom:calc(var(--u)*2)}
  #press{padding-top:0}
  #press .pc-sec-h{margin-top:calc(var(--u)*2)}
  .m-article #press{display:none}
</style>

<div class="ep-frame">
  <div class="topbar">
    <a href="../home/" class="plain"><span class="wm epinoia-mark" aria-label="Epinoia">EPINOIΛ</span></a>
    <a href="#" id="backLeague" class="ep-micro plain">← league</a>
  </div>

  <div class="hero">
    <h1 id="head">News</h1>
    <div class="lg" id="leagueName"></div>
  </div>
  <!-- a publisher's page (?s=): its own head, in its colours, in place of the hero -->
  <div id="brand"></div>

  <!-- one article, or the archive: mode.js decided which from ?a= before any
       of this was painted, so opening an article no longer shows the archive's
       "Loading..." underneath it first. -->
  <!-- a members-only league this viewer may not see: the paywall card, in place
       of the article or the archive (news-page.js newsWall) -->
  <div id="accessWall" class="hide"></div>

  <article id="one"></article>

  <div id="list" class="wrap">
    <div class="empty">Loading&#8230;</div>
  </div>
  <div id="pager" class="pager hide"></div>
  <!-- a league's page (?l=): what the publishers and its creators ran about it (news-page.js press) -->
  <section id="press" class="wrap hide" aria-label="Around the league"></section>

  <footer class="foot">
    <a href="../home/">← Epinoia</a>
    <a href="#" id="footLeague">League</a>
    <span>Epinoia Network</span>
  </footer>
</div>
