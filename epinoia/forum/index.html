<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<!-- PUBLIC. A league's forum (migration 0197): the Discord servers the league attached, each with its way in;
     a server's own widget framed from discord.com and nothing else, and its numbers from Discord's public
     answer for its invitation (connect-src discord.com). -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://discord.com; frame-src https://discord.com">
<title>Forum · Epinoia</title>
<meta name="description" content="A league's Discord server on Epinoia: who is online, the channels, and the way in.">
<link rel="icon" type="image/png" sizes="32x32" href="../brand/epinoia-mark-32.png">
<link rel="apple-touch-icon" href="../brand/epinoia-app-180.png">
<script src="../appmode.js?v=544"></script>
<script src="../i18n.js?v=544"></script>
<script src="../glyphs.js?v=544" defer></script>
<link rel="stylesheet" href="../kit/epinoia-kit.css?v=544">
<link rel="stylesheet" href="../kit/nav.css?v=544">
<link rel="stylesheet" href="../kit/newscard.css?v=544">
<style>
  a.plain{color:inherit;text-decoration:none}
  .topbar{display:flex;align-items:center;gap:12px;padding:calc(var(--u)*2) calc(var(--u)*3);border-bottom:1px solid var(--rule);flex-wrap:wrap}
  .wm{font-family:var(--f-score);font-size:13px;background:linear-gradient(100deg,var(--lume),var(--aqua));color:var(--on-accent);
    padding:3px 9px 1px;text-transform:uppercase}
  /* a wrapping row, not a grid: side by side while both fit, one above the other once they do not */
  .fo-wrap{padding:calc(var(--u)*5) calc(var(--u)*3) calc(var(--u)*7);display:flex;flex-wrap:wrap;gap:calc(var(--u)*5);align-items:flex-start;max-width:1100px}
  .fo-wcol{flex:1 1 320px;max-width:480px;display:flex;flex-direction:column;gap:10px}
  .fo-widget{height:560px;border:1px solid var(--rule);background:#2b2d31}
  .fo-widget iframe{display:block;width:100%;height:100%;border:0}
  .fo-note{margin:0;font-family:var(--f-ui);font-size:12.5px;line-height:1.55;color:var(--ink-3)}
  .fo-list{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:12px}
  .fo-h{margin:0;font-family:var(--f-ui);font-weight:800;font-size:20px;line-height:1.3;color:var(--ink)}
  .fo-p{margin:0 0 4px;font-family:var(--f-ui);font-size:15px;line-height:1.6;color:var(--ink-2)}
  .fo-srv{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--rule)}
  .fo-srv.official{border-left-color:#5865F2}
  .fo-srv.on{box-shadow:inset 0 0 0 2px #5865F2}
  .fo-ic{flex:0 0 48px;width:48px;height:48px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#5865F2;color:#fff;
    font-family:var(--f-score);font-size:18px}
  .fo-ic img{width:100%;height:100%;object-fit:cover;display:block}
  .fo-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px}
  .fo-whose{display:flex;gap:6px;flex-wrap:wrap}
  .fo-badge{font-family:var(--f-micro);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px 2px;border:1px solid var(--rule);
    color:var(--ink-3);text-decoration:none}
  .fo-badge.official{background:#5865F2;border-color:#5865F2;color:#fff}
  .fo-badge.club{border-color:var(--cc,var(--rule));color:var(--ink)}
  .fo-name{margin:2px 0 0;font-family:var(--f-ui);font-weight:800;font-size:17px;line-height:1.25;color:var(--ink);overflow-wrap:anywhere}
  .fo-line{margin:0;font-family:var(--f-ui);font-size:14px;line-height:1.5;color:var(--ink-2)}
  .fo-count{font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3);min-height:1em}
  .fo-count:empty{display:none}
  .fo-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .fo-join,.fo-pick{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;text-decoration:none;cursor:pointer;
    font-family:var(--f-micro);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase}
  .fo-join{color:#fff;background:#5865F2;border:1px solid #5865F2}
  .fo-join:hover{background:#4752c4}
  .fo-pick{color:var(--ink);background:transparent;border:1px solid var(--rule)}
  .fo-pick:disabled{cursor:default;color:var(--ink-3)}
  footer.foot{padding:calc(var(--u)*4) calc(var(--u)*3);font-family:var(--f-micro);font-size:9px;color:var(--ink-3);display:flex;gap:16px;flex-wrap:wrap}
  footer.foot a{color:var(--ink-3);text-decoration:none}
  @media (max-width:760px){ .fo-wrap{padding:20px 16px 28px} .fo-wcol{max-width:none} .fo-widget{height:480px} }
</style>
<link rel="stylesheet" href="../kit/teletext.css?v=544">
<link rel="stylesheet" href="../kit/legibility.css?v=544">
</head>
<body>
<div class="ep-frame">
  <div class="topbar">
    <a href="../home/" class="plain"><span class="wm epinoia-mark" aria-label="Epinoia">EPINOIΛ</span></a>
    <a href="#" id="back" class="ep-micro plain">← league</a>
  </div>
  <main id="forum"><div class="pc-empty" style="margin:16px">Loading&#8230;</div></main>
  <footer class="foot">
    <a href="../home/">← Epinoia</a>
    <span>Epinoia Network</span>
  </footer>
</div>
<script src="../config.js?v=544" defer></script>
<script src="../newscard.js?v=544" defer></script>
<script src="forum-page.js?v=544" defer></script>
<script src="../nav.js?v=544" defer></script>
</body>
</html>
