<!DOCTYPE html>
<html lang="en">
<head>
<!-- FIRST, BEFORE ANYTHING PAINTS: the installed app's route guard (appmode.js). Blocking on
     purpose -- a redirect decided after first paint is a flash of the wrong page. -->
<script src="../appmode.js?v=357"></script>
<script src="../i18n.js?v=357"></script>
<script src="../glyphs.js?v=357" defer></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04100b">
<link rel="manifest" href="/epinoia/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EPINOIΛ">
<!-- PUBLIC. No gate.js, no topnav.js. Every league the viewer may see, so no league slug is
     set for nav.js: this page belongs to HOME, not to one league. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co">
<title>Global scouting · Epinoia</title>
<meta name="description" content="Every league's current season in one table: sort, filter on several stats at once and compare up to five players.">
<link rel="icon" type="image/png" sizes="32x32" href="../brand/epinoia-mark-32.png">
<link rel="apple-touch-icon" href="../brand/epinoia-app-180.png">
<link rel="stylesheet" href="../kit/epinoia-kit.css?v=357">
<link rel="stylesheet" href="../kit/nav.css?v=357">
<link rel="stylesheet" href="../kit/card.css?v=357">
<link rel="stylesheet" href="../kit/table.css?v=357">
<link rel="stylesheet" href="../kit/compare.css?v=357">
<link rel="stylesheet" href="../kit/access.css?v=357">
<style>
  a.plain{color:inherit;text-decoration:none} a.plain:hover{color:var(--lume)}
  .sc-top{display:flex;align-items:center;gap:12px;padding:calc(var(--u)*2) calc(var(--u)*3);border-bottom:1px solid var(--rule)}
  .sc-mark{font-family:var(--f-score);font-size:13px;background:linear-gradient(100deg,var(--lume),var(--aqua));
    color:#04100b;padding:3px 11px 1px;text-transform:uppercase}
  table.ep-tbl th{cursor:pointer;user-select:none}
  table.ep-tbl th.sorted{color:var(--lume)}
  .sc-hdr{flex-wrap:wrap;row-gap:4px}
  .sc-hdr h2{flex:1 1 auto;min-width:0}
  .sc-lede{flex:1 0 100%;margin:0;font-family:var(--f-ui);font-size:13px;line-height:1.45;color:var(--ink-2);max-width:62ch}

  /* THE PROGRESS LINE: each league's short name as its rows land, then what was left out */
  .sc-status{display:grid;gap:2px;padding:10px calc(var(--u)*3);border-bottom:1px solid var(--rule);
    font-family:var(--f-micro);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  .sc-status:empty{display:none}
  .sc-leagues .on{color:var(--ink)}
  .sc-leagues .wait{color:var(--ink-3)}
  .sc-excl{color:var(--ink-3)}
  .sc-warn{color:var(--amber)}

  /* THE LOADING SKELETON: the shape of the table, so the page does not jump when it lands */
  .sc-skel{padding:12px calc(var(--u)*3) 24px;display:grid;gap:8px}
  .sc-skel i{display:block;height:28px;border-radius:2px;background:var(--panel-2)}
  .sc-skel i:first-child{height:40px;margin-bottom:6px}
  .sc-skel i:nth-child(odd){opacity:.7}
  @media (prefers-reduced-motion:no-preference){
    .sc-skel i{animation:sc-pulse 1.2s ease-in-out infinite alternate}
    @keyframes sc-pulse{from{opacity:.45}to{opacity:1}}
  }
  .sc-state{padding:44px 20px;text-align:center;display:grid;gap:14px;justify-items:center;
    font-family:var(--f-micro);font-size:11px;line-height:1.8;color:var(--ink-3)}
  .sc-state .ep-btn{min-height:40px}

  /* THE COMPARISON ON A WIDE SCREEN: a panel above the table (on a phone it is a sheet, compare.css) */
  .sc-cmp{margin:0 calc(var(--u)*3) 12px;padding:12px 16px 16px;border:1px solid var(--rule-2);background:var(--panel)}
  .sc-cmp[hidden]{display:none}
  .sc-cmp-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
  .sc-cmp-title{font-family:var(--f-score);font-size:22px;line-height:1;text-transform:uppercase}
  .sc-cmp-close{min-width:40px;min-height:40px;border:0;background:transparent;cursor:pointer;color:var(--ink-2);font-size:24px;line-height:1}
  .sc-cmp-close:hover{color:var(--ink)}
  .sc-cmp-close:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}

  /* ON A PHONE (820px and below, where the tab bar is): the header wraps, and nothing may widen
     the page -- clip, not hidden, so the table's sticky header still sticks to the page */
  @media (max-width:820px){
    .sc-top{padding:10px 12px}
    .sc-hdr{padding:12px 12px 10px}
    .ep-frame > .sc-hdr h2{font-size:22px;line-height:1.05;overflow-wrap:anywhere}
    .sc-status{padding:8px 12px}
    .sc-skel{padding:10px 12px 20px}
    .sc-cmp{margin:0 12px 12px;padding:10px 12px 14px}
    .ep-frame{overflow-x:clip;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
    body.has-nav .ep-bell{top:auto;bottom:calc(var(--ep-nav-h, calc(58px + env(safe-area-inset-bottom,0px))) + 10px)}
    body.has-nav .ep-bell .panel{top:auto;bottom:48px;max-height:min(60vh,520px)}
  }
  /* INSTALLED, the status bar is drawn over the page (black-translucent), so the page starts below it */
  @media (display-mode:standalone){
    body{padding-top:env(safe-area-inset-top,0px)}
  }
  /* whose game: one row of chips, the same shape as every other chip row */
  .sc-who{display:flex;gap:6px;flex-wrap:wrap;padding:calc(var(--u)*2) calc(var(--u)*3) 0}
  .sc-who[hidden]{display:none}
</style>
</head>
<body>
<div class="ep-frame">
  <div class="sc-top">
    <a href="../home/" class="plain"><span class="sc-mark epinoia-mark" aria-label="Epinoia">EPINOIΛ</span></a>
    <span id="ctx" class="ep-micro">Home · scouting</span>
  </div>
  <div class="ep-hdr sc-hdr"><span class="idx">01</span><h2 id="title">Global scouting</h2>
    <p class="sc-lede">Every league's current season in one table, top 50 by the sorted stat. Filter on several stats at once, then pick up to five players to compare.</p></div>
  <!-- men's / women's, drawn by scouting.js only when the leagues on the page
       actually differ (0131; a league says which it is in its admin console) -->
  <div id="who" class="sc-who" hidden></div>
  <div id="status" class="sc-status" role="status" aria-live="polite"></div>
  <section id="cmpPanel" class="sc-cmp" hidden aria-label="Player comparison"></section>
  <div id="tbl"><div class="sc-skel" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  <footer style="padding:calc(var(--u)*3);font-family:var(--f-micro);font-size:9px;color:var(--ink-3)">Epinoia Network</footer>
</div>
<script src="../config.js?v=357" defer></script>
<script src="../access.js?v=357" defer></script>
<script src="../season.js?v=357" defer></script>
<script src="../bpm.js?v=357" defer></script>
<script src="../data.js?v=357" defer></script>
<script src="../global.js?v=357" defer></script>
<script src="../fulltable.js?v=357" defer></script>
<script src="../compare.js?v=357" defer></script>
<script src="scouting.js?v=357" defer></script>
<script src="../nav.js?v=357" defer></script>
<script src="../xscroll.js?v=357" defer></script>
</body>
</html>
