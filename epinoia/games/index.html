<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- LIGHT: the default theme; appmode.js turns it dark before paint for a reader who chose dark. -->
<meta name="theme-color" content="#f3faf6">
<link rel="manifest" href="/epinoia/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EPINOIΛ">
<!-- PUBLIC. No gate.js, no topnav.js. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co">
<title>Global fixtures · Epinoia</title>
<meta name="description" content="Every fixture and result across all leagues on Epinoia, nearest to now first.">
<link rel="icon" type="image/png" sizes="32x32" href="../brand/epinoia-mark-32.png">
<link rel="apple-touch-icon" href="../brand/epinoia-app-180.png">
<script src="../appmode.js?v=472"></script>
<script src="../i18n.js?v=472"></script>
<script src="../glyphs.js?v=472" defer></script>
<link rel="stylesheet" href="../kit/epinoia-kit.css?v=472">
<link rel="stylesheet" href="../kit/nav.css?v=472">
<link rel="stylesheet" href="../kit/fxc.css?v=472">
<style>
  a.plain{color:inherit;text-decoration:none}
  .gm{overflow-x:clip}
  .gm-top{display:flex;align-items:center;gap:12px;padding:calc(var(--u)*2) calc(var(--u)*3);border-bottom:1px solid var(--rule)}
  .gm-top .wm{background:linear-gradient(100deg,var(--lume),var(--aqua));color:#04100b;padding-top:3px;padding-bottom:1px;
    view-transition-name:ep-mark}
  .gm .ep-hdr{flex-wrap:wrap;row-gap:4px}
  .gm-count{margin-left:auto;font-family:var(--f-micro);font-size:9.5px;letter-spacing:0.06em;text-transform:uppercase;
    color:var(--ink-3);white-space:nowrap}
  /* the one-line answer to "what am I looking at" */
  .gm-lede{margin:0;padding:calc(var(--u)*1.5) calc(var(--u)*3);border-bottom:1px solid var(--rule);
    font-family:var(--f-ui);font-weight:600;font-size:14.5px;line-height:1.45;color:var(--ink)}

  /* LIVE, PINNED above every group: the thing somebody opened the page for */
  .gm-live{border-bottom:1px solid var(--rule);background:color-mix(in oklch,var(--flare) 5%,var(--ground))}
  .gm-live[hidden]{display:none}
  .gm-sub{display:flex;align-items:center;gap:8px;margin:0;padding:calc(var(--u)*1.5) calc(var(--u)*3) 0;
    font-family:var(--f-micro);font-weight:400;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-3)}
  .gm-sub .n{color:var(--ink-3)}
  .gm-live .gm-sub{color:var(--flare)}
  .gm-live .gm-sub .dot{width:7px;height:7px;border-radius:50%;background:var(--flare);animation:fxc-pulse 1.6s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){ .gm-live .gm-sub .dot{animation:none} }

  /* one league per group */
  .gm-groups[aria-busy="true"]{min-height:320px}
  .gm-acc>summary .t{display:flex;min-width:0}
  .gm-acc>summary .flag{flex:none;font-size:16px;line-height:1}
  .gm-acc>summary .n{flex:none;white-space:nowrap;transition:color .3s ease}
  /* a group that Show more just added to (games.js lit()) */
  .gm-acc>summary .n.gm-grew{color:var(--lume)}
  /* the button names where the rows went, which can run long on a phone */
  .gm-more .ep-btn.more{white-space:normal;line-height:1.3;text-wrap:balance}
  .gm-body{padding-bottom:calc(var(--u)*1)}
  .gm-skel{display:grid;gap:8px;padding:calc(var(--u)*2) calc(var(--u)*3);grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .gm-skel i{display:block;height:128px;border:1px solid var(--rule);
    background:linear-gradient(100deg,var(--panel) 30%,var(--panel-2) 50%,var(--panel) 70%);background-size:300% 100%;
    animation:gm-shimmer 1.4s ease-in-out infinite}
  @keyframes gm-shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
  @media (prefers-reduced-motion:reduce){ .gm-skel i{animation:none} }
  .gm-more{padding:0 0 calc(var(--u)*2)}
  .gm-more .ep-btn.more{border-top:none}
  /* each league's own "Show more in this league", at the foot of its list, with what it has read beside it */
  .gm-lmore{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:calc(var(--u)*1.5) calc(var(--u)*3) calc(var(--u)*2)}
  .gm-lmore .ep-btn.more{white-space:normal;line-height:1.3;text-wrap:balance}
  /* the league's Show more: one button, two halves - upcoming on the left, results on the right; a half whose side has
     run out is gone and the other takes the whole width */
  .gm-split{display:flex;width:100%}
  .gm-split[hidden]{display:none}
  .gm-split .ep-btn.more{flex:1 1 50%;min-width:0}
  .gm-split .ep-btn.more[hidden]{display:none}
  .gm-split .ep-btn.more + .ep-btn.more{border-left:1px solid var(--rule-2,var(--rule))}
  .gm-gcount{font-family:var(--f-micro);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-3)}
  .gm-body > .gm-sub:only-child{padding-bottom:calc(var(--u)*2)}

  .empty{padding:calc(var(--u)*5) calc(var(--u)*3);text-align:center;color:var(--ink-3);font-family:var(--f-micro);font-size:10px;line-height:1.9}
  .empty .ep-btn{margin-top:12px}

  @media (max-width:820px){
    .gm-top{padding:calc(var(--u)*1.5) calc(var(--u)*2)}
    .gm .ep-hdr{padding:calc(var(--u)*1.5) calc(var(--u)*2)}
    .gm .ep-hdr h2{font-size:22px}
    .gm-lede{padding:calc(var(--u)*1.25) calc(var(--u)*2)}
    .gm-sub{padding:calc(var(--u)*1.25) 12px 0}
    .gm-lmore{padding:calc(var(--u)*1.25) 12px calc(var(--u)*2)}
    .gm-skel{padding:10px 12px;grid-template-columns:repeat(2,minmax(0,1fr))}
    .ep-frame{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
    body.has-nav .ep-bell{top:auto;bottom:calc(58px + env(safe-area-inset-bottom,0px) + 10px)}
    body.has-nav .ep-bell .panel{top:auto;bottom:48px;max-height:min(60vh,520px)}
  }
  @media (display-mode:standalone){
    body{padding-top:env(safe-area-inset-top,0px)}
  }
  :root[data-theme="light"] .gm-live{background:color-mix(in oklch,var(--flare) 4%,#f3faf6)}
</style>
<link rel="stylesheet" href="../kit/legibility.css?v=472">
</head>
<body>
<div class="ep-frame gm">
  <div class="gm-top">
    <a href="../home/" class="plain"><span class="wm epinoia-mark" aria-label="Epinoia">EPINOIΛ</span></a>
    <span class="ep-micro">every league</span>
  </div>
  <div class="ep-hdr"><span class="idx">01</span><h2 id="gmTitle">Global fixtures</h2>
    <span class="gm-count" id="gmCount" aria-live="polite"></span></div>
  <!-- HOW THE PAGE IS ORDERED, in one line (games.js does exactly this) -->
  <p class="gm-lede">Nearest to now first: leagues with a game in the next 7 days, each showing next games (soonest first) then latest results; Show more goes further out.</p>

  <!-- live games, pinned above the groups; hidden while there are none -->
  <section class="gm-live" id="gmLive" aria-labelledby="gmLiveH" hidden>
    <h3 class="gm-sub" id="gmLiveH"><span class="dot" aria-hidden="true"></span>Live now</h3>
    <div class="fxc-grid" id="gmLiveGrid"></div>
  </section>

  <!-- one details.ep-acc per league, most imminent game first (games.js) -->
  <div class="gm-groups" id="gmGroups" aria-busy="true" aria-labelledby="gmTitle">
    <div class="gm-skel" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </div>

  <div class="gm-more">
    <button type="button" class="ep-btn more" id="gmMore" hidden>Show more</button>
  </div>

  <footer style="padding:calc(var(--u)*3);font-family:var(--f-micro);font-size:9px;color:var(--ink-3)">Epinoia Network</footer>
</div>
<script src="../config.js?v=472" defer></script>
<script src="../data.js?v=472" defer></script>
<script src="../rt.js?v=472" defer></script>
<script src="../country.js?v=472" defer></script>
<script src="../initials.js?v=472" defer></script>
<script src="../globalgames.js?v=472" defer></script>
<script src="games.js?v=472" defer></script>
<script src="../nav.js?v=472" defer></script>
<script src="../xscroll.js?v=472" defer></script>
</body>
</html>
