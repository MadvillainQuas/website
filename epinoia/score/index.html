<script>
"use strict";
/* ==================== core state ==================== */
const PLEN = p => p <= 4 ? 600000 : 300000;
const WIN_MS = 12000;   // live follow-up window; frozen whenever the game clock is stopped
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const FOULNAMES = {personal:'personal', shooting:'shooting', floor:'on-the-floor',
  offensive:'offensive', tech:'technical', unsport:'unsportsmanlike', disq:'disqualifying'};

let S = null;          // persistent game state
let D = null;          // derived stats (rebuilt on every render)
let PMAP = {};         // pid -> {team, p}
let ui = {armed:null, foulType:null, pending:null, subOut:null};
let G = null;          // active gesture

function newState(){
  return {phase:'setup',
    teams:[{name:'team one',players:[]},{name:'team two',players:[]}],
    starters:[[],[]], events:[], redo:[], evSeq:0,
    period:1, clockMs:PLEN(1), running:false, collapsed:false,
    tipWinner:null, arrowInit:null};
}
/* Which slot this page saves into. The practice game gets its own, so
   opening the demo can never overwrite a real game in progress — see the note
   in the commit. */
const EP_TRAIN = new URLSearchParams(location.search).get('train') === '1';
/* ?guide=0 suppresses the controls screen the demo otherwise opens on. It
   exists for the frame on the learn page, which is showing somebody what the
   app LOOKS like — a product shot of its own documentation is not the pitch —
   and for anyone linking straight back into a game they have already read it
   for. Anything other than an explicit 0 leaves the guide on. */
const EP_GUIDE = new URLSearchParams(location.search).get('guide') !== '0';
const EP_KEY = EP_TRAIN ? 'epinoia_v1_demo' : 'epinoia_v1';
window.EP_KEY = EP_KEY;
function save(){ try{ localStorage.setItem(EP_KEY, JSON.stringify(S)); }catch(e){} }
/* The saved game moved key when Courtside became Epinoia. A statistician with a
   game open at that moment must not lose it, so the old key is read through
   once and carried over — renaming a storage key is a silent data loss unless
   somebody remembers the old name. Delete this fallback once no browser can
   still be holding a pre-rename game (a season is plenty). */
function loadSaved(){
  try{
    let r = localStorage.getItem(EP_KEY);
    if (r == null) {
      r = localStorage.getItem('courtside_v1');
      if (r != null) {
        localStorage.setItem(EP_KEY, r);
        localStorage.removeItem('courtside_v1');
      }
    }
    return r ? JSON.parse(r) : null;
  }catch(e){ return null; }
}
function buildPmap(){ PMAP = {}; S.teams.forEach((tm,t)=>tm.players.forEach(p=>PMAP[p.id]={team:t,p})); applyTeamVars(); }
function hexToRgba(h,a){ const m=(h||'').replace('#',''); if(m.length!==6) return 'rgba(147,242,191,'+a+')';
  return 'rgba('+parseInt(m.slice(0,2),16)+','+parseInt(m.slice(2,4),16)+','+parseInt(m.slice(4,6),16)+','+a+')'; }
function applyTeamVars(){
  const r = document.documentElement.style;
  const c0 = safeColour(S.teams[0] && S.teams[0].color, '#93f2bf'),
        c1 = safeColour(S.teams[1] && S.teams[1].color, '#8ff5ff');
  r.setProperty('--team0',c0); r.setProperty('--team1',c1);
  r.setProperty('--team0-glow',hexToRgba(c0,.4)); r.setProperty('--team1-glow',hexToRgba(c1,.4));
}
function vibrate(n){ if(navigator.vibrate) try{ navigator.vibrate(n); }catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* A colour, or the fallback — see the note inside. */
const COLOUR_OK = /^(?:#(?:[0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})|(?:rgb|hsl)a?\([0-9eE.,%\/\s+-]+\)|var\(--[a-z0-9-]+\))$/i;
function safeColour(v, fallback){
  /* NOTHING BUT A COLOUR REACHES A STYLE ATTRIBUTE.

     Names in this file all go through esc(). Club colours did not: they were
     concatenated straight into style="color:'+c+'" in strings handed to
     innerHTML. The value comes from teams.colour, and neither the column nor
     admin_update_team validated it — that function checks the slug against a
     pattern and writes the colour through untouched. So a league administrator
     could store

         #fff" onmouseover="...

     and every visitor to any box score in that league would be served the
     markup, on the public game page.

     The page's CSP is script-src 'self' with no unsafe-inline, so an injected
     handler would not have run — that lock held. But it was the only lock, and
     CSP does not stop injected MARKUP: a link, an image, a panel over the
     score. A policy is the net, not the floor.

     AN ALLOW-LIST, NOT AN ESCAPE. Escaping the quotes would stop the breakout
     and still allow arbitrary CSS through the property, and CSS in an
     attacker's hands is its own problem — a background-image is a request to
     somewhere, with a referer on it. So the value has to LOOK like a colour or
     it is not used: three, six or eight hex digits, a functional notation with
     nothing but numbers and separators inside it, or one of our own custom
     properties. Anything carrying a quote, a bracket or a semicolon falls back.

     Migration 0056 fits the other lock and validates these on the way in. This
     one is the floor, because it also covers rows written before it. */
  const c = String(v == null ? '' : v).trim();
  return COLOUR_OK.test(c) ? c : (fallback || 'var(--lume)');
}
function tname(t){ return S.teams[t].name || (t? 'team two':'team one'); }
function pname(pid){ const m = PMAP[pid]; if(!m) return 'team'; return (m.p.num!==''&&m.p.num!=null?('#'+m.p.num+' '):'')+m.p.name; }
function perName(p){ return p<=4 ? 'q'+p : 'ot'+(p-4); }
function fmtClock(ms){ const s=Math.ceil(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function fmtMin(ms){ const s=Math.round(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function cumEl(p, clk){ let s=0; for(let q=1;q<p;q++) s+=PLEN(q); return s+(PLEN(p)-clk); }

let toastT=null;
function toast(msg, ms){ const el=$('#toast'); el.textContent=msg; el.classList.remove('gone');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.add('gone'), ms||2200); }

/* ==================== event log ==================== */
function evById(id){ return S.events.find(e=>e.id===id); }
function addEvent(ev){
  if(ev.id==null){ S.evSeq = (S.evSeq||0)+1; ev.id = S.evSeq; }
  if(ev.period==null) ev.period = S.period;
  if(ev.clock==null) ev.clock = S.clockMs;
  S.events.push(ev); S.redo = [];
  if(ui.pending && ui.pending.steps && !ui.pending.steps.includes(ev.id)) ui.pending.steps.push(ev.id);
  // FIBA: clock stops after a made basket in the final 2:00 of q4 and overtimes
  if((ev.t==='p2_made'||ev.t==='p3_made') && S.running && S.period>=4 && S.clockMs<=120000){
    S.running = false;
    toast('clock stopped — made basket, final 2:00');
  }
  if(/_made$/.test(ev.t) && ev.team!=null) ui.bumpTeam = ev.team;
  save(); renderAll();
  return ev.id;
}
function foulAlert(pid){
  if(!pid || !D) return;
  const s = D.stats[pid]; if(!s) return;
  if(s.dq) toast(pname(pid)+' — disqualified — sub them out', 4200);
  else if(s.pf===5) toast(pname(pid)+' — 5th foul — sub them out', 4200);
}
function deleteEvent(id){
  const ev = evById(id);
  if(!ev || ev.t==='period_start' || ev.t==='game_end') return;
  // drop the event and any descriptor events that point at it (ids are stable, no remap)
  S.events = S.events.filter(e=> e.id!==id &&
    !((e.t==='tag'||e.t==='stype'||e.t==='loc') && e.ref===id));
  S.redo = [];
  ui.pending = null; ui.subOut = null; ui.armed = null; ui.foulType = null;
  save(); renderAll(); toast('action deleted');
}
function evLabel(ev){
  if(ev.t==='tag') return ev.tag+' tag';
  if(ev.t==='stype') return ev.v;
  if(ev.t==='loc') return 'shot location';
  return (pbpLine(ev,ev.id,{},{})||ev.t).replace(/^— |—$/g,'').trim();
}
function undo(){
  if(!S.events.length) return;
  const ev = S.events.pop(); S.redo.push(ev);
  ui.pending=null; ui.subOut=null; ui.armed=null; ui.foulType=null;
  save(); renderAll(); toast('undone: '+evLabel(ev), 2600);
}
function redo(){
  if(!S.redo.length) return;
  const ev = S.redo.pop(); S.events.push(ev);
  save(); renderAll(); toast('redone: '+evLabel(ev), 2600);
}

/* ==================== derive stats from event log ==================== */
function mkP(){ return {pts:0,p2m:0,p2a:0,p3m:0,p3a:0,ftm:0,fta:0,or:0,dr:0,ast:0,stl:0,blk:0,to:0,pf:0,fd:0,pm:0,min:0,t:0,u:0,dq:false,
  ptsAst:0, rimA:0, rimM:0, midA:0, midM:0, oc:mkOC()}; }
function mkOC(){ return {tFGA:0,tFGM:0,t3M:0,tFTA:0,tTOV:0,tOR:0,tDR:0,tPTS:0, oFGA:0,oFGM:0,o3M:0,oFTA:0,oTOV:0,oOR:0,oDR:0,oPTS:0}; }
function mkBox(){ return {fga:0,fgm:0,f3m:0,fta:0,tov:0,or:0,dr:0,pts:0}; }
function mkT(){ return {pts:0,teamRebO:0,teamRebD:0,teamTo:0,toTot:0,foulTot:0,foulsP:{},paint:0,fast:0,
  sc:0,pot:0,bench:0,lead:0,tos:{h1:0,h2:0,last2:0,ot:{}}}; }

function activeTags(id){
  const s = new Set();
  S.events.forEach(ev=>{ if(ev.t==='tag' && ev.ref===id){ s.has(ev.tag)?s.delete(ev.tag):s.add(ev.tag); } });
  return s;
}

function derive(){
  const d = {stats:{}, team:[mkT(),mkT()], score:[0,0], perQ:[{},{}], pbp:[],
    poss:(S.tipWinner!=null?S.tipWinner:null),
    onCourt:[[...S.starters[0]],[...S.starters[1]]], lineups:[[],[]]};
  let arw = (S.arrowInit!=null) ? S.arrowInit : null; // alternating-possession arrow
  const flag = {sc:[false,false], pot:[false,false]}; // live second-chance / points-off-to windows
  let lastFoulKind = null;
  S.teams.forEach(tm=>tm.players.forEach(p=>d.stats[p.id]=mkP()));
  const lastIn = {}; S.starters.forEach(a=>a.forEach(pid=>lastIn[pid]=0));
  const nowCum = cumEl(S.period, S.clockMs);
  const cur = [ {ids:[...d.onCourt[0]].sort(),start:0,pf:0,pa:0,off:mkBox(),def:mkBox()},
                {ids:[...d.onCourt[1]].sort(),start:0,pf:0,pa:0,off:mkBox(),def:mkBox()} ];
  // on-court accumulation: credit every player on the floor (team side + opp side) and the live stints
  const ocAdd = (team, k, v) => {
    v = v||1;
    d.onCourt[team].forEach(id=>{ if(d.stats[id]) d.stats[id].oc['t'+k]+=v; });
    d.onCourt[1-team].forEach(id=>{ if(d.stats[id]) d.stats[id].oc['o'+k]+=v; });
    const bk = {FGA:'fga',FGM:'fgm','3M':'f3m',FTA:'fta',TOV:'tov',OR:'or',DR:'dr',PTS:'pts'}[k];
    if(bk){ cur[team].off[bk]+=v; cur[1-team].def[bk]+=v; }
  };
  const lastMade = [0,0]; // value of the last made FG per team, for points-assisted
  const isRim = ev => { const l=locs[ev.id]; return (l && l.x>0.33 && l.x<0.67 && l.y<0.42) || (tags[ev.id]&&tags[ev.id].has('paint')); };
  const tags = {}, stypes = {}, locs = {};
  S.events.forEach(ev=>{
    if(ev.t==='tag'){ const s=tags[ev.ref]=tags[ev.ref]||new Set();
      s.has(ev.tag)?s.delete(ev.tag):s.add(ev.tag); }
    else if(ev.t==='stype'){ stypes[ev.ref] = stypes[ev.ref]===ev.v ? null : ev.v; }
    else if(ev.t==='loc'){ locs[ev.ref] = {x:ev.x, y:ev.y}; }
  });
  d.stypes = stypes; d.locs = locs;
  const st = ev => d.stats[ev.pid];
  const close = (t,cum)=>{ const c=cur[t]; const dur=Math.max(0,cum-c.start);
    if(dur>0||c.pf||c.pa) d.lineups[t].push({ids:c.ids,dur,pf:c.pf,pa:c.pa,off:c.off,def:c.def}); };
  const scorePts = (ev,v)=>{
    d.score[ev.team]+=v; d.team[ev.team].pts+=v;
    const q=d.perQ[ev.team]; q[ev.period]=(q[ev.period]||0)+v;
    if(ev.pid && st(ev)) st(ev).pts+=v;
    d.onCourt[ev.team].forEach(id=>{ if(d.stats[id]) d.stats[id].pm+=v; });
    d.onCourt[1-ev.team].forEach(id=>{ if(d.stats[id]) d.stats[id].pm-=v; });
    cur[ev.team].pf+=v; cur[1-ev.team].pa+=v;
    const tg=tags[ev.id];
    if(tg){ if(tg.has('paint')) d.team[ev.team].paint+=v; if(tg.has('transition')) d.team[ev.team].fast+=v; }
    if(flag.sc[ev.team]) d.team[ev.team].sc+=v;
    if(flag.pot[ev.team]) d.team[ev.team].pot+=v;
    if(ev.pid && !S.starters[ev.team].includes(ev.pid)) d.team[ev.team].bench+=v;
    const lead = d.score[ev.team]-d.score[1-ev.team];
    if(lead > d.team[ev.team].lead) d.team[ev.team].lead = lead;
  };
  S.events.forEach((ev,i)=>{
    const cum = cumEl(ev.period||1, ev.clock!=null?ev.clock:PLEN(ev.period||1));
    switch(ev.t){
      case 'ft_miss': if(st(ev)) st(ev).fta++; ocAdd(ev.team,'FTA'); break;
      case 'ft_made': if(st(ev)){st(ev).fta++; st(ev).ftm++;} ocAdd(ev.team,'FTA'); ocAdd(ev.team,'PTS',1); scorePts(ev,1); break;
      case 'p2_miss': if(st(ev)){ st(ev).p2a++; if(isRim(ev)) st(ev).rimA++; else st(ev).midA++; }
        ocAdd(ev.team,'FGA'); break;
      case 'p2_made': if(st(ev)){ st(ev).p2a++; st(ev).p2m++; if(isRim(ev)){st(ev).rimA++;st(ev).rimM++;} else {st(ev).midA++;st(ev).midM++;} }
        ocAdd(ev.team,'FGA'); ocAdd(ev.team,'FGM'); ocAdd(ev.team,'PTS',2); lastMade[ev.team]=2; scorePts(ev,2); break;
      case 'p3_miss': if(st(ev)) st(ev).p3a++; ocAdd(ev.team,'FGA'); break;
      case 'p3_made': if(st(ev)){st(ev).p3a++; st(ev).p3m++;}
        ocAdd(ev.team,'FGA'); ocAdd(ev.team,'FGM'); ocAdd(ev.team,'3M'); ocAdd(ev.team,'PTS',3); lastMade[ev.team]=3; scorePts(ev,3); break;
      case 'reb': if(ev.pid && st(ev)){ ev.off?st(ev).or++:st(ev).dr++; }
                  else { ev.off?d.team[ev.team].teamRebO++:d.team[ev.team].teamRebD++; }
                  ocAdd(ev.team, ev.off?'OR':'DR'); break;
      case 'ast': if(st(ev)){ st(ev).ast++; st(ev).ptsAst += lastMade[ev.team]||2; } break;
      case 'stl': if(st(ev)) st(ev).stl++; break;
      case 'blk': if(st(ev)) st(ev).blk++; break;
      case 'to': if(ev.pid && st(ev)) st(ev).to++; else d.team[ev.team].teamTo++;
                 d.team[ev.team].toTot++; ocAdd(ev.team,'TOV'); break;
      case 'foul': { const s = ev.pid ? st(ev) : null;
        if(s){ s.pf++;
          if(ev.kind==='tech') s.t++;
          if(ev.kind==='unsport') s.u++;
          // FIBA disqualification: a DQ foul, or any two techs/unsportsmanlikes
          if(ev.kind==='disq' || s.t+s.u>=2) s.dq=true; }
        if(ev.drawn && d.stats[ev.drawn]) d.stats[ev.drawn].fd++;
        d.team[ev.team].foulTot++;
        // FIBA team fouls: coach/bench technicals excluded, player techs count;
        // overtimes continue the 4th-quarter count
        if(!(ev.kind==='tech' && !ev.pid)){
          const m=d.team[ev.team].foulsP, key=ev.period>4?4:ev.period;
          m[key]=(m[key]||0)+1;
        }
        break; }
      case 'period_start': if(ev.period>1 && arw!=null){ d.poss=arw; arw=1-arw; } break;
      case 'jump': if(arw!=null){ d.poss=arw; arw=1-arw; } break;
      case 'timeout': { const T=d.team[ev.team].tos;
        if(ev.period<=2) T.h1++;
        else if(ev.period<=4){ T.h2++; if(ev.period===4 && ev.clock<=120000) T.last2++; }
        else T.ot[ev.period]=(T.ot[ev.period]||0)+1; break; }
      case 'sub': { const t=ev.team;
        if(lastIn[ev.out]!=null && d.stats[ev.out]){ d.stats[ev.out].min+=Math.max(0,cum-lastIn[ev.out]); delete lastIn[ev.out]; }
        lastIn[ev.in]=cum;
        close(t,cum);
        d.onCourt[t]=d.onCourt[t].filter(x=>x!==ev.out);
        if(!d.onCourt[t].includes(ev.in)) d.onCourt[t].push(ev.in);
        cur[t]={ids:[...d.onCourt[t]].sort(),start:cum,pf:0,pa:0,off:mkBox(),def:mkBox()}; break; }
    }
    // possession heuristic + live second-chance / points-off-to windows
    switch(ev.t){
      case 'p2_made': case 'p3_made':
        d.poss = 1-ev.team;
        flag.sc[ev.team]=false; flag.pot[ev.team]=false; break;
      case 'ft_made':
        // FIBA: unsportsmanlike / disqualifying free throws keep the ball with the shooting team
        d.poss = (lastFoulKind==='unsport'||lastFoulKind==='disq') ? ev.team : 1-ev.team;
        flag.sc[ev.team]=false; flag.pot[ev.team]=false; break;
      case 'ft_miss':
        d.poss = (lastFoulKind==='unsport'||lastFoulKind==='disq') ? ev.team : null; break;
      case 'p2_miss': case 'p3_miss': d.poss = null; break;
      case 'reb':
        d.poss = ev.team;
        if(ev.off) flag.sc[ev.team]=true;
        else { flag.sc=[false,false]; flag.pot=[false,false]; }
        break;
      case 'stl': d.poss = ev.team; break;
      case 'to':
        d.poss = 1-ev.team;
        flag.sc[ev.team]=false; flag.pot[ev.team]=false;
        flag.sc[1-ev.team]=false; flag.pot[1-ev.team]=true; break;
      case 'foul': lastFoulKind = ev.kind||'personal'; break;
      case 'period_start': flag.sc=[false,false]; flag.pot=[false,false]; break;
    }
    const line = pbpLine(ev,ev.id,tags,stypes);
    if(line) d.pbp.push({period:ev.period, clock:ev.clock, team:ev.team, txt:line, s:[d.score[0],d.score[1]], id:ev.id});
  });
  for(const pid in lastIn){ if(d.stats[pid]) d.stats[pid].min+=Math.max(0,nowCum-lastIn[pid]); }
  close(0,nowCum); close(1,nowCum);
  d.arrow = arw;
  return d;
}

function pbpLine(ev,i,tags,stypes){
  const who = ev.pid ? pname(ev.pid) : (ev.team!=null ? tname(ev.team) : '');
  const tagTxt = tg => {
    const bits = [];
    if(stypes && stypes[i]) bits.push(stypes[i]);
    if(tg && tg.size) bits.push(...tg);
    return bits.length ? ' ('+bits.join(', ')+')' : '';
  };
  switch(ev.t){
    case 'ft_miss': return who+' — free throw missed';
    case 'ft_made': return who+' — free throw made';
    case 'p2_miss': return who+' — 2pt missed'+tagTxt(tags[i]);
    case 'p2_made': return who+' — 2pt made'+tagTxt(tags[i]);
    case 'p3_miss': return who+' — 3pt missed'+tagTxt(tags[i]);
    case 'p3_made': return who+' — 3pt made'+tagTxt(tags[i]);
    case 'reb': return who+' — '+(ev.off?'offensive':'defensive')+' rebound'+(ev.pid?'':' (team)');
    case 'ast': return who+' — assist';
    case 'stl': return who+' — steal';
    case 'blk': return who+' — block';
    case 'to': return who+' — turnover'+(ev.pid?'':' (team)')+(stypes&&stypes[i]?' ('+stypes[i]+')':'');
    case 'foul': return who+' — '+(FOULNAMES[ev.kind]||'personal')+' foul';
    case 'timeout': return tname(ev.team)+' — timeout';
    case 'sub': return tname(ev.team)+' — sub: '+pname(ev.in)+' in, '+pname(ev.out)+' out';
    case 'jump': return 'held ball — alternating possession';
    case 'period_start': return '— '+perName(ev.period)+' —';
    case 'game_end': return '— final —';
  }
  return null;
}

function timeoutsLeft(d,t){
  const T = d.team[t].tos;
  if(S.period<=2) return Math.max(0, 2-T.h1);
  if(S.period<=4){
    let left = 3-T.h2;
    if(S.period===4 && S.clockMs<=120000) left = Math.min(left, 2-T.last2);
    return Math.max(0,left);
  }
  return Math.max(0, 1-(T.ot[S.period]||0));
}
function teamFoulsNow(d,t){ return d.team[t].foulsP[S.period>4?4:S.period]||0; }

/* ==================== clock ==================== */
let lastTick = Date.now(), saveCo = 0;
function tick(){
  const now = Date.now(); const dt = now-lastTick; lastTick = now;
  if(S && S.phase==='game'){
    if(S.running){
      S.clockMs = Math.max(0, S.clockMs-dt);
      if(S.clockMs===0){ S.running=false; save(); renderAll(); onPeriodEnd(); }
      else{
        const el=$('#clkTxt'); if(el) el.textContent=fmtClock(S.clockMs);
        if(++saveCo%25===0) save();
      }
    }
    // windows only count down while the game clock runs — at a dead ball (fouls, free throws,
    // timeouts) the statistician has as long as they need, as in livestats
    if(ui.pending && (ui.pending.hold || !S.running)) ui.pending.expires = Math.max(ui.pending.expires, now+WIN_MS);
    if(ui.subOut && !S.running) ui.subOut.expires = Math.max(ui.subOut.expires, now+WIN_MS);
    if(ui.pending && now>ui.pending.expires) clearPending('window closed');
    if(ui.subOut && now>ui.subOut.expires){ ui.subOut=null; renderAll(); toast('sub cancelled'); }
    // deferred period-end score confirmation, once the live play has resolved
    if(ui.pendConfirm!=null && !ui.pending && !ui.subOut &&
       $('#confirmModal').classList.contains('hidden') &&
       $('#evModal').classList.contains('hidden') &&
       $('#adjModal').classList.contains('hidden')){
      const p = ui.pendConfirm; ui.pendConfirm = null;
      showPeriodConfirm(p);
    }
    updateXRing();
  }
}
setInterval(tick, 200);

function onPeriodEnd(){
  const d = derive();
  if(S.period>=4){
    if(d.score[0]===d.score[1]) toast('tied — resume starts overtime', 4000);
    else toast('game over — end game from the menu', 4000);
  } else toast('end of '+perName(S.period)+' — resume starts '+perName(S.period+1), 4000);
  // a play may still be live at the buzzer (rebound off a miss, a sub) — let it
  // finish with a fresh window before asking to confirm the score
  if(ui.pending || ui.subOut){
    ui.pendConfirm = S.period;
    resetPend();
    if(ui.subOut) ui.subOut.expires = Date.now()+WIN_MS;
    return;
  }
  showPeriodConfirm(S.period);
}
function showPeriodConfirm(p){
  const d = derive();
  const half = p===2;
  const over = p>=4 && d.score[0]!==d.score[1];
  if(half || over){
    askChoice((half?'half-time':'full-time')+' — '+d.score[0]+'–'+d.score[1]+' — check the play-by-play?',
      'score correct', 'review & edit', c=>{ if(c===1) openLog(); });
  } else {
    askConfirm('end of '+perName(p)+' — score '+d.score[0]+'–'+d.score[1]+' — correct?',
      ()=>{}, ()=>openBox());
  }
}
function pauseClock(){ if(!S.running) return; S.running=false; save(); renderAll(); }
function resumeClock(){
  if(S.running) return;
  if(S.clockMs>0){ S.running=true; save(); renderAll(); return; }
  const d = derive();
  if(S.period>=4 && d.score[0]!==d.score[1]){ toast('game over — end game from the menu'); return; }
  S.period++; S.clockMs=PLEN(S.period); S.running=true;
  addEvent({t:'period_start'});
  toast(perName(S.period)+' underway');
}

/* ==================== pending helpers ==================== */
function originAt(idx){
  // a window opened from inside another window inherits its origin time, so a whole
  // joined sequence (shot → and-one → fouler → free throws → rebound) shares one clock
  if(ui.pending && ui.pending.at) return ui.pending.at;
  const e = idx!=null ? evById(idx) : null;
  return e ? {period:e.period, clock:e.clock} : {period:S.period, clock:S.clockMs};
}
function setPend(kind, shot, team, pid, idx){
  const at = originAt(idx);
  const ftCount = (shot==='ft' && ui.pending) ? (ui.pending.ftCount||0)+1 : (shot==='ft'?1:0);
  const ftExp = ui.pending ? ui.pending.ftExp : null;
  const hold = ui.pending ? ui.pending.hold : false;
  // provisional step list for this window (✕ / esc pops the newest; enter / done confirms all)
  const steps = ui.pending && ui.pending.steps ? ui.pending.steps.slice() : [];
  if(!steps.includes(idx)) steps.push(idx);
  ui.pending = {kind, shot, team, pid, anchorIdx:idx, expires:Date.now()+WIN_MS, at, ftCount, ftExp, hold, steps};
  if(shot==='p2'||shot==='p3'){ ui.pending.flow = true; ui.pending.step = 0; }
  ui.foulType = null;
}
function resetPend(){ if(ui.pending) ui.pending.expires = Date.now()+WIN_MS; }
function ftProgress(){
  const p = ui.pending; if(!p || p.shot!=='ft') return;
  if(p.ftExp){ toast('free throw '+p.ftCount+' of '+p.ftExp+(p.ftCount>p.ftExp?' — more than expected':''), 2000); }
}
function toggleHold(){
  // livestats "put free throws on hold": freeze the countdown until released
  const p = ui.pending; if(!p) return;
  p.hold = !p.hold;
  if(!p.hold) resetPend();
  renderAll(); toast(p.hold ? 'window on hold — timer frozen' : 'window released');
}
function clearPending(msg){ ui.pending=null; ui.foulType=null; if(msg) toast(msg); renderAll(); }
function clearTransient(){ ui.armed=null; ui.pending=null; ui.subOut=null; ui.foulType=null; renderAll(); }

/* ==================== game screen render ==================== */
function renderAll(){
  /* A window opening while the sheet is up would leave the roster covered by
     a panel the scorer can no longer dismiss, so it closes itself. */
  try{
    const sh = document.getElementById('sheet');
    if(sh && (ui.armed || ui.pending || ui.subOut)) sh.classList.remove('open');
    if(sh) sh.classList.toggle('locked', !!(ui.armed || ui.pending || ui.subOut));
  }catch(_){}
  if(!S || S.phase==='setup') return;
  D = derive();
  if(S.phase==='final'){ refreshOpenViews(); return; }
  document.body.classList.toggle('pregame', S.phase==='pregame');
  /* EACH ON ITS OWN. These were one statement, so the first to throw took
     every one after it with it — a one-word mistake in the legend left the
     shot chart with no click handler and no error anybody would connect to
     it. A renderer that fails should cost its own panel and nothing else,
     and it should say so out loud rather than leaving a screen half drawn. */
  [renderTopbar, renderSubbar, renderScore, renderCols, renderX,
   renderHelp, renderMid, renderCmd, renderPregame].forEach(fn=>{
    try{ fn(); }
    catch(err){ console.error('render failed: '+fn.name, err); }
  });
  refreshOpenViews();
}

function renderPregame(){
  const box = document.getElementById('mpPregame');
  if(!box) return;
  const on = S.phase === 'pregame';
  box.classList.toggle('hidden', !on);
  /* the shot chart and the chips are meaningless before a shot exists, and the
     log is empty — so the middle column is the pre-game card and nothing else */
  ['mpCourt','mpChips','mpLog'].forEach(id=>{
    const n = document.getElementById(id); if(n) n.classList.toggle('hidden', on);
  });
  if(!on) return;
  const five = t => S.starters[t].length;
  box.innerHTML =
    '<div class="pgtitle">ready to start</div>'+
    '<div class="pgsub">'+esc(tname(0))+' '+five(0)+' starters · '+
      esc(tname(1))+' '+five(1)+' starters.<br>The clock starts when the tip is awarded.</div>'+
    '<div class="pgbtns">'+
      '<button class="pgbtn go" id="pgGo">begin game</button>'+
      '<button class="pgbtn" id="pgHelp">how the controls work</button>'+
      '<button class="pgbtn" id="pgSquads">edit squads</button>'+
    '</div>';
  document.getElementById('pgGo').onclick = beginGame;
  document.getElementById('pgHelp').onclick = openHelp;
  document.getElementById('pgSquads').onclick = openSquads;

  /* THE DEMO OPENS ON THE CONTROLS, ONCE.

     ?train=1 drops a stranger straight into a live scoring screen — the setup
     and the starter picker are clicked through on their behalf — so the first
     thing they see is two rosters, a clock, and no indication that a made
     basket is a hold rather than a tap. Every door into the demo arrives here,
     so gating it at this screen covers all of them at once and cannot be left
     off a new one later.

     Once per page load rather than once ever: coming back to the pregame card
     after editing the squads should not reopen it, and nor should a
     re-render. The button above stays, so it is never more than one tap away. */
  if(EP_TRAIN && !window.__hvSeen && EP_GUIDE){

function teamTappable(t){

function renderCols(){
  for(const t of [0,1]){
    const th = $('.thead[data-team="'+t+'"]');
    const left = timeoutsLeft(D,t), fouls = teamFoulsNow(D,t);
    const maxTo = S.period<=2?2:(S.period<=4?3:1);
    let dots=''; for(let i=0;i<maxTo;i++) dots += i<left?'●':'○';
    th.classList.toggle('tappable', teamTappable(t));
    const tcol = safeColour(S.teams[t].color);
    th.style.boxShadow = 'inset 0 0 22px '+tcol+'22';

    th.innerHTML = '<div class="tn" style="color:'+tcol+'">'+(D.poss===t?'<span class="possdot">◉</span>':'')+esc(tname(t))+'</div>'+
      '<div class="tsub">t/o '+dots+' · fouls '+fouls+
      (fouls>=4?' <span class="bonus">bonus</span>':(fouls===3?' <span class="bonus">+1→bonus</span>':''))+
      (idle?' <span style="opacity:.55">· ⇅ subs</span>':'')+'</div>';

    const pl = $('.plist[data-team="'+t+'"]');
    const onc = D.onCourt[t];
    const order = S.teams[t].players.filter(p=>onc.includes(p.id))
      .concat([null])
      .concat(S.teams[t].players.filter(p=>!onc.includes(p.id)));
    pl.innerHTML = order.map(p=>{
      if(p===null) return S.teams[t].players.length>onc.length ? '<div class="benchsep">— bench —</div>' : '';
      const stp = D.stats[p.id]||mkP();
      const isOn = onc.includes(p.id);
      let cls = 'prow'+(isOn?'':' bench');
      const pd = ui.pending;
      if(ui.armed && !pd && ui.armed!=='timeout') cls+=' armable';
      if(pd && pd.pid===p.id && pd.team===t) cls += (pd.kind==='made'?' hot-made':' hot-miss')+' ants';
      if(pd && pd.kind==='foul' && t!==pd.team) cls+=' armable';
      if(pd && pd.ftArmed && t===pd.team) cls+=' armable';
      if(pd && pd.pick && pickAllowed(pd.pick,t,p.id)) cls+=' armable';
      if(ui.subOut){ if(ui.subOut.pid===p.id) cls+=' suboutmark';
        else if(ui.subOut.team===t && !isOn) cls+=' subtarget'; }
      const out = stp.dq || stp.pf>=5;
      if(out) cls+=' fouledout';
      const pfBadge = out ? '<span class="ff">'+(stp.dq?'dq':'5f')+'</span>'
        : (stp.pf>0 ? '<span class="pfc'+(stp.pf>=4?' warn':'')+'">'+stp.pf+'f</span>' : '');
      return '<div class="'+cls+'" data-pid="'+p.id+'">'+
        '<span class="pname">'+esc(p.name)+'</span>'+pfBadge+
        '<span class="pnum" style="color:'+tcol+';text-shadow:0 0 14px '+tcol+'66">'+esc(p.num)+'</span></div>';
    }).join('');
  }
}

function renderX(){

  x.classList.toggle('hidden', !(ui.armed||ui.pending||ui.subOut));
  $('#delayB').classList.toggle('hidden', !(ui.pending||ui.subOut));

function removeEventKeep(id){
  // remove one event (+ its descriptors) without touching the live window
  S.events = S.events.filter(e=> e.id!==id && !((e.t==='tag'||e.t==='stype'||e.t==='loc') && e.ref===id));
  S.redo = [];
}
function cancelStep(){
  // ✕ / esc = cancel the newest provisional step of whatever is in progress:
  //   pick-in-progress → drop it · a recorded follow-up (block, assist, tag, ft, fouler) → remove it
  //   only the shot left → remove the shot and close · armed only → disarm · sub prompt → drop it
  const p = ui.pending;
  if(ui.subOut){ ui.subOut=null; renderAll(); toast('sub cancelled'); return; }
  if(p){
    if(p.pick){ p.pick=null; renderAll(); toast('cancelled — pick'); return; }
    if(p.ftArmed && (!p.steps || p.steps.length<=1)){ p.ftArmed=false; renderAll(); toast('cancelled — free throws'); return; }
    const steps = (p.steps||[]).filter(id=>evById(id));
    if(steps.length>1){
      const id = steps.pop(); const ev = evById(id);
      removeEventKeep(id); p.steps = steps;
      if(p.foulIdx===id) p.foulIdx = null;
      if(ev && ev.t.startsWith('ft_')) p.ftCount = Math.max(0,(p.ftCount||1)-1);
      if(p.anchorIdx===id){
        // the popped step was the window's own anchor (a later ft) — fall back to the previous primary
        const prev = [...steps].reverse().map(evById).find(e=>e && /^(ft_|p2_|p3_|to$|foul$)/.test(e.t));
        if(prev){ p.anchorIdx=prev.id; p.team=prev.team; p.pid=prev.pid;
          p.kind = /_made$/.test(prev.t)?'made':(/_miss$/.test(prev.t)?'miss':(prev.t==='to'?'to':'foul'));
          p.shot = prev.t.startsWith('ft')?'ft':(prev.t.startsWith('p2')?'p2':(prev.t.startsWith('p3')?'p3':null)); }
      }
      if(ev && ev.t==='ast') p.assistDone=false;
      resetPend(); save(); renderAll(); toast('cancelled: '+evLabel(ev)); return;
    }
    /* NOTHING LEFT TO TAKE BACK, BUT THERE IS SOMEWHERE TO GO BACK TO.

       Pressing ✕ on the location step threw the whole play away — the shot,
       the type already chosen, all of it — because the only event in the
       window was the shot itself. What a scorer means there is "not that, let
       me redo the last bit": they are three taps into a play and want the step
       before, not a blank scoresheet.

       So a flow with a step behind it walks back one instead. The play is
       still recorded, the type it had is still recorded, and ✕ from the FIRST
       step falls through and cancels for real, which is the only place that
       reading is unambiguous. */
    if(p.flow && p.step > 0){
      p.step--;
      resetPend(); save(); renderAll();
      toast('back to ' + flowSteps(p)[p.step]);
      return;
    }
    // the first step of the flow, or no flow at all → cancel it entirely
    const id = steps[0]; const ev = id!=null ? evById(id) : null;
    ui.pending=null; ui.foulType=null;
    if(id!=null) removeEventKeep(id);
    save(); renderAll(); toast(ev ? 'cancelled: '+evLabel(ev) : 'cancelled'); return;
  }
  if(ui.armed){ ui.armed=null; ui.foulType=null; renderAll(); toast('cancelled'); return; }
}
function finishWindow(){
  // "done": the recorded actions stand, the follow-up window simply closes
  if(!(ui.pending||ui.subOut)) return;
  ui.pending = null; ui.subOut = null; ui.foulType = null;
  renderAll(); toast('done');
}

/* ==================== touch-control legend ==================== */
/* A LEGEND MUST NAME THINGS THE READER HAS.

   Seven lines offered "✓ done · enter" and "✕ · esc" on a phone with no enter
   and no escape. Written as functions rather than constants because IS_TOUCH
   is declared further down the file: a const here would evaluate at load and
   die in the temporal dead zone, while a function body runs when the legend is
   drawn, long after. */
/* THE NON-TOUCH BRANCH IS THE KEY, NOT A CALL TO ITSELF. Written as
   DONEK() / CANCK() first time out, which on a phone returned the string and
   on a PC recursed until the stack gave out. helpSpec() is called by
   renderHelp(), which renderAll() runs BEFORE renderMid() — so the throw took
   the shot chart's click handler with it, and a statistician on a desktop
   could not place a shot at all. A legend typo, presenting as a dead court. */
const DONEK = () => IS_TOUCH ? '✓ done' : '✓ done · enter';
const CANCK = () => IS_TOUCH ? '✕ back' : '✕ · esc';

function helpSpec(){
  const p = ui.pending, L = [];
  const k = (key,txt,cls)=>L.push({key,txt,cls});
  if(ui.subOut){
    k('hold + drag ▲ up','bench player — sub in');
    k('✕','cancel the sub','x');
    return L;
  }
  if(p){
    if(p.ftArmed){
      k('tap player','ft missed','red');
      k('hold player 1.5s','ft made','grn');

const SHOTTYPES = ['layup','dunk','tip-in','jump shot','floater','hook','fadeaway'];
function shotAnchor(){

  if(!p || p.anchorIdx==null) return null;

/* ==========================================================================
   THE COURT — FIBA, to the centimetre.

   The viewBox IS the court: 1500 x 1400 centimetres, which is half of the
   28 m x 15 m FIBA playing area. Every number below is therefore a real
   measurement rather than something dialled in until it looked right, and
   anyone can check one against the rule book without decoding a scale factor.

   WHAT THE OLD ONE GOT WRONG, because it is worth saying: its three-point
   line was an arc of radius 45 drawn between two corner posts, which put its
   centre 18 units below the ring. A three-point line is by definition every
   point 6.75 m FROM THE RING, so an arc centred anywhere else is not a
   three-point line — it was several feet out at the wings and correct
   nowhere. The key was 5.2 m wide against a real 4.9 m, there was no
   restricted area, no lane marks, and the dashed line across the middle was
   at 66% of the way down a court that was not a half court to begin with.

   Angles are given in the FIBA rule book from the CENTRE OF THE RING, so
   that is the origin everything here hangs off:

     ring centre      1.575 m from the inner edge of the baseline
     backboard face   1.20 m from it, 1.80 m wide
     key              4.90 m wide, 5.80 m deep  (rectangular, post-2010)
     free-throw circle 1.80 m radius on the free-throw line
     restricted area  1.25 m radius from the ring centre
     three-point line 6.75 m radius, with straight sections 0.90 m in from
                      each sideline running back to the baseline
     centre circle    1.80 m radius

   The corner where the straight section meets the arc is NOT a number to be
   guessed: it is where a vertical line 0.90 m from the sideline crosses a
   circle of 6.75 m about the ring, so it is solved rather than typed.
   ========================================================================== */
/* One self-contained declaration on purpose: the public box score lifts this
   verbatim by name (supabase/tests/extract-boxscore.mjs), and that extractor
   is line-anchored — it takes a `const NAME =` and stops at the next line
   starting in column 0. A follow-up `COURT.CORNER_Y = …` statement would be
   left behind, and the copy would reference a value it never computed. */
const COURT = (function(){
  const C = {
    W:1500, H:1400,            // half of 28 x 15 m, in centimetres
    RIM_X:750, RIM_Y:157.5,    // centre of the ring
    RIM_R:22.5,                // 45 cm diameter
    BOARD_Y:120, BOARD_HALF:90,// backboard face, 1.80 m wide
    KEY_HALF:245, KEY_LEN:580, // 4.90 m x 5.80 m
    FT_R:180, RA_R:125, ARC_R:675, CORNER_X:90, CENTRE_R:180
  };
  /* where the corner straight meets the arc — solved, not eyeballed */
  C.CORNER_Y = C.RIM_Y + Math.sqrt(C.ARC_R*C.ARC_R - Math.pow(C.RIM_X - C.CORNER_X, 2));
  return C;
}());

function courtSVG(loc, opts){
  const C = COURT, o = opts || {};
  const kL = C.RIM_X - C.KEY_HALF, kR = C.RIM_X + C.KEY_HALF;     // 505 / 995
  const cy = +C.CORNER_Y.toFixed(2);                              // 299.01
  const arcR = C.ARC_R;
  /* THE FALLBACK IS NOT DECORATION. This court is drawn on three surfaces now
     — the scorer, the public box score and the season shot chart on a player
     profile — and only the first two load a stylesheet that defines --line-hi.
     On the player page every line resolved to `stroke: none`, so the court was
     not faint, it was absent: bins floating on an empty rectangle. A var()
     fallback makes the drawing portable to whatever page it is dropped on,
     which is what a shared component has to be. Same value as the token. */
  const line = 'var(--line-hi, rgba(190,255,225,.38))';

  /* Lane space marks, outside the lane lines, at the FIBA distances from the
     baseline. Dropped on the small chart, where four ticks a side become a
     smudge rather than information. */
  const ticks = o.plain ? '' : [175, 215, 300, 385].map(y =>
    '<path d="M '+kL+' '+y+' h -22 M '+kR+' '+y+' h 22" stroke="'+line+'" stroke-width="6"/>'
  ).join('');

  const mark = loc
    ? '<circle cx="'+(loc.x*C.W)+'" cy="'+(loc.y*C.H)+'" r="38" fill="var(--amber)" '+
      'stroke="rgba(255,220,150,.5)" stroke-width="18"/>'
    : '';

  return '<svg viewBox="0 0 '+C.W+' '+C.H+'" xmlns="http://www.w3.org/2000/svg" '+
      'preserveAspectRatio="xMidYMid meet">'+
    '<rect x="0" y="0" width="'+C.W+'" height="'+C.H+'" fill="rgba(140,255,200,.04)"/>'+
    /* the boundary, stroked so its INNER edge is the playing area */
    '<rect x="3" y="3" width="'+(C.W-6)+'" height="'+(C.H-6)+'" fill="none" '+
      'stroke="'+line+'" stroke-width="6"/>'+

    /* three point: 0.90 m in from each sideline, then 6.75 m about the ring */
    '<path d="M '+C.CORNER_X+' 0 V '+cy+' A '+arcR+' '+arcR+' 0 0 0 '+(C.W-C.CORNER_X)+' '+cy+
      ' V 0" fill="none" stroke="'+line+'" stroke-width="6"/>'+

    /* the key */
    '<rect x="'+kL+'" y="0" width="'+(C.KEY_HALF*2)+'" height="'+C.KEY_LEN+'" '+
      'fill="rgba(140,255,200,.06)" stroke="'+line+'" stroke-width="6"/>'+
    ticks+

    /* free-throw circle: solid away from the basket, dashed within the key */
    '<path d="M '+(C.RIM_X-C.FT_R)+' '+C.KEY_LEN+' A '+C.FT_R+' '+C.FT_R+' 0 0 0 '+
      (C.RIM_X+C.FT_R)+' '+C.KEY_LEN+'" fill="none" stroke="'+line+'" stroke-width="6"/>'+
    '<path d="M '+(C.RIM_X-C.FT_R)+' '+C.KEY_LEN+' A '+C.FT_R+' '+C.FT_R+' 0 0 1 '+
      (C.RIM_X+C.FT_R)+' '+C.KEY_LEN+'" fill="none" stroke="'+line+'" stroke-width="5" '+
      'stroke-dasharray="34 26"/>'+

    /* restricted area, closed back to the backboard as the rule book draws it */
    '<path d="M '+(C.RIM_X-C.RA_R)+' '+C.BOARD_Y+' V '+C.RIM_Y+
      ' A '+C.RA_R+' '+C.RA_R+' 0 0 0 '+(C.RIM_X+C.RA_R)+' '+C.RIM_Y+
      ' V '+C.BOARD_Y+'" fill="none" stroke="'+line+'" stroke-width="5"/>'+

    /* centre circle — only the half inside this end of the floor exists here */
    '<path d="M '+(C.RIM_X-C.CENTRE_R)+' '+C.H+' A '+C.CENTRE_R+' '+C.CENTRE_R+
      ' 0 0 1 '+(C.RIM_X+C.CENTRE_R)+' '+C.H+'" fill="none" stroke="'+line+'" stroke-width="6"/>'+

    /* backboard, its arm, and the ring */
    '<line x1="'+(C.RIM_X-C.BOARD_HALF)+'" y1="'+C.BOARD_Y+'" x2="'+(C.RIM_X+C.BOARD_HALF)+
      '" y2="'+C.BOARD_Y+'" stroke="var(--lume)" stroke-width="11" stroke-linecap="round"/>'+
    '<line x1="'+C.RIM_X+'" y1="'+C.BOARD_Y+'" x2="'+C.RIM_X+'" y2="'+(C.RIM_Y-C.RIM_R)+
      '" stroke="var(--lume)" stroke-width="6"/>'+
    '<circle cx="'+C.RIM_X+'" cy="'+C.RIM_Y+'" r="'+C.RIM_R+'" fill="none" '+
      'stroke="var(--lume)" stroke-width="7"/>'+
    mark+'</svg>';
}
/* ============================================================================
   WHERE A SHOT WAS TAKEN AND WHAT IT WAS WORTH HAVE TO AGREE.

   These are two separate facts in the log — the p2_/p3_ event says what it was
   worth, a later `loc` event says where it came from — and nothing made them
   consistent. recordLoc took whatever was tapped. So a three could be recorded
   in the paint, and on the demo season 615 of 709 three-point attempts plot
   INSIDE the arc while not one of 1,249 twos plots outside it.

   THE VALUE IS THE FACT THAT MATTERS AND THE ONE TO TRUST. It decides the
   score, it is chosen deliberately by tapping 3PT, and it is checked against
   the scoreboard all night. The location is a thumb on a court three inches
   wide, entered in a hurry, and nobody proofreads it. So where they disagree
   the location moves, never the value.

   arcSide() is the geometry, and the corner is why it is not one line: the
   three-point line is two straights 90cm in from each sideline, and only above
   where they meet the arc is distance-from-the-ring the test. Below that the
   arc runs OUTSIDE the straights, so a distance test alone calls a genuine
   corner three a two.
   ============================================================================ */
function arcSide(nx, ny){
  const C = COURT, px = nx*C.W, py = ny*C.H;
  if(px <= C.CORNER_X || px >= C.W - C.CORNER_X) return true;      // outside a straight
  return Math.hypot(px - C.RIM_X, py - C.RIM_Y) > C.ARC_R;
}

/* The nearest point on the correct side of the line, stepped a little past it
   so a snapped shot reads as clearly beyond (or clearly within) rather than
   sitting on the paint. Three candidate boundaries — the arc and the two
   straights — nearest one wins, which is what keeps a corner shot in the
   corner instead of flinging it radially out through the baseline. */
function snapToValue(nx, ny, wantThree){
  if(arcSide(nx, ny) === !!wantThree) return {x:nx, y:ny, moved:false};
  const C = COURT, STEP = 25;                                      // 25cm past the line
  const px = nx*C.W, py = ny*C.H;
  const cand = [];

  /* on the arc, radially from the ring — valid only where the arc is the
     boundary, i.e. beyond where it meets the straights */
  const dx = px - C.RIM_X, dy = py - C.RIM_Y;
  const d  = Math.hypot(dx, dy) || 1;
  const r  = C.ARC_R + (wantThree ? STEP : -STEP);
  const ax = C.RIM_X + dx/d*r, ay = C.RIM_Y + dy/d*r;
  if(ay >= C.CORNER_Y) cand.push({x:ax, y:ay});

  /* On either straight, at this shot's own depth. NEAR SIDE FIRST, because
     the two are equidistant from anything down the middle and a tie that
     always resolves left would invent a left-corner hot spot out of the
     shots whose location was nonsense to begin with — a three logged under
     the ring has no right answer, but it should at least stay on the half of
     the floor it was taken on. */
  const depth = Math.max(STEP, Math.min(C.CORNER_Y, py));
  const inset = wantThree ? -STEP : STEP;
  const near  = {x:C.CORNER_X + inset,       y:depth};
  const far   = {x:C.W - C.CORNER_X - inset, y:depth};
  cand.push(px < C.RIM_X ? near : far);
  cand.push(px < C.RIM_X ? far  : near);

  const best = cand.reduce((a,b)=>
    Math.hypot(b.x-px, b.y-py) < Math.hypot(a.x-px, a.y-py) ? b : a);
  return {
    x: +Math.max(0.01, Math.min(0.99, best.x/C.W)).toFixed(3),
    y: +Math.max(0.01, Math.min(0.99, best.y/C.H)).toFixed(3),
    moved: true
  };
}

function wireLogRows(root){
  root.querySelectorAll('.ldel').forEach(b=>b.addEventListener('click', e=>{
    e.stopPropagation(); confirmDelete(+b.dataset.id);
  }));
  // tap = edit; swipe left = delete (mobile); plain click works on desktop too
  root.querySelectorAll('.logrow.editable').forEach(row=>{
    let g = null;
    row.addEventListener('pointerdown', e=>{
      if(e.target.closest('.ldel')) return;
      g = {x:e.clientX, y:e.clientY, swiped:false};
      try{ row.setPointerCapture(e.pointerId); }catch(err){}
    });
    row.addEventListener('pointermove', e=>{
      if(!g) return;
      const dx = e.clientX-g.x, dy = e.clientY-g.y;
      if(Math.abs(dx)>14 && Math.abs(dx)>Math.abs(dy)*1.5){
        row.style.transform = 'translateX('+Math.max(-90,Math.min(0,dx))+'px)';
        if(dx<-60) g.swiped = true;
      }
    });
    row.addEventListener('pointerup', e=>{
      if(!g) return;
      row.style.transform = '';
      const dist = Math.hypot(e.clientX-g.x, e.clientY-g.y);
      const swiped = g.swiped; g = null;
      const id = +row.dataset.id;
      if(swiped) confirmDelete(id);
      else if(dist<10) openEvEditor(id);
    });
    row.addEventListener('pointercancel', ()=>{ if(g){ row.style.transform=''; g=null; } });
  });
}
/* ==================== the controls reference ====================
   EVERY CONTROL, FOR THE DEVICE IN YOUR HANDS.

   Two genuinely different apps share this code. On a phone a made basket is a
   press-and-hold, the typed command bar does not exist, and there is no key to
   press for anything; on a desktop the same basket is a 1.5-second hold or
   four typed characters, and half the app is reachable from the keyboard. One
   list covering both would spend most of its length telling each reader about
   controls they do not have — which is exactly how the legend came to offer
   "esc" to a phone.

   So the reference is built for ONE device and offers the other as a toggle
   rather than mixing them. A statistician reading up on a laptop before
   scoring a game on a tablet still needs to see the touch controls, so the
   switch exists — but it is a deliberate act, not the default.

   THE DIRECTIONS ARE DRAWN, NOT DESCRIBED. "Drag toward the middle" is a
   sentence the reader has to translate into a movement, and it is ambiguous
   the moment you notice the two teams face opposite ways: inward is RIGHT for
   the left-hand column and LEFT for the right-hand one. An arrow beside a
   roster column is the movement itself. */

let HV_MODE = null;         // 'touch' | 'key' — null means "whatever this is"

function hvMode(){ return HV_MODE || (IS_TOUCH ? 'touch' : 'key'); }

/* The gesture map, drawn: two roster columns with the arrows that actually
   fire, labelled with what they record. One picture instead of the four
   paragraphs it replaces. */
function hvCourtSVG(){
  const line = 'var(--line-hi, rgba(190,255,225,.38))';
  const arrow = (x1,y1,x2,y2) => {           /* a shaft with a head on the far end */
    const dx = x2-x1, dy = y2-y1, L = Math.hypot(dx,dy), ux = dx/L, uy = dy/L;
    const bx = x2-ux*9, by = y2-uy*9, px = -uy*6, py = ux*6;
    return '<path d="M '+x1+' '+y1+' L '+x2+' '+y2+
           ' M '+(bx+px)+' '+(by+py)+' L '+x2+' '+y2+' L '+(bx-px)+' '+(by-py)+'"/>';
  };
  /* Columns are inset far enough that the OUTWARD arrows have somewhere to go.
     Drawing only the inward ones left "outward = block" as a caption with no
     picture attached, which is the half of the gesture people get wrong. */
  const col = (x,label,facing) =>
    '<rect x="'+x+'" y="40" width="120" height="132" rx="10" fill="rgba(140,255,200,.05)" '+
      'stroke="'+line+'"/>'+
    '<text x="'+(x+60)+'" y="32" text-anchor="middle" fill="var(--dim)" font-size="11" '+
      'letter-spacing="1.4">'+label+'</text>'+
    [0,1,2,3].map(i=>'<rect x="'+(x+9)+'" y="'+(50+i*31)+'" width="102" height="23" rx="7" '+
      'fill="rgba(200,255,230,.06)" stroke="var(--line, rgba(170,255,215,.16))"/>').join('')+
    '<g stroke="var(--lume)" stroke-width="2.5" fill="none" stroke-linecap="round" '+
      'stroke-linejoin="round">'+
      (facing==='right' ? arrow(x+128, 92, x+172, 92) : arrow(x-8, 92, x-52, 92))+
    '</g>'+
    '<g stroke="var(--dim)" stroke-width="2" fill="none" stroke-linecap="round" '+
      'stroke-linejoin="round" opacity=".8">'+
      (facing==='right' ? arrow(x-8, 140, x-36, 140) : arrow(x+128, 140, x+156, 140))+
    '</g>';

  return '<svg class="hv-court" viewBox="0 0 520 274" xmlns="http://www.w3.org/2000/svg" '+
      'preserveAspectRatio="xMidYMid meet" role="img" '+
      'aria-label="Two roster columns facing each other across the middle of the screen. '+
      'Holding a player and dragging toward the middle records a rebound, an assist or a '+
      'steal. Dragging toward the outer edge records a block. Dragging down takes a player '+
      'off the floor and dragging up brings one on, on either side.">'+
    col(44,'left team','right')+
    col(356,'right team','left')+
    /* what the two inward arrows are both pointing at */
    '<text x="260" y="82" text-anchor="middle" fill="var(--lume)" font-size="12" '+
      'letter-spacing="1.2">toward the middle</text>'+
    '<text x="260" y="100" text-anchor="middle" fill="var(--dim)" font-size="10.5">'+
      'rebound · assist · steal</text>'+
    /* and what the two faint outward ones are, said where they point away to */
    '<text x="260" y="138" text-anchor="middle" fill="var(--faint)" font-size="10">'+
      '← outward · block · outward →</text>'+
    /* THE VERTICAL PAIR SITS IN THE MIDDLE ON PURPOSE. Drawn under the columns
       they read as "left team subs out, right team subs in", which is not what
       they mean: both work on either side. */
    '<text x="260" y="196" text-anchor="middle" fill="var(--faint)" font-size="10">'+
      'either team</text>'+
    '<g stroke="var(--lume)" stroke-width="2.5" fill="none" stroke-linecap="round" '+
      'stroke-linejoin="round" opacity=".9">'+
      arrow(196, 212, 196, 244)+
      arrow(316, 244, 316, 212)+
    '</g>'+
    '<text x="208" y="238" fill="var(--dim)" font-size="10.5">down · sub out</text>'+
    '<text x="328" y="238" fill="var(--dim)" font-size="10.5">up · sub in</text>'+
    '</svg>';
}
