const TEAMCOLORS = ['#93f2bf','#8ff5ff','#ffb3ef','#ffd166','#b7a8ff','#ff8f97',
  '#ffffff','#ff9f43','#c8ff5a','#5ab8ff','#ff5fb0','#d7c4a1'];
function initSetup(){
  $$('.team-card').forEach((card,t)=>{
    const sw = document.createElement('div');
    sw.className = 'swatches';
    sw.innerHTML = TEAMCOLORS.map(c=>
      '<span class="swatch" data-c="'+c+'" style="background:'+c+';color:'+c+'"></span>').join('');
    card.insertBefore(sw, card.querySelector('.roster'));
    const def = t===0 ? TEAMCOLORS[0] : TEAMCOLORS[1];
    card.dataset.color = def;
    sw.querySelector('[data-c="'+def+'"]').classList.add('on');
    sw.addEventListener('click', e=>{
      const s = e.target.closest('.swatch'); if(!s) return;
      sw.querySelectorAll('.swatch').forEach(x=>x.classList.remove('on'));
      s.classList.add('on');
      card.dataset.color = s.dataset.c;
    });
    const roster = card.querySelector('.roster');
    for(let i=0;i<5;i++) roster.appendChild(rosterRowEl());
    card.querySelector('.addP').addEventListener('click', ()=>roster.appendChild(rosterRowEl()));
    const file = card.querySelector('.scanFile');
    card.querySelector('.scanP').addEventListener('click', ()=>file.click());
    file.addEventListener('change', ()=>{ if(file.files[0]) handleScan(card, file.files[0]); file.value=''; });
  });
  $('#goGame').addEventListener('click', startGame);
  $('#trainB').addEventListener('click', startTraining);
}
function startTraining(){
  const roster1 = ['ada lovelace','grace hopper','katherine johnson','hedy lamarr','radia perlman',
    'annie easley','mary jackson','dorothy vaughan','margaret hamilton','joan clarke',
    'frances allen','barbara liskov'];
  const roster2 = ['miles davis','john coltrane','bill evans','paul chambers','jimmy cobb',
    'wynton kelly','cannonball adderley','lee morgan','art blakey','horace silver',
    'freddie hubbard','dexter gordon'];
  showStarterPick([
    {name:'neon city', color:TEAMCOLORS[0], players:roster1.map((n,i)=>({id:'p0_'+i, name:n, num:String(i+4)}))},
    {name:'soft club', color:TEAMCOLORS[1], players:roster2.map((n,i)=>({id:'p1_'+i, name:n, num:String(i+4)}))}
  ]);
}
function startGame(){
  const teams = [];
  $$('.team-card').forEach((card,t)=>{
    const name = (card.querySelector('.tname').value.trim() || 'team '+(t+1)).toLowerCase();
    const players = [];
    card.querySelectorAll('.rrow').forEach(r=>{
      const nm = r.querySelector('.rname').value.trim();
      if(!nm) return;
      players.push({id:'p'+t+'_'+players.length, name:nm.toLowerCase(),
        num:r.querySelector('.rnum').value.trim()});
    });
    teams.push({name, players, color:card.dataset.color||TEAMCOLORS[t]});
  });
  if(!teams[0].players.length || !teams[1].players.length){ toast('add players to both teams'); return; }
  const proceed = ()=>showStarterPick(teams);
  if(teams[0].players.length<5 || teams[1].players.length<5)
    askConfirm('fewer than five on a team — start anyway?', proceed);
  else proceed();
}

/* ==================== starting-five picker ==================== */
let SP = null;
function showStarterPick(teams){
  SP = {teams, sel:[new Set(teams[0].players.slice(0,5).map(p=>p.id)),
                    new Set(teams[1].players.slice(0,5).map(p=>p.id))]};
  renderStarterPick();
  showScreen('startersview');
}
function renderStarterPick(){
  const need = t => Math.min(5, SP.teams[t].players.length);
  const colHTML = t => {
    const rows = SP.teams[t].players.map(p=>{
      const on = SP.sel[t].has(p.id);
      return '<div class="prow'+(on?' startsel':' bench')+'" data-team="'+t+'" data-pid="'+p.id+'">'+
        '<span class="pname">'+esc(p.name)+'</span><span class="pnum">'+esc(p.num)+'</span></div>';
    }).join('');
    return '<div class="spcol"><div class="glass sphead"><div class="tn">'+esc(SP.teams[t].name)+'</div>'+
      '<div class="tsub">'+SP.sel[t].size+' / '+need(t)+' starters</div></div>'+
      '<div class="splist" data-team="'+t+'">'+rows+'</div></div>';
  };
  const ok = SP.sel[0].size===need(0) && SP.sel[1].size===need(1);
  $('#startersview').innerHTML =
    '<div class="ovhead"><button class="backbtn" id="spBack">← rosters</button>'+
    '<div class="ovtitle">pick the starting fives</div></div>'+
    '<div class="spgrid">'+colHTML(0)+colHTML(1)+'</div>'+
    '<button id="spGo" class="bigcta" style="margin:10px auto 14px;'+(ok?'':'opacity:.35;')+'">start game</button>';
  $('#spBack').onclick = ()=>{ SP=null; showScreen('setup'); };
  $$('#startersview .splist').forEach(el=>el.addEventListener('click', e=>{
    const r = e.target.closest('.prow'); if(!r) return;
    const t = +r.dataset.team, pid = r.dataset.pid, sel = SP.sel[t];
    if(sel.has(pid)) sel.delete(pid);
    else {
      if(sel.size>=need(t)){ toast('five already picked — deselect one first'); return; }
      sel.add(pid);
    }
    renderStarterPick();
  }));
  $('#spGo').onclick = ()=>{
    if(!(SP.sel[0].size===need(0) && SP.sel[1].size===need(1))){ toast('pick five per team'); return; }
    const teams = SP.teams;
    const starters = [teams[0].players.filter(p=>SP.sel[0].has(p.id)).map(p=>p.id),
                      teams[1].players.filter(p=>SP.sel[1].has(p.id)).map(p=>p.id)];
    SP = null;
    launchGame(teams, starters);
  };
}
/* ==================== the pre-game hold ====================
   THE GAME SCREEN BEFORE THE GAME. Same columns, same score box, same
   everything — the clock simply has not started and there are two buttons in
   the middle of it.

   It exists because the minute before a tip is the minute the squad changes.
   Somebody is late, somebody is injured in the warm-up, a coach names a
   different five than the team sheet said. The old flow went from the starter
   picker straight into a live game and immediately asked who won the tip, so
   the only way to fix a squad was to abandon the game and set it up again.

   NOTHING IS RECORDED YET. No period_start, so the event log begins when the
   game does; and bootstrap.js only claims the fixture and publishes the roster
   snapshot once the phase is 'game', so the squad written to the public page is
   the one after these edits rather than the one from the team sheet. */
function launchGame(teams, starters){
  S = newState();
  S.teams = teams; S.phase = 'pregame'; S.starters = starters;
  buildPmap();
  save();
  showScreen('game');
  renderAll();
  toast('check the squads, then begin the game', 4200);
}

/* Refuse anything that would record a fact about a game that has not started.
   One helper rather than a disabled attribute on each control, because the
   keyboard shortcuts reach the same actions without going near the buttons. */
function pregameHold(){
  if(S && S.phase === 'pregame'){ toast('begin the game first'); return true; }
  return false;
}

function beginGame(){
  if(!S || S.phase !== 'pregame') return;
  S.phase = 'game';
  addEvent({t:'period_start'});
  /* showScreen again on purpose: bootstrap.js claims the fixture on a screen
     change and skips it unless the phase is 'game'. This is the moment both
     are true, and it is when the public page should start showing the game. */
  showScreen('game');
  renderAll();
  jumpTap();               // who won the tip -> possession, arrow, and the clock
}

/* ==================== the squad editor ====================
   Reached from the pre-game hold, and only from there: once a game is under
   way its roster is frozen by design, because a name added at half time would
   silently rewrite who was available in the first half.

   Three ways a player arrives, because there are three ways it happens in a
   hall. Somebody on the club's published roster who was left off the team
   sheet is pulled from the club. Somebody who is not on it at all — a late
   registration, a call-up — is typed in. And somebody who is not playing is
   taken off. Starters are chosen here too, so the one screen answers the whole
   question rather than sending anybody back to the picker.

   THE EDITS ARE TO THE GAME, NOT TO THE CLUB. Nothing here writes to the
   database: a club's roster is the club's to maintain, and a statistician
   fixing tonight's line-up must not silently re-register anybody. What is
   written is the game's own roster snapshot, and only when the game begins. */
let SQ = null;

function openSquads(){
  if(!S || S.phase !== 'pregame') return;
  /* hasClub distinguishes "the club roster is exhausted" from "there is no club
     behind this game" — a training game and a friendly have no published
     roster to pull from, and telling somebody everybody is already on the sheet
     when nothing was ever looked up is a small lie the screen does not need. */
  const hasClub = !!(window.EpinoiaSquads && window.EpinoiaSquads.available());
  SQ = { pool:[null,null], hasClub };
  renderSquads();
  showScreen('squadsview');
  /* the club rosters are fetched in the background — the screen is usable
     without them, and a friendly with no fixture behind it never has them */
  if(hasClub){
    [0,1].forEach(t=>{
      window.EpinoiaSquads.roster(t)
        .then(list=>{ if(SQ){ SQ.pool[t] = list; renderSquads(); } })
        .catch(()=>{ if(SQ){ SQ.pool[t] = []; renderSquads(); } });
    });
  } else {
    SQ.pool = [[],[]];
  }
}

function squadColHTML(t){
  const players = S.teams[t].players;
  const starters = new Set(S.starters[t]);
  const need = Math.min(5, players.length);
  const rows = players.map(p=>{
    const on = starters.has(p.id);
    return '<div class="sqrow" data-team="'+t+'" data-pid="'+esc(p.id)+'">'+
      '<span class="sqnum">'+esc(p.num||'')+'</span>'+
      '<span class="sqname">'+esc(p.name)+'</span>'+
      '<button class="sqpill'+(on?' on':'')+'" data-role="start">'+(on?'starter':'bench')+'</button>'+
      '<button class="sqx" data-role="drop" title="not playing tonight">✕</button>'+
    '</div>';
  }).join('') || '<div class="sqnote">nobody in this squad yet.</div>';

  /* only the ones NOT already in the squad — offering a name that is already
     on the sheet is how a player ends up in it twice */
  const have = new Set(players.map(p=>String(p.name).toLowerCase()));
  const pool = (SQ.pool[t] || []).filter(p=>!have.has(String(p.name).toLowerCase()));
  const poolHTML = !SQ.hasClub
    ? '<div class="sqnote">No club roster behind this game — add anybody by name above.</div>'
    : SQ.pool[t] == null
    ? '<div class="sqnote">loading the club roster…</div>'
    : (pool.length
        ? '<div class="sqnote">on the club roster, not on tonight\'s sheet:</div>'+
          pool.map(p=>'<div class="sqrow" data-team="'+t+'" data-pid="'+esc(p.id)+'">'+
            '<span class="sqnum">'+esc(p.num||'')+'</span>'+
            '<span class="sqname">'+esc(p.name)+'</span>'+
            '<button class="sqpill" data-role="add">add</button></div>').join('')
        : '<div class="sqnote">everybody on the club roster is on the sheet.</div>');

  return '<div class="sqcol"><div class="glass sqhead"><span class="tn">'+esc(tname(t))+'</span>'+
    '<span class="tsub">'+starters.size+' / '+need+' starters · '+players.length+' available</span></div>'+
    rows +
    '<div class="sqadd" data-team="'+t+'">'+
      '<input class="num" data-role="num" placeholder="#" maxlength="3" inputmode="numeric">'+
      '<input data-role="name" placeholder="add a player by name" maxlength="40">'+
      '<button data-role="manual">add</button></div>'+
    poolHTML + '</div>';
}

function renderSquads(){
  if(!SQ) return;
  const need = t => Math.min(5, S.teams[t].players.length);
  const ok = S.starters[0].length===need(0) && S.starters[1].length===need(1);
  $('#squadsview').innerHTML =
    '<div class="ovhead"><button class="backbtn" id="sqBack">← pre-game</button>'+
    '<div class="ovtitle">edit squads</div></div>'+
    '<div class="sqgrid">'+squadColHTML(0)+squadColHTML(1)+'</div>'+
    '<button id="sqDone" class="bigcta" style="margin:4px auto 18px;'+(ok?'':'opacity:.35;')+'">done</button>';

  $('#sqBack').onclick = closeSquads;
  $('#sqDone').onclick = ()=>{
    if(!ok){ toast('pick five per team'); return; }
    closeSquads();
  };

  /* onclick, not addEventListener: renderSquads runs again after every toggle,
     and a listener added each time would fire once per render — the second tap
     on a starter pill would toggle it twice and leave it where it started. */
  $('#squadsview').onclick = e=>{
    const btn = e.target.closest('button[data-role]');
    if(!btn) return;
    const role = btn.dataset.role;
    if(role==='manual'){ addManual(+btn.closest('.sqadd').dataset.team); return; }
    const row = btn.closest('.sqrow'); if(!row) return;
    const t = +row.dataset.team, pid = row.dataset.pid;
    if(role==='start') toggleStarter(t, pid);
    else if(role==='drop') dropPlayer(t, pid);
    else if(role==='add') addFromPool(t, pid);
  };
}

function closeSquads(){
  SQ = null;
  buildPmap();
  save();
  showScreen('game');
  renderAll();
}

function toggleStarter(t, pid){
  const list = S.starters[t];
  const i = list.indexOf(pid);
  if(i>=0) list.splice(i,1);
  else {
    const need = Math.min(5, S.teams[t].players.length);
    if(list.length>=need){ toast('five already picked — take one off first'); return; }
    list.push(pid);
  }
  save(); renderSquads();
}

function dropPlayer(t, pid){
  const players = S.teams[t].players;
  const i = players.findIndex(p=>p.id===pid);
  if(i<0) return;
  players.splice(i,1);
  const si = S.starters[t].indexOf(pid);
  if(si>=0) S.starters[t].splice(si,1);
  save(); renderSquads();
}

function addPlayerTo(t, player){
  const players = S.teams[t].players;
  if(players.some(p=>String(p.name).toLowerCase()===String(player.name).toLowerCase())){
    toast('already on the sheet'); return false;
  }
  players.push(player);
  save(); renderSquads();
  return true;
}

function addFromPool(t, pid){
  const p = (SQ.pool[t]||[]).find(x=>x.id===pid);
  if(!p) return;
  addPlayerTo(t, {id:p.id, name:p.name, num:p.num});
}

function addManual(t){
  const wrap = $('#squadsview .sqadd[data-team="'+t+'"]');
  const nameEl = wrap.querySelector('[data-role="name"]');
  const numEl = wrap.querySelector('[data-role="num"]');
  const name = nameEl.value.trim().toLowerCase();
  if(!name){ toast('type a name first'); return; }
  /* A local id, distinct from the club roster's UUIDs, so a manually added
     player is never mistaken for a registered one when the snapshot is read
     back. Nothing downstream needs it to be a UUID — the snapshot carries the
     name and number, which is what a box score shows. */
  addPlayerTo(t, {id:'x'+t+'_'+Date.now().toString(36), name, num:numEl.value.trim()});
  nameEl.value = ''; numEl.value = '';
  nameEl.focus();
}

/* ==================== roster scan (ocr) ==================== */
function loadTesseract(){
  return new Promise((res,rej)=>{
    if(window.Tesseract) return res();
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    sc.onload = res; sc.onerror = ()=>rej(new Error('offline'));
    document.head.appendChild(sc);
  });
}
function parseRoster(text){
  const players = []; let teamName = null;
  text.split('\n').map(l=>l.trim()).filter(Boolean).forEach(line=>{
    let m = line.match(/^[\s#*.•\-]*(\d{1,2})[\s.):\-]+([A-Za-zÀ-ÿ'`.\- ]{2,40})$/);
    if(m){ players.push({num:m[1], name:m[2].trim()}); return; }
    m = line.match(/^([A-Za-zÀ-ÿ'`.\- ]{2,40}?)[\s.]+#?(\d{1,2})$/);
    if(m){ players.push({num:m[2], name:m[1].trim()}); return; }
    if(!teamName && !/\d/.test(line) && line.length>=3 && line.length<=28 &&
       /^[A-Za-zÀ-ÿ'&.\- ]+$/.test(line)) teamName = line;
  });
  return {teamName, players};
}
async function handleScan(card, file){
  toast('reading roster… hold on', 20000);
  try{
    await loadTesseract();
    const res = await Tesseract.recognize(file, 'eng');
    const {teamName, players} = parseRoster(res.data.text || '');
    if(!players.length){ toast('couldn’t read any players — add manually', 3500); return; }
    const tn = card.querySelector('.tname');
    if(teamName && !tn.value.trim()) tn.value = teamName.toLowerCase();
    const roster = card.querySelector('.roster');
    players.forEach(p=>{
      let row = [...roster.querySelectorAll('.rrow')].find(r=>!r.querySelector('.rname').value.trim());
      if(!row){ row = rosterRowEl(); roster.appendChild(row); }
      row.querySelector('.rnum').value = p.num;
      row.querySelector('.rname').value = p.name.toLowerCase();
    });
    toast('scanned '+players.length+' players — check & edit', 3500);
  }catch(err){
    toast('scan needs internet — add players manually', 4000);
  }
}

/* ==================== boot ==================== */
wireGame(); wireConfirm(); initSetup();
S = newState();
function migrate(s){
  if(!s || !s.events) return s;
  if(!s.evSeq || s.events.some(e=>e.id==null)){
    let q = 0;
    s.events.forEach(e=>{ e.id = ++q; });
    s.events.forEach(e=>{
      if((e.t==='tag'||e.t==='stype'||e.t==='loc') && e.idx!=null){
        const t = s.events[e.idx]; e.ref = t ? t.id : null; delete e.idx;
      }
    });
    s.evSeq = q;
  }
  return s;
}
/* THE SAVED GAME AND THE FIXTURE IN THE URL ARE TWO DIFFERENT INTENTIONS,
   and until now the second one lost.

   Opening the scorer from a box score puts ?g=<fixture> in the URL: the
   statistician has said, unambiguously, which game they mean to score. If any
   game was left saved in this browser — a practice run, an abandoned setup,
   last week's fixture — this asked "resume the saved game?" and, on `no`,
   reset to a blank setup screen.

   Meanwhile bootstrap.js had ALREADY loaded the requested fixture behind the
   modal, because S is still null while the question is open and its "a game is
   in progress" guard therefore saw nothing to stop for. So `no` threw away the
   very fixture that had just been asked for and left an empty sheet, with the
   real game one navigation away. The answer arrived after the work it was
   meant to govern.

   Two fixes, and they are separate concerns:

   THE HANDSHAKE. The question is settled BEFORE the fixture loads rather than
   alongside it — bootstrap waits on window.__epResume — so nothing is built
   behind the dialog and declining the saved game falls through to loading the
   fixture instead of to a blank screen.

   WHICH GAME IS SAVED. A saved game carries no fixture id of its own, so
   "resume" could quietly reopen last week's game while the URL — and with it
   the live transport and the finalise button — still pointed at tonight's,
   publishing one game's events into another fixture. bootstrap now stamps the
   fixture a saved game belongs to, and when that disagrees with the URL the
   question says so rather than pretending the two are the same thing. */
/* THE SCORER OPENS ON THE SETUP SCREEN, ALWAYS.

   There used to be a modal here — "resume the saved game?" — asked before the
   page had drawn and before anybody had said what they came for. Every answer
   it offered was wrong for somebody. "Yes" reopened whatever was in storage
   against whatever fixture the URL named, which published one game's events
   into another. "No" destroyed a game's work on a single tap, with no undo.
   And on the demo, "no" reset the state and dropped the visitor into the
   league fixture picker — a screen they had no business seeing.

   All three are downstream of asking at all. The saved game is now KEPT,
   untouched, and offered from the bar at the foot of the screen alongside the
   other ways out (see bootstrap.js). Nothing is restored without being asked
   for, nothing is discarded without being asked for, and the page opens the
   same way every time. window.__epResume stays, permanently settled, because
   bootstrap.js waits on it before loading a fixture. */
window.__epResume = { pending:false, resumed:false, done:null };

/* Exposed for the load control in the bar. Both were already global by virtue
   of being top-level declarations in a classic script; naming them here is a
   statement that bootstrap.js is allowed to use them. */
window.loadSaved = loadSaved;
window.migrateSaved = migrate;
window.applySaved = function (saved) {
  S = saved; S.running = false; buildPmap();
  if (S.phase === 'final') { renderFinal(); showScreen('finalview'); }
  else { showScreen('game'); renderAll(); }
};
window.describeSaved = function (saved) {
  if (!saved || !saved.teams) return null;
  const names = saved.teams.map(t => t && t.name ? t.name : 'team');
  let a = 0, b = 0;
  (saved.events || []).forEach(e => {
    const v = e.t === 'p3_made' ? 3 : e.t === 'p2_made' ? 2 : e.t === 'ft_made' ? 1 : 0;
    if (v && e.team === 0) a += v; else if (v) b += v;
  });
  return { names: names, score: [a, b], phase: saved.phase,
           period: saved.period || 1, events: (saved.events || []).length };
};

(function boot(){ showScreen('setup'); })();
</script>
