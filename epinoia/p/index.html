<!DOCTYPE html>
<html lang="en">
<head>

      content="default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.twitch.tv https://player.vimeo.com https://www.facebook.com">

<style>
  /* ---- identity band: photo top-left, name beside it ---- */
  .idband{display:flex;gap:16px;align-items:flex-start;
    padding:calc(var(--u)*3);border-bottom:1px solid var(--rule)}
  .photo{position:relative;width:96px;height:96px;flex:none;border-radius:6px;
    overflow:hidden;background:var(--panel-2);border:1px solid var(--rule-2);
    display:grid;place-items:center}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .photo .ini{font-family:var(--f-score);font-size:34px;color:var(--ink-3);line-height:1}
  .photo .num{position:absolute;left:0;bottom:0;padding:2px 6px 0;
    font-family:var(--f-score);font-size:15px;color:var(--on-accent);background:var(--team-a,var(--lume))}
  .idmeta{min-width:0;flex:1}
  .idmeta h1{font-family:var(--f-ui);font-weight:800;font-size:clamp(22px,4.6vw,34px);
    margin:0;letter-spacing:-.01em;line-height:1.05}
  .idmeta .sub{font-family:var(--f-micro);font-size:9.5px;color:var(--ink-3);
    letter-spacing:.12em;text-transform:uppercase;margin-top:7px;display:flex;
    gap:8px;flex-wrap:wrap;align-items:center}
  .idmeta .sub a{color:var(--ink-2);text-decoration:none}
  .idmeta .sub a:hover{color:var(--lume)}
  .pos-chip{border:1px solid var(--rule-2);border-radius:999px;padding:3px 9px}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:1px;
    background:var(--rule);border-bottom:1px solid var(--rule)}
  .tile{background:var(--ground);padding:calc(var(--u)*2) calc(var(--u)*1.5);text-align:center}
  .tile .v{font-family:var(--f-score);font-size:26px;line-height:1;color:var(--ink)}
  .tile .l{font-family:var(--f-micro);font-size:8px;color:var(--ink-3);
    letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
  .tile.hi .v{color:var(--lume)}

  .sec{border-bottom:1px solid var(--rule)}
  .sec-h{display:flex;align-items:baseline;gap:12px;
    padding:calc(var(--u)*3) calc(var(--u)*3) calc(var(--u)*1.5)}
  .sec-h .idx{font-family:var(--f-micro);font-size:9px;color:var(--lume);letter-spacing:.14em}
  .sec-h h2{font-family:var(--f-ui);font-weight:800;font-size:13px;text-transform:uppercase;
    letter-spacing:.05em;margin:0}
  .sec-h .note{margin-left:auto;font-family:var(--f-micro);font-size:9px;color:var(--ink-3)}

  .empty{padding:calc(var(--u)*4) calc(var(--u)*3);text-align:center;color:var(--ink-3);
    font-family:var(--f-micro);font-size:10px;line-height:1.9}
  .bar{display:flex;align-items:center;gap:12px;padding:calc(var(--u)*2) calc(var(--u)*3);
    border-bottom:1px solid var(--rule);flex-wrap:wrap}
  .wm{font-family:var(--f-score);font-size:19px;
    background:linear-gradient(100deg,var(--lume),var(--aqua));color:var(--on-accent);
    padding:3px 11px 1px;text-transform:uppercase;text-decoration:none}
  .foot{padding:calc(var(--u)*4) calc(var(--u)*3);font-family:var(--f-micro);
    font-size:9px;color:var(--ink-3);display:flex;gap:14px;flex-wrap:wrap}
  .foot a{color:var(--ink-3)}
  @media (max-width:520px){ .photo{width:74px;height:74px} }
  /* index_9's percentile bars: where this player sits against everyone else
     in the competition, which is the fastest way to read a stat line. */
  .bars{padding:0 calc(var(--u)*3) calc(var(--u)*3)}
  .barrow{display:grid;grid-template-columns:104px 1fr 56px;gap:10px;align-items:center;
    padding:5px 0}
  .barrow .bl{font-family:var(--f-micro);font-size:8.5px;color:var(--ink-3);
    letter-spacing:.11em;text-transform:uppercase;text-align:right}
  .barrow .bt{height:9px;border-radius:2px;background:var(--panel-2);overflow:hidden;position:relative}
  .barrow .bt i{display:block;height:100%;border-radius:2px}
  .barrow .bv{font-family:var(--f-data);font-size:11.5px;text-align:right;color:var(--ink)}
  .barrow .bp{font-family:var(--f-micro);font-size:8px;color:var(--ink-3)}
  /* A volume row is a statistic in its own right — ranked like every other —
     but it belongs to the rate above it, so it is indented and quieter. The
     group should still read as four shot types, not eight unrelated bars. */
  .barrow.volrow{margin-top:-4px}
  .barrow.volrow .bl{color:var(--ink-3);opacity:.85;padding-left:10px}
  .barrow.volrow .bt{height:6px;opacity:.8}
  .barrow.volrow .bv{font-size:10.5px;color:var(--ink-2)}
  .barrow{align-items:start}
  .barrow .bl{padding-top:1px}
  .bargroup{font-family:var(--f-micro);font-size:8.5px;color:var(--lume);
    letter-spacing:.14em;text-transform:uppercase;padding:12px 0 4px}
  .wowy-bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    padding:0 calc(var(--u)*3) calc(var(--u)*2)}
  .wowy-bar .wl{font-family:var(--f-micro);font-size:9px;color:var(--ink-3);
    letter-spacing:.1em;text-transform:uppercase}
  /* the ON/OFF badge — the thing that makes a WOWY table readable at a glance */
  .wb{display:inline-block;min-width:34px;text-align:center;padding:3px 7px 2px;
    border-radius:2px;font-family:var(--f-micro);font-size:7.5px;letter-spacing:.1em}
  .wb.on{background:var(--lume);color:var(--on-accent);font-weight:700}
  .wb.off{background:transparent;color:var(--ink-3);border:1px solid var(--rule-2)}
  table.ft td.stick.c0w,table.ft th.stick.c0w{position:sticky;left:0;z-index:2;
    background:var(--ground);text-align:center}
  table.ft thead th.stick.c0w{z-index:4;background:#0c1f16}
  table.ft th:not(.stick),table.ft td:not(.stick){text-align:right}
  table.ft td .wb{margin:0 auto}
  /* a thin sample is dimmed rather than dropped — dropping it would hide that
     the arrangement happened at all */
  table.ft tbody tr.thin td{opacity:.45}
  table.ft tbody tr.none td{opacity:.3}
  table.ft td.novalue{text-align:left;font-family:var(--f-micro);font-size:8.5px;
    color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
  .with-tbl td.stick.c1{text-align:left}
  .with-tbl .ft-name{font-family:var(--f-micro);font-size:9px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--ink-3)}
  .ptabs{padding:calc(var(--u)*2) calc(var(--u)*3) 0}
  .compscope{padding:0 0 calc(var(--u)*2)}
  /* the video tab: everything else steps aside */
  body.vtab .sec:not(#videosec), body.vtab section.card{display:none}
  /* IN THE CLUB'S COLOURS -- the same dress as the club's own page (t/index.html): the
     player is at a club and the card says which one before the name is read. teamcolour.js
     paints --team-a/--team-b and the -ink variants that are safe as text; body.themed
     switches the page's accent to them. */
  body.themed{--lume:var(--team-a-ink);
    --rule:color-mix(in oklch,var(--team-a) 26%,transparent);
    --rule-2:color-mix(in oklch,var(--team-a) 50%,transparent);
    background:
      radial-gradient(1000px 560px at 10% -6%, color-mix(in oklch,var(--team-a) 26%,var(--ground)), transparent 60%),
      radial-gradient(800px 480px at 100% 20%, color-mix(in oklch,var(--team-b) 12%,var(--ground)), transparent 58%),
      var(--ground);
    background-attachment:fixed}
  body.themed .idband{position:relative;border-bottom:none;
    background:linear-gradient(120deg, color-mix(in oklch,var(--team-a) 30%,var(--ground)) 0%,
                                       color-mix(in oklch,var(--team-a) 10%,var(--ground)) 55%, transparent 100%)}
  body.themed .idband::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
    background:linear-gradient(90deg,var(--team-a) 0 72%,var(--team-b) 72% 88%,var(--team-a) 88%)}
  /* THE PLAYER CARD IS A CLUB CARD. The photo box is printed the way the club cards on the
     league page are: a flood of the club's colour with a halftone bitten into it, the
     initials in the club's ink with the second colour showing through the offset, the
     jersey number on a band of the colour. A photograph, when there is one, sits on the
     same plate and keeps the frame. */
  body.themed .photo{border-color:color-mix(in oklch,var(--team-a) 70%,transparent);
    background:
      radial-gradient(circle,color-mix(in oklch,var(--team-a) 62%,transparent) 1.1px,transparent 1.4px) 0 0/7px 7px,
      linear-gradient(180deg,color-mix(in oklch,var(--team-a) 42%,var(--panel-2)),
                             color-mix(in oklch,var(--team-a) 16%,var(--panel-2)));
    box-shadow:0 0 0 1px color-mix(in oklch,var(--team-b) 55%,transparent),
               0 0 26px color-mix(in oklch,var(--team-a) 30%,transparent)}
  body.themed .photo .ini{color:var(--team-a-ink);
    text-shadow:3px 3px 0 color-mix(in oklch,var(--team-b) 60%,transparent)}
  body.themed .photo .num{background:var(--team-a);color:var(--team-on-a);
    box-shadow:0 -1px 0 var(--team-b)}
  body.themed .idmeta .sub a{color:var(--team-a-ink)}
  body.themed .idmeta .sub a:hover{color:var(--ink)}
  body.themed .pos-chip{border-color:color-mix(in oklch,var(--team-b) 60%,transparent);color:var(--team-b-ink)}
  body.themed .tile.hi .v,body.themed .sec-h .idx{color:var(--team-a-ink)}
  body.themed .ep-tab.on{background:var(--team-a);color:var(--team-on-a)}
  .idmeta .ep-follow.lbl{margin-top:8px}
</style>
</head>
<body>
<div class="ep-frame">
  <div class="bar">
    <a href="../" class="wm epinoia-mark" aria-label="Epinoia">EPINOIΛ</a>
    <span id="ctx" class="ep-micro"></span>
  </div>

  <div class="idband">
    <div class="photo" id="photo"><span class="ini" id="ini">—</span></div>
    <div class="idmeta">
      <h1 id="name">—</h1>
      <div class="sub" id="sub"></div>
    </div>
  </div>

  <div class="tiles" id="tiles"></div>

  <!-- PROFILE / VIDEO. Shown only when a game this player was in has footage the
       page can seek; the video section then lives under its own tab. -->
  <div class="ep-tabs ptabs" id="ptabs" role="tablist" style="display:none">
    <button class="ep-tab on" data-p="profile" role="tab">Profile</button>
    <button class="ep-tab" data-p="video" role="tab">Video</button>
  </div>

  <div class="sec">
    <div class="sec-h"><span class="idx">01</span><h2>League percentile</h2>
      <span class="note" id="barNote"></span></div>
    <div id="bars"></div>
  </div>

  <div class="sec">
    <div class="sec-h"><span class="idx">02</span><h2>Season</h2>
      <span class="note" id="seasonNote"></span></div>
    <div id="seasons"></div>
  </div>

  <div class="sec">
    <div class="sec-h"><span class="idx">03</span><h2>Game log</h2>
      <span class="note" id="logNote"></span></div>
    <div id="log"></div>
  </div>

  <!-- ON VIDEO. Hidden until there is footage lined up with a game this player
       actually played in, which is why it carries no placeholder: an empty
       section on every profile in a league without cameras teaches people to
       scroll past this part of the page. -->
  <div class="sec" id="videosec" style="display:none">
    <div class="sec-h"><span class="idx">03b</span><h2>On video</h2>
      <span class="note" id="videoNote"></span></div>
    <div id="videopanel"></div>
  </div>

  <div class="sec">
    <div class="sec-h"><span class="idx">04</span><h2>On the floor with</h2>
      <span class="note" id="wowyNote"></span></div>
    <div id="onoff"></div>
    <div id="withpanel"></div>
  </section>

  <!-- the season's shooting on the box score's court, zone by zone -->
  <section class="card">
    <div class="cardhead">
      <h2>Shot chart</h2>
    </div>
    <div id="shotchart"></div>
  </div>

  <div class="foot">
    <a href="../">← all games</a>
    <a id="teamLink" href="#">team page</a>
    <span>Epinoia Network</span>
  </div>
</div>
