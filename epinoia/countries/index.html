<!-- ==========================================================================
     THE COUNTRIES PAGE IS NOW A SECTION OF HOME.

     HOME lists every league grouped by country, as cards, under the day's
     fixtures and the best players, so a second page doing the same job over
     the water would be two answers to one question. The address stays because
     it is linked from outside: old shares, bookmarks and /league/countries/.

     A META REFRESH AND A PLAIN LINK, NO SCRIPT OF ITS OWN. The CSP forbids
     inline scripts and a redirect needs nothing a refresh cannot do. appmode.js
     is still first in the head, with no data-water, so it only settles the theme
     and the app flag before paint: inside the app this page shows the ground
     colour for the instant it is on screen, never the pool.
     ========================================================================== -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
