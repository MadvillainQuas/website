<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04100b">
<!-- PUBLIC. No gate.js, no topnav.js. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co">
<title>League · Epinoia</title>
<link rel="icon" type="image/png" sizes="32x32" href="../brand/epinoia-mark-32.png">
<link rel="apple-touch-icon" href="../brand/epinoia-mark-180.png">
<link rel="stylesheet" href="../kit/epinoia-kit.css?v=116">
<link rel="stylesheet" href="../kit/table.css?v=116">
<link rel="stylesheet" href="../kit/nav.css?v=116">
<style>
  .tabs-wrap{padding:calc(var(--u)*2) calc(var(--u)*3);border-bottom:1px solid var(--rule)}
  .pane{display:none} .pane.on{display:block}
  .crest{display:inline-grid;place-items:center;width:22px;height:22px;font-family:var(--f-score);
    font-size:11px;color:#04100b;margin-right:9px;vertical-align:-5px;flex:none}
  .tname-cell{display:flex;align-items:center}
  .tname-cell a{color:inherit;text-decoration:none}
  .tname-cell a:hover{color:var(--lume)}
  .fx{display:grid;grid-template-columns:88px 1fr auto 1fr 70px;gap:10px;align-items:center;
    padding:11px calc(var(--u)*3);border-bottom:1px solid var(--rule)}
  .fx:hover{background:color-mix(in oklch,var(--lume) 6%,transparent)}
  .fx .d{font-family:var(--f-micro);font-size:9.5px;color:var(--ink-3)}
  .fx .h{text-align:right} .fx .a{text-align:left}
  .fx .tn{font-family:var(--f-ui);font-weight:700;font-size:13.5px;text-transform:uppercase;letter-spacing:.02em}
  .fx .sc{font-family:var(--f-score);font-size:22px;padding:0 10px;white-space:nowrap}
  .fx .st{font-family:var(--f-micro);font-size:9px;text-align:right}
  .fx .st.final{color:var(--ink-3)} .fx .st.live{color:var(--flare)} .fx .st.sched{color:var(--aqua)}
  .fx .win{color:var(--lume)}
  .empty{padding:calc(var(--u)*5) calc(var(--u)*3);text-align:center;color:var(--ink-3);
    font-family:var(--f-micro);font-size:11px}
  .lead{display:grid;grid-template-columns:28px 1fr 60px;gap:10px;align-items:center;
    padding:8px calc(var(--u)*3);border-bottom:1px solid var(--rule)}
  .lead .r{font-family:var(--f-score);font-size:16px;color:var(--ink-3)}
  .lead .n{font-family:var(--f-ui);font-weight:600;font-size:13px}
  .lead .v{font-family:var(--f-data);font-size:13px;text-align:right;color:var(--lume)}
  .pick{display:flex;gap:8px;flex-wrap:wrap;padding:calc(var(--u)*2) calc(var(--u)*3);
    border-bottom:1px solid var(--rule)}
  a.plain{color:inherit;text-decoration:none}

  /* ---- groups ---- */
  .grouphead{font-family:var(--f-ui);font-weight:800;font-size:12px;text-transform:uppercase;
    letter-spacing:.08em;color:var(--lume);padding:calc(var(--u)*3) calc(var(--u)*3) calc(var(--u));}

  /* ---- knockout bracket ---- */
  .bracket{display:flex;gap:calc(var(--u)*3);align-items:flex-start;overflow-x:auto;
    padding:calc(var(--u)*3)}
  .brcol{display:flex;flex-direction:column;gap:calc(var(--u)*2);min-width:210px;flex:0 0 auto;
    justify-content:space-around}
  .brlabel{font-family:var(--f-micro);font-size:8.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
  .brtie{border:1px solid var(--rule-2);background:var(--panel)}
  .brside{display:flex;align-items:center;gap:8px;padding:8px 10px;
    border-bottom:1px solid var(--rule)}
  .brside:last-of-type{border-bottom:none}
  .brside.win{background:color-mix(in oklch,var(--lume) 10%,transparent)}
  .brside.win .brname{color:var(--lume);font-weight:700}
  .brdot{width:8px;height:8px;border-radius:50%;flex:none}
  .brname{font-family:var(--f-ui);font-weight:600;font-size:12px;color:var(--ink);
    text-decoration:none;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  a.brname:hover{color:var(--lume)}
  .brname.pend{color:var(--ink-3);font-family:var(--f-micro);font-size:9px;
    font-weight:400;font-style:italic}
  .brseed{font-family:var(--f-micro);font-size:8px;color:var(--ink-3);
    border:1px solid var(--rule-2);padding:0 4px}
  .bragg{font-family:var(--f-score);font-size:17px;color:var(--ink);min-width:22px;
    text-align:right}
  .brfoot{display:flex;gap:9px;padding:6px 10px;border-top:1px solid var(--rule);
    font-family:var(--f-micro);font-size:8.5px}
  .brfoot a{color:var(--ink-3);text-decoration:none}
  .brfoot a:hover{color:var(--lume)}
  .brfoot.pend{color:var(--ink-3);font-style:italic}

  /* ---- season awards ---- */
  .awgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:1px;
    background:var(--rule);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .awcard{background:var(--ground);padding:calc(var(--u)*2) calc(var(--u)*2)}
  .awtitle{font-family:var(--f-micro);font-size:8px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
  .awwho{font-family:var(--f-ui);font-weight:700;font-size:13.5px;line-height:1.3}
  .awwho a{color:var(--ink);text-decoration:none}
  .awwho a:hover{color:var(--lume)}
  .awteam{display:block;font-family:var(--f-micro);font-size:8.5px;color:var(--ink-3);
    font-weight:400;margin-top:3px;letter-spacing:.08em;text-transform:uppercase}
  .awval{font-family:var(--f-score);font-size:26px;color:var(--lume);line-height:1;margin-top:8px}
  .awdet{font-family:var(--f-micro);font-size:7.5px;color:var(--ink-3);margin-top:5px;
    line-height:1.6}
  .seasonpick .ep-chip{font-family:var(--f-micro);font-size:9.5px}
  .seasonpick{border-bottom:1px solid var(--rule)}
  .phasepick{padding:calc(var(--u)*2) calc(var(--u)*3);border-bottom:1px solid var(--rule)}
  .phasepick .ep-chip{font-family:var(--f-micro);font-size:9.5px}
  .phasepick .kindtag{margin-left:6px;font-size:7.5px;opacity:.7;letter-spacing:.1em}
  /* a points deduction, printed beside the total it has already been taken off */
  .dock{color:var(--flare);font-size:9px;margin-left:4px;vertical-align:super}
</style>
</head>
<body>
<div class="ep-frame">
  <div style="display:flex;align-items:center;gap:12px;padding:calc(var(--u)*2) calc(var(--u)*3);border-bottom:1px solid var(--rule)">
    <a href="../" class="plain"><span style="font-family:var(--f-score);font-size:13px;background:linear-gradient(100deg,var(--lume),var(--aqua));color:#04100b;padding:3px 11px 1px;text-transform:uppercase" class="epinoia-mark" aria-label="Epinoia">EPINOIΛ</span></a>
    <span id="ctx" class="ep-micro"></span>
  </div>

  <div class="ep-board" style="grid-template-columns:1fr">
    <div class="ep-side a" style="padding:calc(var(--u)*3)">
      <div class="ep-trc" id="seasonName"></div>
      <div class="ep-tnm" id="leagueName" style="font-size:clamp(20px,4vw,30px)">—</div>
    </div>
  </div>

  <div id="seasonPick" class="pick seasonpick" style="display:none"></div>

  <div class="tabs-wrap">
    <div class="ep-tabs" role="tablist">
      <button class="ep-tab on" data-p="table" role="tab">Table</button>
      <button class="ep-tab" data-p="fixtures" role="tab">Fixtures</button>
      <button class="ep-tab" data-p="leaders" role="tab">Leaders</button>
      <button class="ep-tab" data-p="teams" role="tab">Team Stats</button>
      <button class="ep-tab" data-p="cup" role="tab">Cup</button>
    </div>
  </div>

  <!-- The table tab holds the phase selector, whatever that phase renders
       (a table, or a bracket if the phase is a knockout), and the awards.
       The awards used to sit outside the pane system, which is why they
       appeared under every tab. -->
  <div class="pane on" id="pane-table">
    <div id="phasePick" class="pick phasepick"></div>
    <div id="tableBody"></div>
    <div id="awards" style="display:none"></div>
  </div>
  <div class="pane" id="pane-fixtures"></div>
  <div class="pane" id="pane-leaders"></div>
  <div class="pane" id="pane-teams"></div>
  <div class="pane" id="pane-cup">
    <div id="cupPick" class="pick phasepick"></div>
    <div id="cupBody"></div>
  </div>

  <footer style="padding:calc(var(--u)*3);font-family:var(--f-micro);font-size:9px;color:var(--ink-3)">
    <span id="foot">Epinoia Network</span>
  </footer>
</div>

<script src="../config.js?v=116" defer></script>
<script src="../bpm.js?v=116" defer></script>
<script src="../season.js?v=116" defer></script>
<script src="../data.js?v=116" defer></script>
<script src="../fulltable.js?v=116" defer></script>
<script src="bracket.js?v=116" defer></script>
<script src="league.js?v=116" defer></script>
<script src="../nav.js?v=116" defer></script>
</body>
</html>
