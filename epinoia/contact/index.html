<style>
  .topbar{display:flex;align-items:center;gap:12px;padding:calc(var(--u)*2) calc(var(--u)*3);
    border-bottom:1px solid var(--rule)}
  .wm{font-family:var(--f-score);font-size:19px;
    background:linear-gradient(100deg,var(--lume),var(--aqua));color:var(--on-accent);
    padding:3px 11px 1px;text-transform:uppercase;text-decoration:none}
  .pane{max-width:620px;margin:0 auto;padding:calc(var(--u)*6) calc(var(--u)*3)}
  h1{font-family:var(--f-score);font-size:clamp(30px,6.5vw,52px);line-height:.9;margin:0 0 calc(var(--u)*2);
    text-transform:uppercase;background:linear-gradient(100deg,var(--lume),var(--aqua));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  p.lead{font-family:var(--f-micro);font-size:10px;color:var(--ink-3);line-height:2;
    margin:0 0 calc(var(--u)*3);max-width:66ch}
  label.f{display:flex;flex-direction:column;gap:6px;margin-bottom:calc(var(--u)*2)}
  label.f span{font-family:var(--f-micro);font-size:9px;letter-spacing:0.07em;
    text-transform:uppercase;color:var(--ink-3)}
  textarea.ep-input{min-height:170px;resize:vertical;line-height:1.7}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*2)}
  @media (max-width:560px){ .two{grid-template-columns:1fr} }
  .msg{font-family:var(--f-micro);font-size:10px;line-height:1.9;padding:11px 14px;
    margin:calc(var(--u)*2) 0;border-left:2px solid var(--rule-2);color:var(--ink-2)}
  .msg.ok{border-left-color:var(--lume);color:var(--lume);
    background:color-mix(in oklch,var(--lume) 8%,transparent)}
  .msg.err{border-left-color:var(--flare);color:var(--flare);
    background:color-mix(in oklch,var(--flare) 8%,transparent)}
  .msg.warn{border-left-color:var(--amber);color:var(--amber);
    background:color-mix(in oklch,var(--amber) 8%,transparent)}
  .hide{display:none}
  /* Not display:none — some bots fill anything that is display:none on the
     assumption that it is a trap. Off-screen and unfocusable is quieter. */
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .note{font-family:var(--f-micro);font-size:9px;color:var(--ink-3);line-height:1.9;
    margin-top:calc(var(--u)*3)}
  .count{font-family:var(--f-micro);font-size:8.5px;color:var(--ink-3);text-align:right}
  /* the privacy option: what it is, above the two choices it needs */
  .pv{border-left:2px solid var(--aqua);padding:10px 14px;margin:0 0 calc(var(--u)*2);
    background:color-mix(in oklch,var(--aqua) 6%,transparent)}
  .pv p{font-family:var(--f-micro);font-size:9.5px;line-height:1.9;color:var(--ink-2);margin:0 0 calc(var(--u)*1.5)}
  .pv p a{color:var(--aqua)}
</style>
