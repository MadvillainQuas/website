<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- LIGHT: the default theme; appmode.js turns it dark before paint for a reader who chose dark. -->
<meta name="theme-color" content="#f3faf6">
<link rel="manifest" href="/epinoia/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EPINOIΛ">
<!-- PUBLIC. No gate.js, no topnav.js. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co">
<title>Injury report · Epinoia</title>
<meta name="description" content="Who is missing: players a club was using who have not played since, worked out from the box scores, by club.">
<link rel="icon" type="image/png" sizes="32x32" href="../brand/epinoia-mark-32.png">
<link rel="apple-touch-icon" href="../brand/epinoia-app-180.png">
<script src="../appmode.js?v=380"></script>
<script src="../i18n.js?v=380" data-i18n-packs="report"></script>
<script src="../glyphs.js?v=380" defer></script>
<link rel="stylesheet" href="../kit/epinoia-kit.css?v=380">
<link rel="stylesheet" href="../kit/nav.css?v=380">
<link rel="stylesheet" href="../kit/wire.css?v=380">
<style>
  a.plain{color:inherit;text-decoration:none}
  .wr{overflow-x:clip}
  .wr-top{display:flex;align-items:center;gap:12px;padding:calc(var(--u)*2) calc(var(--u)*3);border-bottom:1px solid var(--rule)}
  .wr-top .wm{background:linear-gradient(100deg,var(--lume),var(--aqua));color:#04100b;padding-top:3px;padding-bottom:1px;
    view-transition-name:ep-mark}
  .wr .ep-hdr{flex-wrap:wrap;row-gap:4px}
  .wr-count{margin-left:auto;font-family:var(--f-micro);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-3);white-space:nowrap}
  .wr-lede{margin:0;padding:calc(var(--u)*1.5) calc(var(--u)*3);border-bottom:1px solid var(--rule);
    font-family:var(--f-micro);font-size:9px;line-height:1.8;color:var(--ink-3)}
  .wr-skel{display:grid;gap:8px;padding:calc(var(--u)*2) calc(var(--u)*3)}
  .wr-skel i{display:block;height:48px;border:1px solid var(--rule);
    background:linear-gradient(100deg,var(--panel) 30%,var(--panel-2) 50%,var(--panel) 70%);background-size:300% 100%;
    animation:wr-shimmer 1.4s ease-in-out infinite}
  @keyframes wr-shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
  @media (prefers-reduced-motion:reduce){ .wr-skel i{animation:none} }
  .empty{padding:calc(var(--u)*5) calc(var(--u)*3);text-align:center;color:var(--ink-3);
    font-family:var(--f-micro);font-size:10px;line-height:1.9}
  @media (max-width:820px){
    .wr-top{padding:calc(var(--u)*1.5) calc(var(--u)*2)}
    .wr .ep-hdr{padding:calc(var(--u)*1.5) calc(var(--u)*2)}
    .wr .ep-hdr h2{font-size:22px}
    .wr-lede{padding:calc(var(--u)*1.25) calc(var(--u)*2)}
    .wr-skel{padding:10px 12px}
    .ep-frame{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
    body.has-nav .ep-bell{top:auto;bottom:calc(58px + env(safe-area-inset-bottom,0px) + 10px)}
    body.has-nav .ep-bell .panel{top:auto;bottom:48px;max-height:min(60vh,520px)}
  }
  @media (display-mode:standalone){ body{padding-top:env(safe-area-inset-top,0px)} }
  /* IN THE LEAGUE'S OWN COLOURS (nav.js paints body.league-themed on a page about one league,
     and never on the global wire, which names no league): the same wash and trim the statistics
     page gives its heading, since neither has a .hero for the kit to trim. */
  body.league-themed .ep-frame > .ep-hdr{position:relative;padding-bottom:calc(var(--u)*1.5);
    background:linear-gradient(120deg, color-mix(in srgb,var(--league-a) 26%,var(--ground)) 0%,
                                       color-mix(in srgb,var(--league-a) 8%,var(--ground)) 55%, transparent 100%)}
  body.league-themed .ep-frame > .ep-hdr::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;pointer-events:none;
    background:linear-gradient(90deg,var(--league-a) 0 72%,var(--league-b) 72% 88%,var(--league-a) 88%)}
  body.league-themed #wrTitle{color:var(--league-a-ink)}
</style>
</head>
<body>
<div class="ep-frame wr">
  <div class="wr-top">
    <a href="../home/" class="plain"><span class="wm epinoia-mark" aria-label="Epinoia">EPINOIΛ</span></a>
    <span class="ep-micro" id="wrCtx">every league</span>
  </div>
  <div class="ep-hdr"><span class="idx">01</span><h2 id="wrTitle">Injury report</h2>
    <span class="wr-count" id="wrCount" aria-live="polite"></span></div>
  <p class="wr-lede" id="wrLede">Worked out from the box scores: a player the club was playing who has
    not taken the floor since. Nobody files this — it resolves itself the moment they play again.</p>

  <!-- one details.ep-acc per club (per league, on the global wire) — wire.js -->
  <div class="wr-body" id="wrBody" aria-busy="true" aria-labelledby="wrTitle">
    <div class="wr-skel" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>

  <footer style="padding:calc(var(--u)*3);font-family:var(--f-micro);font-size:9px;color:var(--ink-3)">Epinoia Network</footer>
</div>
<script src="../config.js?v=380" defer></script>
<script src="../access.js?v=380" defer></script>
<script src="../bpm.js?v=380" defer></script>
<script src="../season.js?v=380" defer></script>
<script src="../data.js?v=380" defer></script>
<script src="../injuries.js?v=380" defer></script>
<script src="../initials.js?v=380" defer></script>
<script src="wire.js?v=380" defer></script>
<script src="../nav.js?v=380" defer></script>
<script src="../xscroll.js?v=380" defer></script>
</body>
</html>
