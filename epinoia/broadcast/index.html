<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- PUBLIC, and deliberately chrome-free: this page is a video layer, not a
     web page. No nav, no gate, no footer, nothing that could appear on air. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co">
<title>Broadcast graphics · Epinoia</title>
<link rel="icon" type="image/png" sizes="32x32" href="../brand/epinoia-mark-32.png">
<style>
/* ============================================================================
   A BROWSER SOURCE, NOT A WEB PAGE.

   OBS, vMix, CasparCG and Singular all composite an HTML page over video, and
   all of them honour a transparent page background. So the background here is
   transparent by default and every scene paints only its own box — anything
   that fills the viewport becomes a black rectangle over the game.

   ?chroma=#00b140 paints a key colour instead, for a mixer that cannot take an
   alpha channel. Deliberately opt-in: keying is a downgrade, and defaulting to
   it would mean everyone with a modern mixer keys a colour for no reason.

   FONT SIZES ARE IN vmin AND EVERY SCENE SCALES AS A UNIT. A graphic is
   designed once at 1920x1080 and then someone renders it at 1280x720 for a
   stream — a layout in px silently changes proportion, a layout that scales
   does not.
   ========================================================================= */
/* ============================================================================
   THE SITE'S OWN FACES, ON AIR.

   These graphics were set in the system UI font, which is fine and is nobody's
   brand. The platform has four faces and uses them for specific jobs — Jersey
   for scores and headings, Silkscreen for the small ruled labels, Archivo for
   names, Martian Mono for figures in a table — and a scorebug set in Segoe UI
   over a page set in those is a graphic that plainly came from somewhere else.

   Self-hosted, and loaded here rather than by importing the whole kit: the kit
   carries page chrome, a nav and a grid this page has no use for, and a
   browser source should download four fonts and nothing else.
   ========================================================================= */
@font-face{font-family:'Jersey25';src:url('../kit/fonts/jersey25.woff2') format('woff2');
  font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:'Silkscreen';src:url('../kit/fonts/silkscreen.woff2') format('woff2');
  font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:'Archivo';src:url('../kit/fonts/archivo.woff2') format('woff2');
  font-weight:100 900;font-stretch:62% 125%;font-style:normal;font-display:block}
@font-face{font-family:'MartianMono';src:url('../kit/fonts/martian.woff2') format('woff2');
  font-weight:100 800;font-stretch:75% 112.5%;font-style:normal;font-display:block}
@font-face{font-family:'EpinoiaMark';src:url('../brand/epinoia-mark.woff2') format('woff2');
  font-weight:400;font-style:normal;font-display:block}

/* font-display:block, not swap, and that is the opposite of the right answer
   on a web page. A swap means the graphic appears in a fallback face and then
   reflows into the real one — on a page nobody minds, on air it is a caption
   that visibly changes shape while somebody is reading it. Blocking briefly is
   the lesser fault when the alternative happens in front of an audience. */

:root{
  /* the platform's own palette, not a second one invented for broadcast */
  --ground:#04100b; --panel:#0a1a13;
  --ink:#e6fff1; --dim:rgba(230,255,241,.62); --faint:rgba(230,255,241,.42);
  --lume:#93f2bf; --aqua:#8ff5ff; --amber:#ffd166; --flare:#ff5f6b;
  --rule:rgba(147,242,191,.20); --rule-2:rgba(147,242,191,.44);
  --f-score:'Jersey25',ui-monospace,monospace;
  --f-micro:'Silkscreen',ui-monospace,monospace;
  --f-ui:'Archivo',system-ui,sans-serif;
  --f-data:'MartianMono',ui-monospace,monospace;
  --u:1vmin;
}
body{font-family:var(--f-ui);color:var(--ink)}

/* Every label on the platform is Silkscreen, uppercase, widely tracked. That
   one rule is most of why a page looks like this platform, so it is one class
   here rather than repeated into a dozen. */
.lbl,.bug .per,.bug .fl,.rank .hd i,.cmp .hd i,.offs .hd i,.five .hd i,
.l3 .tm,.l3 .st i,.lu .mins,.rr .num,.fin .lbl,.fin .comp,.fixcard .lbl,
.fixcard .meta,.sq .sqhd .lbl,.ogrp .ot,.orow .r,.raillabel,.fivehead .comp,
.fivehead .when{
  font-family:var(--f-micro);text-transform:uppercase;letter-spacing:.18em}

/* Figures in a TABLE are Martian Mono, which is what the tables use. */
.rr .v,.lu .net,.l3 .st b,.cmp .r b,.fpnum,.periods td{
  font-family:var(--f-data);font-variant-numeric:tabular-nums}

/* THE SCOREBOARD'S OWN FIGURES ARE JERSEY, which is the face this platform
   names for scores and the one every heading here is already set in. A
   scorebug whose numbers are in the table face is a scorebug that looks like a
   spreadsheet on a video wall.

   Jersey is NOT tabular — measured, not assumed: at 100px its "1" advances
   31.7 against 48.8 for its "2". So every character is given its own cell by
   .fg below, which is what a scoreboard does anyway. See figures() in
   broadcast.js. */
.bug .sc,.bug .clk,.fin .fs .s{
  font-family:var(--f-score);letter-spacing:.01em}
/* Each character in its own cell — and the run must never break between them.
   inline-block cells are wrappable, so a three-digit score in a squeezed flex
   column came out as "10" over "6". Caught on a 106-79 game at 1.6x scale,
   which is exactly the shape a real production uses. */
.fg{display:inline-block;width:.56em;text-align:center}
.bug .sc,.bug .clk{white-space:nowrap}
.fg.sep{width:.3em}
/* A minus, a slash or an en dash inside a run of figures wants the digit cell
   rather than the narrow one — they are as wide as a numeral in this face. */
.fg.sep:is(.wide){width:.56em}

/* headings and team marks are Jersey, as they are on every page */
.bug .tag,.sq .sqhd .nm,.five .hd span,.rank .hd span,.cmp .hd span,
.offs .hd span,.fin .fs .t,.fx1 .t,.railname,.badge .mono{
  font-family:var(--f-score);letter-spacing:.02em}

/* ============================================================================
   THE STARTING FIVE — full frame, not an overlay.
   ========================================================================= */
/* ---- NOT QUITE THE WHOLE FRAME -------------------------------------------
   These four — the starting five, both squads, the bench and the fives
   together — were full-bleed: inset:0, edge to edge, and for the twenty or
   thirty seconds one is up the broadcast is a slide rather than a basketball
   game. A viewer who has just tuned in cannot tell whether the picture is
   still there.

   Inset by a few vmin instead, with a corner radius and a shadow, so a band of
   the court shows all the way round. The card is still the subject and still
   perfectly legible; it now reads as a graphic OVER a game rather than
   INSTEAD of one, which is also what makes cutting back to play feel like a
   cut rather than a channel change.

   Percentages of the SHORT side, so the band is the same visual weight at
   1080p and at 720p — the whole reason this file is in vmin. */
.fivecard{
  position:absolute;inset:0;border-radius:2.4vmin;overflow:hidden;
  box-shadow:0 2vmin 6vmin rgba(0,0,0,.55), 0 0 0 1px rgba(147,242,191,.16);
  /* SCALED, NOT SHRUNK, and the difference matters here.

     Insetting the box would give the same outer size and a different inner
     one: everything in this card — the portraits, the rail, the type — is
     measured in vmin against the VIEWPORT, so the contents would keep their
     size while their container lost 20% of its. The five would then be
     cropped, which is a worse graphic than a full-bleed one.

     A transform takes the card and its contents together. Nothing reflows,
     nothing clips, and the proportions a designer chose are the proportions
     that go out — just smaller. */
  transform:scale(.82);transform-origin:50% 50%;
  display:flex;
  background:
    /* the ruled diagonal the platform uses behind its own headers, which is
       what stops a large dark area reading as a hole rather than a design */
    repeating-linear-gradient(115deg,
      rgba(147,242,191,.035) 0 1px, transparent 1px 46px),
    radial-gradient(120% 90% at 78% 8%,
      color-mix(in oklch, var(--tc) 14%, transparent), transparent 62%),
    linear-gradient(180deg, var(--panel), var(--ground) 72%);
}

.fivecard .rail{
  flex:0 0 15vmin;display:flex;flex-direction:column;align-items:center;
  padding:3vmin 1vmin 3vmin;
  background:linear-gradient(180deg, rgba(4,16,11,.92), rgba(4,16,11,.72));
  border-right:.35vmin solid var(--tc)}
.railtop{display:flex;flex-direction:column;align-items:center;gap:1.6vmin}
.lgmark{width:7vmin;height:7vmin;object-fit:contain}
/* The competition's NAME, not a wordmark. "Epinoia Demo League" broke over
   three lines in a 15vmin rail and read as a mistake in the corner of the
   frame. Set across the rail on two lines at most, centred and tight. */
.lgword{font-family:var(--f-score);font-size:1.9vmin;line-height:1.05;
  color:var(--lume);letter-spacing:.02em;text-align:center;max-width:12vmin;
  text-transform:uppercase;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.railrule{display:block;width:5vmin;height:1px;background:var(--rule-2)}
/* The club name runs up the rail, which is what every lineup card does — it
   buys the players the whole width instead of a band across the top. */
.railname{margin-top:auto;writing-mode:vertical-rl;transform:rotate(180deg);
  font-size:4.8vmin;text-transform:uppercase;color:#fff;line-height:1}
.raillabel{margin-top:1.6vmin;writing-mode:vertical-rl;transform:rotate(180deg);
  font-size:1.5vmin;color:var(--lume)}

.fivebody{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;
  padding:1.8vmin 3vmin 1.8vmin}
.fivehead{display:flex;align-items:baseline;gap:1.6vmin;
  padding-bottom:1.1vmin;border-bottom:1px solid var(--rule)}
.fivehead .comp{font-size:1.3vmin;color:var(--lume)}
.fivehead .when{margin-left:auto;font-size:1.2vmin;color:var(--faint)}

.fiverow{flex:1 1 auto;display:grid;grid-template-columns:repeat(5,1fr);
  gap:1.4vmin;align-items:stretch;min-height:0;padding-top:.8vmin}
.fp{display:flex;flex-direction:column;align-items:center;height:100%;min-height:0}
.fpnum{font-size:4.4vmin;font-weight:800;line-height:1;color:#fff;
  text-shadow:0 0 2.4vmin color-mix(in oklch, var(--tc) 60%, transparent),
              0 .2vmin .6vmin rgba(0,0,0,.5)}
/* the figure takes whatever height is left, so five of them always line up on
   the floor whatever the frame is */
.fpcut{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:flex-end;
  justify-content:center;margin:.6vmin 0 1.2vmin;position:relative}
/* A FLOOR TO STAND ON. Five figures ending in mid-air read as floating; a
   soft ellipse under each one is what a real lineup card uses and it costs
   nothing. Behind the figure, so a cut-out with its own shadow still wins. */
.fpcut::after{content:'';position:absolute;bottom:-.2vmin;left:14%;right:14%;
  height:1.1vmin;border-radius:50%;
  background:radial-gradient(closest-side,
    color-mix(in oklch, var(--tc) 34%, transparent), transparent)}
.cut{position:relative;display:block;height:100%;width:100%;
  display:flex;align-items:flex-end;justify-content:center}
/* THE PLACEHOLDER MUST NOT BE THE LOUDEST THING ON THE CARD. At full height
   and near-solid it dominated the frame and the graphic read as a wireframe
   rather than a lineup. Shorter than a real cut-out would be, and quieter, so
   the numbers and the names carry the card until the photographs arrive. */
/* FULL HEIGHT AGAIN, QUIET INSTEAD OF SHORT. Cutting it to 84% pushed the
   dead space to the TOP of the box — a hand's width of nothing between the
   shirt number and the head, five times across the card. The figure fills its
   box as a real cut-out will; what stops it dominating is its colour, not its
   size. */
.cut .sil{height:100%;width:auto;max-width:100%;
  fill:color-mix(in oklch, var(--tc) 30%, #16211c);
  opacity:.8;transition:opacity .2s ease}
.cut img{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  height:100%;width:auto;max-width:100%;object-fit:contain;object-position:50% 100%;
  opacity:0;transition:opacity .25s ease;
  /* a cut-out with a hard edge sits better on the ground with a shadow under
     it than floating; this is the same trick a real lineup card uses */
  filter:drop-shadow(0 1.4vmin 1.6vmin rgba(0,0,0,.55))}
.cut.hascut img{opacity:1}
.cut.hascut .sil{opacity:0}

/* Off the frame edge. The names sat on the bottom rule, which is the one place
   a broadcast overlay or a channel bug is most likely to land on top of them. */
.fpname{text-align:center;line-height:1.12;padding-bottom:.6vmin}
.fpname .first{display:block;font-family:var(--f-ui);font-weight:400;
  font-size:1.9vmin;color:var(--dim);letter-spacing:.02em}
.fpname .last{display:block;font-family:var(--f-ui);font-weight:800;
  font-size:2.6vmin;color:#fff;text-transform:capitalize;letter-spacing:-.01em;
  text-shadow:0 .2vmin .8vmin rgba(0,0,0,.6)}
/* position · height · weight, the three things read off a team sheet */
.vitals{display:block;margin-top:.7vmin;font-family:var(--f-micro);
  font-size:1.8vmin;letter-spacing:.14em;text-transform:uppercase;color:var(--lume)}
.vitals b{font-weight:400;color:var(--lume)}
.vitals i{font-style:normal;color:var(--faint);margin:0 .5vmin}

/* ---------------- the bench, on the same card ----------------
   Deliberately the same frame, rail, header and floor as the starting five —
   a director cutting from one to the other is turning a page, not changing
   design. What differs is the portrait: head and shoulders in a rounded frame,
   because twelve full-body figures across 16:9 are forty pixels wide each and
   read as a barcode. */
/* A FIXED PORTRAIT, NOT A FLEXING ONE. aspect-ratio:1 on a box that also flexed
   to fill its row made every circle as tall as half the frame — they overlapped
   their neighbours and each number landed on the wrong player. The portrait is
   sized in vmin like everything else here, and the row lays out around it. */
.benchrow{flex:1 1 auto;display:grid;
  grid-template-columns:repeat(6,1fr);grid-auto-rows:min-content;
  gap:3.4vmin 1.4vmin;min-height:0;padding:2vmin 0;align-content:center}
.bp{display:flex;flex-direction:column;align-items:center;min-width:0}
.bpcut{position:relative;width:min(100%,14vmin);height:14vmin;
  display:flex;align-items:center;justify-content:center;margin-bottom:1.1vmin}
.port2{position:relative;display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;border-radius:50%;overflow:hidden;
  background:linear-gradient(180deg,
    color-mix(in oklch, var(--tc) 22%, #0d1512), #0a1210);
  border:.25vmin solid color-mix(in oklch, var(--tc) 52%, transparent)}
.port2 .ini{font-family:var(--f-score);font-size:3.9vmin;
  color:color-mix(in oklch, var(--tc) 78%, #fff)}
.port2 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  /* a face sits in the top third of a portrait and the very top of a
     full-body cut-out, so the two are framed differently on purpose */
  object-position:50% 18%;opacity:0;transition:opacity .2s ease}
.port2.fromcut img{object-position:50% 6%;transform:scale(1.5);transform-origin:50% 8%}
.port2.hasface img{opacity:1}
.port2.hasface .ini{opacity:0}
/* the number rides the portrait, as it does on a team sheet */
/* The number sits ON its own portrait, centred under the chin — offset to the
   corner it was overlapping the next player along. */
.bpnum{position:absolute;left:50%;transform:translateX(-50%);bottom:-.9vmin;z-index:2;
  font-family:var(--f-data);font-weight:800;font-size:1.4vmin;line-height:1;
  padding:.3vmin .7vmin;border-radius:.4vmin;background:var(--tc);color:#04100b;
  box-shadow:0 .2vmin .6vmin rgba(0,0,0,.5)}
.bp .fpname{padding-bottom:0}
.bp .fpname .last{font-size:1.95vmin}
.bp .vitals{font-size:1.3vmin;margin-top:.4vmin}

/* A bench of seven does not want a six-wide grid with one on the second row;
   a short list gets one line and bigger portraits. */
.benchrow.oneline{grid-template-columns:repeat(6,1fr)}
.benchrow.oneline .bpcut{width:min(100%,17vmin);height:17vmin}
.benchrow.oneline .port2 .ini{font-size:4.6vmin}

@media (max-aspect-ratio:1/1){ .benchrow{grid-template-columns:repeat(4,1fr)} }

/* A five-wide grid stops working long before a 16:9 frame does; below this the
   graphic is being previewed rather than broadcast, and two rows beats five
   unreadable columns. */
@media (max-aspect-ratio:1/1){
  .fiverow{grid-template-columns:repeat(3,1fr);gap:1vmin}
  .fivecard .rail{flex-basis:11vmin}
  .railname{font-size:3vmin}
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden}
body{-webkit-font-smoothing:antialiased}
body.chroma{background:var(--chroma)}

/* Safe area: broadcast graphics sit inside the title-safe box, not against the
   edge of the raster. ?safe=0 turns it off for a mixer that positions the
   source itself. */
#stage{position:absolute;inset:0;display:flex;padding:4vmin 5vmin}
#stage.pos-bl{align-items:flex-end;justify-content:flex-start}
#stage.pos-br{align-items:flex-end;justify-content:flex-end}
#stage.pos-tl{align-items:flex-start;justify-content:flex-start}
#stage.pos-tr{align-items:flex-start;justify-content:flex-end}
#stage.pos-bc{align-items:flex-end;justify-content:center}
#stage.pos-tc{align-items:flex-start;justify-content:center}
#stage.pos-c {align-items:center;justify-content:center}
#stage.nosafe{padding:0}

/* Nothing renders until there is something true to show. A scorebug that
   appears with 0–0 and then corrects itself has already been on air wrong. */
/* Hidden until every element is present, then one fade for the whole graphic —
   see the note on reveal() in broadcast.js. A graphic that assembles itself in
   front of an audience is one a director will not use twice. */
#stage[data-ready="0"]{opacity:0}
#stage{opacity:1;transition:opacity .3s ease}

/* ---------------- crests ---------------- */
/* The monogram is painted first and the crest loads on top of it, so there is
   no frame where the mark is missing — and a 404 leaves the initials rather
   than a hole. */
.badge{position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:4.4vmin;height:4.4vmin;border-radius:.6vmin;flex:0 0 auto;overflow:hidden;
  background:color-mix(in oklch, var(--tc) 22%, #0b1310);
  border:1px solid color-mix(in oklch, var(--tc) 55%, transparent)}
.badge .mono{font-weight:800;font-size:1.7vmin;letter-spacing:.02em;color:var(--tc);
  line-height:1}
.badge .crest{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  opacity:0;transition:opacity .18s ease;background:rgba(0,0,0,.25)}
.badge.hascrest .crest{opacity:1}
.badge.hascrest .mono{opacity:0}
.badge.sm{width:3.2vmin;height:3.2vmin;border-radius:.45vmin}
.badge.sm .mono{font-size:1.25vmin}
.badge.lg{width:9vmin;height:9vmin;border-radius:1vmin}
.badge.lg .mono{font-size:3.4vmin}

/* ---------------- the plate every card sits on ---------------- */
.card,.bug{
  background:linear-gradient(180deg, rgba(9,17,14,.93), rgba(5,11,9,.96));
  border:1px solid rgba(255,255,255,.13);
  border-radius:1vmin;
  box-shadow:0 .8vmin 3vmin rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
  /* NO backdrop-filter. It was here for a frosted edge over video and it
     washed the whole plate out — measured: the same card renders correctly the
     moment it is disabled. The plate is already 93-96% opaque so the blur was
     buying almost nothing, and a filter that samples what is behind it is the
     property most likely to misbehave in an embedded browser compositing with
     an alpha channel. A graphic that is legible everywhere beats one that is
     prettier on the machine it was designed on. */
  overflow:hidden}

/* ---------------- scorebug ---------------- */
.bug{display:flex;align-items:stretch}
.bug .side{display:flex;align-items:center;gap:1vmin;padding:.9vmin 1.3vmin;
  position:relative}
/* the club colour as an edge, never as a fill — see the note above */
.bug .side.home{border-left:.55vmin solid var(--tc)}
.bug .side.away{border-right:.55vmin solid var(--tc);flex-direction:row-reverse}
.bug .tag{font-weight:800;font-size:2.1vmin;letter-spacing:.05em;line-height:1;
  min-width:5.4vmin;text-align:center}
/* A touch larger, because Jersey sits smaller on the line than Martian at the
   same size — matching the number rather than matching the declaration. */
/* Room for three digits at their own cell width, so a team passing 100 widens
   the plate rather than breaking the number. */
/* ---- SMALLER, ACROSS THE BOARD -------------------------------------------
   Every figure here came down by about a fifth. A scorebug is read at a glance
   from across a room and it is on screen for two hours, so the size it wants
   is the smallest that is still instantly legible — not the largest that fits.
   The previous set was sized to be readable in a screenshot of the graphic
   ALONE, which is a different problem from being readable over a basketball
   court, where everything around it is moving. */
.bug .sc{font-weight:800;font-size:4vmin;line-height:.95;min-width:7vmin;
  text-align:center;font-variant-numeric:tabular-nums}
.bug .mid{position:relative;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:.6vmin 1.8vmin;min-width:10vmin;
  background:rgba(0,0,0,.42);
  border-left:1px solid rgba(255,255,255,.1);border-right:1px solid rgba(255,255,255,.1)}
.bug .clk{font-weight:800;font-size:2.9vmin;line-height:1.05}
/* a running clock is a shade brighter than a stopped one, which tells a viewer
   whether play is live without a word */
.bug .clk.run{color:#fff}
.bug .clk:not(.run){color:rgba(255,255,255,.72)}
/* FINAL is a state, not a time: amber rather than the live white, so a still
   frame of a rerun cannot be read as a game in progress.

   AFTER the :not(.run) rule above, not before it. Both are (0,3,0), so file
   order decides and the earlier one loses — which is exactly how this landed
   as a white FIN the first time and why the trap is written down here. */
.bug .clk.fin{color:var(--amber);letter-spacing:.06em}
.bug .per.fin{color:var(--amber)}
.bug .per{font-size:1.15vmin;letter-spacing:.24em;color:var(--dim);text-transform:uppercase;
  margin-top:.3vmin}

/* ---- the league's mark ----------------------------------------------------
   Square, so a round badge and a wordmark both sit right, and the initials are
   the same square when there is no image. data-fade is the platform's own
   reveal: the monogram is drawn first and the picture fades over it once it
   has actually loaded, so a slow or missing file leaves initials rather than
   an empty box. See wireFades in broadcast.js. */
.bug .lgm{position:relative;display:flex;align-items:center;justify-content:center;
  width:5.4vmin;height:5.4vmin;flex:0 0 auto;margin-right:.9vmin}
.bug .lgm i{font-family:var(--f-score);font-style:normal;color:var(--ink);opacity:.9}
/* One or two letters across the badge. */
.bug .lgm .ini2{font-size:2.2vmin;letter-spacing:.04em}
/* Three stacked, filling the square. Tight leading because these are separate
   lines of one glyph each and the face's own line height would leave the block
   floating in the middle of the badge rather than occupying it. */
.bug .lgm .ini3{display:flex;flex-direction:column;align-items:center;
  justify-content:center;line-height:.82;font-size:1.75vmin;letter-spacing:.06em}
.bug .lgm .ini3 b{font-weight:400;display:block}
.bug .lgm img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  opacity:0;transition:opacity .3s ease}
.bug .lgm.haslgm img{opacity:1}
.bug .lgm.haslgm i{opacity:0}
.bug .arw{position:absolute;top:.5vmin;width:0;height:0;
  border-top:.7vmin solid transparent;border-bottom:.7vmin solid transparent}
.bug .arw.l{left:.7vmin;border-right:.9vmin solid rgba(255,255,255,.75)}
.bug .arw.r{right:.7vmin;border-left:.9vmin solid rgba(255,255,255,.75)}
.bug .rail{display:flex;flex-direction:column;justify-content:center;gap:.5vmin;
  padding:0 1.1vmin;background:rgba(0,0,0,.22);
  border-left:1px solid rgba(255,255,255,.08)}
.bug .fl{display:flex;align-items:center;gap:.5vmin;font-size:1.05vmin;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.bug .fl b{font-size:1vmin;letter-spacing:.16em;color:#ffd98a;font-weight:700}
.bug .fl.bonus{color:#ffd98a}
.dots{display:inline-flex;gap:.4vmin}
.dot{width:.85vmin;height:.85vmin;border-radius:50%;background:rgba(255,255,255,.2);
  display:inline-block}
.dot.on{background:#ff5f6b;box-shadow:0 0 .8vmin rgba(255,95,107,.5)}

/* ---------------- lower third ---------------- */
.l3{min-width:48vmin;max-width:72vmin}
.l3 .bar{height:.6vmin;background:var(--tc)}
.l3 .who{display:flex;align-items:center;gap:1.3vmin;padding:1.5vmin 2vmin .7vmin}
.l3 .num{font-weight:800;font-size:2.2vmin;color:var(--tc);min-width:3vmin}
.l3 .nm{font-weight:800;font-size:3.3vmin;text-transform:capitalize;letter-spacing:.01em}
.l3 .tm{margin-left:auto;font-size:1.35vmin;letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim);text-align:right;text-transform:uppercase}
.l3 .line{display:flex;gap:2.4vmin;padding:0 2vmin 1.7vmin}
.l3 .st{display:flex;flex-direction:column}
.l3 .st b{font-weight:800;font-size:2.7vmin;line-height:1;font-variant-numeric:tabular-nums}
.l3 .st i{font-style:normal;font-size:1.2vmin;letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim);margin-top:.45vmin}

/* ---------------- ranked graphics ---------------- */
.rank{min-width:46vmin;max-width:64vmin;padding:1.5vmin 1.8vmin 1.2vmin}
.rank.wide{min-width:58vmin;max-width:78vmin}
.rank .hd{display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:1.1vmin;padding-bottom:.8vmin;border-bottom:1px solid rgba(255,255,255,.12)}
.rank .hd span{font-weight:800;font-size:1.9vmin;letter-spacing:.06em;text-transform:uppercase}
.rank .hd i{font-style:normal;font-size:1.2vmin;letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim)}
.rr{display:grid;grid-template-columns:auto auto 1fr 10vmin auto;align-items:center;
  gap:1vmin;padding:.5vmin 0}
.rr .num{font-size:1.4vmin;color:var(--dim);min-width:2.4vmin;text-align:right;
  font-variant-numeric:tabular-nums}
.rr .nm{font-weight:700;font-size:1.9vmin;text-transform:capitalize;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
/* The bar is the graphic. A column of numbers has to be read; a row of bars is
   ranked before anybody has finished reading the first name. */
.rr .bar{height:.7vmin;background:rgba(255,255,255,.1);border-radius:.35vmin;overflow:hidden}
.rr .bar i{display:block;height:100%;background:var(--tc);border-radius:.35vmin}
.rr .v{font-weight:800;font-size:2.2vmin;min-width:4.6vmin;text-align:right;
  font-variant-numeric:tabular-nums}
.rr .v.down{color:#ff8a92}

/* ---------------- lineups ---------------- */
.lu{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:1.4vmin;
  padding:.7vmin 0;border-left:.4vmin solid var(--tc);padding-left:1vmin;margin-bottom:.4vmin}
.lu .who{display:flex;flex-wrap:wrap;gap:.5vmin}
.lu .p{font-size:1.5vmin;font-weight:600;text-transform:capitalize;
  background:rgba(255,255,255,.07);border-radius:.35vmin;padding:.25vmin .6vmin}
.lu .mins{font-size:1.4vmin;color:var(--dim);font-variant-numeric:tabular-nums}
.lu .net{font-weight:800;font-size:2.1vmin;min-width:5vmin;text-align:right;
  font-variant-numeric:tabular-nums}
.lu .net.up{color:#63ffa0} .lu .net.down{color:#ff8a92}

/* ---------------- comparison ---------------- */
.cmp{min-width:52vmin;max-width:70vmin;padding:1.6vmin 2vmin 1.2vmin}
.cmp .hd{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:1.3vmin;padding-bottom:.8vmin;border-bottom:1px solid rgba(255,255,255,.12)}
.cmp .hd span{display:flex;align-items:center;gap:.9vmin;font-weight:800;font-size:2vmin;
  letter-spacing:.04em}
.cmp .hd i{font-style:normal;font-size:1.2vmin;letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim)}
.cmp .r{display:grid;grid-template-columns:6vmin 1fr 6vmin;align-items:center;
  gap:1.2vmin;margin-bottom:.9vmin;font-variant-numeric:tabular-nums}
.cmp .r b{font-weight:800;font-size:2vmin}
.cmp .r .lab{text-align:center;font-size:1.2vmin;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim)}
.cmp .r .v{text-align:right} .cmp .r .v2{text-align:left}
.cmp .track{grid-column:1/-1;height:.55vmin;background:rgba(255,255,255,.1);
  border-radius:.3vmin;overflow:hidden;display:flex}
.cmp .track span{display:block;height:100%}

/* ---------------- final ---------------- */
.fin{padding:2.2vmin 3.4vmin;text-align:center}
.fin .lbl{font-size:1.4vmin;letter-spacing:.34em;text-transform:uppercase;color:var(--dim)}
.fin .row{display:flex;align-items:center;justify-content:center;gap:2.2vmin;margin-top:1.2vmin}
.fin .fs{display:flex;align-items:center;gap:1.2vmin;opacity:.72}
.fin .fs.won{opacity:1}
.fin .fs .t{font-weight:800;font-size:2.4vmin;text-transform:uppercase;letter-spacing:.03em}
.fin .fs .s{font-weight:800;font-size:5vmin;line-height:1;font-variant-numeric:tabular-nums}
.fin .vs{font-size:1.5vmin;color:var(--dim);text-transform:uppercase;letter-spacing:.2em}
.fin .comp{margin-top:1vmin;font-size:1.3vmin;letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim)}

/* ---------------- faces ----------------
   Same rule as the crest: initials are painted first and the photograph loads
   on top, so a picture that 404s leaves a portrait with initials in it rather
   than a hole. A broadcast graphic with a gap where a face should be is worse
   than one that never had faces. */
.face{position:relative;display:block;width:100%;aspect-ratio:3/4;overflow:hidden;
  border-radius:.5vmin;background:linear-gradient(180deg,
    color-mix(in oklch, var(--tc) 20%, #0d1512), #0a1210);
  border:1px solid color-mix(in oklch, var(--tc) 40%, transparent);
  display:flex;align-items:center;justify-content:center}
.face .ini{font-weight:800;font-size:2.2vmin;color:color-mix(in oklch, var(--tc) 75%, #fff);
  letter-spacing:.02em}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:50% 18%;opacity:0;transition:opacity .2s ease}
.face.hasface img{opacity:1}
.face.hasface .ini{opacity:0}

/* ---------------- one team's squad ---------------- */
.sq{min-width:56vmin;max-width:84vmin;padding:1.6vmin 1.8vmin 1.4vmin}
.sq .sqhd{display:flex;align-items:center;gap:1.4vmin;padding-bottom:1.1vmin;
  margin-bottom:1.2vmin;border-bottom:.35vmin solid var(--tc)}
.sq .sqhd .nm{font-weight:800;font-size:2.8vmin;text-transform:uppercase;letter-spacing:.03em}
.sq .sqhd .lbl{margin-left:auto;font-size:1.25vmin;letter-spacing:.24em;text-transform:uppercase;
  color:var(--dim)}
.sqgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:.9vmin}
.sqgrid .pl{display:flex;flex-direction:column;gap:.45vmin;position:relative}
.sqgrid .pl .n{position:absolute;top:.35vmin;left:.35vmin;z-index:2;
  font-weight:800;font-size:1.3vmin;padding:.1vmin .5vmin;border-radius:.3vmin;
  background:rgba(0,0,0,.66);color:#fff}
.sqgrid .pl .nm{font-size:1.25vmin;font-weight:600;text-transform:capitalize;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* a starter is marked rather than separated — the squad is still the squad */
.sqgrid .pl.start .face{box-shadow:0 0 0 .3vmin var(--tc)}

/* ---------------- both fives ---------------- */
.five{min-width:64vmin;max-width:92vmin;padding:1.6vmin 2vmin 1.5vmin}
.five .hd{display:flex;align-items:baseline;justify-content:space-between;
  padding-bottom:.9vmin;margin-bottom:1.3vmin;border-bottom:1px solid rgba(255,255,255,.12)}
.five .hd span{font-weight:800;font-size:2vmin;text-transform:uppercase;letter-spacing:.06em}
.five .hd i{font-style:normal;font-size:1.2vmin;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim)}
.fives{display:flex;align-items:flex-start;gap:1.6vmin}
.fivecol{flex:1 1 0;min-width:0}
.fivecol .fh{display:flex;align-items:center;gap:.8vmin;margin-bottom:.9vmin;
  padding-bottom:.6vmin;border-bottom:.3vmin solid var(--tc)}
.fivecol .fh span{font-weight:800;font-size:1.8vmin;letter-spacing:.05em}
.fivecol .pl{display:grid;grid-template-columns:4.6vmin 2.6vmin 1fr;align-items:center;
  gap:.8vmin;margin-bottom:.6vmin}
.fivecol .pl .face{width:4.6vmin;aspect-ratio:1;border-radius:.45vmin}
.fivecol .pl .face .ini{font-size:1.4vmin}
.fivecol .pl .n{font-weight:800;font-size:1.5vmin;color:var(--tc);text-align:right}
.fivecol .pl .nm{font-size:1.7vmin;font-weight:600;text-transform:capitalize;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fives .vs{align-self:center;font-size:1.5vmin;letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim)}

/* ---------------- officials ---------------- */
.offs{min-width:44vmin;max-width:64vmin;padding:1.6vmin 2vmin 1.3vmin}
.offs .hd{display:flex;align-items:baseline;justify-content:space-between;
  padding-bottom:.9vmin;margin-bottom:1.1vmin;border-bottom:1px solid rgba(255,255,255,.12)}
.offs .hd span{font-weight:800;font-size:1.9vmin;text-transform:uppercase;letter-spacing:.06em}
.offs .hd i{font-style:normal;font-size:1.15vmin;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim)}
.ogrps{display:flex;gap:2.4vmin}
.ogrp{flex:1 1 0;min-width:0}
.ogrp .ot{font-size:1.15vmin;letter-spacing:.24em;text-transform:uppercase;color:var(--lume);
  margin-bottom:.7vmin}
.orow{display:flex;align-items:baseline;gap:.9vmin;margin-bottom:.5vmin}
.orow .r{font-size:1.15vmin;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  min-width:9vmin}
.orow .n{font-weight:700;font-size:1.75vmin;text-transform:capitalize}

/* ---------------- the fixture card ---------------- */
.fixcard{padding:2.4vmin 3.4vmin;text-align:center;min-width:52vmin}
.fixcard .lbl{font-size:1.3vmin;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.fixcard .row{display:flex;align-items:center;justify-content:center;gap:2.6vmin;
  margin:1.4vmin 0 1.1vmin}
.fx1{display:flex;flex-direction:column;align-items:center;gap:.8vmin}
.fx1 .t{font-weight:800;font-size:2.2vmin;text-transform:uppercase;letter-spacing:.03em}
.fixcard .vs{font-size:1.6vmin;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.fixcard .meta{font-size:1.3vmin;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.fixcard .meta .sep{margin:0 .8vmin;opacity:.6}

/* Everything below only exists when the page is opened by a person rather than
   by a mixer, which is the only time a diagnostic is welcome on screen. */
#diag{position:absolute;left:1vmin;top:1vmin;font:11px ui-monospace,monospace;
  color:#9ff;background:rgba(0,0,0,.6);padding:5px 8px;border-radius:4px;display:none}
body.debug #diag{display:block}
</style>
</head>
