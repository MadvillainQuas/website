<style>
  a.plain{color:inherit;text-decoration:none}
  .topbar{display:flex;align-items:center;gap:12px;padding:calc(var(--u)*2) calc(var(--u)*3);
    border-bottom:1px solid var(--rule);flex-wrap:wrap}
  .wm{font-family:var(--f-score);font-size:19px;
    background:linear-gradient(100deg,var(--lume),var(--aqua));color:var(--on-accent);
    padding:3px 11px 1px;text-transform:uppercase}
  .hero{padding:calc(var(--u)*4) calc(var(--u)*3) calc(var(--u)*3);border-bottom:1px solid var(--rule)}
  .hero h1{font-family:var(--f-score);font-size:clamp(30px,6.5vw,54px);line-height:.88;margin:0;
    text-transform:uppercase;background:linear-gradient(100deg,var(--lume),var(--aqua));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{font-family:var(--f-micro);font-size:9.5px;color:var(--ink-3);line-height:2;
    max-width:74ch;margin:calc(var(--u)*2) 0 0}

  /* the filters: clubs as a rail, plus the state of play */
  .filters{padding:calc(var(--u)*2) calc(var(--u)*3);border-bottom:1px solid var(--rule);
    display:flex;flex-direction:column;gap:9px}
  .frow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .frow .flabel{font-family:var(--f-micro);font-size:8.5px;letter-spacing:0.08em;
    text-transform:uppercase;color:var(--ink-3);margin-right:4px}
  .teamchip .sw{display:inline-block;width:8px;height:8px;border-radius:50%;
    margin-right:6px;vertical-align:middle}

  .fxcount{font-family:var(--f-micro);font-size:9px;color:var(--ink-3);
    padding:calc(var(--u)*2) calc(var(--u)*3) 0}

  /* ---- a fixture, with room to breathe ---- */
  .day{font-family:var(--f-micro);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--lume);padding:calc(var(--u)*3) calc(var(--u)*3) calc(var(--u));
    border-bottom:1px solid var(--rule)}
  .fixture{display:block;text-decoration:none;color:inherit;
    border-bottom:1px solid var(--rule);padding:calc(var(--u)*3);
    transition:background .15s ease}
  a.fixture:hover{background:color-mix(in oklch,var(--lume) 5%,transparent)}

  .fxtop{display:grid;grid-template-columns:1fr auto 1fr;gap:calc(var(--u)*2);
    align-items:center}
  .side{display:flex;align-items:center;gap:12px;min-width:0}
  .side.away{flex-direction:row-reverse;text-align:right}
  /* the badge: the club plate in miniature, same ink and halftone as the
     screenprint cards so a club looks like itself everywhere */
  .badge{position:relative;width:54px;height:54px;flex:none;display:grid;place-items:center;
    background:var(--panel);border:1px solid var(--rule-2);overflow:hidden}
  .badge .bflood{position:absolute;inset:0;background:var(--ink-c);opacity:.16}
  .badge .btone{position:absolute;inset:-25%;
    background-image:radial-gradient(circle,var(--ink-c) .9px,transparent 1.2px);
    background-size:5px 5px;opacity:.45;transform:rotate(-12deg)}
  .badge .bmono{position:relative;font-family:var(--f-score);font-size:20px;line-height:1;
    color:var(--ink);z-index:1}
  .badge img{position:relative;z-index:1;width:70%;height:70%;object-fit:contain}
  .sname{font-family:var(--f-ui);font-weight:800;font-size:15px;text-transform:uppercase;
    letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .srec{font-family:var(--f-micro);font-size:8.5px;color:var(--ink-3);margin-top:3px}

  /* the scoreboard in the middle */
  .board{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:120px}
  .bscore{font-family:var(--f-score);font-size:clamp(26px,5vw,38px);line-height:1;
    display:flex;align-items:baseline;gap:10px}
  .bscore .win{color:var(--lume)}
  .bscore .lose{color:var(--ink-3)}
  .bdash{color:var(--ink-3);font-size:.7em}
  .bstate{font-family:var(--f-micro);font-size:8px;letter-spacing:0.1em;text-transform:uppercase;
    color:var(--ink-3)}
  .bstate.live{color:var(--flare)}
  .bstate.final{color:var(--lume)}
  .btime{font-family:var(--f-score);font-size:26px;line-height:1;color:var(--ink)}
  .pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--flare);
    margin-right:6px;vertical-align:1px;animation:p 1.6s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}

  /* quarters, for a game that has been played */
  .qs{display:flex;gap:1px;margin-top:4px;background:var(--rule)}
  .q{background:var(--ground);padding:2px 6px;font-family:var(--f-data);font-size:9px;
    color:var(--ink-3);text-align:center;min-width:26px}
  .q b{display:block;font-family:var(--f-micro);font-size:7px;color:var(--ink-3);
    letter-spacing:0.06em}

  /* leaders and venue below the board */
  .fxfoot{display:flex;gap:calc(var(--u)*3);flex-wrap:wrap;align-items:flex-start;
    margin-top:calc(var(--u)*2);padding-top:calc(var(--u)*2);border-top:1px solid var(--rule)}
  .leaders{display:flex;gap:calc(var(--u)*2);flex-wrap:wrap;flex:1;min-width:0}
  /* An unplayed fixture's footer carries this where a played one carries its
     leaders — same slot, same weight, so the row does not change shape. */
  .fxpreview{display:inline-flex;align-items:center;gap:6px;flex:1;
    font-family:var(--f-micro);font-size:8px;letter-spacing:0.11em;
    text-transform:uppercase;color:var(--aqua);opacity:.9}
  .fxpvdot{width:5px;height:5px;border-radius:50%;background:var(--aqua);
    box-shadow:0 0 8px var(--aqua);flex:none}
  .fixture:hover .fxpreview{opacity:1}
  /* The fives are named and the ball is minutes away: the lume rather than the
     aqua, and full opacity without waiting for a hover, because this is the one
     state in the slot that is news rather than a signpost. */
  .fxpreview.in{color:var(--lume);opacity:1}
  .fxpreview.in .fxpvdot{background:var(--lume);box-shadow:0 0 8px var(--lume);
    animation:fxpv 1.6s ease-in-out infinite}
  @keyframes fxpv{0%,100%{opacity:1}50%{opacity:.3}}
  @media (prefers-reduced-motion:reduce){ .fxpreview.in .fxpvdot{animation:none} }
  .ldr{min-width:96px}
  .ldr .lk{font-family:var(--f-micro);font-size:7.5px;letter-spacing:0.08em;
    text-transform:uppercase;color:var(--ink-3)}
  .ldr .ln{font-family:var(--f-ui);font-weight:700;font-size:11.5px;color:var(--ink);
    margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ldr .lv{font-family:var(--f-score);font-size:17px;color:var(--lume);line-height:1;margin-top:2px}
  .venue{font-family:var(--f-micro);font-size:9px;color:var(--ink-3);line-height:1.9;
    text-align:right;margin-left:auto;max-width:34ch}
  .venue .vn{color:var(--ink-2);font-size:9.5px;display:block}
  .venue .vt{color:var(--lume);display:block;margin-top:2px}

  .empty{padding:calc(var(--u)*6) calc(var(--u)*3);text-align:center;color:var(--ink-3);
    font-family:var(--f-micro);font-size:10.5px;line-height:2}
  footer.foot{padding:calc(var(--u)*4) calc(var(--u)*3);font-family:var(--f-micro);
    font-size:9px;color:var(--ink-3);display:flex;gap:16px;flex-wrap:wrap}
  footer.foot a{color:var(--ink-3);text-decoration:none}

  @media (max-width:700px){
    .fxtop{grid-template-columns:1fr;gap:calc(var(--u)*2)}
    .side.away{flex-direction:row;text-align:left}
    .board{align-items:flex-start}
    .venue{text-align:left;margin-left:0}
  }
  .ep-chip .kind{margin-left:6px;font-size:7px;letter-spacing:.12em;opacity:.65;text-transform:uppercase}
  /* the season chips are links, so a season can be copied or opened in a new tab;
     a chip does not want the underline a link carries by default */
  #seasonPick .ep-chip{text-decoration:none}
  .fixture{position:relative}
  .fixture .ep-follow.corner{top:10px;right:10px}
  /* ---- the club, as dropdowns (fixtures.js pickSelect) ----
     a teletext label over each, the box in the chosen club's colour down its edge */
  .fpick{gap:12px;align-items:flex-end}
  .fsel{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1 1 150px;--sc:var(--ink)}
  .fsel .fl{font-family:var(--f-micro);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
  .fsel .fbox{position:relative;display:block}
  .fsel .fbox::after{content:"";position:absolute;right:13px;top:50%;margin-top:-3px;pointer-events:none;
    border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid var(--ink)}
  .fsel select{appearance:none;-webkit-appearance:none;width:100%;min-height:42px;padding:0 34px 0 14px;
    font-family:var(--f-ui);font-weight:700;font-size:13px;color:var(--ink);cursor:pointer;
    background:var(--panel);border:1px solid var(--rule-2);border-radius:0;
    box-shadow:inset 6px 0 0 var(--sc),3px 3px 0 color-mix(in srgb,var(--sc) 35%,transparent);text-overflow:ellipsis}
  .fsel select:hover{background:color-mix(in srgb,var(--sc) 7%,var(--panel))}
  .fsel select:focus-visible{outline:2px solid var(--lume);outline-offset:2px}
  .fsel.off{opacity:.45} .fsel.off select{cursor:not-allowed}
  .freset{min-height:42px;padding:0 16px;font-family:var(--f-micro);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    background:#0a0a0a;color:#ffe14d;border:0;cursor:pointer}
  .freset:hover{background:#ffe14d;color:#0a0a0a}
  @media (max-width:700px){ .fsel{flex:1 1 calc(50% - 12px);max-width:none} .freset{flex:0 0 auto;min-height:34px;margin-left:auto} }

  /* ---- each fixture in its two clubs' colours (fixtures.js fixtureRow) ---- */
  .fixture{--hc:var(--rule-2);--ac:var(--rule-2);
    background:linear-gradient(90deg,color-mix(in srgb,var(--hc) 13%,transparent),transparent 40%,
                               transparent 60%,color-mix(in srgb,var(--ac) 13%,transparent));
    box-shadow:inset 6px 0 0 var(--hc),inset -6px 0 0 var(--ac)}
  a.fixture:hover{background:linear-gradient(90deg,color-mix(in srgb,var(--hc) 22%,transparent),transparent 45%,
                               transparent 55%,color-mix(in srgb,var(--ac) 22%,transparent))}
  .fixture .sname{color:var(--ink-t,var(--ink))}
  .fixture .badge{border:2px solid var(--ink-c);border-radius:50%;background:#fff}
  .fixture .badge .bflood,.fixture .badge .btone{display:none}
  /* the score on a black teletext block, the winner's side in yellow */
  .fixture .bscore{background:#0a0a0a;color:#fff;padding:7px 14px 5px;gap:12px}
  .fixture .bscore .win{color:#ffe14d}
  .fixture .bscore .lose{color:#9aa39e}
  .fixture .btime{background:#0a0a0a;color:#fff;padding:7px 14px 5px;font-size:24px}
  .fixture .bstate{padding:2px 7px;border:1px solid var(--rule-2);background:var(--panel)}
  .fixture .ldr .lv{color:var(--ink)}
  /* each day on a teletext strip */
  .day{background:#0a0a0a;color:#ffe14d;border-bottom:0;padding:9px calc(var(--u)*3) 8px;margin-top:calc(var(--u)*2)}
  /* the one-line members banner sits in the page's gutter like the filters do */
  #accessBanner > .ep-lock{width:auto;margin:calc(var(--u)*2) calc(var(--u)*3)}
</style>

<body>
<div class="ep-frame">
  <div class="topbar">
    <a href="../home/" class="plain"><span class="wm epinoia-mark" aria-label="Epinoia">EPINOIΛ</span></a>
    <span id="ctx" class="ep-micro"></span>
  </div>

  <div class="hero">
    <h1>Fixtures</h1>
    <p>
      Every game in the season — played, playing and to come — with the score,
      who led it, and where to find it. Pick a club to follow just theirs.
    </p>
  </div>

  <!-- a members-only league this viewer may not see (fixtures.js leagueAccess):
       one line about the results while the fixtures stay public, or the paywall
       card in place of the list when they do not. Hidden for every open league. -->
  <div id="accessBanner" class="hide"></div>

  <div class="filters">
    <!-- WHICH SEASON, above the filters because it is not one: it decides which
         list this is. Hidden (fixtures.js renderSeasonPicker) until the league has
         more than one season with games in it. -->
    <div class="frow" style="display:none"><span class="flabel">Season</span><span id="seasonPick"></span></div>
    <div class="frow" style="display:none"><span class="flabel">Competition</span><span id="compPick"></span></div>
    <div class="frow fpick" id="teamPick"></div>
    <div class="frow"><span class="flabel">Show</span><span id="statePick"></span></div>
  </div>

  <div class="fxcount" id="count"></div>
  <div id="list"><div class="empty">Loading…</div></div>

  <footer class="foot">
    <a href="../home/">← Epinoia</a>
    <span id="foot">Epinoia Network</span>
  </footer>
</div>
