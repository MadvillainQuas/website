<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<!-- EMBED. Runs inside someone else's page. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co">
<title>Epinoia table</title>
<link rel="icon" type="image/png" sizes="32x32" href="../../brand/epinoia-mark-32.png">
<link rel="apple-touch-icon" href="../../brand/epinoia-app-180.png">
<link rel="stylesheet" href="../../kit/fonts.css?v=365">
<link rel="stylesheet" href="../../kit/embed.css?v=365">
<style>
  /* A standings or leaders table small enough to sit in an article. Not the
     full table — that is a link. Eight columns at most, and it says so. */
  .ep-tbl{ width:100%; border-collapse:separate; border-spacing:0;
    font-variant-numeric:tabular-nums lining-nums }
  /* a group or conference heading, and a division inside a conference (0144) */
  .ep-grp{ font-weight:800; font-size:11px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--lume, #93f2bf); padding:10px 8px 4px }
  .ep-div{ font-size:10px; text-transform:uppercase; letter-spacing:.1em; opacity:.7; padding:6px 8px 2px }
  .ep-tbl th{
    font-family:'Silkscreen',ui-monospace,monospace; font-size:7px;
    letter-spacing:.11em; text-transform:uppercase; font-weight:400;
    color:rgba(230,255,241,.5); text-align:right; padding:8px 8px;
    background:#0c1f16; border-bottom:1px solid rgba(147,242,191,.3);
  }
  .ep-tbl th.l, .ep-tbl td.l{ text-align:left }
  .ep-tbl td{
    padding:0 8px; height:29px; text-align:right; font-size:12px;
    color:rgba(230,255,241,.82); border-bottom:1px solid rgba(147,242,191,.1);
    white-space:nowrap;
  }
  .ep-tbl tbody tr:nth-child(even) td{ background:rgba(147,242,191,.03) }
  .ep-tbl .nm{ display:flex; align-items:center; gap:8px; min-width:0 }
  .ep-tbl .nm span.c{
    flex:none; width:18px; height:18px; border-radius:2px; display:grid;
    place-items:center; color:#04100b;
    font-family:'Jersey25',ui-monospace,monospace; font-size:9px;
  }
  .ep-tbl .nm b{ font-weight:700; font-size:12.5px; color:#e6fff1;
    overflow:hidden; text-overflow:ellipsis }
  .ep-hd{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 12px; border-bottom:1px solid rgba(147,242,191,.18);
    font-family:'Silkscreen',ui-monospace,monospace; font-size:7.5px;
    letter-spacing:.13em; text-transform:uppercase; color:rgba(230,255,241,.6);
  }
  /* ================= IT SCROLLS WHEN IT HAS TO =================
     The table is content-driven and posts its own height, so a page that resizes the frame
     around it still sees every row. A frame with a FIXED height — the league's own front
     page, and most of the pages that embed it — simply cut the table off at the bottom
     edge, which is how a twelve-club standings table showed nine clubs and no hint that
     there were more. The rows now scroll inside the frame, between a header and a footer
     that stay put, and postHeight measures the list's real height rather than the box's,
     so nothing that resized the frame before starts scrolling instead. */
  html,body{height:auto;overflow:hidden}
  body.cse{display:flex;flex-direction:column;max-height:100vh}
  #host{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  #host::-webkit-scrollbar{width:6px}
  #host::-webkit-scrollbar-thumb{background:rgba(147,242,191,.28);border-radius:3px}
  .ep-hd,.ep-foot{flex:none}
  /* the head stays above the rows it names when they scroll under it */
  .ep-tbl thead th{position:sticky;top:0;z-index:1}
</style>
<script src="../../i18n.js?v=365" data-i18n-packs="embed"></script>
<script src="../../glyphs.js?v=365" defer></script>
</head>
<body class="cse">
  <div class="ep-hd"><span id="title" translate="no">Epinoia</span><span id="sub"></span></div>
  <div id="host"><div class="ep-empty">Loading…</div></div>
  <div class="ep-foot">
    <a id="more" href="../../" target="_blank" rel="noopener">full table ↗</a>
    <span class="epinoia-mark" aria-label="Epinoia">EPINOIΛ</span>
  </div>
<script src="../../config.js?v=365" defer></script>
<!-- access.js: a members-only league's table is refused to an anonymous read, so
     a member's own browser has to say who is asking (data.js asks access.js) -->
<script src="../../access.js?v=365" defer></script>
<script src="../../teamcolour.js?v=365" defer></script>
<script src="../theme.js?v=365" defer></script>
<script src="../../season.js?v=365" defer></script>
<script src="../../data.js?v=365" defer></script>
<script src="../../standings.js?v=365" defer></script>
<script src="table.js?v=365" defer></script>
</body>
</html>
