<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04100b">
<meta name="robots" content="noindex">
<!-- PUBLIC. The window a notification button on a league's own website opens (docs/notify-embed.md §2). No gate.js, no topnav.js. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co; worker-src 'self'">
<title>Notifications · Epinoia</title>
<link rel="icon" type="image/png" sizes="32x32" href="../../brand/epinoia-mark-32.png">
<link rel="manifest" href="/epinoia/manifest.webmanifest">
<script src="../../appmode.js?v=341"></script>
<link rel="stylesheet" href="../../kit/epinoia-kit.css?v=341">
<style>
  body{margin:0;background:var(--ground);color:var(--ink)}
  .card{max-width:460px;margin:0 auto;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
  .lg{display:flex;align-items:center;gap:10px;min-height:32px}
  .lg img{width:32px;height:32px;object-fit:contain;flex:none}
  .lg span{font-family:var(--f-micro);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  h1{font-family:var(--f-ui);font-weight:800;font-size:22px;line-height:1.25;margin:0;text-wrap:balance}
  .lead{font-family:var(--f-ui);font-size:15px;line-height:1.55;color:var(--ink-2);margin:0;max-width:60ch}
  .acts{display:flex;flex-wrap:wrap;gap:8px}
  .acts .ep-btn{min-height:48px;padding:12px 18px;font-size:14px}
  .acts .hide,.hide{display:none !important}
  .msg{font-family:var(--f-ui);font-size:14px;line-height:1.5;padding:10px 12px;border-left:2px solid var(--rule-2);color:var(--ink-2)}
  .msg.ok{border-left-color:var(--lume);color:var(--ink)}
  .msg.bad{border-left-color:var(--flare);color:var(--flare)}
  .opts{display:grid;gap:0;border-top:1px solid var(--rule)}
  .opt{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--rule);font-family:var(--f-ui);font-size:14px}
  .opt span{flex:1}
  .h{font-family:var(--f-micro);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:4px 0 -8px}
  input.sw{-webkit-appearance:none;appearance:none;flex:none;box-sizing:border-box;width:40px;height:24px;margin:0;border-radius:12px;cursor:pointer;
    border:1px solid var(--rule-2);background:radial-gradient(circle at 11px 50%,var(--ink-3) 0 7px,transparent 7.5px) no-repeat,transparent}
  input.sw:checked{border-color:var(--lume);background:radial-gradient(circle at 27px 50%,var(--on-accent) 0 7px,transparent 7.5px) no-repeat,var(--lume)}
  input.sw:focus-visible{outline:2px solid var(--lume);outline-offset:2px}
  .teams{display:grid;border-top:1px solid var(--rule)}
  .foot{font-family:var(--f-micro);font-size:10px;line-height:1.8;color:var(--ink-3)}
  .foot a{color:inherit}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="lg"><img id="crest" alt="" class="hide"><span id="league">Epinoia</span></div>
  <h1 id="title">Notifications</h1>
  <p class="lead" id="lead">Loading…</p>
  <div class="acts">
    <button class="ep-btn pri hide" id="on" type="button">Turn on notifications</button>
    <button class="ep-btn hide" id="stop" type="button">Stop notifications</button>
    <button class="ep-btn hide" id="test" type="button">Send a test</button>
    <button class="ep-btn hide" id="close" type="button">Close this window</button>
  </div>
  <div class="msg hide" id="msg" role="status" aria-live="polite"></div>
  <div class="teams hide" id="teams"></div>
  <div class="h hide" id="optsH">What to tell you</div>
  <div class="opts hide" id="opts"></div>
  <p class="foot">No account needed. Epinoia keeps this browser’s push address and what it follows, and nothing about you; turning notifications off deletes it. <a href="../../privacy/" target="_blank" rel="noopener">Privacy</a></p>
</main>
<script src="../../config.js?v=341"></script>
<script src="page.js?v=341"></script>
</body>
</html>
