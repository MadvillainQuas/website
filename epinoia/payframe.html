<!DOCTYPE html>

<head>

<!-- THE PAYMENT FRAME (docs/memberships.md §12). The one page on the site that runs Stripe.js: the payment window
     (paywindow.js) frames it inside whatever page the fan is on, and hands it the checkout over postMessage (never in
     its address). Every other page keeps its own CSP and never loads a third-party script for payment. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' https://js.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com; connect-src 'self' https://api.stripe.com https://merchant-ui-api.stripe.com https://checkout.stripe.com">
<title>Payment · Epinoia</title>
<link rel="stylesheet" href="kit/payframe.css?v=703">
</head>
<body>
<div id="checkout" aria-live="polite"><p class="wait">Opening secure checkout…</p></div>
<script src="payframe.js?v=703"></script>
</body>
</html>
